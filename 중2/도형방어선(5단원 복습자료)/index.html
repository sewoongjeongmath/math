<style>

.modebuttons{display:flex;flex-direction:column;gap:6px;width:min(280px,100%)}button.hard{background:#793d42;border-color:#b95b62;color:#fff} button.challenge{background:#592f6b;border-color:#8b4da8;color:#fff} .rank-tabs{display:flex;gap:4px;width:min(330px,100%)}.rank-tabs button{flex:1;padding:7px 3px;font-size:13px}

#qp{width:min(310px,calc(100% - 8px));box-sizing:border-box;gap:5px}#qp p{font-size:12px}#qp #ans{font-size:26px}
.fg{width:220px;max-width:100%;height:auto}.fg polygon{fill:rgba(255,255,255,.05);stroke:#e8efe6;stroke-width:1.6;stroke-linejoin:round}.fg line{stroke:#e8efe6;stroke-width:1.6}.fg line.pr{stroke:#f2b84b}
.fg text{fill:#ffd36a;font:700 11px 'Noto Sans KR',sans-serif;text-anchor:middle;dominant-baseline:middle}.fg text.v{fill:#e8efe6}.fg text.x{fill:#ff8f9f;font-size:13px}

.opts{display:flex;flex-direction:column;gap:5px;width:100%}.opts button{padding:8px 10px;font-size:15px}.opts.ox{flex-direction:row}.opts.ox button{flex:1;font-size:18px;padding:12px 0}

<body>
<div id="w"><canvas id="c" width="360" height="640"></canvas><div id="o"></div></div>
<script>
const C=document.getElementById('c'),X=C.getContext('2d'),O=document.getElementById('o'),W=360,H=640,PY=560;
const $=id=>document.getElementById(id),K={l:0,r:0};
const WP=[{n:'권총',h:0,r:3,m:1,c:'#6fc8ff',l:14},{n:'소총',h:100,r:5,m:1.3,c:'#ffd36a',l:24},{n:'기관단총',h:250,r:9,m:1.2,c:'#ff9f5a',l:18},{n:'레이저건',h:500,r:8,m:2.2,c:'#5be3ff',l:26},{n:'플라즈마포',h:1000,r:7,m:4,c:'#d58bff',l:30}];
let S,Q,inp='',mode='',best=0,playerName='',difficulty='normal',rankDifficulty='normal';const HM=[1,0.1,0.07,2.8,3.0],SPM=[1,1,2,3,3.2];const ER=()=>S.stage<4?1:.15+.85*Math.min(1,S.st/120);
const diffLabel=d=>d==='challenge'?'도전':(d==='hard'?'하드':'노말');
const PM=[1,1,2,8,15],TG=[1e4,2e4,1e5,1e6,Infinity],PV=[0,1e4,2e4,1e5,1e6];
try{best=+localStorage.getItem('gdbs')||0}catch(e){}
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function init(){S={hp:100,atk:10,lvl:1,t:0,hits:0,wi:0,wh:0,qm:30,kills:0,bk:0,nb:0,bt:40,zs:[],gates:[],fx:[],bl:[],ft:[],score:0,stage:1,st:0,px:W/2,tx:W/2,sp:1,fire:0,gt:4,fl:0,dash:0,pop:null,ban:null,ang:-Math.PI/2,mf:0,qt:0,cv:0,fastBt:5,run:false}}
function ov(h,live){O.innerHTML=h;O.hidden=false;O.className=live?'live':''}
function menu(){mode='';ov(`<h1>도형 방어선</h1><p>이름이나 번호를 입력하고 시작하세요.</p><input id="name" maxlength=20 placeholder="예: 2-3 김민수" autocomplete="off" value="${playerName.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}"><div class="modebuttons"><button class="p" onclick="start('normal')">노말 모드 시작</button><button class="hard" onclick="start('hard')">하드 모드 시작</button><button class="challenge" onclick="start('challenge')">🔥 도전 모드 시작</button></div><button onclick="showRanking('normal')">🏆 랭킹 보기</button><p>노말 · 하드(적 강화) · 도전(5단계 시작+최종무기+1회 오답 즉시 실패)</p>`);setTimeout(()=>{const e=$('name');if(e){e.focus();e.select()}},0)}
function start(selectedDifficulty){if(selectedDifficulty)difficulty=selectedDifficulty;const e=$('name');if(e&&e.value.trim())playerName=e.value.trim();if(!playerName){alert('이름 또는 번호를 입력하세요.');return}try{best=+(localStorage.getItem('gdbs_'+difficulty)||(difficulty==='normal'?localStorage.getItem('gdbs'):'0'))||0}catch(e){best=0}init();if(difficulty==='challenge'){S.stage=5;S.wi=4;S.wh=1000}O.hidden=true;mode='';S.run=true}
function showRanking(which){rankDifficulty=['normal','hard','challenge'].includes(which)?which:difficulty;mode='rank';const requested=rankDifficulty;ov(`<h1>🏆 ${diffLabel(requested)} 랭킹</h1><div class="rank-tabs"><button class="${requested==='normal'?'p':''}" onclick="showRanking('normal')">노말</button><button class="${requested==='hard'?'p':''}" onclick="showRanking('hard')">하드</button><button class="${requested==='challenge'?'p':''}" onclick="showRanking('challenge')">도전</button></div><div id="rank"><div class="rankerr">불러오는 중...</div></div><button onclick="menu()">돌아가기</button>`);if(typeof google!='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(rows=>{if(mode==='rank'&&rankDifficulty===requested)renderRanking(rows,requested)}).withFailureHandler(()=>{if(mode!=='rank'||rankDifficulty!==requested)return;const e=$('rank');if(e)e.innerHTML='<div class="rankerr">랭킹을 불러오지 못했습니다.</div>'}).getRanking(requested)}else{renderRanking([],requested)}}
function renderRanking(rows,which=difficulty){const e=$('rank');if(!e)return;if(!rows.length){e.innerHTML=`<div class="rankerr">${diffLabel(which)} 모드 기록이 아직 없습니다.</div>`;return}e.innerHTML=rows.map((r,i)=>`<div class="rh ${r.name===playerName?'me':''}"><span>${i<3?['🥇','🥈','🥉'][i]:i+1+'.'} ${esc(r.name)}</span><b>${Number(r.score).toLocaleString()}점</b></div>`).join('')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function spawnZ(b){const d=df(),r=Math.random();let T;
 if(b)T={hm:0,v:.55,r:34,d:40,c:'#d9694f'};
 else if(r<.2&&d>.7)T={hm:.5,v:1.8,r:11,d:8,c:'#7fc4c9'};
 else if(r>.85&&d>2)T={hm:2.5,v:.65,r:20,d:15,c:'#a493c2'};
 else T={hm:1,v:1,r:15,d:10,c:'#8fa3b8'};
 const hard=difficulty==='hard'||difficulty==='challenge';const challengeHp=difficulty==='challenge';const hp=b?Math.ceil(Math.min(S.stage<=3?250:Infinity,400+250*S.nb)*ER()*(challengeHp?0.8:(hard?1.35:1))):Math.ceil((12+8*d+3*d*d)*T.hm*HM[S.stage-1]*ER()*(challengeHp?0.7:(hard?1.5:1)));
 const challengeSpeed=difficulty==='challenge'?(S.t<60?1:(S.t<120?1.05:1.10)):1;S.zs.push({x:R(40,320),y:-40,hp,mh:hp,v:Math.min(110,45+d*2)*T.v*challengeSpeed,d:T.d,r:T.r,c:T.c,b});
 if(b){S.nb++;S.ban={s:'보스 로봇 접근!',t:2}}}
function spawnFastZ(){const d=df(),hp=Math.ceil((12+8*d+3*d*d)*0.6*HM[S.stage-1]*ER()*0.7);S.zs.push({x:R(40,320),y:-40,hp,mh:hp,v:Math.min(110,45+d*2)*3,d:12,r:10,c:'#ff4d5a',b:false,fast:true});S.ban={s:'초고속 로봇 출현!',t:2}}
function spawnG(){const gm=[10,10,12,15,20][S.stage-1];if(!S.ng){S.ng=1;S.gates.push({y:-40,v:[R(1,gm),R(1,gm)]});return}const n=Math.random()<.5?2:3,v=[];for(let i=0;i<n;i++){let x;do x=R(-gm,gm);while(!x);v.push(x)}
 if(Math.random()<.2)v.forEach((x,i)=>v[i]=-Math.abs(x));else if(!v.some(x=>x>0))v[R(0,n-1)]=R(1,gm);S.gates.push({y:-40,v})}
function pick(v){S.cv=v;S.qt=30;S.qm=30;newQ()}
function shoot(){const w=WP[S.wi],n=[1,1,2,2,3][S.wi];S.mf=.07;
 for(let i=0;i<n;i++)S.bl.push({x:S.px+(i-(n-1)/2)*16,y:PY-30,d:Math.ceil(S.atk*w.m*.5),c:w.c,r:3+S.wi*.8})}
function hit(z,b){if(z.hp<=0)return;z.hp-=b.d;S.hits++;S.score++;
 if(z.hp<=0){S.kills++;const pt=(z.b?1500:3*(10+Math.floor(z.mh/4)))*PM[S.stage-1];S.score+=pt;S.ft.push({x:z.x,y:z.y,s:'+'+pt.toLocaleString(),t:.7});if(z.b){S.bk++;S.ban={s:'보스 격파!',t:2}}}
 if(S.stage>=3&&difficulty!=='challenge'){S.wh++;let n=0;WP.forEach((q,j)=>{if(S.wh>=q.h)n=j});if(n>S.wi){S.wi=n;S.ban={s:'새 무기 획득: '+WP[n].n,t:2.5}}}}
function upd(dt){
 S.t+=dt;S.st+=dt;S.tx=Math.max(24,Math.min(W-24,S.tx+(K.r-K.l)*230*dt));S.px+=(S.tx-S.px)*Math.min(1,dt*12);
 S.dash=(S.dash+dt*40)%40;S.fl=Math.max(0,S.fl-dt);S.mf=Math.max(0,S.mf-dt);
 if(S.pop&&(S.pop.t-=dt)<=0)S.pop=null;if(S.ban&&(S.ban.t-=dt)<=0)S.ban=null;
 S.sp-=dt;if(S.sp<=0){let spawnScale=1;if(difficulty==='challenge'){spawnScale=S.t<60?1:(S.t<120?0.87:0.77)}S.sp=Math.max(.3,1-.07*df())*SPM[S.stage-1]*((difficulty==='hard'||difficulty==='challenge')?0.8:1)*spawnScale;spawnZ(0);if(df()>4&&Math.random()<.3)spawnZ(0)}
 if(difficulty==='challenge'&&S.score>500000){S.fastBt-=dt;if(S.fastBt<=0){spawnFastZ();S.fastBt=5}}
 S.bt-=dt;if(S.bt<=0){S.bt=50;spawnZ(1)}
 S.gt-=dt;if(S.gt<=0&&!S.gates.length&&mode!='q'){spawnG();S.gt=99}
 for(const g of S.gates){g.y+=80*dt;if(g.y>=PY-30){const n=g.v.length,i=Math.max(0,Math.min(n-1,Math.floor((S.px-16)/((W-32)/n))));const v=g.v[i];S.gates=[];S.gt=6;pick(v);break}}
 for(const z of S.zs){z.y+=z.v*dt;if(z.y>=PY-10){S.hp-=z.d;z.hp=0;S.fl=.3}}
 for(const b of S.bl){const o=b.y;b.y-=650*dt;let t=null;
  for(const z of S.zs)if(z.hp>0&&Math.abs(b.x-z.x)<=z.r+8&&z.y+z.r>=b.y&&z.y-z.r<=o&&(!t||z.y>t.y))t=z;
  if(t){hit(t,b);b.dead=1}else if(b.y<-40)b.dead=1}
 S.bl=S.bl.filter(b=>!b.dead);S.ft=S.ft.filter(f=>(f.t-=dt)>0);
 S.fire-=dt;if(S.fire<=0){S.fire=1/WP[S.wi].r;shoot()}
 S.zs=S.zs.filter(z=>z.hp>0);S.fx=S.fx.filter(f=>(f.t-=dt)>0);
 if(S.hp<=0)over();else if(S.stage<5&&S.score>=TG[S.stage-1])clear()}
function df(){return[0,3,6,8,10][S.stage-1]+S.st/60}
function go(){O.hidden=true;S.run=true}
function clear(){S.run=false;mode='';K.l=K.r=0;S.stage++;S.st=0;S.atk=10;S.hp=100;S.zs=[];S.bl=[];S.gates=[];S.gt=4;S.bt=40;S.sp=1;if(S.stage==3){S.wh=0;S.wi=0}
 const N={2:'2단계는 로봇이 더 빠르고 단단해져요.',3:'3단계부터 명중 횟수에 따라 새 무기를 얻어요! 목표는 100,000점이에요.',4:'4단계예요. 목표는 1,000,000점! 점수 배율이 크게 올라요.',5:'마지막 5단계예요. 죽을 때까지 계속돼요!'};
 ov(`<h1>${S.stage-1}단계 클리어!</h1><p>${N[S.stage]}<br>체력은 100으로 회복되고, 공격력은 처음 값(10)으로 초기화돼요.</p><button class="p" onclick="go()">${S.stage}단계 시작</button>`)}
function over(){S.run=false;S.hp=0;mode='';if(S.score>best){best=S.score;try{localStorage.setItem('gdbs_'+difficulty,best);if(difficulty==='normal')localStorage.setItem('gdbs',best)}catch(e){}}
 const payload={name:playerName,difficulty:difficulty,score:S.score,stage:S.stage,kills:S.kills,boss:S.bk,hits:S.hits,survival:Math.floor(S.t)};
 ov(`<h1>방어선 붕괴</h1><p>${diffLabel(difficulty)} 모드</p><div class="q">${S.score.toLocaleString()}점</div><p>${playerName} · ${S.stage}단계 도달<br>최고 점수 ${best.toLocaleString()}점<br>${Math.floor(S.t)}초 생존 · 로봇 ${S.kills}기 처치 · 보스 ${S.bk}기 격파 · 명중 ${S.hits}회</p><p id="saveStatus">점수 저장 중...</p><div id="rank"></div><button class="p" onclick="start()">같은 모드 다시 도전</button><button onclick="showRanking()">🏆 랭킹 보기</button>`);
 if(typeof google!='undefined'&&google.script&&google.script.run){google.script.run.withSuccessHandler(rows=>{const st=$('saveStatus');if(st)st.textContent='점수가 저장되었습니다!';renderRanking(rows,difficulty)}).withFailureHandler(()=>{const st=$('saveStatus');if(st)st.textContent='점수 저장에 실패했습니다. (게임은 계속할 수 있어요)';}).saveScore(payload)}else{renderRanking([],difficulty)}}
const ch=a=>a[R(0,a.length-1)],shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(p=>p[1]);
const f1=n=>n.toFixed(1),SV=s=>`<svg viewBox="0 0 220 112" class="fg">${s}</svg>`;
const tx=(s,x,y,c)=>`<text x="${f1(x)}" y="${f1(y)}"${c?` class="${c}"`:''}>${s}</text>`;
const pg=P=>`<polygon points="${P.map(p=>f1(p[0])+','+f1(p[1])).join(' ')}"/>`;
const ln=(a,b,c)=>`<line x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"${c?` class="${c}"`:''}/>`;
const lb=(s,x,y)=>tx(s,x,y,/x/.test(s)?'x':'');
function fit(P,x0,y0,w,h,fl){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]),a=Math.min(...xs),b=Math.max(...xs),c=Math.min(...ys),d=Math.max(...ys),s=Math.min(w/(b-a||1),h/(d-c||1));
 return P.map(p=>[x0+(w-(b-a)*s)/2+(fl?b-p[0]:p[0]-a)*s,y0+(h-(d-c)*s)/2+(d-p[1])*s])}
function tri(P,nm,sd,an){const c=[0,1].map(i=>(P[0][i]+P[1][i]+P[2][i])/3),o=(p,d)=>{const x=p[0]-c[0],y=p[1]-c[1],l=Math.hypot(x,y)||1;return[p[0]+x/l*d,p[1]+y/l*d]};let s=pg(P);
 P.forEach((p,i)=>{const q=o(p,9);s+=tx(nm[i],q[0],q[1],'v')});
 [[0,1],[1,2],[2,0]].forEach(([i,j],k)=>{if(sd&&sd[k]!==''&&sd[k]!=null){const q=o([(P[i][0]+P[j][0])/2,(P[i][1]+P[j][1])/2],10);s+=lb(''+sd[k],q[0],q[1])}});
 P.forEach((p,i)=>{if(an&&an[i])s+=lb(an[i],p[0]+(c[0]-p[0])*.35,p[1]+(c[1]-p[1])*.35)});return s}
const bySides=([a,b,c])=>{const x=(a*a+c*c-b*b)/(2*a);return[[0,0],[a,0],[x,Math.sqrt(Math.max(0,c*c-x*x))]]};
const bySAS=(a,b,t)=>[[0,0],[a,0],[b*Math.cos(t*Math.PI/180),b*Math.sin(t*Math.PI/180)]];
const byAng=(A,B)=>{const r=Math.PI/180,g=180-A-B,k=Math.sin(B*r)/Math.sin(g*r);return[[0,0],[1,0],[k*Math.cos(A*r),k*Math.sin(A*r)]]};
const two=(p1,n1,s1,a1,p2,n2,s2,a2,fl)=>SV(tri(fit(p1,14,16,80,80,0),n1,s1,a1)+tri(fit(p2,124,16,80,80,fl),n2,s2,a2));
const PT=[[3,4,5],[6,8,10],[5,12,13],[9,12,15],[8,15,17],[12,16,20],[7,24,25],[15,20,25],[10,24,26],[20,21,29]];
const OXB=[['한 변의 길이가 다른 두 정삼각형은 항상 닮음이다.',1,'정삼각형은 모두 닮음이에요'],
['두 직사각형은 항상 닮음이다.',0,'가로·세로의 비가 다를 수 있어요'],
