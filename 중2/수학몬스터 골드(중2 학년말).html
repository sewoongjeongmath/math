<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>수학몬스터 골드</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* Layout: 휴대용 게임기 — 위에는 3:2 화면, 아래에는 방향키와 A/B 버튼 */
:root{
  --page:#191b2b; --page-ink:#c9c6e0;
  --shell:#e1b23e; --shell-dark:#a77b1c; --shell-hi:#f6d777;
  --bezel:#2c2b3d; --lens:#11121b;
  --btn:#b3315e; --btn-dark:#7a1d3e; --pad:#2a2a36;
  --box:#f8f8f0; --ink:#26263a; --line:#3a3a58;
  --good:#2e9a4a; --bad:#cf3a3a; --gold:#d79a18;
  --f-title:"Black Han Sans","Nanum Gothic Coding",sans-serif;
  --f-ui:"Nanum Gothic Coding","Malgun Gothic","Apple SD Gothic Neo",monospace;
  --f-math:"Times New Roman","Noto Serif KR",serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{background:var(--page);color:var(--page-ink)}
body{font-family:var(--f-ui);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 24px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
#app{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
#console{background:linear-gradient(180deg,var(--shell-hi),var(--shell) 18%,var(--shell) 80%,var(--shell-dark));border-radius:18px 18px 46px 18px;padding:14px 14px 18px;box-shadow:0 6px 0 #6d4f10,0 14px 30px #0008;display:flex;flex-direction:column;gap:14px}
#bezel{background:var(--bezel);border-radius:12px 12px 30px 12px;padding:12px 14px 10px;box-shadow:inset 0 2px 0 #fff2}
#bezel .brand{display:flex;justify-content:space-between;align-items:center;color:#9a98b8;font:700 11px/1 var(--f-ui);letter-spacing:.12em;margin-top:8px}
#bezel .led{display:inline-block;width:8px;height:8px;border-radius:50%;background:#e33;box-shadow:0 0 6px #f44;margin-right:6px;vertical-align:middle}
#screen{position:relative;width:100%;aspect-ratio:3/2;background:#000;container-type:inline-size;overflow:hidden;border-radius:3px}
#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#ui{position:absolute;inset:0;font-size:3.1cqw;color:var(--ink);line-height:1.45}
#ui button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
.box{background:var(--box);border:.55cqw solid var(--line);border-radius:1.2cqw;box-shadow:inset 0 0 0 .45cqw var(--box),inset 0 0 0 .8cqw #8d8db0}
#tb{position:absolute;left:1.5%;right:1.5%;bottom:2%;height:29%;padding:2.2cqw 3.2cqw;white-space:pre-wrap;font-weight:700}
#tb.half{right:47%}
#tbn{position:absolute;right:2.6cqw;bottom:1.6cqw;animation:blink .7s steps(2) infinite;color:var(--btn)}
@keyframes blink{50%{opacity:0}}
.menu{position:absolute;display:grid;gap:.6cqw 3cqw;padding:2cqw 3cqw;font-weight:700;z-index:5}
.menu .mi{display:flex;align-items:center;padding-left:3cqw;position:relative;white-space:nowrap}
.menu .mi.on::before{content:"▶";position:absolute;left:0;font-size:.8em;top:50%;transform:translateY(-50%)}
.menu .mi .sub{font-weight:400;color:#6a6a86;font-size:.82em;margin-left:1.5cqw}
.menu.battle{right:1.5%;bottom:2%;width:44%;height:29%;grid-template-rows:1fr 1fr;align-content:center}
.menu.start{right:1.5%;top:2.5%;min-width:30%}
.menu.start.two{min-width:58%;max-height:95%;gap:.2cqw 2.4cqw;padding:1.6cqw 2.4cqw}
.menu.yesno{right:1.5%;bottom:33%}
.menu.moves{left:1.5%;right:1.5%;bottom:2%;height:29%;grid-template-columns:1fr 1fr!important;align-content:center}
.panel{position:absolute;inset:2.5% 2%;display:flex;flex-direction:column;z-index:6;padding:2.4cqw 3cqw}
.panel h3{margin:0 0 1.6cqw;font:400 4.2cqw/1.1 var(--f-title);color:var(--ink);display:flex;justify-content:space-between;align-items:baseline;gap:2cqw}
.panel h3 small{font:700 2.7cqw var(--f-ui);color:#6a6a86}
.panel .list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:.6cqw;min-height:0}
.panel .row{display:flex;align-items:center;gap:2cqw;padding:1cqw 1.6cqw 1cqw 4.2cqw;border-radius:1cqw;position:relative;font-weight:700}
.panel .row.on{background:#ece6c4}
.panel .row.on::before{content:"▶";position:absolute;left:1cqw;font-size:.8em;top:50%;transform:translateY(-50%)}
.panel .row.dim{opacity:.45}
.panel .row img{width:8cqw;height:8cqw;image-rendering:auto}
.panel .row .grow{flex:1;min-width:0}
.panel .row .sm{font-weight:400;font-size:.85em;color:#55556e}
.panel .foot{margin-top:1.4cqw;font-size:2.6cqw;color:#6a6a86}
.hpb{display:flex;align-items:center;gap:1cqw;font:700 2.3cqw var(--f-ui);color:#d79a18}
.hpb .bar{flex:1;height:1.5cqw;background:#555;border:.35cqw solid #333;border-radius:1cqw;overflow:hidden}
.hpb .bar i{display:block;height:100%;background:#3fbf5a;transition:width .5s}
.hpb .bar i.mid{background:#e3b52c}.hpb .bar i.low{background:#e04a3a}
.stat{position:absolute;padding:1.2cqw 2.4cqw;font-weight:700;z-index:2}
#ehp{left:2.5%;top:4%;width:46%}
#php{right:2.5%;top:43%;width:47%}
.stat .nm{display:flex;justify-content:space-between;font-size:3cqw}
.stat .num{text-align:right;font-size:2.8cqw;font-variant-numeric:tabular-nums}
.stat .xp{height:.9cqw;background:#ccc;border-radius:1cqw;overflow:hidden;margin-top:.5cqw}
.stat .xp i{display:block;height:100%;background:#4a8be0;transition:width .5s}
/* 퀴즈 */
.quiz{position:absolute;inset:2.5% 2%;z-index:8;display:flex;flex-direction:column;gap:1.5cqw;padding:2.4cqw 3.2cqw;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.quiz .qh{display:flex;justify-content:space-between;align-items:center;gap:2cqw}
.quiz .qu{background:var(--ink);color:#fff;border-radius:5cqw;padding:.4cqw 2cqw;font-size:2.5cqw;font-weight:700;white-space:nowrap}
.quiz .qt{font:400 3.3cqw var(--f-title);color:var(--btn-dark);text-align:right}
.quiz .tbar{position:relative;height:2.2cqw;background:#e7e2cf;border-radius:2cqw;overflow:hidden}
.quiz .tbar i{position:absolute;inset:0 auto 0 0;width:100%;background:linear-gradient(90deg,#f0a020,#f6d34a)}
.quiz .tbar span{position:absolute;inset:0;font-size:1.8cqw;font-weight:700;display:flex;align-items:center;justify-content:center;color:#5a4410}
.quiz .qq{font-size:3.4cqw;font-weight:700;line-height:1.7;flex:0 0 auto}
.quiz .qo{display:grid;grid-template-columns:1fr 1fr;gap:1.2cqw;flex:1;align-content:start}
.quiz .opt{display:flex;gap:1.6cqw;align-items:center;border:.4cqw solid #c9c4ac;border-radius:1.4cqw;padding:1.1cqw 1.8cqw;background:#fffef6;font-weight:700;font-size:3.1cqw;line-height:1.5;min-height:8cqw}
.quiz .opt b{color:var(--btn);font-size:1.1em}
.quiz .opt.on{border-color:var(--ink);background:#fff4c8;box-shadow:0 .5cqw 0 #c9b25a}
.quiz .opt.ok{border-color:var(--good);background:#dff5e3}
.quiz .opt.ng{border-color:var(--bad);background:#fbe0de}
.quiz.done .opt:not(.ok):not(.ng){opacity:.5}
.quiz .qf{border-top:.4cqw dashed #c9c4ac;padding-top:1.2cqw;font-size:2.8cqw;line-height:1.6}
.quiz .qf .good{color:var(--good);font:400 3.6cqw var(--f-title)}
.quiz .qf .bad{color:var(--bad);font:400 3.6cqw var(--f-title)}
.quiz .qf .ans{background:#fff4c8;padding:0 1cqw;border-radius:.6cqw}
.quiz .qf .ex{color:#46465e;margin-top:.3cqw}
.quiz .qf .go{float:right;color:var(--btn);animation:blink .7s steps(2) infinite}
.m i{font-family:var(--f-math);font-style:italic;font-weight:700}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .15em}
.fr>span:first-child{border-bottom:.12em solid currentColor;padding:0 .2em}
.dt{position:relative;display:inline-block}
.dt::after{content:"";position:absolute;left:50%;top:-.08em;width:.2em;height:.2em;margin-left:-.1em;border-radius:50%;background:currentColor}
.sys{display:inline-flex;flex-direction:column;vertical-align:middle;border-left:.15em solid currentColor;border-radius:.5em 0 0 .5em;padding-left:.5em;margin:0 .3em;line-height:1.5}
sup{font-size:.68em;line-height:0}
/* 타이틀 */
#title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6%;z-index:9;color:#fff;pointer-events:none}
#title .logo{font:400 11.5cqw/1 var(--f-title);color:#ffd84a;letter-spacing:.02em;-webkit-text-stroke:.5cqw #5a2a0a;paint-order:stroke fill;text-shadow:.8cqw .8cqw 0 #8a3a14}
#title .logo span{font-size:.62em;color:#fff;-webkit-text-stroke:.45cqw #2a3a8a;text-shadow:.6cqw .6cqw 0 #2a3a8a;vertical-align:.35em;margin-left:.15em}
#title .sub{margin-top:1.5cqw;font:700 3.2cqw var(--f-ui);background:#2a3a8acc;padding:.6cqw 2.4cqw;border-radius:5cqw;letter-spacing:.06em}
#title .copy{position:absolute;bottom:3%;font:700 2.4cqw var(--f-ui);color:#2a3a6a}
#nameIn{position:absolute;left:10%;right:10%;top:22%;z-index:10;padding:3cqw;display:flex;flex-direction:column;gap:2cqw;font-weight:700}
#nameIn input{font:700 4cqw var(--f-ui);padding:1.2cqw 2cqw;border:.5cqw solid var(--line);border-radius:1cqw;background:#fff;color:var(--ink);width:100%;box-sizing:border-box}
#nameIn button{align-self:flex-end;background:var(--btn)!important;color:#fff!important;padding:1cqw 3cqw!important;border-radius:1cqw!important}
.toast{position:absolute;left:50%;top:4%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.8cqw 2.6cqw;border-radius:5cqw;font-weight:700;font-size:2.6cqw;z-index:11;pointer-events:none;animation:pop .2s}
/* 패드 */
#pad{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 6px}
.dpad{position:relative;width:132px;height:132px}
.dpad button{position:absolute;width:44px;height:44px;background:var(--pad);border:0;color:#77768f;font-size:16px;box-shadow:0 4px 0 #0007;cursor:pointer;touch-action:none}
.dpad button:active,.dpad button.press{transform:translateY(2px);box-shadow:0 2px 0 #0007;color:#fff}
.dpad .u{left:44px;top:0;border-radius:6px 6px 0 0}.dpad .d{left:44px;bottom:0;border-radius:0 0 6px 6px}
.dpad .l{left:0;top:44px;border-radius:6px 0 0 6px}.dpad .r{right:0;top:44px;border-radius:0 6px 6px 0}
.dpad .c{position:absolute;left:44px;top:44px;width:44px;height:44px;background:var(--pad)}
.midbtns{display:flex;justify-content:center;gap:14px;align-self:end;padding-bottom:6px}
.pill{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 10px var(--f-ui);color:#6d4f10;letter-spacing:.08em}
.pill button{width:54px;height:14px;border-radius:8px;background:#6e6a7e;border:0;box-shadow:0 3px 0 #0006;cursor:pointer;transform:rotate(-20deg)}
.ab{display:flex;gap:14px;transform:rotate(-20deg);padding-right:4px}
.ab .btn{display:flex;flex-direction:column;align-items:center;gap:4px;font:700 13px var(--f-ui);color:#6d4f10}
.ab button{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#d9568a,var(--btn) 55%,var(--btn-dark));border:0;color:#fff8;font:400 22px var(--f-title);box-shadow:0 5px 0 #5a1530;cursor:pointer;touch-action:none}
.ab button:active,.ab button.press{transform:translateY(3px);box-shadow:0 2px 0 #5a1530}
.ab .btn:first-child{margin-top:26px}
.hint{font-size:13px;line-height:1.6;color:#9c99b8;text-align:center;margin:0}
.hint kbd{font:700 12px var(--f-ui);background:#2c2e44;border:1px solid #44466a;border-bottom-width:2px;border-radius:4px;padding:0 6px;color:#e5e2f6}
button:focus-visible{outline:3px solid #6ab0ff;outline-offset:2px}
@media (max-width:520px){
  #console{padding:10px 10px 14px;border-radius:14px 14px 34px 14px}
  #bezel{padding:8px 8px 6px}
  .dpad{width:117px;height:117px}.dpad button,.dpad .c{width:39px;height:39px}
  .dpad .u,.dpad .d,.dpad .c{left:39px}.dpad .l,.dpad .r,.dpad .c{top:39px}
  .ab button{width:50px;height:50px}.ab{gap:8px}
  .midbtns{gap:8px}.pill button{width:42px}
}
.stat.pb{background:transparent;border:0;box-shadow:none}
.pballs{display:flex;gap:1cqw;padding:.6cqw 1cqw;border-bottom:.5cqw solid var(--ink);border-left:.5cqw solid var(--ink)}
.pballs i{width:2.4cqw;height:2.4cqw;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff 0 18%,#f0c040 20% 50%,#2a3a8a 52%);border:.3cqw solid #202028}
.pballs i.x{background:#888;opacity:.6}
.ty{display:inline-block;color:#fff;font-size:.72em;padding:0 .9cqw;border-radius:.8cqw;margin-right:.6cqw;font-weight:700;line-height:1.5;text-shadow:0 1px 0 #0004}
.tys{margin:.2cqw 0}
.dexcard,.statcard{position:absolute;inset:2.5% 2%;z-index:9;background:#141420;color:#f4f4f4;border:.8cqw solid #c8502a;border-radius:1cqw;padding:2.4cqw 3cqw;display:flex;flex-direction:column;gap:1.6cqw;font-weight:700;animation:pop .18s}
.dexcard .dk-top{display:flex;gap:3cqw;border-bottom:.6cqw solid #c8502a;padding-bottom:1.6cqw}
.dk-pic{background:#fff;width:30%;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#202028;border-radius:.6cqw;position:relative}
.dk-pic img{width:85%;image-rendering:auto}
.dk-pic span{position:absolute;bottom:-5cqw;left:0;right:0;text-align:center;color:#f4f4f4;font-size:3cqw}
.dk-info{display:flex;flex-direction:column;gap:.6cqw;font-size:3.4cqw;flex:1}
.dk-info b{font:400 5cqw var(--f-title)}
.dk-info em{font-style:normal;float:right;font-variant-numeric:tabular-nums}
.dk-desc{font-size:3.3cqw;line-height:1.7;margin-top:2cqw}
.dk-go,.statcard::after{position:absolute;right:2.4cqw;bottom:1.4cqw;color:#f0c040;animation:blink .7s steps(2) infinite}
.tcard{position:absolute;inset:2.5% 2%;z-index:9;border-radius:1.4cqw;padding:1.6cqw;display:flex;flex-direction:column;gap:1.2cqw;font-weight:700;color:#26263a;background:repeating-conic-gradient(#3a46d0 0 25%,#d89a6a 0 50%) 0 0/3.2cqw 3.2cqw;border:.6cqw solid #2a2a8a;animation:pop .18s}
.tc-top{background:#fbfaf4;border-radius:1.2cqw;display:flex;align-items:center;padding:1cqw 2.4cqw;gap:2cqw}
.tc-info{flex:1;display:grid;grid-template-columns:auto 1fr;column-gap:2.4cqw;row-gap:.3cqw;font-size:3cqw;align-items:baseline}
.tc-info .nm{grid-column:1/3;font-size:4.4cqw;border-bottom:.5cqw solid #26263a;padding-bottom:.4cqw;margin-bottom:.4cqw}
.tc-info .v{text-align:right;font-variant-numeric:tabular-nums}
.tc-hero{height:21cqw;image-rendering:auto}
.tc-bt{background:#fbfaf4;border-radius:1.2cqw;padding:.8cqw 1.6cqw 1cqw;flex:1;display:flex;flex-direction:column;min-height:0}
.tc-bt h4{margin:0 0 .4cqw;font-size:2.8cqw;color:#2a2a8a}
.tc-badges{flex:1;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;gap:.4cqw 1cqw;min-height:0}
.tc-b{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:2.3cqw;line-height:1.1;min-height:0}
.tc-b .face{height:9.6cqw;image-rendering:auto}
.tc-b .bd{position:absolute;left:0;top:0;width:6.6cqw;image-rendering:auto;filter:drop-shadow(.3cqw .3cqw 0 rgba(0,0,0,.25))}
.tc-b .slot{position:absolute;left:.4cqw;top:.4cqw;width:5.4cqw;height:5.4cqw;border:.35cqw dashed #b8b4a8;border-radius:50%}
.tc-b.no .face{filter:grayscale(1);opacity:.4}
.tc-b .n{color:#26263a}.tc-b.no .n{color:#a8a49a}
.tc-b .no1{position:absolute;right:.6cqw;top:0;background:#d89a6a;color:#fff;border-radius:.6cqw;padding:0 .7cqw;font-size:2.1cqw}
.badgepop{position:absolute;left:50%;top:13%;transform:translateX(-50%);z-index:8;background:#fbfaf4;border:.6cqw solid #d79a18;border-radius:2cqw;padding:2cqw 3cqw;text-align:center;font-weight:700;font-size:3cqw;color:#26263a;animation:pop .25s}
.badgepop img{width:20cqw;display:block;margin:0 auto 1cqw;image-rendering:auto;animation:spinin .6s ease-out}
@keyframes spinin{from{transform:scale(.2) rotate(-200deg)}to{transform:none}}
.badgeicons img{width:4cqw;vertical-align:middle;margin-right:.3cqw;image-rendering:auto}
.statcard{background:#f0e0f8;color:#26263a;border-color:#7a4a9a;flex-direction:row;gap:3cqw}
.statcard::after{content:"▶";color:#7a4a9a}
.st-l{width:32%;display:flex;flex-direction:column;align-items:center;gap:.6cqw;background:#fff;border-radius:1cqw;padding:1.6cqw;font-size:3cqw}
.st-l img{width:90%;image-rendering:auto}
.st-nm{font:400 4cqw var(--f-title)}
.st-r{flex:1;display:flex;flex-direction:column;gap:.6cqw;font-size:3cqw;min-width:0}
.st-r em{font-style:normal;color:#7a1d3e}
.st-hp{text-align:right;font-variant-numeric:tabular-nums;font-size:3.2cqw}
.st-box{border:.5cqw double #7a4a9a;border-radius:1cqw;padding:.8cqw 1.6cqw;display:grid;grid-template-columns:1fr 1fr 1fr;gap:1cqw;background:#fff8}
.st-mv{display:grid;grid-template-columns:1fr;gap:0;font-size:2.4cqw;line-height:1.35}.st-mv>div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tdot{display:inline-block;width:1.6cqw;height:1.6cqw;border-radius:.4cqw;margin-right:.8cqw;vertical-align:middle}.st-mv sup{color:#7a4a9a;font-size:.7em}.st-mv .sm{font-size:.85em;color:#7a4a9a}
.st-st{font-size:2.6cqw;color:#55556e}
@container (max-width:480px){#ui{font-size:3.7cqw}.quiz .qq{font-size:4cqw!important}.quiz .opt{font-size:3.8cqw}.quiz .qf{font-size:3.4cqw}.stat .nm{font-size:3.4cqw}.quiz .qu{font-size:3cqw}}
#fsBtn{display:none}
/* 휴대폰: 화면을 꽉 채우기 (세로 = 화면 위 + 패드 아래, 가로 = 패드 | 화면 | 버튼) */
@media (pointer:coarse),(max-width:700px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{margin:0;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);box-sizing:border-box}
  #app{max-width:none;height:100%;gap:0}
  .hint{display:none}
  #console{flex:1;min-height:0;border-radius:0;box-shadow:none;padding:6px 6px 10px;gap:6px;justify-content:space-between}
  #bezel{border-radius:8px;padding:6px 6px 4px}
  #bezel .brand{margin-top:4px;font-size:9px}

<script>
// ================== 문제 은행 (중2 Ⅰ~Ⅵ단원) ==================
const UNITS = ['전 단원', 'Ⅰ. 유리수와 순환소수', 'Ⅱ. 문자와 식', 'Ⅲ. 함수', 'Ⅳ. 도형의 성질', 'Ⅴ. 닮음과 피타고라스 정리', 'Ⅵ. 확률'];
const R = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];

const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
const nz = (a, b) => { let v = 0; while (v === 0) v = R(a, b); return v; };
const N = n => (n < 0 ? '−' + (-n) : '' + n);
function F(n, d) { // 기약분수 문자열
  if (d < 0) { n = -n; d = -d; }

}

}

function mono(c, vs) {

}
// 다항식: [[c, vars]...]

}
const lin = (a, b, x = 'x') => poly([[a, [[x, 1]]], [b, []]]);
const lineEq = (a, b) => 'y = ' + lin(a, b);
const sys = (r1, r2) => `⟦${r1}¦${r2}⟧`;

function mk(q, a, ds, ex) {
  const opts = [a];
  for (const d of ds) { if (opts.length >= 4) break; if (d !== undefined && d !== null && !opts.includes(d)) opts.push(d); }
  return { q, a, opts, ex };
}
function mkN(q, ans, cands, ex, fmt = N) {
  const ds = [];
  const pool = cands.concat([ans + 1, ans - 1, ans + 2, ans * 2, ans - 2, ans + 3, ans + 10]);
  for (const c of pool) { if (ds.length >= 3) break; if (Number.isFinite(c) && c !== ans && !ds.includes(c)) ds.push(c); }
  return mk(q, fmt(ans), ds.map(fmt), ex);
}
// 분수 보기 (값으로 중복 제거)
function mkF(q, [n, d], cands, ex) {

  for (const [cn, cd] of cands) { if (ds.length >= 3) break; const v = cn / cd; if (!cd || seen.some(s => Math.abs(s - v) < 1e-9)) continue; seen.push(v); ds.push(F(cn, cd)); }
  return mk(q, F(n, d), ds, ex);
}
function tf(trues, falses, ex) { // 옳은 것 / 옳지 않은 것
  if (Math.random() < 0.5) { const t = pick(trues); const fs = shuffle(falses.slice()).slice(0, 3); return mk('다음 중 옳은 것은?', t, fs, ex); }
  const f = pick(falses); const ts = shuffle(trues.slice()).slice(0, 3); return mk('다음 중 옳지 않은 것은?', f, ts, ex);
}

const GEN = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [] };

// ---------------- Ⅰ. 유리수와 순환소수 ----------------

});
GEN[1].push(() => { // 순환소수 표기

});
GEN[1].push(() => { // n번째 자리 숫자
  let per, intro;
  if (Math.random() < 0.5) { per = '142857'; intro = `[1|7] = 0.⟨142857⟩일 때,`; }

GEN[1].push(() => { // 가장 작은 자연수 x

});
GEN[1].push(() => tf(
  ['순환소수는 모두 유리수이다.', '유한소수는 모두 유리수이다.', '정수가 아닌 유리수는 유한소수 또는 순환소수로 나타낼 수 있다.', '[1|3]은 순환소수로 나타내어진다.', '순환소수는 분수로 나타낼 수 있다.'],

function tileFor(t, x, y, wf) {
  const th = CUR.theme;
  if (CUR.id === 'pitaShop' && x === 1 && y === 6 && S.flags.lakeDone) return tileCv('st', th);
  if (/\d/.test(t)) {
    const w = CUR.warps[t] || {};
    if (w.door) return tileCv('D', th);
    if (w.stairs) return tileCv('st', th);
    if (w.mat) return tileCv('mat', th, 0, CUR.floor);
    return tileCv(CUR.indoor ? 'f' : (CUR.cave ? '.' : '='), th, 0, CUR.floor);
  }
  if (ROOF[t]) return tileCv('R', th, 0, ROOF[t]);
  if (t === 'G') { const d = Object.values(CUR.warps).find(w => /^gym\d$/.test(w.to)); return tileCv('R', th, 0, GYM_COL[d ? +d.to.slice(3) : 0]); }
  if (t === 'W') return tileCv('W', th, x % 2 === 0 ? 1 : 0);
  if (t === '~') return tileCv('~', th, wf);
  if ('fgcrwi'.includes(t)) return tileCv(t, th, 0, CUR.floor);
  return tileCv(t, th);
}
function drawWorld(now) {
  const sm = stepMs();
  const ox = P.moving ? (P.tx - P.x) * P.prog : 0, oy = P.moving ? (P.ty - P.y) * P.prog : 0;
  const px = (P.x + ox) * 16, py = (P.y + oy) * 16;
  const W = CUR.w * 16, Hh = CUR.h * 16;
  const camX = W <= 240 ? Math.round((W - 240) / 2) : Math.round(clamp(px - 112, 0, W - 240));
  const camY = Hh <= 160 ? Math.round((Hh - 160) / 2) : Math.round(clamp(py - 72, 0, Hh - 160));
  ctx.fillStyle = '#101018'; ctx.fillRect(0, 0, 240, 160);
  const tx0 = Math.max(0, Math.floor(camX / 16)), ty0 = Math.max(0, Math.floor(camY / 16)), wf = Math.floor(now / 500) % 2;
  for (let ty = ty0; ty <= ty0 + 10 && ty < CUR.h; ty++) for (let tx = tx0; tx <= tx0 + 15 && tx < CUR.w; tx++) ctx.drawImage(tileFor(tileAt(tx, ty), tx, ty, wf), tx * 16 - camX, ty * 16 - camY);
  for (const b of CUR.blds) {
    const em = b.emblem || ({ C: '+', M: 'M' })[b.roof]; if (!em) continue;
    const x = (b.x + b.w / 2) * 16 - camX, y = (b.y + 1) * 16 - camY;
    if (y < -20 || y > 180 || x < -20 || x > 260) continue;
    ctx.fillStyle = '#fff'; ctx.fillRect(x - 9, y - 7, 18, 14); ctx.fillStyle = '#26263a'; ctx.fillRect(x - 9, y - 7, 18, 1); ctx.fillRect(x - 9, y + 6, 18, 1); ctx.fillRect(x - 9, y - 7, 1, 14); ctx.fillRect(x + 8, y - 7, 1, 14);
    ctx.fillStyle = b.roof === 'G' ? '#333' : ROOF[b.roof] || '#333'; ctx.font = 'bold 10px "Nanum Gothic Coding", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(em, x, y + 1);
  }
  const list = CUR.ents.filter(e => entVisible(e) && Math.abs(e.y * 16 - py) < 130 && Math.abs(e.x * 16 - px) < 170);
  const pos = e => e.mv ? [e.x + (e.mv.tx - e.x) * e.mv.p, e.y + (e.mv.ty - e.y) * e.mv.p] : [e.x, e.y];
  const order = list.map(e => ({ y: pos(e)[1], e })).concat([{ y: P.y + oy, p: true }]).sort((a, b) => a.y - b.y);
  const onWater = tileAt(P.x, P.y) === '~' || (P.moving && tileAt(P.tx, P.ty) === '~');
  for (const o of order) {
    if (o.p) {
      const bob = P.jump ? -Math.round(Math.sin(P.prog * Math.PI) * 9) : P.moving && P.prog > .25 && P.prog < .75 && !P.slide ? -1 : 0;
      const sx = Math.round(px - camX), sy = Math.round(py - camY) - 3 + bob;
      if (onWater) { ctx.fillStyle = '#f04a4a'; ctx.beginPath(); ctx.ellipse(sx + 8, sy + 13, 8, 4, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(sx + 1, sy + 12, 3, 2); ctx.fillRect(sx + 12, sy + 12, 3, 2); }
      else { ctx.fillStyle = '#0003'; ctx.fillRect(sx + 3, Math.round(py - camY) + 13, 10, 2); }
      const onBike = S.bike && !onWater; if (onBike) drawBike(sx, sy, P.dir, false);
      const sp = chSprite('player', P.dir), hh = onWater ? 12 : 16;
      if (P.moving && P.step % 2 && !S.bike && (P.dir === 'up' || P.dir === 'down')) { ctx.save(); ctx.translate(sx + 16, sy); ctx.scale(-1, 1); ctx.drawImage(sp, 0, 0, 16, hh, 0, 0, 16, hh); ctx.restore(); }
      else ctx.drawImage(sp, 0, 0, 16, hh, sx, sy, 16, hh);
      if (onBike) drawBike(sx, sy, P.dir, true);
      if (!P.moving && tileAt(P.x, P.y) === ',') ctx.drawImage(tileFor(',', P.x, P.y, 0), 0, 10, 16, 6, sx, Math.round(py - camY) + 10, 16, 6);
      continue;
    }
    const e = o.e, [ex, ey] = pos(e), sx = Math.round(ex * 16 - camX), sy = Math.round(ey * 16 - camY);
    if (e.kind === 'item' || e.kind === 'starter') { drawBall(sx + 8, sy + 8, e.kind === 'starter' ? '#e04a4a' : '#f0c040'); continue; }
    if (e.kind === 'qdoor') { drawQdoor(sx, sy); continue; }
    const bigSp = { faketree: 'tree', legend: e.sp, friday: 'turtle', redfish: 'fishr', beasts: e.sp || 'beastO', sick: 'sheep2' }[e.kind];
    if (bigSp) { const k = e.kind === 'faketree' ? 22 : 30; drawMon(bigSp, 'front', sx + 8 - k / 2, sy + 14 - k + (e.kind === 'faketree' ? Math.round(Math.sin(now / 150)) : Math.sin(now / 400) * 2), k); continue; }
    ctx.fillStyle = '#0003'; ctx.fillRect(sx + 3, sy + 13, 10, 2);
    ctx.drawImage(chSprite(e.pal || 't3', e.dir || 'down'), sx, sy - 3);
    if (e.alert) { ctx.fillStyle = '#fff'; ctx.fillRect(sx + 4, sy - 15, 8, 10); ctx.fillStyle = '#202028'; ctx.fillRect(sx + 4, sy - 15, 8, 1); ctx.fillRect(sx + 4, sy - 6, 8, 1); ctx.fillStyle = '#d02a2a'; ctx.fillRect(sx + 7, sy - 13, 2, 4); ctx.fillRect(sx + 7, sy - 8, 2, 1); }
  }
  if (CUR.dark && !S.keys.lamp) {
    const cx = Math.round(px - camX) + 8, cy = Math.round(py - camY) + 6;
    const gr = ctx.createRadialGradient(cx, cy, 10, cx, cy, 34);
    gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,0,0,0.96)');
    ctx.fillStyle = gr; ctx.fillRect(0, 0, 240, 160);
  }
}
function drawBall(x, y, top) {
  ctx.fillStyle = '#0003'; ctx.fillRect(x - 4, y + 4, 8, 2);
  ctx.fillStyle = '#202028'; ctx.beginPath(); ctx.arc(x, y, 5.5, 0, 7); ctx.fill();
  ctx.fillStyle = top; ctx.beginPath(); ctx.arc(x, y, 4.5, Math.PI, 0); ctx.fill();
  ctx.fillStyle = '#2a3a8a'; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, Math.PI); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2);
}
function drawQdoor(sx, sy) {
  ctx.fillStyle = '#5a4a7a'; ctx.fillRect(sx, sy, 16, 16); ctx.fillStyle = '#8a7ab8'; for (let i = 1; i < 16; i += 4) ctx.fillRect(sx + i, sy + 1, 2, 14);

// 자전거: 옆모습은 바퀴 두 개, 앞·뒷모습은 바퀴 하나가 몸 가운데 아래로 보이고 핸들이 양옆으로 뻗는다
function drawBike(sx, sy, dir, front) {
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(sx + x, sy + y, w, h); };
  const tire = '#202028', rim = '#9aa0b0', red = '#d83a3a', dred = '#9a2a2a';
  if (dir === 'left' || dir === 'right') {
    if (front) return;
    const f = dir === 'right' ? 1 : -1, X = x => f > 0 ? x : 15 - x;
    for (const cx of [2.5, 12.5]) { ctx.fillStyle = tire; ctx.beginPath(); ctx.arc(sx + cx + .5, sy + 15, 3.2, 0, 7); ctx.fill(); ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(sx + cx + .5, sy + 15, 1.9, 0, 7); ctx.fill(); ctx.fillStyle = tire; ctx.fillRect(sx + cx, sy + 14.5, 1, 1); }
    ctx.strokeStyle = red; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(sx + X(3), sy + 15); ctx.lineTo(sx + X(7), sy + 11); ctx.lineTo(sx + X(12), sy + 11); ctx.lineTo(sx + X(13), sy + 15); ctx.moveTo(sx + X(7), sy + 11); ctx.lineTo(sx + X(9), sy + 15); ctx.stroke();
    R(Math.min(X(11), X(13)), 8, 3, 1, '#3a3a48'); R(Math.min(X(5), X(8)), 10, 4, 1, '#3a3a48');
    return;
  }
  if (dir === 'down') { // 앞모습: 앞바퀴가 몸 앞으로, 핸들은 손 높이
    if (!front) { R(1, 9, 14, 1, '#3a3a48'); return; }
    R(6, 12, 4, 7, tire); R(7, 12, 2, 7, '#3a3a48'); R(7, 11, 2, 2, red); R(5, 11, 6, 1, red);
    R(1, 9, 3, 2, '#3a3a48'); R(12, 9, 3, 2, '#3a3a48'); R(0, 9, 1, 2, red); R(15, 9, 1, 2, red);
    return;
  }
  // 뒷모습: 뒷바퀴와 흙받이가 보이고, 핸들 끝이 어깨 옆으로 살짝 보인다
  if (!front) { R(0, 8, 16, 1, '#3a3a48'); R(0, 8, 1, 2, red); R(15, 8, 1, 2, red); return; }
  R(6, 12, 4, 7, tire); R(7, 13, 2, 6, '#3a3a48'); R(5, 11, 6, 2, red); R(6, 11, 4, 1, dred); R(7, 14, 2, 1, '#f0c040');
}

function drawTitle(now) {
  const bands = ['#5a8ae0', '#6a9ae6', '#7aaaea', '#8abaee', '#9ac8f2', '#b0d6f6'];
  bands.forEach((c, i) => { ctx.fillStyle = c; ctx.fillRect(0, i * 18, 240, 18); });
  ctx.fillStyle = '#c8e2f8'; ctx.fillRect(0, 108, 240, 52);
  for (let i = 0; i < 14; i++) { const x = ((i * 37 - now / 60) % 280 + 280) % 280 - 20; ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.ellipse(x, 112 + (i % 3) * 10, 22, 8, 0, 0, 7); ctx.fill(); ctx.fillStyle = '#e6f0fa'; ctx.beginPath(); ctx.ellipse(x + 6, 118 + (i % 3) * 10, 16, 5, 0, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 140, 240, 20);
  const y = 96 + Math.sin(now / 500) * 4, s = 1.25 + Math.sin(now / 250) * .04;
  ctx.save(); ctx.translate(178, y); ctx.scale(s, s * (1 - Math.abs(Math.sin(now / 250)) * .06)); ctx.imageSmoothingEnabled = true; ctx.drawImage(sprQ('dragon', 'sil', 58 * 1.3), -29, -29, 58, 58); ctx.imageSmoothingEnabled = false; ctx.restore();
  for (let i = 0; i < 6; i++) { const k = (now / 700 + i / 6) % 1; ctx.fillStyle = `rgba(255,220,80,${1 - k})`; const x = 30 + i * 37, yy = 150 - k * 30; ctx.fillRect(x, yy, 2, 2); ctx.fillRect(x - 2, yy + 2, 6, 1); ctx.fillRect(x, yy - 2, 1, 6); }
}

// ---------- 세계 지도 ----------
const MAPCOL = { T: '#2e6a3a', '.': '#8ccf6a', ',': '#5aa848', '=': '#e8d8a0', '~': '#4a9ae0', '*': '#a8dc80', L: '#6aa850', x: '#3a7a3a', S: '#c8945a', F: '#b07a48', W: '#f2ead2', i: '#cfe8f8' };
function tileCol(M, t) {
  if (/\d/.test(t)) return M.cave ? '#b89870' : '#e8d8a0';
  if (M.cave) return t === 'T' ? '#5a4632' : t === '~' ? '#4a7ab0' : '#b89870';
  if (ROOF[t]) return ROOF[t]; if (t === 'G') return '#d0a020'; return MAPCOL[t] || '#8ccf6a';
}
function worldMap() {
  return new Promise(res => {
    const ids = Object.keys(WORLD);
    let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9; for (const id of ids) { const W2 = WORLD[id]; x0 = Math.min(x0, W2.x); y0 = Math.min(y0, W2.y); x1 = Math.max(x1, W2.x + W2.w); y1 = Math.max(y1, W2.y + W2.h); }
    const WW = x1 - x0 + 4, HH = y1 - y0 + 4, sc = 2;
    const cv = document.createElement('canvas'); cv.width = WW * sc; cv.height = HH * sc; const g = cv.getContext('2d');
    g.fillStyle = '#1d2a44'; g.fillRect(0, 0, cv.width, cv.height);
    // 격자무늬 바다 바탕
    g.fillStyle = '#22334f'; for (let y = 0; y < cv.height; y += 8) for (let x = (y / 8) % 2 * 4; x < cv.width; x += 8) g.fillRect(x, y, 2, 2);
    let seenTiles = 0, allTiles = 0;
    const here = CUR.world ? { map: CUR.id, x: P.x, y: P.y } : S.lastOut;
    for (const id of ids) {
      const M = MAPS[id], W2 = WORLD[id], f = (S.fog || {})[id] || '', cw = Math.ceil(M.w / FOGC);
      for (let y = 0; y < M.h; y++) for (let x = 0; x < M.w; x++) {
        allTiles++; if (f[Math.floor(y / FOGC) * cw + Math.floor(x / FOGC)] !== '1') continue; seenTiles++;
        g.fillStyle = tileCol(M, M.g[y][x]); g.fillRect((W2.x - x0 + 2 + x) * sc, (W2.y - y0 + 2 + y) * sc, sc, sc);
      }
    }
    // 지역 사이를 잇는 길 (양쪽 출구 중 한 곳이라도 가 봤으면 표시)
    const seenAt = (id, x, y) => { const f = (S.fog || {})[id] || '', cw = Math.ceil(MAPS[id].w / FOGC); return f[Math.floor(y / FOGC) * cw + Math.floor(x / FOGC)] === '1'; };
    for (const P2 of WPATHS) {
      if (!seenAt(P2.a, ...P2.ea) && !seenAt(P2.b, ...P2.eb)) continue;
      for (const [cx, cy] of P2.cells) { const px = (cx - x0 + 2) * sc, py = (cy - y0 + 2) * sc; g.fillStyle = P2.cave ? '#5a4632' : '#3a5a30'; g.fillRect(px - 1, py - 1, sc + 2, sc + 2); }
      for (const [cx, cy] of P2.cells) { const px = (cx - x0 + 2) * sc, py = (cy - y0 + 2) * sc; g.fillStyle = P2.cave ? '#b89870' : '#e8d8a0'; g.fillRect(px, py, sc, sc); }
    }
    // 가 본 지역의 테두리 (지역끼리 구분)
    g.strokeStyle = 'rgba(10,20,40,.55)'; g.lineWidth = 1;
    for (const id of ids) { if (!(S.fog || {})[id] || !/1/.test(S.fog[id])) continue; const W2 = WORLD[id]; g.strokeRect((W2.x - x0 + 2) * sc + .5, (W2.y - y0 + 2) * sc + .5, W2.w * sc - 1, W2.h * sc - 1); }
    // 가 본 마을 이름
    const labels = [];
    for (const id of ids) { const M = MAPS[id], W2 = WORLD[id]; if (!(S.fog || {})[id] || !/1/.test(S.fog[id])) continue; labels.push({ id, name: M.name, x: (W2.x - x0 + 2 + M.w / 2) * sc, y: (W2.y - y0 + 2 + M.h / 2) * sc, town: !M.wild && !M.cave }); }
    const el = document.createElement('div'); el.className = 'worldmap';
    el.innerHTML = `<div class="wm-h"><b>수학 지도</b><span>${here ? '현재 위치: ' + MAPS[here.map].name : ''} · 탐험 ${Math.round(seenTiles / allTiles * 100)}%</span></div><div class="wm-box"><div class="wm-in"></div></div><div class="wm-f">방향키: 지도 움직이기 · A/B: 닫기 · 어두운 곳은 아직 가 보지 않은 곳</div>`;
    const box = el.querySelector('.wm-in'); box.appendChild(cv);
    const marker = document.createElement('i'); marker.className = 'wm-me';
    if (here) { const W2 = WORLD[here.map]; marker.style.left = ((W2.x - x0 + 2 + here.x) * sc) + 'px'; marker.style.top = ((W2.y - y0 + 2 + here.y) * sc) + 'px'; box.appendChild(marker); }
    for (const P2 of WPATHS) if (P2.cave && (seenAt(P2.a, ...P2.ea) || seenAt(P2.b, ...P2.eb))) { const c = P2.cells[Math.floor(P2.cells.length / 2)]; labels.push({ id: P2.name, name: P2.name, x: (c[0] - x0 + 2) * sc, y: (c[1] - y0 + 2) * sc - 6, town: false }); }
    for (const L2 of labels) { const t = document.createElement('span'); t.className = 'wm-lb' + (L2.town ? ' town' : ''); t.textContent = L2.name; t.style.left = L2.x + 'px'; t.style.top = L2.y + 'px'; box.appendChild(t); }
    box.style.width = cv.width + 'px'; box.style.height = cv.height + 'px';
    ui.appendChild(el);
    const outer = el.querySelector('.wm-box');
    // 처음엔 내 위치가 가운데 오도록
    requestAnimationFrame(() => { const zoom = outer.clientWidth / 300; box.style.transform = `scale(${zoom})`; box.style.transformOrigin = '0 0'; const mx = here ? parseFloat(marker.style.left) * zoom : 0, my = here ? parseFloat(marker.style.top) * zoom : 0; outer.scrollLeft = mx - outer.clientWidth / 2; outer.scrollTop = my - outer.clientHeight / 2; });
    const off = pushHandler(a => {
      const st = 40;
      if (a === 'up') outer.scrollTop -= st; else if (a === 'down') outer.scrollTop += st; else if (a === 'left') outer.scrollLeft -= st; else if (a === 'right') outer.scrollLeft += st;
      else if (a === 'a' || a === 'b' || a === 'start') { off(); el.remove(); SFX.sel(); res(); }
    });
  });
}

// ---------- 메인 루프 ----------
let lastT = performance.now();
function loop(now) {
