 {t:'그래프 모양의 뜻',b:`<div class="shape-row"><div>${mini('8,52 86,8')}<span>계속 증가</span></div><div>${mini('8,8 86,52')}<span>계속 감소</span></div><div>${mini('8,30 86,30')}<span>변화 없음</span></div><div>${mini('8,52 46,10 86,10')}<span>증가 후 일정</span></div></div><p class="tip">수평선(—)은 “변화가 없다”는 뜻이에요!</p>`}
],[
 ()=>{const g=walkGraph();const k=pick(g.pts.slice(1));return prob(`민수가 집에서 출발해 산책한 시간 ${X}분과 집에서 떨어진 거리 ${Y} m의 그래프예요. 출발한 지 ${k[0]}분 후 민수는 집에서 몇 m 떨어져 있을까요?`,inp(k[1],'m'),`가로축에서 ${k[0]}을 찾고 위로 올라가 세로축 값을 읽어요.`,`${X} = ${k[0]}일 때 ${Y} = <b>${k[1]} m</b>`,lineGraph(g.pts,{xmax:Math.ceil(g.tmax/10)*10,ymax:Math.max(400,Math.ceil(g.dmax/200)*200),xstep:5,ystep:200,xl:'시간(분)',yl:'거리(m)'}))},
 ()=>{const g=walkGraph();const st=g.segs.filter(s=>s.dd===0).reduce((a,s)=>a+s.t1-s.t0,0);return prob('민수가 집에서 출발해 산책한 그래프예요. 민수가 <b>멈춰 있었던</b> 시간은 모두 몇 분일까요?',inp(st,'분'),'그래프가 수평(옆으로 평평)인 구간을 찾아요.',`수평인 구간: ${g.segs.filter(s=>s.dd===0).map(s=>`${s.t0}~${s.t1}분`).join(', ')}<br>→ 모두 <b>${st}분</b>`,lineGraph(g.pts,{xmax:Math.ceil(g.tmax/10)*10,ymax:Math.max(400,Math.ceil(g.dmax/200)*200),xstep:5,ystep:200,xl:'시간(분)',yl:'거리(m)'}))},
 ()=>{const g=walkGraph();return prob('민수가 산책하는 동안 집에서 <b>가장 멀리</b> 떨어졌을 때의 거리는 몇 m일까요?',inp(g.dmax,'m'),'그래프에서 가장 높은 점을 찾아요.',`가장 높은 점의 ${Y}좌표: <b>${g.dmax} m</b>`,lineGraph(g.pts,{xmax:Math.ceil(g.tmax/10)*10,ymax:Math.max(400,Math.ceil(g.dmax/200)*200),xstep:5,ystep:200,xl:'시간(분)',yl:'거리(m)'}))},
 ()=>{const S=[['빈 물통에 일정한 양의 물을 계속 받을 때, 시간에 따른 물의 높이',0],['불을 붙인 양초가 일정하게 탈 때, 시간에 따른 양초의 길이',1],['빈 물통에 물을 받다가 가득 차서 수도를 잠근 뒤, 시간에 따른 물의 높이',2],['물이 담긴 물통을 한동안 두었다가 물을 빼기 시작할 때, 시간에 따른 물의 높이',3]];
  const s=pick(S);const shapes=[mini('8,52 86,8'),mini('8,8 86,52'),mini('8,52 46,10 86,10'),mini('8,14 46,14 86,52')];
  return prob(`다음 상황에 알맞은 그래프는?<div class="qbox">${s[0]}</div>`,mcFixed(shapes,s[1]),'시간이 지날수록 값이 커지는지, 작아지는지, 그대로인지 생각해요.',['계속 증가하므로 오른쪽 위로 올라가는 그래프','계속 감소하므로 오른쪽 아래로 내려가는 그래프','증가하다가 변화가 없어지므로 올라가다 수평이 되는 그래프','변화가 없다가 감소하므로 수평이다가 내려가는 그래프'][s[1]])},
 ()=>{const h0=pick([40,60,80]),r=pick([2,4,5]);const t=h0/r;return prob(`물통의 물을 빼기 시작한 지 ${X}분 후의 물의 높이를 ${Y} cm라 할 때의 그래프예요. 물이 모두 빠지는 데 몇 분이 걸릴까요?`,inp(t,'분'),Y+'가 0이 되는 '+X+'의 값을 찾아요.',`그래프가 ${X}축과 만나는 점: ${X} = <b>${t}분</b>`,lineGraph([[0,h0],[t,0]],{xmax:Math.ceil((t+2)/5)*5,ymax:h0+20,xstep:5,ystep:20,xl:'시간(분)',yl:'높이(cm)'}))}
]);

T(21,3,'정비례',[
 {t:'정비례란?',b:`<p>${X}가 2배, 3배, 4배 …가 될 때 ${Y}도 2배, 3배, 4배 …가 되면 <b>${Y}는 ${X}에 정비례</b>한다고 해요.</p>${tableHTML([X,'1','2','3','4'],[[Y,'3','6','9','12']])}<p>${Y}는 항상 ${X}의 3배 → <mark>${Y} = 3${X}</mark></p>`},
 {t:'정비례의 식',b:`<div class="ex big-ex">${Y} = ${A_}${X} &nbsp;(${A_} ≠ 0)</div><p>${fs(Y,X)}의 값이 항상 ${A_}로 일정해요.</p><div class="ex">한 개에 500원인 연필 ${X}자루의 값 ${Y}원 → ${Y} = 500${X}</div>`},
 {t:'정비례의 그래프',b:`<p>${Y} = ${A_}${X}의 그래프는 <mark>원점을 지나는 직선</mark>이에요.</p><div class="row2"><div>${coordPlane([],4,{lines:[[-2,-4,2,4]]})}<div class="cap">${A_} &gt; 0: 오른쪽 위로 (제1, 3사분면)</div></div><div>${coordPlane([],4,{lines:[[-2,4,2,-4]]})}<div class="cap">${A_} &lt; 0: 오른쪽 아래로 (제2, 4사분면)</div></div></div>`},
 {t:'식 구하기',b:`<div class="ex steps">${Y}가 ${X}에 정비례하고, ${X} = 2일 때 ${Y} = 8<br>${Y} = ${A_}${X}에 대입: 8 = ${A_} × 2<br>${A_} = 4 → <b>${Y} = 4${X}</b></div>`}
],[
 ()=>{const a=RZ(-6,6),k=RZ(-5,5);return prob(`${Y} = ${co(a,'x')}에서 ${X} = ${N(k)}일 때, ${Y}의 값은?`,inp(a*k),X+'에 값을 대입해요.',`${Y} = ${N(a)} × ${P(k)} = <b>${N(a*k)}</b>`)},
 ()=>{const a=RZ(-6,6),p=RZ(-5,5),r=RZ(-5,5);const ask=Math.random()<.5;return ask?prob(`${Y}가 ${X}에 정비례하고, ${X} = ${N(p)}일 때 ${Y} = ${N(a*p)}이에요. ${Y} = ${A_}${X}에서 ${A_}의 값은?`,inp(a),`${Y} = ${A_}${X}에 ${X}, ${Y}를 대입해요.`,`${N(a*p)} = ${A_} × ${P(p)} → ${A_} = <b>${N(a)}</b>`)
  :prob(`${Y}가 ${X}에 정비례하고, ${X} = ${N(p)}일 때 ${Y} = ${N(a*p)}이에요. ${X} = ${N(r)}일 때 ${Y}의 값은?`,inp(a*r),'먼저 식 '+Y+' = '+A_+X+'를 구해요.',`${A_} = ${N(a*p)} ÷ ${P(p)} = ${N(a)} → ${Y} = ${co(a,'x')}<br>${X} = ${N(r)} → ${Y} = <b>${N(a*r)}</b>`)},
 ()=>{const a=R(2,9);const ok=pick([`${Y} = ${a}${X}`,`${Y} = −${a}${X}`,`${Y} = ${fs(X,a)}`,`${fs(Y,X)} = ${a}`]);
  return prob(`다음 중 ${Y}가 ${X}에 <b>정비례</b>하는 것은?`,mc(ok,[`${Y} = ${X} + ${a}`,`${Y} = ${fs(a,X)}`,`${X}${Y} = ${a}`,`${Y} = ${a}${X} − 1`]),Y+' = (수) × '+X+' 꼴을 찾아요.',`<b>${ok}</b>는 ${Y} = ${A_}${X} 꼴이므로 정비례예요.`)},
 ()=>{const a=RZ(-5,5);const opts=['제1사분면과 제3사분면','제2사분면과 제4사분면','제1사분면과 제2사분면','제3사분면과 제4사분면'];
  return prob(`정비례 ${Y} = ${co(a,'x')}의 그래프가 지나는 사분면은?`,mcFixed(opts,a>0?0:1),A_+'가 양수인지 음수인지 보세요.',`${A_} = ${N(a)} ${a>0?'&gt;':'&lt;'} 0 → 오른쪽 ${a>0?'위':'아래'}로 향하는 직선 → <b>${opts[a>0?0:1]}</b>`)},
 ()=>{const k=pick([300,500,800,1200]),s=pick([40,60,80]);const F=[[`한 개에 ${k}원인 공책 ${X}권의 값 ${Y}원`,`${Y} = ${k}${X}`,[`${Y} = ${k} + ${X}`,`${Y} = ${fs(k,X)}`,`${Y} = ${fs(X,k)}`]],[`시속 ${s} km로 ${X}시간 동안 달린 거리 ${Y} km`,`${Y} = ${s}${X}`,[`${Y} = ${fs(s,X)}`,`${Y} = ${s} + ${X}`,`${Y} = ${fs(X,s)}`]],[`한 변의 길이가 ${X} cm인 정삼각형의 둘레 ${Y} cm`,`${Y} = 3${X}`,[`${Y} = ${X} + 3`,`${Y} = ${fs(3,X)}`,`${Y} = ${X}<sup>3</sup>`]]];
  const f=pick(F);return prob(`다음 관계를 식으로 나타내면?<div class="qbox">${f[0]}</div>`,mc(f[1],f[2]),X+'에 1, 2, 3을 넣어 표를 만들어 보세요.',`<b>${f[1]}</b> (정비례)`)},
 ()=>{let p,q;do{p=RZ(-4,4);q=RZ(-4,4)}while(Math.abs(q)%Math.abs(p)!==0&&Math.abs(p)%Math.abs(q)!==0);const a=Q(q,p);
  return prob(`그림은 정비례 ${Y} = ${A_}${X}의 그래프예요. ${A_}의 값은?<div class="cap">분수는 1/2, −3/4 처럼 입력해요.</div>`,inp(a),'그래프가 지나는 점 A의 좌표를 읽고 대입해요.',`점 A${pt(p,q)}를 대입: ${N(q)} = ${A_} × ${P(p)}<br>${A_} = <b>${fr(a.n,a.d)}</b>`,coordPlane([{x:p,y:q,lab:'A'}],5,{lines:[lineThru(q/p)]}))}
]);

T(22,3,'반비례',[
 {t:'반비례란?',b:`<p>${X}가 2배, 3배 …가 될 때 ${Y}는 ${fs(1,2)}배, ${fs(1,3)}배 …가 되면 <b>${Y}는 ${X}에 반비례</b>한다고 해요.</p>${tableHTML([X,'1','2','3','6'],[[Y,'12','6','4','2']])}<p>${X} × ${Y}가 항상 12 → <mark>${Y} = ${fs(12,X)}</mark></p>`},
 {t:'반비례의 식',b:`<div class="ex big-ex">${Y} = ${fs(A_,X)} &nbsp;(${A_} ≠ 0)</div><p><mark>${X}${Y} = ${A_}</mark> (곱이 일정)</p><div class="ex">넓이가 24 cm²인 직사각형의 가로 ${X} cm, 세로 ${Y} cm → ${X}${Y} = 24 → ${Y} = ${fs(24,X)}</div>`},
 {t:'반비례의 그래프',b:`<p>${Y} = ${fs(A_,X)}의 그래프는 좌표축에 가까워지는 <mark>한 쌍의 매끄러운 곡선</mark>이에요.</p><div class="row2"><div>${hyper(4)}<div class="cap">${A_} &gt; 0: 제1, 3사분면</div></div><div>${hyper(-4)}<div class="cap">${A_} &lt; 0: 제2, 4사분면</div></div></div>`},
 {t:'식 구하기',b:`<div class="ex steps">${Y}가 ${X}에 반비례하고, ${X} = 3일 때 ${Y} = 4<br>${A_} = ${X}${Y} = 3 × 4 = 12<br>→ <b>${Y} = ${fs(12,X)}</b></div>`}
],[
 ()=>{const k=RZ(-6,6),y0=RZ(-6,6);const a=k*y0;return prob(`${Y} = ${fs(N(a),X)}에서 ${X} = ${N(k)}일 때, ${Y}의 값은?`,inp(y0),`${N(a)}를 ${N(k)}(으)로 나눠요.`,`${Y} = ${N(a)} ÷ ${P(k)} = <b>${N(y0)}</b>`)},
 ()=>{const p=RZ(-6,6),q=RZ(-6,6);const a=p*q;const r=pick(divs(Math.abs(a)).map(d=>d*pick([1,-1])));const ask=Math.random()<.5;
  return ask?prob(`${Y}가 ${X}에 반비례하고, ${X} = ${N(p)}일 때 ${Y} = ${N(q)}이에요. ${Y} = ${fs(A_,X)}에서 ${A_}의 값은?`,inp(a),`${A_} = ${X} × ${Y}`,`${A_} = ${N(p)} × ${P(q)} = <b>${N(a)}</b>`)
  :prob(`${Y}가 ${X}에 반비례하고, ${X} = ${N(p)}일 때 ${Y} = ${N(q)}이에요. ${X} = ${N(r)}일 때 ${Y}의 값은?`,inp(a/r),`먼저 ${A_} = ${X}${Y}를 구해요.`,`${A_} = ${N(p)} × ${P(q)} = ${N(a)}<br>${Y} = ${N(a)} ÷ ${P(r)} = <b>${N(a/r)}</b>`)},
 ()=>{const a=R(2,12);const ok=pick([`${Y} = ${fs(a,X)}`,`${X}${Y} = ${a}`,`${Y} = −${fs(a,X)}`]);return prob(`다음 중 ${Y}가 ${X}에 <b>반비례</b>하는 것은?`,mc(ok,[`${Y} = ${a}${X}`,`${Y} = ${fs(X,a)}`,`${Y} = ${X} + ${a}`,`${fs(Y,X)} = ${a}`]),X+'와 '+Y+'의 곱이 일정한 식을 찾아요.',`<b>${ok}</b> → ${X}${Y} = (일정) 이므로 반비례`)},
 ()=>{const a=pick([12,24,36,60]);const xs=divs(a).filter(d=>d<=12);const sel=shuf(xs).slice(0,4).sort((x,y)=>x-y);const hide=R(0,3);
  return prob(`${Y}가 ${X}에 반비례할 때, 표의 □에 알맞은 수는?${tableHTML([X,...sel.map(String)],[[Y,...sel.map((x,i)=>i===hide?'□':String(a/x))]])}`,inp(a/sel[hide]),'다른 칸에서 '+X+' × '+Y+'의 값을 먼저 구해요.',`${X} × ${Y} = ${a} (일정)<br>${sel[hide]} × □ = ${a} → □ = <b>${a/sel[hide]}</b>`)},
 ()=>{const F=[()=>{const S=pick([24,36,48]),x=pick(divs(S).filter(d=>d>1&&d<S));return[`넓이가 ${S} cm²인 직사각형의 가로가 ${x} cm일 때, 세로는 몇 cm일까요?`,S/x,'cm',`가로 × 세로 = ${S} → 세로 = ${S} ÷ ${x} = `]},
   ()=>{const D=pick([60,120,240]),s=pick(divs(D).filter(d=>d>=10&&d<D));return[`${D} km 떨어진 곳에 시속 ${s} km로 가면 몇 시간이 걸릴까요?`,D/s,'시간',`속력 × 시간 = ${D} → 시간 = ${D} ÷ ${s} = `]},
   ()=>{const n=pick([4,6,8]),d=pick([6,8,12,24]);const tot=n*d,m=pick(divs(tot).filter(x=>x!==n&&x>1&&x<=24));return[`${n}명이 하면 ${d}일 걸리는 일을 ${m}명이 하면 며칠이 걸릴까요? (모두 같은 빠르기로 일해요)`,tot/m,'일',`사람 수 × 일 수 = ${tot} → ${tot} ÷ ${m} = `]}];
  const [q,ans,u,ex]=pick(F)();return prob(q,inp(ans,u),'두 양의 곱이 일정한지 생각해 보세요.',ex+`<b>${ans}${u}</b>`)},
 ()=>{const a=pick([6,8,12,-6,-8,-12]);const ds=divs(Math.abs(a));const pts=shuf(ds).slice(0,3).map(d=>{const s=pick([1,-1]);return[d*s,a/(d*s)]});let bad;do{const d=pick(ds);bad=[d,a/d+pick([1,-1,2])]}while(bad[0]*bad[1]===a);
  return prob(`다음 중 반비례 ${Y} = ${fs(N(a),X)}의 그래프 위의 점이 <b>아닌</b> 것은?`,mc(pt(...bad),pts.map(p=>pt(...p))),X+' × '+Y+' = '+N(a)+'인지 확인해요.',`${pt(...bad)} → ${N(bad[0])} × ${P(bad[1])} = ${N(bad[0]*bad[1])} ≠ ${N(a)}<br>→ 그래프 위의 점이 <b>아니에요</b>.`)}
]);
function hyper(a){const u=24,r=4,S=(2*r+2)*u,c=S/2;let s='';for(let i=-r;i<=r;i++){s+=ln(c+i*u,u,c+i*u,S-u,'s grid');s+=ln(u,c+i*u,S-u,c+i*u,'s grid')}s+=ln(6,c,S-6,c)+ln(c,S-6,c,6)+tx(c-10,c+14,'O','t sm');
 for(const sg of [1,-1]){const p=[];for(let x=0.9;x<=4;x+=0.1){const xx=sg*x,yy=a/xx;if(Math.abs(yy)<=4.3)p.push([(c+xx*u).toFixed(1),(c-yy*u).toFixed(1)])}s+=`<polyline points="${p.map(q=>q.join(',')).join(' ')}" class="s acc wide" fill="none"/>`}return SV(S,S,s)}

const SOLIDS=[['삼각뿔',3,true],['사각뿔',4,true],['오각뿔',5,true],['삼각기둥',3,false],['사각기둥',4,false],['오각기둥',5,false],['육각기둥',6,false]];
T(23,4,'점, 선, 면',[
 {t:'점, 선, 면',b:`<p>점이 움직이면 <b>선</b>, 선이 움직이면 <b>면</b>이 돼요.</p><p><b>교점</b>: 선과 선, 또는 선과 면이 만나는 점<br><b>교선</b>: 면과 면이 만나서 생기는 선</p>${boxFig(4,3,3)}<p class="tip">입체도형에서 교점 = 꼭짓점, 교선 = 모서리예요!</p>`},
 {t:'직선, 반직선, 선분',b:`${tableHTML(['이름','모양','같은 것은?'],[['직선 AB','← A ── B → (양쪽 끝없이)','직선 AB = 직선 BA'],['반직선 AB','A ── B → (A에서 시작해 B쪽으로)','반직선 AB ≠ 반직선 BA'],['선분 AB','A ── B (A부터 B까지)','선분 AB = 선분 BA']])}<p class="tip">반직선은 <mark>시작점과 방향</mark>이 모두 같아야 같은 반직선이에요.</p>`},
 {t:'두 점 사이의 거리와 중점',b:`<p>두 점 A, B를 잇는 선 중 가장 짧은 <b>선분 AB의 길이</b>가 두 점 사이의 거리예요.</p><p>선분 AB 위에서 A, B로부터 같은 거리에 있는 점 M을 <b>중점</b>이라고 해요.</p><div class="ex">AB = 10 cm이고 M이 중점이면<br>AM = MB = ${fs(1,2)}AB = 5 cm</div>`}
],[
 ()=>{const s=pick(SOLIDS);const [nm,n,pyr]=s;const V=pyr?n+1:2*n,E=pyr?2*n:3*n;const ask=R(0,2);const lab=['교점','교선','교점과 교선'][ask];const ans=[V,E,V+E][ask];
  return prob(`${nm}에서 ${ask===2?'교점의 개수와 교선의 개수의 합':lab+'의 개수'}은?`,inp(ans,'개'),'교점 = 꼭짓점, 교선 = 모서리를 세어요.',`${nm}의 꼭짓점(교점): ${V}개, 모서리(교선): ${E}개<br>→ <b>${ans}개</b>`,prismFig(n,pyr))},
 ()=>{const sameOpts=['직선 AB와 직선 BC','반직선 AB와 반직선 AC','선분 AC와 선분 CA','직선 AC와 직선 CB','반직선 CB와 반직선 CA'];const diff=['반직선 AB와 반직선 BA','선분 AB와 선분 AC','반직선 BA와 반직선 BC','반직선 AC와 반직선 CA','선분 AB와 반직선 AB'];
  const ask=Math.random()<.5;if(ask)return prob('세 점 A, B, C가 한 직선 위에 이 순서대로 있을 때, 서로 <b>같은</b> 것은?',mc(pick(sameOpts),shuf(diff).slice(0,3)),'반직선은 시작점과 방향이 같아야 같아요.','직선은 이름의 순서가 달라도 같은 직선이고, 반직선은 시작점과 방향이 같으면 같아요.',numLineABC());
  return prob('세 점 A, B, C가 한 직선 위에 이 순서대로 있을 때, 서로 <b>다른</b> 것은?',mc(pick(diff),shuf(sameOpts).slice(0,3)),'반직선 AB와 반직선 BA는 시작점이 달라요.','반직선은 시작점과 방향이 모두 같아야 같은 반직선이에요. 선분과 반직선은 서로 달라요.',numLineABC())},
 ()=>{const n=R(3,6);const k=R(0,2);const nm=['직선','반직선','선분'][k];const ans=[n*(n-1)/2,n*(n-1),n*(n-1)/2][k];
  return prob(`어느 세 점도 한 직선 위에 있지 않은 서로 다른 ${n}개의 점이 있어요. 이 중 두 점을 지나는 <b>${nm}</b>의 개수는?`,inp(ans,'개'),k===1?'반직선은 AB와 BA가 달라요. 직선 개수의 2배!':'두 점을 고르는 방법의 수예요. AB와 BA는 같아요.',`두 점을 고르는 방법: ${n} × ${n-1} ÷ 2 = ${n*(n-1)/2}<br>${k===1?`반직선은 방향이 2가지 → ${n*(n-1)/2} × 2 = `:''}<b>${ans}개</b>`)},
 ()=>{const ab=R(2,10)*4;const t=R(0,1);if(t===0)return prob(`선분 AB의 길이가 ${ab} cm이고 점 M이 선분 AB의 중점일 때, AM의 길이는?`,inp(ab/2,'cm'),'중점은 선분을 반으로 나눠요.',`AM = ${ab} ÷ 2 = <b>${ab/2} cm</b>`);
  return prob(`선분 AB의 길이가 ${ab} cm예요. 점 M은 선분 AB의 중점이고, 점 N은 선분 AM의 중점일 때, 선분 NB의 길이는?`,inp(ab*3/4,'cm'),'AM, NM, MB의 길이를 차례로 구해요.',`AM = MB = ${ab/2} cm<br>NM = ${ab/2} ÷ 2 = ${ab/4} cm<br>NB = NM + MB = ${ab/4} + ${ab/2} = <b>${ab*3/4} cm</b>`)}
]);
function numLineABC(){let s=ln(20,40,380,40);[['A',80],['B',200],['C',320]].forEach(([l,x])=>{s+=dot(x,40,'d',5)+tx(x,64,l,'t b')});return SV(400,80,s)}

T(24,4,'각',[
 {t:'각과 각의 크기',b:`<p>한 점에서 시작하는 두 반직선이 이루는 도형을 <b>각</b>이라고 해요. ∠AOB 또는 ∠O로 써요.</p>${rayFig([50],['50°',''])}`},

],[
 ()=>{const t=R(0,3);const a=[R(5,89),90,R(91,179),180][t];return prob(`크기가 ${a}°인 각은?`,mcFixed(['예각','직각','둔각','평각'],t),'90°, 180°와 비교해 보세요.',`${a}°는 ${['0°보다 크고 90°보다 작으므로 예각','직각','90°보다 크고 180°보다 작으므로 둔각','평각'][t]}`)},
 ()=>{const t=R(0,2);if(t===0){const k=R(30,150);return prob(`그림에서 ∠${X}의 크기는?`,inp(180-k,'°'),'일직선은 180°예요.',`${X} + ${k}° = 180°<br>${X} = <b>${180-k}°</b>`,rayFig([180-k],[`${k}°`,X]))}
  if(t===1){const k=R(20,70),m=R(20,70);return prob(`그림에서 ∠${X}의 크기는?`,inp(180-k-m,'°'),'세 각을 모두 더하면 180°예요.',`${k}° + ${X} + ${m}° = 180°<br>${X} = <b>${180-k-m}°</b>`,rayFig([m,180-k],[`${m}°`,X,`${k}°`]))}
  const c=pick([10,20,30]);const x=(180-c)/3;if(x%1)return TOPICS[24].gens[1]();return prob(`그림에서 ${X}의 값은?`,inp(x,'°'),'일직선 위의 각의 합은 180°예요.',`${X} + (2${X} + ${c}°) = 180°<br>3${X} = ${180-c}°, ${X} = <b>${x}°</b>`,rayFig([2*x+c],[`2${X} + ${c}°`,X]))},
 ()=>{const k=R(30,150);const t=R(0,2);if(t===0)return prob(`그림과 같이 두 직선이 만날 때, ∠${X}의 크기는?`,inp(k,'°'),'마주 보는 각(맞꼭지각)은 크기가 같아요.',`∠${X}와 ${k}°는 맞꼭지각 → ∠${X} = <b>${k}°</b>`,crossFig(k>90?180-k:k,k>90?['',X,'',`${k}°`]:[X,'',`${k}°`,'']));
  if(t===1)return prob(`그림과 같이 두 직선이 만날 때, ∠${X}의 크기는?`,inp(180-k,'°'),'이웃한 두 각은 일직선을 이루므로 합이 180°예요.',`${X} + ${k}° = 180° → ∠${X} = <b>${180-k}°</b>`,crossFig(k>90?180-k:k,k>90?[X,`${k}°`,'','']:[`${k}°`,X,'','']));
  const x=R(10,40),c=R(5,30)*1;const ang=2*x+c;if(ang>=90)return TOPICS[24].gens[2]();return prob(`그림과 같이 두 직선이 만날 때, ${X}의 값은?`,inp(x,'°'),'맞꼭지각의 크기가 같다는 것을 이용해 식을 세워요.',`2${X} + ${c}° = ${ang}° (맞꼭지각)<br>2${X} = ${ang-c}°, ${X} = <b>${x}°</b>`,crossFig(ang,[`2${X} + ${c}°`,'',`${ang}°`,'']))},
 ()=>{const k=R(15,75);return prob(`그림에서 ∠AOC = 90°일 때, ∠${X}의 크기는?`,inp(90-k,'°'),'두 각을 더하면 90°예요.',`${k}° + ${X} = 90° → ${X} = <b>${90-k}°</b>`,rayFigR(k))},
 ()=>{const h=R(1,11);const ang=Math.min(h,12-h)*30;return prob(`시계가 ${h}시 정각을 가리킬 때, 시침과 분침이 이루는 각 중 <b>작은 쪽</b> 각의 크기는?`,inp(ang,'°'),'시계에서 숫자 한 칸은 360° ÷ 12 = 30°예요.',`분침은 12, 시침은 ${h}를 가리켜요. 작은 쪽으로 ${Math.min(h,12-h)}칸<br>${Math.min(h,12-h)} × 30° = <b>${ang}°</b> (${ang<90?'예각':ang===90?'직각':ang<180?'둔각':'평각'})`,clockFig(h))}
]);
function rayFigR(k){const O=[80,180];let s=ln(O[0],O[1],330,O[1])+ln(O[0],O[1],O[0],20);s+=`<path d="M${O[0]+14},${O[1]} L${O[0]+14},${O[1]-14} L${O[0]},${O[1]-14}" class="s thin" fill="none"/>`;const a=rad(k);s+=ln(O[0],O[1],O[0]+180*Math.cos(a),O[1]-180*Math.sin(a));
 s+=tx(O[0]+70*Math.cos(a/2),O[1]-70*Math.sin(a/2),k+'°','t b acc-t')+tx(O[0]+62*Math.cos((a+Math.PI/2)/2),O[1]-62*Math.sin((a+Math.PI/2)/2),X,'t b acc-t');s+=tx(O[0]-12,O[1]+12,'O','t sm')+tx(336,O[1]+4,'A','t b')+tx(O[0]+188*Math.cos(a),O[1]-188*Math.sin(a),'B','t b')+tx(O[0],14,'C','t b');return SV(360,200,s)}
function clockFig(h){const c=[100,100];let s=`<circle cx="100" cy="100" r="80" class="s" fill="none"/>`;for(let i=1;i<=12;i++){const a=rad(90-30*i);s+=tx(c[0]+64*Math.cos(a),c[1]-64*Math.sin(a),i,'t xs')}s+=ln(100,100,100,30,'s wide')+ln(100,100,100+45*Math.cos(rad(90-30*h)),100-45*Math.sin(rad(90-30*h)),'s acc wide')+dot(100,100,'d',4);return SV(200,200,s)}

T(25,4,'위치 관계',[
 {t:'평면에서 두 직선',b:`<ol class="big"><li>한 점에서 만난다</li><li>평행하다 (만나지 않는다) → ${v('l')} // ${v('m')}</li><li>일치한다</li></ol>`},
 {t:'공간에서 두 직선: 꼬인 위치',b:`<p>공간에서는 <mark>만나지도 않고 평행하지도 않은</mark> 두 직선이 있어요. 이를 <b>꼬인 위치</b>라고 해요.</p>${cubeFig(['AB','CG'])}<p>모서리 AB와 모서리 CG는 꼬인 위치예요.</p><p class="tip">꼬인 위치는 공간(입체)에서만 생겨요!</p>`},
 {t:'직육면체에서 찾는 법',b:`<p>모서리 AB를 기준으로:</p><ul class="big"><li><b>평행</b>: 같은 방향 → DC, EF, HG (3개)</li><li><b>만남</b>: A나 B에 붙은 모서리 → AD, AE, BC, BF (4개)</li><li><b>꼬인 위치</b>: 나머지 → CG, DH, EH, FG (4개)</li></ul>`},
 {t:'직선과 평면, 두 평면',b:`<p><b>직선과 평면</b>: 직선이 평면에 포함된다 / 한 점에서 만난다 / 평행하다</p><p><b>두 평면</b>: 만난다 / 평행하다</p><div class="ex">직육면체에서 면 ABCD와 평행한 모서리: EF, FG, GH, HE (4개)<br>면 ABCD와 수직인 모서리: AE, BF, CG, DH (4개)</div>`}
],[
 ()=>{const e=pick(CUBE_E);const k=R(0,2);const nm=['평행한','만나는','꼬인 위치에 있는'][k];const key=['par','meet','skew'][k];const list=CUBE_E.filter(x=>edgeRel(e,x)===key);
  return prob(`직육면체에서 모서리 ${e}와(과) <b>${nm}</b> 모서리는 모두 몇 개일까요?`,inp(list.length,'개'),k===2?'평행하지도 않고 만나지도 않는 모서리를 찾아요.':k===0?'같은 방향으로 놓인 모서리를 찾아요.':`${e[0]} 또는 ${e[1]}에 이어진 모서리를 찾아요.`,`모서리 ${e}와 ${nm} 모서리: ${list.join(', ')}<br>→ <b>${list.length}개</b>`,cubeFig([e]))},
 ()=>{const e=pick(CUBE_E);const sk=CUBE_E.filter(x=>edgeRel(e,x)==='skew');const ot=CUBE_E.filter(x=>['par','meet'].includes(edgeRel(e,x)));const ok=pick(sk);
  return prob(`직육면체에서 모서리 ${e}와(과) <b>꼬인 위치</b>에 있는 모서리는?`,mc('모서리 '+ok,shuf(ot).slice(0,3).map(x=>'모서리 '+x)),'만나지도 않고, 평행하지도 않은 모서리예요.',`모서리 ${ok}는 ${e}와 만나지도 평행하지도 않아요 → <b>꼬인 위치</b><br>(${e}와 꼬인 위치: ${sk.join(', ')})`,cubeFig([e]))},
 ()=>{const faces={ABCD:['EF','FG','GH','HE','AE','BF','CG','DH'],EFGH:['AB','BC','CD','DA','AE','BF','CG','DH'],ABFE:['DC','CG','GH','HD','AD','BC','FG','EH'],BCGF:['AD','DH','HE','EA','AB','DC','EF','HG']};const f=pick(Object.keys(faces));const par=Math.random()<.5;const list=par?faces[f].slice(0,4):faces[f].slice(4);
  return prob(`직육면체에서 면 ${f}와(과) <b>${par?'평행한':'수직인'}</b> 모서리는 모두 몇 개일까요?`,inp(4,'개'),par?'마주 보는 면의 모서리를 찾아요.':'면에 수직으로 서 있는 모서리를 찾아요.',`면 ${f}와 ${par?'평행한':'수직인'} 모서리: ${list.join(', ')} → <b>4개</b>`,cubeFig([f.slice(0,2)]))},
 ()=>{const Tt=['평면에서 두 직선은 만나거나 평행하거나 일치한다.','꼬인 위치에 있는 두 직선은 만나지 않는다.','공간에서 평행한 두 직선은 만나지 않는다.','직육면체에서 한 모서리와 평행한 모서리는 3개이다.'];const Ff=[['평면에서 두 직선은 꼬인 위치에 있을 수 있다.','꼬인 위치는 공간에서만 생겨요.'],['만나지 않는 두 직선은 항상 평행하다.','공간에서는 꼬인 위치일 수도 있어요.'],['꼬인 위치에 있는 두 직선은 한 평면 위에 있다.','꼬인 위치의 두 직선은 한 평면 위에 있지 않아요.'],['직육면체에서 한 모서리와 꼬인 위치에 있는 모서리는 2개이다.','4개예요.']];
  const f=pick(Ff);return prob('다음 중 <b>옳지 않은</b> 것은?',mc(f[0],shuf(Tt).slice(0,3)),'꼬인 위치가 언제 생기는지 생각해 보세요.',`옳지 않은 것: “${f[0]}”<br>${f[1]}`)}
]);

T(26,4,'평행선의 성질',[
 {t:'동위각과 엇각',b:`${paraFig(60,{P:{ur:'a',ul:'b',ll:'c',lr:'d'},Q:{ur:'e',ul:'f',ll:'g',lr:'h'}})}<p><b>동위각</b>: <mark>같은 위치</mark>에 있는 각 → a와 e, b와 f, c와 g, d와 h</p><p><b>엇각</b>: 두 직선 <mark>안쪽에서 엇갈린</mark> 각 → c와 e, d와 f</p>`},
 {t:'평행선의 성질',b:`<p>두 직선 ${v('l')}, ${v('m')}이 <b>평행</b>하면</p><ol class="big"><li>동위각의 크기가 같아요.</li><li>엇각의 크기가 같아요.</li></ol>${paraFig(55,{P:{ur:'55°',ll:'55°'},Q:{ur:'55°'}})}`},

 ()=>{const th=R(35,80);const k=pick(['ur','ul','ll','lr']);const val=k==='ur'||k==='ll'?th:180-th;const L1={},L2={};L1[k]=val+'°';L2[k]=X;
  return prob(`${v('l')} // ${v('m')}일 때, ∠${X}의 크기는?`,inp(val,'°'),'같은 위치에 있는 각(동위각)을 찾아보세요.',`∠${X}와 ${val}°는 동위각이고, ${v('l')} // ${v('m')}이므로 크기가 같아요.<br>∠${X} = <b>${val}°</b>`,paraFig(th,{P:L1,Q:L2}))},
 ()=>{const th=R(35,80);const sw=Math.random()<.5;const val=sw?180-th:th;const L1=sw?{lr:val+'°'}:{ll:val+'°'},L2=sw?{ul:X}:{ur:X};
  return prob(`${v('l')} // ${v('m')}일 때, ∠${X}의 크기는?`,inp(val,'°'),'두 평행선 안쪽에서 엇갈린 위치의 각(엇각)을 찾아보세요.',`∠${X}와 ${val}°는 엇각이고, ${v('l')} // ${v('m')}이므로 크기가 같아요.<br>∠${X} = <b>${val}°</b>`,paraFig(th,{P:L1,Q:L2}))},
 ()=>{const th=R(35,80);return prob(`${v('l')} // ${v('m')}일 때, ∠${X}의 크기는?`,inp(th,'°'),'먼저 동위각이나 엇각을 찾고, 일직선(180°)을 이용해요.',`${180-th}°의 엇각은 ∠${X}의 이웃한 각과 같아요.<br>∠${X} = 180° − ${180-th}° = <b>${th}°</b>`,paraFig(th,{P:{lr:(180-th)+'°'},Q:{ur:X}}))},
 ()=>{const pairs=[['a','e','동위각'],['b','f','동위각'],['c','g','동위각'],['d','h','동위각'],['c','e','엇각'],['d','f','엇각']];const p=pick(pairs);const flip=Math.random()<.5;const from=flip?p[1]:p[0],to=flip?p[0]:p[1];const others='abcdefgh'.split('').filter(x=>x!==from&&x!==to);
  return prob(`그림에서 ∠${from}의 <b>${p[2]}</b>은?`,mc('∠'+to,shuf(others).slice(0,3).map(x=>'∠'+x)),p[2]==='동위각'?'다른 교점에서 같은 위치에 있는 각을 찾아요.':'두 직선 안쪽에서 반대쪽에 있는 각을 찾아요.',`∠${from}의 ${p[2]}은 <b>∠${to}</b>예요.`,paraFig(60,{P:{ur:'a',ul:'b',ll:'c',lr:'d'},Q:{ur:'e',ul:'f',ll:'g',lr:'h'}},{parallel:false}))},
 ()=>{const k=R(40,80);const same=Math.random()<.5;const m=same?k:k+pick([-5,5,10]);return prob(`그림에서 두 직선 ${v('l')}, ${v('m')}은 평행할까요?`,mcFixed(['평행하다','평행하지 않다'],same?0:1),'동위각의 크기가 같은지 확인해요.',`동위각의 크기: ${k}°, ${m}° → ${same?'같으므로 <b>평행하다</b>':'다르므로 <b>평행하지 않다</b>'}`,paraFig(60,{P:{ur:k+'°'},Q:{ur:m+'°'}},{parallel:false}))},
 ()=>{const x=R(10,30),c=R(5,20);const val=2*x+c;if(val>=85)return TOPICS[26].gens[5]();return prob(`${v('l')} // ${v('m')}일 때, ${X}의 값은?`,inp(x),'동위각의 크기가 같음을 이용해 방정식을 세워요.',`동위각: 2${X} + ${c} = ${val}<br>2${X} = ${val-c}, ${X} = <b>${x}</b>`,paraFig(val,{P:{ur:`(2${X} + ${c})°`},Q:{ur:val+'°'}}))}
]);

T(27,4,'작도',[
 {t:'작도란?',b:`<p><b>눈금 없는 자</b>와 <b>컴퍼스</b>만 사용하여 도형을 그리는 것을 작도라고 해요.</p>${tableHTML(['도구','하는 일'],[['눈금 없는 자','두 점을 잇는 선분 긋기, 선분 연장하기'],['컴퍼스','원 그리기, 선분의 길이를 재어 옮기기']])}<p class="tip">각도기나 눈금 있는 자는 쓰지 않아요!</p>`},
 {t:'길이가 같은 선분 작도',b:`<ol class="big"><li>자로 직선을 긋고 점 P를 잡아요.</li><li>컴퍼스로 선분 AB의 길이를 재요.</li><li>점 P를 중심으로 반지름이 AB인 원을 그려 직선과 만나는 점 Q를 찾아요.</li></ol><p>→ 선분 PQ의 길이 = 선분 AB의 길이</p>`},
 {t:'삼각형이 될 조건',b:`<p>세 변의 길이가 주어질 때, <mark>(가장 긴 변) &lt; (나머지 두 변의 합)</mark>이어야 삼각형이 돼요.</p><div class="ex">3, 4, 5 → 5 &lt; 3 + 4 ○<br>2, 3, 6 → 6 &gt; 2 + 3 ✕ (삼각형이 안 돼요)<br>2, 3, 5 → 5 = 2 + 3 ✕</div>`},
 {t:'삼각형이 하나로 정해지는 경우',b:`<ol class="big"><li><b>세 변</b>의 길이를 알 때</li><li><b>두 변</b>의 길이와 <b>그 끼인각</b>의 크기를 알 때</li><li><b>한 변</b>의 길이와 <b>그 양 끝 각</b>의 크기를 알 때</li></ol><p class="tip">세 각만 알면 크기가 다른 삼각형이 여러 개 생겨요.</p>`}
],[
 ()=>{const F=[['작도할 때 사용하는 도구는?','눈금 없는 자와 컴퍼스',['눈금 있는 자와 각도기','각도기와 컴퍼스','눈금 있는 자와 컴퍼스']],['작도에서 선분의 길이를 재어 다른 곳으로 옮길 때 사용하는 도구는?','컴퍼스',['눈금 없는 자','각도기','눈금 있는 자']],['작도에서 두 점을 지나는 선분을 그을 때 사용하는 도구는?','눈금 없는 자',['컴퍼스','각도기','삼각자의 눈금']]];const f=pick(F);
  return prob(f[0],mc(f[1],f[2]),'작도에는 눈금 없는 자와 컴퍼스만 써요.',`<b>${f[1]}</b>`)},
 ()=>{const ok=()=>{let a,c,d;do{a=R(2,10);c=R(2,10);d=R(2,10)}while(Math.max(a,c,d)>=a+c+d-Math.max(a,c,d));return [a,c,d]};const bad=()=>{const a=R(2,6),c=R(2,6);return shuf([a,c,a+c+R(0,3)])};
  const askOk=Math.random()<.5;const right=askOk?ok():bad();const wr=Array.from({length:3},()=>(askOk?bad():ok()).sort((x,y)=>x-y).join(', '));const rs=right.slice().sort((x,y)=>x-y);
  return prob(`다음 중 세 변의 길이로 삼각형을 <b>${askOk?'만들 수 있는':'만들 수 없는'}</b> 것은? (단위: cm)`,mc(rs.join(', '),wr),'가장 긴 변이 나머지 두 변의 합보다 작아야 해요.',`${rs.join(', ')} → 가장 긴 변 ${rs[2]} ${rs[2]<rs[0]+rs[1]?'&lt;':'≥'} ${rs[0]} + ${rs[1]} = ${rs[0]+rs[1]}<br>→ 삼각형을 <b>${rs[2]<rs[0]+rs[1]?'만들 수 있어요':'만들 수 없어요'}</b>`)},
 ()=>{const p=R(3,9),q=R(3,9);const lo=Math.abs(p-q),hi=p+q;const cnt=hi-lo-1;return prob(`삼각형의 세 변의 길이가 ${p} cm, ${q} cm, ${X} cm일 때, 자연수 ${X}는 모두 몇 개일까요?`,inp(cnt,'개'),`${X}는 두 변의 차보다 크고, 합보다 작아야 해요.`,`${lo} &lt; ${X} &lt; ${hi}<br>${X} = ${Array.from({length:cnt},(_,i)=>lo+1+i).join(', ')}<br>→ <b>${cnt}개</b>`)},
 ()=>{const goods=['AB, BC, CA의 길이','AB, BC의 길이와 ∠B의 크기','BC의 길이와 ∠B, ∠C의 크기'];const bads=[['∠A, ∠B, ∠C의 크기','세 각만 알면 크기가 다른 삼각형이 여러 개 생겨요.'],['AB, BC의 길이와 ∠C의 크기','∠C는 AB와 BC의 끼인각이 아니에요.'],['AB = 3 cm, BC = 4 cm, CA = 8 cm','8 &gt; 3 + 4 이므로 삼각형이 만들어지지 않아요.'],['AB, CA의 길이와 ∠B의 크기','∠B는 AB와 CA의 끼인각이 아니에요.']];
  if(Math.random()<.5){const g=pick(goods);const bs=shuf(bads).slice(0,3);return prob('△ABC가 <b>하나로 정해지는</b> 것은?',mc(g,bs.map(x=>x[0])),'세 변 / 두 변과 그 끼인각 / 한 변과 양 끝 각',`<b>${g}</b> → 하나로 정해져요.<br>${bs.map(x=>'✕ '+x[0]+': '+x[1]).join('<br>')}`)}
  const bd=pick(bads);return prob('△ABC가 하나로 정해지지 <b>않는</b> 것은?',mc(bd[0],goods),'세 변 / 두 변과 그 끼인각 / 한 변과 양 끝 각이 아닌 것을 찾아요.',`<b>${bd[0]}</b><br>${bd[1]}`)}
]);

T(28,4,'합동',[
 {t:'합동이란?',b:`<p>모양과 크기가 같아서 <b>완전히 포개어지는</b> 두 도형을 합동이라고 해요.</p><div class="ex big-ex">△ABC ≡ △DEF</div><p class="tip">꼭짓점을 <mark>대응하는 순서대로</mark> 써요. A↔D, B↔E, C↔F</p>`},
 {t:'대응변과 대응각',b:`${tableHTML(['△ABC','','△DEF'],[['변 AB','=','변 DE'],['변 BC','=','변 EF'],['∠A','=','∠D'],['∠C','=','∠F']])}<p>합동인 두 도형은 <b>대응변의 길이</b>와 <b>대응각의 크기</b>가 각각 같아요.</p>`},
 {t:'삼각형의 합동 조건',b:`${tableHTML(['조건','뜻'],[['<b>SSS</b> 합동','세 변의 길이가 각각 같다'],['<b>SAS</b> 합동','두 변의 길이가 같고, 그 끼인각의 크기가 같다'],['<b>ASA</b> 합동','한 변의 길이가 같고, 그 양 끝 각의 크기가 같다']])}<p class="tip">S는 변(Side), A는 각(Angle)이에요.</p>`}
],[
 ()=>{const perm=shuf([0,1,2]);const L1=['A','B','C'],L2=['D','E','F'];const name2=perm.map(i=>L2[i]).join('');// △ABC ≡ △(name2): A↔name2[0]
  const sides={AB:R(3,9),BC:R(3,9),CA:R(3,9)};const angB=R(40,80),angC=R(30,70),angA=180-angB-angC;const ang={A:angA,B:angB,C:angC};
  const map={A:name2[0],B:name2[1],C:name2[2]};const t=R(0,1);
  if(t===0){const sKey=pick(Object.keys(sides));const tgt=map[sKey[0]]+map[sKey[1]];return prob(`△ABC ≡ △${name2}이고 ${sKey} = ${sides[sKey]} cm일 때, 변 ${tgt}의 길이는?`,inp(sides[sKey],'cm'),'꼭짓점을 쓴 순서대로 짝을 지어요.',`A↔${map.A}, B↔${map.B}, C↔${map.C}<br>${sKey}의 대응변은 ${tgt} → <b>${sides[sKey]} cm</b>`)}
  const k=pick(['A','B','C']);return prob(`△ABC ≡ △${name2}이고 ∠A = ${angA}°, ∠B = ${angB}°일 때, ∠${map[k]}의 크기는?`,inp(ang[k],'°'),'∠'+map[k]+'에 대응하는 △ABC의 각을 찾아요. 삼각형 세 각의 합은 180°!',`∠${map[k]}에 대응하는 각은 ∠${k}<br>${k==='C'?`∠C = 180° − ${angA}° − ${angB}° = `:`∠${k} = `}<b>${ang[k]}°</b>`)},
 ()=>{const C=[['AB = DE, BC = EF, CA = FD',0],['AB = DE, ∠B = ∠E, BC = EF',1],['AC = DF, ∠A = ∠D, AB = DE',1],['BC = EF, ∠B = ∠E, ∠C = ∠F',2],['AB = DE, ∠A = ∠D, ∠B = ∠E',2],['∠A = ∠D, ∠B = ∠E, ∠C = ∠F',3],['AB = DE, BC = EF, ∠C = ∠F',3]];const c=pick(C);const opts=['SSS 합동','SAS 합동','ASA 합동','합동이라고 할 수 없다'];
  return prob(`△ABC와 △DEF에서 다음이 성립할 때, 두 삼각형은 어떤 합동일까요?<div class="qbox">${c[0]}</div>`,mcFixed(opts,c[1]),'변(S)과 각(A)의 개수와 위치를 확인해요. 끼인각인지가 중요해요!',c[1]===3?(c[0].startsWith('∠A')?'세 각만 같으면 크기가 다를 수 있어서 합동이라고 할 수 없어요.':'∠C는 AB, BC의 끼인각이 아니므로 합동이라고 할 수 없어요.'):`${c[0]} → <b>${opts[c[1]]}</b>`)},
 ()=>{const Tt=['합동인 두 도형의 넓이는 같다.','합동인 두 도형의 대응각의 크기는 같다.','반지름의 길이가 같은 두 원은 합동이다.','한 변의 길이가 같은 두 정사각형은 합동이다.'];const Ff=[['넓이가 같은 두 삼각형은 합동이다.','넓이가 같아도 모양이 다를 수 있어요.'],['세 각의 크기가 같은 두 삼각형은 합동이다.','크기가 다를 수 있어요.'],['둘레의 길이가 같은 두 직사각형은 합동이다.','가로 1, 세로 5와 가로 2, 세로 4는 둘레가 같지만 합동이 아니에요.'],['넓이가 같은 두 직사각형은 합동이다.','가로 2, 세로 6과 가로 3, 세로 4는 넓이가 같지만 합동이 아니에요.']];
  const f=pick(Ff);return prob('다음 중 <b>옳지 않은</b> 것은?',mc(f[0],shuf(Tt).slice(0,3)),'반례(맞지 않는 예)를 떠올려 보세요.',`옳지 않은 것: “${f[0]}”<br>${f[1]}`)},
 ()=>{const B=R(40,75),Cc=R(35,70),A=180-B-Cc;return prob(`△ABC ≡ △DEF일 때, ∠F의 크기는?`,inp(Cc,'°'),'∠F의 대응각은 ∠C예요.',`∠F = ∠C = 180° − (${A}° + ${B}°) = <b>${Cc}°</b>`,triFig(B,Cc,{A:A+'°',B:B+'°'}))}
]);

function lineThru(m){const xe=5/Math.max(1,Math.abs(m));return[-xe,-m*xe,xe,m*xe]}

// ================= PART 5 평면도형 =================
const PNAME=['','','','삼각형','사각형','오각형','육각형','칠각형','팔각형','구각형','십각형','십일각형','십이각형','십삼각형','십사각형','십오각형'];
T(29,5,'다각형',[
 {t:'다각형',b:`<p>여러 개의 <b>선분</b>으로 둘러싸인 평면도형을 다각형이라고 해요. 변이 ${'n'}개면 ${'n'}각형!</p>${polyFig(5)}<p class="tip">원처럼 곡선이 있으면 다각형이 아니에요.</p>`},
 {t:'내각과 외각',b:`<p><b>내각</b>: 다각형 안쪽의 각<br><b>외각</b>: 한 변과 이웃한 변의 연장선이 이루는 각</p><div class="ex big-ex">(내각) + (외각) = 180°</div><p>한 꼭짓점에서 내각과 외각은 일직선을 이루기 때문이에요.</p>`},
 {t:'정다각형',b:`<p><mark>모든 변의 길이가 같고, 모든 내각의 크기가 같은</mark> 다각형이에요.</p><div class="ex">정삼각형, 정사각형, 정오각형 …</div><p class="tip">마름모는 네 변의 길이는 같지만 내각이 다를 수 있어서 정다각형이 아닐 수 있어요!</p>`},
 {t:'대각선',b:`<p>이웃하지 않는 두 꼭짓점을 이은 선분이에요.</p>${polyFig(6,true)}<div class="ex">${'n'}각형의 한 꼭짓점에서 그을 수 있는 대각선: <b>(n − 3)개</b><br>${'n'}각형의 대각선 전체 개수: <b>n(n − 3) ÷ 2</b>개</div><p class="tip">자기 자신과 양옆 꼭짓점 3개에는 대각선을 그을 수 없어서 n − 3이에요.</p>`}
],[
 ()=>{const n=R(4,12);return prob(`${PNAME[n]}의 한 꼭짓점에서 그을 수 있는 대각선의 개수는?`,inp(n-3,'개'),'자기 자신과 양옆 꼭짓점을 빼요 → n − 3',`${n} − 3 = <b>${n-3}개</b>`,n<=9?polyFig(n,true):'')},
 ()=>{const n=R(4,12);const d=n*(n-3)/2;return prob(`${PNAME[n]}의 대각선의 개수는 모두 몇 개일까요?`,inp(d,'개'),'n(n − 3) ÷ 2를 이용해요.',`${n} × (${n} − 3) ÷ 2 = ${n} × ${n-3} ÷ 2 = <b>${d}개</b>`)},
 ()=>{const n=R(5,12);const d=n*(n-3)/2;return prob(`대각선의 개수가 ${d}개인 다각형은?`,mc(PNAME[n],[PNAME[n-1],PNAME[n+1],PNAME[Math.min(15,n+2)],PNAME[d>15?n-2:Math.max(3,Math.min(15,d))]]),'n(n − 3) ÷ 2에 n을 하나씩 넣어 보세요.',`${n} × ${n-3} ÷ 2 = ${d} → <b>${PNAME[n]}</b>`)},
 ()=>{const k=R(40,170);const inv=Math.random()<.5;return prob(`다각형의 한 꼭짓점에서 ${inv?'외각':'내각'}의 크기가 ${k}°일 때, ${inv?'내각':'외각'}의 크기는?`,inp(180-k,'°'),'내각과 외각을 더하면 180°예요.',`180° − ${k}° = <b>${180-k}°</b>`)},
 ()=>{const Tt=['정다각형은 모든 변의 길이와 모든 내각의 크기가 같다.','정삼각형은 정다각형이다.','한 꼭짓점에서 내각과 외각의 크기의 합은 180°이다.','삼각형은 대각선이 없다.'];const Ff=[['네 변의 길이가 같은 사각형은 모두 정사각형이다.','마름모는 네 변의 길이가 같지만 정사각형이 아닐 수 있어요.'],['모든 변의 길이가 같은 다각형은 정다각형이다.','내각의 크기도 모두 같아야 해요.'],['원은 다각형이다.','원은 곡선으로 둘러싸여 있어 다각형이 아니에요.'],['사각형의 대각선은 4개이다.','4 × 1 ÷ 2 = 2개예요.']];
  const f=pick(Ff);return prob('다음 중 <b>옳지 않은</b> 것은?',mc(f[0],shuf(Tt).slice(0,3)),'정다각형의 두 가지 조건을 떠올려 보세요.',`옳지 않은 것: “${f[0]}”<br>${f[1]}`)},
 ()=>{const n=R(4,12);return prob(`${PNAME[n]}의 한 꼭짓점에서 대각선을 모두 그었을 때 생기는 삼각형의 개수는?`,inp(n-2,'개'),'대각선 (n − 3)개가 도형을 몇 조각으로 나누는지 생각해요.',`대각선 ${n-3}개 → 삼각형 ${n} − 2 = <b>${n-2}개</b>`,n<=9?polyFig(n,true):'')}
]);

T(30,5,'다각형의 내각과 외각',[

],[
 ()=>{const B=R(30,80),C=R(30,80),A=180-B-C;if(A<20)return TOPICS[30].gens[0]();return prob('그림의 삼각형에서 ∠'+X+'의 크기는?',inp(A,'°'),'세 내각의 합은 180°예요.',`${X} = 180° − (${B}° + ${C}°) = <b>${A}°</b>`,triFig(B,C,{A:X,B:B+'°',C:C+'°'}))},
 ()=>{const B=R(30,75),C=R(35,80),A=180-B-C;if(A<25)return TOPICS[30].gens[1]();const t=Math.random()<.5;
  if(t)return prob('그림에서 ∠'+X+'의 크기는? (∠'+X+'는 꼭짓점 C의 외각)',inp(A+B,'°'),'외각 = 이웃하지 않는 두 내각의 합',`${X} = ${A}° + ${B}° = <b>${A+B}°</b>`,triFig(B,C,{A:A+'°',B:B+'°'},{ext:X,ext2:true}));
  return prob('그림에서 ∠'+X+'의 크기는?',inp(A,'°'),'외각 = 이웃하지 않는 두 내각의 합',`${A+B}° = ${X} + ${B}°<br>${X} = <b>${A}°</b>`,triFig(B,C,{A:X,B:B+'°'},{ext:(A+B)+'°'}))},
 ()=>{const n=R(4,12);return prob(`${PNAME[n]}의 내각의 크기의 합은?`,inp(180*(n-2),'°'),'180° × (n − 2)',`180° × (${n} − 2) = 180° × ${n-2} = <b>${180*(n-2)}°</b>`)},
 ()=>{const n=pick([3,4,5,6,8,9,10,12]);const ext=360/n,int=180-ext;const ask=Math.random()<.5;return prob(`정${PNAME[n]}의 한 ${ask?'내각':'외각'}의 크기는?`,inp(ask?int:ext,'°'),'외각의 합은 360°예요. 먼저 한 외각을 구해 보세요.',`한 외각 = 360° ÷ ${n} = ${ext}°${ask?`<br>한 내각 = 180° − ${ext}° = `:' → '}<b>${ask?int:ext}°</b>`)},
 ()=>{const n=R(5,12);const s=180*(n-2);return prob(`내각의 크기의 합이 ${s}°인 다각형은?`,mc(PNAME[n],[PNAME[n-1],PNAME[n+1],PNAME[n-2]]),`180° × (n − 2) = ${s}°`,`n − 2 = ${s} ÷ 180 = ${n-2}<br>n = ${n} → <b>${PNAME[n]}</b>`)},
 ()=>{const n=pick([5,6,8,9,10,12,15]);const ext=360/n;return prob(`한 외각의 크기가 ${ext}°인 정다각형은?`,mc('정'+PNAME[n],['정'+PNAME[n-1],'정'+PNAME[Math.min(15,n+1)],'정'+PNAME[n-2]]),'외각의 합 360° ÷ (한 외각) = 변의 개수',`360° ÷ ${ext}° = ${n} → <b>정${PNAME[n]}</b>`)},
 ()=>{const r=pick([[1,2,3],[2,3,4],[1,1,2],[3,4,5],[2,3,5],[1,2,6],[1,3,5]]);const s=r[0]+r[1]+r[2];const unit=180/s;const big=r[2]*unit;
  return prob(`삼각형의 세 내각의 크기의 비가 ${r.join(' : ')}일 때, 가장 큰 각의 크기는?`,inp(big,'°'),`180°를 ${r.join(' + ')} = ${s}칸으로 나누어요.`,`한 칸: 180° ÷ ${s} = ${unit}°<br>가장 큰 각: ${unit}° × ${r[2]} = <b>${big}°</b>`)}
]);

T(31,5,'부채꼴의 성질',[
 {t:'원과 관련된 이름들',b:`${tableHTML(['이름','뜻'],[['호 AB','원 위의 두 점 A, B 사이의 원의 일부분'],['현 AB','원 위의 두 점 A, B를 이은 선분'],['부채꼴','두 반지름과 호로 둘러싸인 도형'],['중심각','부채꼴에서 두 반지름이 이루는 각'],['활꼴','현과 호로 둘러싸인 도형']])}${sectorFig(80,'','중심각','호',{chord:true})}`},
 {t:'중심각과 호의 길이',b:`<p>한 원에서 <mark>중심각의 크기와 호의 길이는 정비례</mark>해요.</p><div class="ex">중심각 30° → 호 4 cm<br>중심각 60° (2배) → 호 8 cm (2배)<br>중심각 90° (3배) → 호 12 cm (3배)</div><p>부채꼴의 <b>넓이</b>도 중심각에 정비례해요.</p>`},
 {t:'현의 길이는 정비례하지 않아요!',b:`<p>중심각의 크기가 같으면 현의 길이도 같아요. 하지만 중심각이 2배가 되어도 <mark>현의 길이는 2배가 되지 않아요</mark>.</p><div class="row2"><div>${sectorFig(60,'','60°','',{chord:true})}</div><div>${sectorFig(120,'','120°','',{chord:true})}</div></div><p class="tip">한 원에서 가장 긴 현은 지름이에요.</p>`}
],[
 ()=>{const a=pick([20,30,40,45,60]),k=pick([2,3,4]),l=R(2,9);return prob(`한 원에서 중심각의 크기가 ${a}°인 부채꼴의 호의 길이가 ${l} cm일 때, 중심각의 크기가 ${a*k}°인 부채꼴의 호의 길이는?`,inp(l*k,'cm'),'호의 길이는 중심각에 정비례해요.',`중심각이 ${a}° → ${a*k}°로 ${k}배<br>호의 길이도 ${k}배: ${l} × ${k} = <b>${l*k} cm</b>`,sectorFig(a*k,'',a*k+'°','?'))},
 ()=>{const a=pick([30,40,60,90]),k=pick([2,3]),S=R(3,12);const big=Math.random()<.5;return big?prob(`한 원에서 중심각이 ${a}°인 부채꼴의 넓이가 ${S} cm²일 때, 중심각이 ${a*k}°인 부채꼴의 넓이는?`,inp(S*k,'cm²'),'부채꼴의 넓이는 중심각에 정비례해요.',`${k}배 → ${S} × ${k} = <b>${S*k} cm²</b>`)
  :prob(`한 원에서 중심각이 ${a*k}°인 부채꼴의 넓이가 ${S*k} cm²일 때, 중심각이 ${a}°인 부채꼴의 넓이는?`,inp(S,'cm²'),'부채꼴의 넓이는 중심각에 정비례해요.',`중심각이 ${fr(1,k)}배 → ${S*k} ÷ ${k} = <b>${S} cm²</b>`)},
 ()=>{const a=pick([20,30,40,50]),k=pick([2,3,4]),l=R(2,6);return prob(`한 원에서 중심각이 ${a}°인 부채꼴의 호의 길이가 ${l} cm예요. 호의 길이가 ${l*k} cm인 부채꼴의 중심각의 크기는?`,inp(a*k,'°'),'호의 길이가 몇 배가 되었는지 보세요.',`호의 길이 ${k}배 → 중심각도 ${k}배<br>${a}° × ${k} = <b>${a*k}°</b>`)},
 ()=>{const Tt=['호의 길이는 중심각의 크기에 정비례한다.','부채꼴의 넓이는 중심각의 크기에 정비례한다.','한 원에서 가장 긴 현은 지름이다.','중심각의 크기가 같은 두 부채꼴의 현의 길이는 같다.','반원은 중심각의 크기가 180°인 부채꼴이다.'];const Ff=[['현의 길이는 중심각의 크기에 정비례한다.','현의 길이는 중심각에 정비례하지 않아요.'],['중심각의 크기가 2배가 되면 현의 길이도 2배가 된다.','현의 길이는 2배보다 짧아요.'],['호와 현으로 둘러싸인 도형을 부채꼴이라고 한다.','그것은 활꼴이에요.'],['원 위의 두 점을 이은 선분을 호라고 한다.','그것은 현이에요.']];
  const f=pick(Ff);return prob('한 원에 대한 설명으로 <b>옳지 않은</b> 것은?',mc(f[0],shuf(Tt).slice(0,3)),'현의 길이는 정비례하지 않는다는 것을 기억해요.',`옳지 않은 것: “${f[0]}”<br>${f[1]}`)},
 ()=>{const D=[['원 위의 두 점을 이은 선분','현'],['두 반지름과 호로 둘러싸인 도형','부채꼴'],['현과 호로 둘러싸인 도형','활꼴'],['원 위의 두 점 사이의 원의 일부분','호'],['부채꼴에서 두 반지름이 이루는 각','중심각']];const d=pick(D);
  return prob(`다음 설명에 알맞은 이름은?<div class="qbox">${d[0]}</div>`,mc(d[1],D.filter(x=>x!==d).map(x=>x[1])),'선분인지, 곡선인지, 도형인지, 각인지 먼저 생각해요.',`${d[0]} → <b>${d[1]}</b>`)}
]);

T(32,5,'부채꼴의 호의 길이와 넓이',[

 ()=>{const r=R(2,12);return prob(`반지름의 길이가 ${r} cm인 원의 <b>넓이</b>는?`,mc(piStr(r*r)+' cm²',[piStr(2*r)+' cm²',piStr(r)+' cm²',piStr(2*r*r)+' cm²',piStr(4*r)+' cm²']),'원의 넓이 = πr²',`π × ${r}<sup>2</sup> = <b>${piStr(r*r)} cm²</b>`)},
 ()=>{const x=pick([30,45,60,90,120,135,150,180,40,72]);const r=pick([2,3,4,6,8,9,10,12]);const l=Q(2*r*x,360);const S=Q(r*r*x,360);
  return prob(`반지름의 길이가 ${r} cm, 중심각의 크기가 ${x}°인 부채꼴의 <b>호의 길이</b>는?`,mc(piStr(l)+' cm',[piStr(S)+' cm',piStr(Q(r*x,360))+' cm',piStr(Q(4*r*x,360))+' cm',piStr(2*r)+' cm']),'2πr × (중심각) / 360',`2π × ${r} × ${fs(x,360)} = <b>${piStr(l)} cm</b>`,sectorFig(x,r+' cm',x+'°'))},
 ()=>{const x=pick([30,45,60,90,120,150,40,72]);const r=pick([2,3,4,6,8,10,12]);const l=Q(2*r*x,360);const S=Q(r*r*x,360);
  return prob(`반지름의 길이가 ${r} cm, 중심각의 크기가 ${x}°인 부채꼴의 <b>넓이</b>는?`,mc(piStr(S)+' cm²',[piStr(l)+' cm²',piStr(Q(2*r*r*x,360))+' cm²',piStr(r*r)+' cm²',piStr(Q(r*x,360))+' cm²']),'πr² × (중심각) / 360',`π × ${r}<sup>2</sup> × ${fs(x,360)} = <b>${piStr(S)} cm²</b>`,sectorFig(x,r+' cm',x+'°'))},
 ()=>{const r=R(2,10),k=R(1,8);const S=Q(r*k,2);return prob(`반지름의 길이가 ${r} cm, 호의 길이가 ${k===1?'':k}π cm인 부채꼴의 넓이는?`,mc(piStr(S)+' cm²',[piStr(r*k)+' cm²',piStr(Q(k,2))+' cm²',piStr(r*r*k)+' cm²',piStr(Q(r,2))+' cm²']),'S = ½ × (반지름) × (호의 길이)',`${fs(1,2)} × ${r} × ${k===1?'':k}π = <b>${piStr(S)} cm²</b>`)},
 ()=>{const r=pick([3,4,6,9,10,12]);const x=pick([30,60,90,120,40,45,150].filter(a=>(2*r*a)%360===0));if(!x)return TOPICS[32].gens[5]();const l=2*r*x/360;
  return prob(`반지름의 길이가 ${r} cm이고 호의 길이가 ${l===1?'':l}π cm인 부채꼴의 중심각의 크기는?`,inp(x,'°'),'2πr × (중심각) / 360 = (호의 길이)로 식을 세워요.',`2π × ${r} × ${fs(X,360)} = ${l===1?'':l}π<br>${X} = ${l} × 360 ÷ ${2*r} = <b>${x}°</b>`)}
]);

 {t:'예로 확인하기',b:`<div class="ex">오각기둥 (n = 5)<br>면: 5 + 2 = 7 → 칠면체<br>모서리: 3 × 5 = 15<br>꼭짓점: 2 × 5 = 10</div><div class="ex">육각뿔 (n = 6)<br>면: 7, 모서리: 12, 꼭짓점: 7</div>`}

  const f={기둥:{F:'n + 2',E:'3n',V:'2n'},뿔:{F:'n + 1',E:'2n',V:'n + 1'},뿔대:{F:'n + 2',E:'3n',V:'2n'}}[kind][k];
  return prob(`${nmS}의 <b>${nm}</b>의 개수는?`,inp(info[k],'개'),`n각${kind}의 ${nm} 개수: ${f}`,`n = ${n} → ${f.replace('n',n).replace(/^(\d)(\d)$/,'$1 × $2')} = <b>${info[k]}개</b>`,kind==='뿔대'?'':prismFig(n,kind==='뿔'))},

 ()=>{const kind=pick(['기둥','뿔','뿔대']);const n=R(3,8);return prob(`${POLY_K[n]}각${kind}의 옆면의 모양은?`,mcFixed(['직사각형','삼각형','사다리꼴','오각형'],kind==='기둥'?0:kind==='뿔'?1:2),'각기둥·각뿔·각뿔대의 옆면을 떠올려요.',`각${kind}의 옆면 모양: <b>${solidInfo(kind,n).side}</b>`)},
 ()=>{const n=R(3,9);const kind=pick(['기둥','뿔']);const E=solidInfo(kind,n).E;return prob(`모서리의 개수가 ${E}개인 각${kind}은?`,mc(POLY_K[n]+'각'+kind,[POLY_K[Math.max(3,n-1)===n?n+1:n-1]+'각'+kind,POLY_K[Math.min(10,n+1)]+'각'+kind,POLY_K[n]+'각'+(kind==='기둥'?'뿔':'기둥'),POLY_K[Math.min(10,n+2)]+'각'+kind]),kind==='기둥'?'n각기둥의 모서리: 3n':'n각뿔의 모서리: 2n',`${kind==='기둥'?'3':'2'}n = ${E} → n = ${n} → <b>${POLY_K[n]}각${kind}</b>`)}

T(34,6,'정다면체',[

 ()=>{const r=pick(REG);return prob(`다음 조건을 만족하는 정다면체는?<div class="qbox">면의 모양: ${r[1]}<br>한 꼭짓점에 모인 면의 개수: ${r[2]}개</div>`,mc(r[0],REG.filter(x=>x!==r).map(x=>x[0])),'면 모양과 꼭짓점에 모인 면의 수를 함께 봐요.',`<b>${r[0]}</b>`)},
 ()=>{const Tt=['정다면체는 5가지뿐이다.','정육면체의 면은 정사각형이다.','정팔면체의 면은 정삼각형이다.','정십이면체의 면은 정오각형이다.'];const Ff=[['면의 모양이 정육각형인 정다면체가 있다.','정육각형 면의 정다면체는 없어요.'],['정이십면체의 꼭짓점은 20개이다.','꼭짓점은 12개예요.'],['정팔면체의 면은 정사각형이다.','정삼각형이에요.'],['정사면체의 모서리는 4개이다.','6개예요.']];
  const f=pick(Ff);return prob('다음 중 <b>옳지 않은</b> 것은?',mc(f[0],shuf(Tt).slice(0,3)),'정다면체 표를 떠올려 보세요.',`옳지 않은 것: “${f[0]}”<br>${f[1]}`)}

T(35,6,'회전체',[

 ()=>{const r=pick(REV);return prob(`${r[1]}을(를) 회전축을 <b>포함하는</b> 평면으로 자를 때 생기는 단면의 모양은?`,mc(r[2],['직사각형','이등변삼각형','원','사다리꼴','정사각형'].filter(x=>x!==r[2])),'돌리기 전 도형을 축 반대쪽에도 똑같이 붙인 모양이에요.',`${r[1]} → <b>${r[2]}</b>`)},
 ()=>{const non=pick(['정육면체','사각뿔','삼각기둥','오각뿔대']);return prob('다음 중 <b>회전체가 아닌</b> 것은?',mc(non,shuf(['원기둥','원뿔','구','원뿔대']).slice(0,3)),'회전체는 축에 수직으로 자르면 원이 나와요.',`<b>${non}</b>은(는) 다면체예요. 회전체가 아니에요.`)},
 ()=>{const t=Math.random()<.5;const a=R(2,8),h=R(3,10);if(t)return prob(`가로 ${a} cm, 세로 ${h} cm인 직사각형을 세로를 회전축으로 1회전 시킨 원기둥이 있어요. 이 원기둥을 회전축을 포함하는 평면으로 자른 단면의 넓이는?`,inp(2*a*h,'cm²'),'단면은 가로가 2배인 직사각형이에요.',`단면: 가로 ${a} × 2 = ${2*a} cm, 세로 ${h} cm인 직사각형<br>넓이 = ${2*a} × ${h} = <b>${2*a*h} cm²</b>`,revolveFig('rect'));
  return prob(`밑변 ${a} cm, 높이 ${h} cm인 직각삼각형을 높이를 회전축으로 1회전 시킨 원뿔이 있어요. 이 원뿔을 회전축을 포함하는 평면으로 자른 단면의 넓이는?`,inp(a*h,'cm²'),'단면은 밑변이 2배인 이등변삼각형이에요.',`단면: 밑변 ${2*a} cm, 높이 ${h} cm인 삼각형<br>넓이 = ${2*a} × ${h} ÷ 2 = <b>${a*h} cm²</b>`,revolveFig('rtri'))}

function snap(p){return{q:p.q,fig:p.fig||'',type:p.type,choices:p.choices,answer:p.answer,accept:p.accept,ans:p.ans,show:p.show,unit:p.unit,hint:p.hint,ex:p.ex,fixed:p.fixed}}
function logWrong(p,my){let n=D.wrong.find(w=>w.p.q===p.q&&w.tid===p.tid);if(n){n.n++;n.ok=0;n.t=Date.now();n.my=my}else{n={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),tid:p.tid,gi:p.gi,p:snap(p),my,t:Date.now(),n:1,ok:0};D.wrong.unshift(n);if(D.wrong.length>300)D.wrong.pop()}return n}
const ansText=p=>p.type==='choice'?p.choices[p.answer]:p.show+(p.unit?' '+p.unit:'');

// ---------- 세션 ----------
let S=null,TIMER=null,view='home',arg={};
function mk(tid,gi){const p=TOPICS[tid].gens[gi]();p.tid=tid;p.gi=gi;return p}
function quizList(tid,n){const g=TOPICS[tid].gens.length;return Array.from({length:n},(_,i)=>mk(tid,Math.min(g-1,Math.floor(i*g/n))))}
function randQ(tid){return mk(tid,R(0,TOPICS[tid].gens.length-1))}
function studied(){const s=TOPICS.filter(t=>t&&(D.lesson[t.id]||D.stars[t.id]!=null||D.best[t.id]!=null)).map(t=>t.id);return s.length>=2?s:TOPICS.filter(Boolean).map(t=>t.id)}
function start(mode,opt={}){
 clearInterval(TIMER);S={mode,opt,i:0,score:0,combo:0,maxCombo:0,tries:0,xp:0,answered:false,hint:false,list:[],grad:0,wrongN:0};
 if(mode==='quiz'){S.tid=opt.tid;S.total=10;S.list=quizList(opt.tid,10)}
 if(mode==='type'){S.tid=opt.tid;S.total=5;S.list=Array.from({length:5},()=>mk(opt.tid,opt.gi))}
 if(mode==='mix'){const pool=opt.pool||studied();S.total=10;S.list=Array.from({length:10},()=>randQ(pick(pool)))}
 if(mode==='speed'){S.tid=opt.tid;S.total=0;S.time=60;S.list=[randQ(opt.tid)];TIMER=setInterval(()=>{if(view!=='run'){clearInterval(TIMER);return}S.time--;const el=document.getElementById('timer');if(el){el.textContent=S.time+'초';el.classList.toggle('low',S.time<=10)}if(S.time<=0){clearInterval(TIMER);end()}},1000)}
 if(mode==='boss'){S.pid=opt.pid;S.hp=10;S.maxhp=10;S.hearts=3;S.list=[randQ(pick(topicsIn(opt.pid)).id)]}
 if(mode==='review'){S.total=opt.notes.length;S.list=opt.notes.map(n=>Object.assign(clone(n.p),{tid:n.tid,gi:n.gi,noteId:n.id}))}
 go('run');
}
const cur=()=>S.list[S.i];
function submit(val){
 if(!S||S.answered)return;const p=cur();
 if(p.type!=='choice'&&String(val).trim()===''){const i=document.getElementById('ans');if(i){i.classList.add('shake');setTimeout(()=>i.classList.remove('shake'),400);i.focus()}return}
 const ok=p.type==='choice'?val===p.answer:checkInput(p,val);S.tries++;
 const my=p.type==='choice'?p.choices[val]:esc(val)+(p.unit?' '+p.unit:'');
 if(ok)return finish(true);
 S.combo=0;
 if(S.tries===1){logWrong(p,my);S.wrongN++;save()}
 if(S.tries===1&&S.mode!=='speed'){
  sfx('no');
  if(p.type==='choice'){const bt=document.querySelector(`.ch[data-i="${val}"]`);if(bt){bt.classList.add('wrong');bt.disabled=true}}
  else{const i=document.getElementById('ans');if(i){i.classList.add('shake');setTimeout(()=>i.classList.remove('shake'),400);i.select()}}
  fb(`<div class="fb retry"><div class="fb-h">${pick(['아까워요!','괜찮아요!','거의 다 왔어요!'])} 한 번 더 해 볼까요?</div><div class="fb-hint"><b>힌트</b> ${p.hint}</div><div class="cap">오답노트에 저장했어요. 나중에 다시 풀 수 있어요.</div></div>`);
  updStat();return;
 }
 finish(false,my);
}
function finish(ok,my){
 S.answered=true;const p=cur();const first=S.tries===1;markDay();D.solved++;let gain=0,extra='';
 if(ok){if(first){S.score++;D.first++;S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);D.maxCombo=Math.max(D.maxCombo,S.combo);gain=10+Math.min(S.combo-1,5)*2}else gain=4;
  S.xp+=gain;addXP(gain);sfx(S.combo>=3&&first?'combo':'ok');
  if(S.mode==='boss'){S.hp=Math.max(0,S.hp-1);sfx('hit');const m=document.querySelector('.monster');if(m){m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit')}}
  if(S.mode==='review'){const n=D.wrong.find(w=>w.id===p.noteId);if(n){if(first){n.ok++;if(n.ok>=1){D.wrong=D.wrong.filter(w=>w!==n);D.grad++;S.grad++;extra=`<div class="grad">오답 졸업! 이 문제는 이제 완전히 내 것이에요.</div>`;addXP(15);S.xp+=15}else extra=''}}}
 }else{sfx('no');if(S.mode==='boss')S.hearts--;if(S.mode==='review'){const n=D.wrong.find(w=>w.id===p.noteId);if(n)n.ok=0}}
 save();checkBadges();
 document.querySelectorAll('.ch').forEach(b=>{b.disabled=true;if(+b.dataset.i===p.answer&&p.type==='choice')b.classList.add('right')});
 const inEl=document.getElementById('ans');if(inEl){inEl.disabled=true;inEl.classList.add(ok?'okin':'noin')}
 document.querySelectorAll('.keys button,.inrow .btn').forEach(b=>b.disabled=true);
 const over=S.mode==='boss'&&(S.hp<=0||S.hearts<=0);const last=S.total&&S.i>=S.total-1;
 const nextBtn=S.mode==='speed'?'':`<button class="btn primary big" data-act="next" id="nextbtn">${over||last?'결과 보기':'다음 문제'} →</button>`;
 if(ok)fb(`<div class="fb ok"><div class="fb-h">${pick(['정답!','완벽해요!','좋아요!','최고예요!','잘했어요!','바로 그거예요!'])} <span class="xp">+${gain} XP</span>${S.combo>=3&&first?` <span class="combo-pop">${S.combo} 콤보!</span>`:''}</div>${extra}${S.mode==='speed'?'':`<details class="fb-ex"><summary>풀이 보기</summary><div>${p.ex}</div></details>`}${nextBtn}</div>`);
 else fb(`<div class="fb no"><div class="fb-h">정답은 <span class="ansv">${ansText(p)}</span></div>${S.mode==='speed'?'':`<div class="fb-ex open"><b>풀이</b><div>${p.ex}</div></div><div class="cap">오답노트에 저장했어요. 다시 풀어서 맞히면 졸업!</div>`}${nextBtn}</div>`);
 updStat();
 if(S.mode==='speed'){setTimeout(()=>{if(S&&S.mode==='speed'&&view==='run'&&S.time>0)next()},ok?650:1700)}
 else setTimeout(()=>{const nb=document.getElementById('nextbtn');if(nb){nb.focus({preventScroll:true});nb.scrollIntoView({block:'nearest',behavior:'smooth'})}},60);
}
function next(){
 if(!S)return;
 if(S.mode==='boss'&&(S.hp<=0||S.hearts<=0))return end();
 if(S.total&&S.i>=S.total-1)return end();
 if(S.mode==='speed')S.list.push(randQ(S.tid));
 if(S.mode==='boss')S.list.push(randQ(pick(topicsIn(S.pid)).id));
 S.i++;S.tries=0;S.answered=false;S.hint=false;app.innerHTML=runHTML();bindRun();window.scrollTo(0,0);
}
function end(){
 clearInterval(TIMER);const r={mode:S.mode,score:S.score,total:S.total,xp:S.xp,maxCombo:S.maxCombo,wrongN:S.wrongN,grad:S.grad,tid:S.tid,pid:S.pid,stars:0,newBest:false,win:false,opt:S.opt};
 if(S.mode==='quiz'){const st=S.score>=10?3:S.score>=8?2:S.score>=6?1:0;r.stars=st;if(st>starsOf(S.tid))D.stars[S.tid]=st;if((D.best[S.tid]??-1)<S.score){D.best[S.tid]=S.score;r.newBest=true}if(st===3){addXP(30);r.xp+=30}}
 if(S.mode==='type'){const k=S.tid+'-'+S.opt.gi;const td=D.typeDone[k]||{n:0,best:0};td.n++;r.newBest=S.score>td.best;td.best=Math.max(td.best,S.score);D.typeDone[k]=td}
 if(S.mode==='speed'){r.total=S.i+1;if((D.speed[S.tid]||0)<S.score){D.speed[S.tid]=S.score;r.newBest=true}}
 if(S.mode==='boss'){r.win=S.hp<=0;r.hp=S.hp;if(r.win){const firstWin=!D.boss[S.pid];D.boss[S.pid]=true;addXP(firstWin?80:40);r.xp+=firstWin?80:40}r.total=S.i+1}
 save();checkBadges();const res=r;S=null;go('result',res);
 if(res.stars===3||res.win||(res.mode!=='boss'&&res.total&&res.score===res.total&&res.total>=5)){sfx('win');confetti()}
}
function fb(h){const el=document.getElementById('fb');if(el)el.innerHTML=h}
function updStat(){const el=document.getElementById('rstat');if(el)el.innerHTML=statHTML();const pr=document.getElementById('prog');if(pr&&S.total)pr.style.width=((S.i+(S.answered?1:0))/S.total*100)+'%';const bh=document.getElementById('bosshp');if(bh){bh.style.width=(S.hp/S.maxhp*100)+'%';document.getElementById('hpnum').textContent=S.hp+' / '+S.maxhp;document.getElementById('hearts').innerHTML=heartsHTML()}}
const heartsHTML=()=>Array.from({length:3},(_,i)=>`<span class="heart ${i<S.hearts?'on':''}">♥</span>`).join('');
function statHTML(){let s='';if(S.mode==='speed')s+=`<span class="timer" id="timer">${S.time}초</span><span class="sc">정답 ${S.score}</span>`;else if(S.mode==='boss')s+=`<span class="sc">맞힌 수 ${S.score}</span>`;else s+=`<span class="sc">${S.i+1} / ${S.total}</span>`;
 s+=`<span class="combo ${S.combo>=3?'hot':''}">콤보 ${S.combo}</span>`;return s}

// ---------- 화면 ----------
function go(v,a={}){view=v;arg=a;render();window.scrollTo(0,0)}
function bar(){const L=lvInfo(D.xp);const nw=D.wrong.length;return `<header class="bar"><button class="logo" data-act="home" aria-label="처음 화면">수학<b>퀘스트</b><span>${CFG.num}</span></button>
 <div class="lvbox" title="${L.title}"><span class="lv">Lv.${L.lv}</span><div class="xpbar"><i style="width:${L.rest/L.need*100}%"></i></div><span class="xpn">${L.rest}/${L.need}</span></div>
 <button class="nbtn" data-act="notes">오답노트${nw?`<b>${nw}</b>`:''}</button><button class="ibtn" data-act="records" aria-label="내 기록">기록</button><button class="ibtn" data-act="sound" aria-label="소리 켜기/끄기">${D.sound?'소리 켬':'소리 끔'}</button></header>`}
function render(){
 if(view==='run'){app.innerHTML=runHTML();bindRun();return}
 let h=bar();
 if(view==='home')h+=homeHTML();
 if(view==='topic')h+=topicHTML(arg.tid,arg.tab||'lesson');
 if(view==='result')h+=resultHTML(arg);
 if(view==='notes')h+=notesHTML(arg.part||0,arg.tid||0);
 if(view==='records')h+=recordsHTML();
 app.innerHTML=h;
 if(!D.name)showName();
}
function ring(n,goal){const r=34,c=2*Math.PI*r,f=Math.min(1,n/goal);return `<svg viewBox="0 0 84 84" width="84" height="84" class="ring"><circle cx="42" cy="42" r="${r}" class="rg-b"/><circle cx="42" cy="42" r="${r}" class="rg-f" stroke-dasharray="${(c*f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 42 42)"/><text x="42" y="40" class="rg-t">${n}</text><text x="42" y="56" class="rg-s">/ ${goal}</text></svg>`}
function nextTopic(){return TOPICS.find(t=>t&&starsOf(t.id)<1)||TOPICS.find(t=>t&&starsOf(t.id)<3)}
function homeHTML(){const L=lvInfo(D.xp);const tn=D.today.d===todayStr()?D.today.n:0;const nt=nextTopic();const st=streak();
 let h=`<main class="wrap"><section class="hero"><div class="hello"><div class="eyebrow">Lv.${L.lv} · ${L.title}</div><h1>${esc(D.name||'친구')}의 수학 퀘스트</h1><p>${NT()}개 단원을 하나씩 정복해요. 개념을 읽고, 문제를 풀고, 틀린 문제는 오답노트에서 다시!</p>
 <div class="hero-btns"><button class="btn primary" data-act="mix">랜덤 10문제 도전</button><button class="btn" data-act="notes">오답노트 다시 풀기${D.wrong.length?` (${D.wrong.length})`:''}</button><button class="btn ghost" data-act="records">내 기록·배지</button></div></div>
 <div class="goal">${ring(tn,GOAL)}<div><div class="g-h">오늘의 목표</div><div class="g-s">${tn>=GOAL?'목표 달성! 대단해요':`${GOAL-tn}문제 더 풀면 달성`}</div><div class="g-s">연속 학습 <b>${st}일</b> · 별 <b>${totalStars()}</b>/${MAXS()}</div></div></div></section>`;
 if(nt)h+=`<button class="cont ${partOf(nt.id).col}" data-act="topic" data-t="${nt.id}"><span class="cont-l">이어서 공부하기</span><span class="cont-t"><span class="tn">${tnum(nt.id)}</span>${nt.title}</span><span class="cont-a">시작 →</span></button>`;
 for(const P of PARTS){const ts=topicsIn(P.id);const got=ts.reduce((a,t)=>a+starsOf(t.id),0);
  h+=`<section class="part ${P.col}"><div class="part-h"><div><span class="pnum">PART ${P.id}</span><h2>${P.name}</h2><p>${P.sub} · ${ts[0].id}~${ts[ts.length-1].id}번</p></div><div class="part-r"><span class="pstars">★ ${got} / ${ts.length*3}</span><button class="btn boss" data-act="boss" data-p="${P.id}">${D.boss[P.id]?'보스 재도전':'보스전'}: ${P.boss}</button></div></div><div class="tiles">`;
  for(const t of ts){const s=starsOf(t.id);const nw=D.wrong.filter(w=>w.tid===t.id).length;h+=`<button class="tile ${s===3?'mast':''} ${nt&&nt.id===t.id?'nexty':''}" data-act="topic" data-t="${t.id}"><span class="tn">${tnum(t.id)}</span><span class="tt">${t.title}</span><span class="ts">${starStr(s)}</span><span class="tmeta">${D.lesson[t.id]?'<span class="chk">개념 ✓</span>':''}${nw?`<span class="wn">오답 ${nw}</span>`:''}</span></button>`}
  h+=`</div></section>`}
 return h+`<footer class="foot">${CFG.foot} · 진행 기록은 이 기기의 브라우저에 저장돼요.</footer></main>`}
function topicHTML(id,tab){const t=TOPICS[id],P=partOf(id);const nw=D.wrong.filter(w=>w.tid===id).length;
 let h=`<main class="wrap"><div class="tophead ${P.col}"><button class="back" data-act="home">← 단원 목록</button><div class="crumb">PART ${P.id} · ${P.name}</div><h1><span class="tnum">${tnum(id)}</span>${t.title}</h1><div class="tstat">${starStr(starsOf(id))}<span>퀴즈 최고 ${D.best[id]??'-'}/10</span><span>스피드 최고 ${D.speed[id]??'-'}</span></div>
 <nav class="tabs" role="tablist">${[['lesson','개념 배우기'],['quiz','연습 퀴즈'],['speed','스피드 게임'],['wrong',`이 단원 오답${nw?` ${nw}`:''}`]].map(([k,l])=>`<button role="tab" aria-selected="${tab===k}" class="${tab===k?'on':''}" data-act="tab" data-tab="${k}">${l}</button>`).join('')}</nav></div>`;
 if(tab==='lesson'){const L=t.lesson;const i=Math.min(arg.card||0,L.length-1);const c=L[i];const last=i===L.length-1;
  h+=`<section class="lesson"><div class="lcard"><div class="lstep">개념 ${i+1} / ${L.length}</div><h2>${c.t}</h2><div class="lbody">${c.b}</div></div>
  <div class="lnav"><button class="btn" data-act="card" data-c="${i-1}" ${i===0?'disabled':''}>← 이전</button><div class="dots">${L.map((_,k)=>`<button class="dot ${k===i?'on':''} ${k<i?'past':''}" data-act="card" data-c="${k}" aria-label="개념 ${k+1}"></button>`).join('')}</div>${last?`<button class="btn primary" data-act="lessondone">다 읽었어요! 문제 풀기 →</button>`:`<button class="btn primary" data-act="card" data-c="${i+1}">다음 →</button>`}</div></section>`}
 if(tab==='quiz'){h+=`<section class="panel"><div class="pgrid"><div class="pcard main"><h2>연습 퀴즈 10문제</h2><p>쉬운 문제부터 차근차근 어려워져요. 처음에 맞히면 별 점수에 들어가요.</p><ul class="rules"><li>틀리면 <b>힌트</b>를 보고 한 번 더 풀 수 있어요.</li><li>연속으로 맞히면 <b>콤보 보너스 XP</b>!</li><li>6개 ★ · 8개 ★★ · 10개 ★★★</li></ul><button class="btn primary big" data-act="quiz" data-t="${id}">퀴즈 시작</button></div>
  <div class="pcard"><h3>유형별 집중 연습 <span class="cap">유형마다 5문제 · ${t.gens.filter((_,gi)=>(D.typeDone||{})[id+'-'+gi]).length} / ${t.gens.length} 유형 학습함</span></h3><div class="types">${t.gens.map((g,gi)=>{let s='';try{s=g().q.replace(/<div[\s\S]*$/,'').replace(/<[^>]+>/g,'').slice(0,46)}catch(e){}const td=(D.typeDone||{})[id+'-'+gi];return `<button class="type ${td?'done':''}" data-act="type" data-t="${id}" data-g="${gi}"><span class="tyn">유형 ${gi+1}</span><span class="tyq">${esc(s)}…</span>${td?`<span class="tydone" title="${td.n}번 학습, 최고 ${td.best}/5">✓ 학습함 · 최고 ${td.best}/5${td.n>1?` · ${td.n}회`:''}</span>`:''}</button>`}).join('')}</div><p class="cap">숫자가 매번 바뀌어서 몇 번이든 새로 연습할 수 있어요.</p></div></div></section>`}
 if(tab==='speed')h+=`<section class="panel"><div class="pcard main speedcard"><h2>60초 스피드 게임</h2><p>60초 동안 최대한 많이 맞혀 보세요. 틀려도 바로 다음 문제로 넘어가요.</p><div class="bigrec"><span>내 최고 기록</span><b>${D.speed[id]??0}</b><span>문제</span></div><button class="btn primary big" data-act="speed" data-t="${id}">시작!</button></div></section>`;
 if(tab==='wrong')h+=notesList(D.wrong.filter(w=>w.tid===id),true);
 return h+'</main>'}
function resultHTML(r){let title,sub='',big='';const tname=r.tid?TOPICS[r.tid].title:'';
 if(r.mode==='quiz'){big=`<div class="rstars">${starStr(r.stars)}</div>`;title=['조금만 더 힘내요!','별 하나 획득!','잘했어요!','완벽해요! 만점!'][r.stars];sub=`${tname} · ${r.score}/10 정답${r.newBest?' · 최고 기록!':''}`}
 else if(r.mode==='speed'){big=`<div class="rnum">${r.score}<span>문제</span></div>`;title=r.newBest?'새로운 최고 기록!':'수고했어요!';sub=`${tname} · 60초 동안 ${r.score}문제 정답`}
 else if(r.mode==='boss'){const P=PARTS[r.pid-1];big=`<div class="rboss ${P.col}">${monster(P.id,r.win)}</div>`;title=r.win?`${P.boss}를 물리쳤어요!`:`${P.boss}가 아직 버티고 있어요`;sub=r.win?`PART ${P.id} 보스 클리어`:`남은 보스 체력 ${r.hp}. 오답노트로 약점을 보강하고 다시 도전해요!`}
 else if(r.mode==='review'){big=`<div class="rnum">${r.score}<span>/ ${r.total}</span></div>`;title=r.grad?`${r.grad}문제 오답 졸업!`:'오답 복습 완료';sub='처음에 맞힌 문제는 한 번 더 맞히면 졸업해요.'}
 else{big=`<div class="rnum">${r.score}<span>/ ${r.total}</span></div>`;title=r.score===r.total?'모두 정답!':'수고했어요!';sub=r.mode==='type'?`${tname} 유형 연습`:'랜덤 도전'}
 const again=r.mode==='quiz'?`data-act="quiz" data-t="${r.tid}"`:r.mode==='speed'?`data-act="speed" data-t="${r.tid}"`:r.mode==='boss'?`data-act="boss" data-p="${r.pid}"`:r.mode==='type'?`data-act="type" data-t="${r.tid}" data-g="${r.opt.gi}"`:r.mode==='mix'?'data-act="mix"':'data-act="notes"';
 return `<main class="wrap"><section class="result">${big}<h1>${title}</h1><p class="rsub">${sub}</p><div class="rgrid"><div><b>+${r.xp}</b><span>얻은 XP</span></div><div><b>${r.maxCombo}</b><span>최대 콤보</span></div><div><b>${r.wrongN}</b><span>오답노트에 추가</span></div></div>
 <div class="rbtns"><button class="btn primary big" ${again}>${r.mode==='review'?'오답노트로':'다시 도전'}</button>${r.wrongN&&r.mode!=='review'?`<button class="btn" data-act="notes" ${r.tid?`data-t="${r.tid}"`:''}>틀린 문제 확인하기</button>`:''}${r.tid?`<button class="btn" data-act="topic" data-t="${r.tid}">단원으로</button>`:''}<button class="btn ghost" data-act="home">처음 화면</button></div></section></main>`}
function notesList(list,inTopic){if(!list.length)return `<section class="empty"><h2>오답노트가 비어 있어요</h2><p>${inTopic?'이 단원에서 틀린 문제가 없어요. 멋져요!':'문제를 풀다 틀리면 자동으로 여기에 모여요.'}</p></section>`;
 const ids=list.slice(0,10).map(w=>w.id).join(',');
 return `<div class="notebar"><span>${list.length}문제 · 다시 풀어서 맞히면 졸업</span><button class="btn primary" data-act="review" data-ids="${ids}">${Math.min(10,list.length)}문제 다시 풀기</button></div><section class="notes">${list.map(w=>{const t=TOPICS[w.tid];const P=partOf(w.tid);const d=new Date(w.t);
  return `<article class="note"><div class="note-h"><span class="ntag ${P.col}">${tnum(w.tid)} ${t.title}</span><span class="nmeta">${d.getMonth()+1}/${d.getDate()} · 틀린 횟수 ${w.n}</span></div><div class="nq">${w.p.q}</div>${w.p.fig?`<div class="fig">${w.p.fig}</div>`:''}
  <div class="nans"><div><span class="lbl">내 답</span><span class="nmy">${w.my}</span></div><div><span class="lbl">정답</span><span class="nright">${ansText(w.p)}</span></div></div>
  <details class="nex"><summary>풀이 보기</summary><div>${w.p.ex}</div></details>
  <div class="nbtns"><button class="btn small primary" data-act="review" data-ids="${w.id}">다시 풀기</button><button class="btn small" data-act="type" data-t="${w.tid}" data-g="${w.gi}">비슷한 문제 5개</button><button class="btn small ghost" data-act="ndel" data-id="${w.id}">지우기</button></div></article>`}).join('')}</section>`}
function notesHTML(part,tid){let list=D.wrong;if(tid)list=list.filter(w=>w.tid===tid);else if(part)list=list.filter(w=>TOPICS[w.tid].part===part);
 return `<main class="wrap"><div class="nhead"><button class="back" data-act="home">← 처음 화면</button><h1>오답노트</h1><p>틀린 문제는 자동으로 저장돼요. 다시 풀어서 <b>맞히면 바로 졸업</b>! 지금까지 <b>${D.grad}</b>문제 졸업했어요.</p>
 <div class="chips"><button class="chip ${!part&&!tid?'on':''}" data-act="nfilter" data-p="0">전체 ${D.wrong.length}</button>${PARTS.map(P=>{const n=D.wrong.filter(w=>TOPICS[w.tid].part===P.id).length;return `<button class="chip ${P.col} ${part===P.id?'on':''}" data-act="nfilter" data-p="${P.id}" ${n?'':'disabled'}>${P.name} ${n}</button>`}).join('')}${tid?`<span class="chip on">${tnum(tid)} ${TOPICS[tid].title}</span>`:''}</div></div>${notesList(list,false)}</main>`}
function recordsHTML(){const L=lvInfo(D.xp);const acc=D.solved?Math.round(D.first/D.solved*100):0;
 return `<main class="wrap"><div class="nhead"><button class="back" data-act="home">← 처음 화면</button><h1>${esc(D.name||'친구')}의 기록</h1><p>Lv.${L.lv} ${L.title} · 총 ${D.xp} XP</p></div>
 <section class="stats"><div><b>${D.solved}</b><span>푼 문제</span></div><div><b>${acc}%</b><span>한 번에 맞힌 비율</span></div><div><b>${totalStars()}</b><span>모은 별 / ${MAXS()}</span></div><div><b>${D.grad}</b><span>오답 졸업</span></div><div><b>${streak()}일</b><span>연속 학습</span></div><div><b>${D.maxCombo}</b><span>최고 콤보</span></div></section>
 <h2 class="sech">배지 <span class="cap">${D.badges.length} / ${BADGES.length}</span></h2><section class="badges">${BADGES.map(([id,nm,ds])=>`<div class="badge ${D.badges.includes(id)?'got':''}"><div class="medal">${D.badges.includes(id)?'★':'?'}</div><b>${nm}</b><span>${ds}</span></div>`).join('')}</section>
 <h2 class="sech">파트별 진행</h2><section class="pprog">${PARTS.map(P=>{const ts=topicsIn(P.id);const got=ts.reduce((a,t)=>a+starsOf(t.id),0);return `<div class="pp ${P.col}"><span>${P.name}</span><div class="ppbar"><i style="width:${got/(ts.length*3)*100}%"></i></div><b>${got}/${ts.length*3}</b><em>${D.boss[P.id]?'보스 ✓':''}</em></div>`}).join('')}</section>
 <h2 class="sech">설정</h2><section class="settings"><label for="nm">이름</label><div class="inrow"><input id="nm" value="${esc(D.name)}" maxlength="12"><button class="btn" data-act="rename">바꾸기</button></div>
 <button class="btn" data-act="sound">효과음 ${D.sound?'끄기':'켜기'}</button><button class="btn ghost danger" data-act="reset" id="resetbtn">모든 기록 지우기</button></section></main>`}
function monster(pid,dead){const cols=['p1','p2','p3','p4','p5','p6','p7'];const shapes0=[
 'M60 18 L98 40 L98 88 L60 108 L22 88 L22 40Z','M60 14 C95 14 104 50 98 78 C92 104 28 104 22 78 C16 50 25 14 60 14Z','M60 12 C92 12 102 44 102 70 L102 108 L88 96 L74 108 L60 96 L46 108 L32 96 L18 108 L18 70 C18 44 28 12 60 12Z','M24 24 H96 V96 H24Z','M60 16 L104 60 L60 104 L16 60Z','M30 30 H90 V90 H30Z M30 30 L50 14 H110 L90 30 M90 30 L110 14 V74 L90 90','M60 16 C92 16 100 40 100 58 C100 72 92 78 84 80 L96 108 L80 92 L70 108 L60 92 L50 108 L40 92 L24 108 L36 80 C28 78 20 72 20 58 C20 40 28 16 60 16Z'];
 const eye=dead?'<path d="M42 50 l10 10 M52 50 l-10 10 M68 50 l10 10 M78 50 l-10 10" class="mx"/>':'<circle cx="47" cy="55" r="7" class="me"/><circle cx="73" cy="55" r="7" class="me"/><circle cx="49" cy="56" r="3" class="mp"/><circle cx="75" cy="56" r="3" class="mp"/>';
 return `<svg viewBox="0 0 120 120" class="msvg"><path d="${shapes0[(pid-1)%shapes0.length]}" class="mb"/>${eye}<path d="${dead?'M48 80 Q60 72 72 80':'M46 76 Q60 88 74 76'}" class="mm"/></svg>`}
function runHTML(){const p=cur();const t=TOPICS[p.tid];const P=partOf(p.tid);const bossP=S.mode==='boss'?PARTS[S.pid-1]:null;
 let h=`<div class="run ${(bossP||P).col}"><div class="run-top"><button class="back" data-act="quit" id="quitbtn">✕ 그만하기</button>${S.total?`<div class="prog"><i id="prog" style="width:${S.i/S.total*100}%"></i></div>`:'<div class="prog ghostp"></div>'}<div class="rstat" id="rstat">${statHTML()}</div></div>`;
 if(bossP)h+=`<div class="bosspanel"><div class="monster">${monster(bossP.id,false)}</div><div class="binfo"><div class="bname">${bossP.boss} <span class="cap">PART ${bossP.id}</span></div><div class="hpbar"><i id="bosshp" style="width:${S.hp/S.maxhp*100}%"></i></div><div class="brow"><span id="hpnum">${S.hp} / ${S.maxhp}</span><span id="hearts">${heartsHTML()}</span></div></div></div>`;
 h+=`<div class="qcard"><div class="qmeta"><span class="ntag ${P.col}">${tnum(p.tid)} ${t.title}</span>${S.mode==='review'?'<span class="cap">오답 다시 풀기</span>':''}</div><div class="q">${p.q}</div>${p.fig?`<div class="fig">${p.fig}</div>`:''}<div class="ans">`;
 if(p.type==='choice'){const nums=['①','②','③','④','⑤'];h+=`<div class="choices ${p.choices.some(c=>c.includes('<svg'))?'svgch':''}">${p.choices.map((c,i)=>`<button class="ch" data-act="pick" data-i="${i}"><span class="cn">${nums[i]}</span><span class="cv">${c}</span></button>`).join('')}</div>`}
 else h+=`<div class="inrow"><input id="ans" type="text" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="답을 입력하세요" aria-label="답 입력">${p.unit?`<span class="unit">${p.unit}</span>`:''}<button class="btn primary" data-act="submit">확인</button></div><div class="keys"><button data-act="key" data-k="-">− 음수</button><button data-act="key" data-k="/">/ 분수</button><button data-act="key" data-k=".">. 소수점</button><button data-act="key" data-k="back">⌫ 지우기</button></div>`;
 h+=`</div>${S.mode!=='speed'?`<div class="qtools"><button class="hbtn" data-act="hint">힌트 보기</button></div><div class="hintbox" id="hintbox" hidden><b>힌트</b> ${p.hint}</div>`:''}<div id="fb" aria-live="polite"></div></div></div>`;
 return h}
function bindRun(){const i=document.getElementById('ans');if(i){i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(S&&S.answered)next();else submit(i.value)}});if(!matchMedia('(pointer:coarse)').matches)i.focus()}}
function showName(){if(document.getElementById('namebox'))return;const d=document.createElement('div');d.id='namebox';d.className='modal';d.innerHTML=`<div class="mbox"><div class="eyebrow">처음 오셨군요!</div><h2>이름(닉네임)을 알려 주세요</h2><p>퀘스트에서 불러 줄 이름이에요. 나중에 기록 화면에서 바꿀 수 있어요.</p><input id="nmfirst" maxlength="12" placeholder="예) 수학왕 민준"><button class="btn primary big" data-act="setname">퀘스트 시작!</button></div>`;document.body.appendChild(d);setTimeout(()=>document.getElementById('nmfirst')?.focus(),50)}

// ---------- 이벤트 ----------
let quitArm=false,delArm=null,resetArm=false;
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act;const tid=+el.dataset.t||0;
 switch(a){
 case 'home':go('home');break;
 case 'topic':go('topic',{tid,tab:D.lesson[tid]?'quiz':'lesson',card:0});break;
 case 'tab':go('topic',{tid:arg.tid,tab:el.dataset.tab,card:0});break;
 case 'card':arg.card=+el.dataset.c;render();document.querySelector('.lesson')?.scrollIntoView({block:'start'});break;
 case 'lessondone':if(!D.lesson[arg.tid]){D.lesson[arg.tid]=1;addXP(20);toast('<b>개념 학습 완료!</b> +20 XP');checkBadges();save()}go('topic',{tid:arg.tid,tab:'quiz'});break;
 case 'quiz':start('quiz',{tid});break;
 case 'type':start('type',{tid,gi:+el.dataset.g});break;
 case 'speed':start('speed',{tid});break;
 case 'mix':start('mix');break;
 case 'boss':start('boss',{pid:+el.dataset.p});break;
 case 'review':{const ids=el.dataset.ids.split(',');const notes=ids.map(id=>D.wrong.find(w=>w.id===id)).filter(Boolean);if(notes.length)start('review',{notes});break}
 case 'notes':go('notes',{tid:tid||0});break;
 case 'nfilter':go('notes',{part:+el.dataset.p});break;
 case 'records':go('records');break;
 case 'sound':D.sound=!D.sound;save();render();if(D.sound)sfx('ok');break;
 case 'pick':submit(+el.dataset.i);break;
 case 'submit':submit(document.getElementById('ans').value);break;
 case 'key':{const i=document.getElementById('ans');if(!i||i.disabled)break;const k=el.dataset.k;if(k==='back')i.value=i.value.slice(0,-1);else if(k==='-'){i.value=i.value.startsWith('-')?i.value.slice(1):'-'+i.value}else i.value+=k;if(!matchMedia('(pointer:coarse)').matches)i.focus();break}
 case 'hint':{const hb=document.getElementById('hintbox');if(hb){hb.hidden=false;el.remove()}break}
 case 'next':next();break;
 case 'quit':if(!quitArm){quitArm=true;el.textContent='정말 그만둘까요? 한 번 더 누르면 종료';el.classList.add('arm');setTimeout(()=>{quitArm=false;const q=document.getElementById('quitbtn');if(q){q.textContent='✕ 그만하기';q.classList.remove('arm')}},3000)}else{quitArm=false;clearInterval(TIMER);const back=S&&S.tid?{tid:S.tid}:null;S=null;back?go('topic',{tid:back.tid,tab:'quiz'}):go('home')}break;
 case 'ndel':{const id=el.dataset.id;if(delArm!==id){delArm=id;el.textContent='정말 지울까요?';el.classList.add('arm');setTimeout(()=>{if(delArm===id)delArm=null},3000)}else{D.wrong=D.wrong.filter(w=>w.id!==id);delArm=null;save();render()}break}
 case 'rename':{const v=document.getElementById('nm').value.trim();if(v){D.name=v;save();toast('이름을 바꿨어요');render()}break}
 case 'setname':{const v=(document.getElementById('nmfirst').value||'').trim()||'수학 탐험가';D.name=v;save();document.getElementById('namebox')?.remove();render();break}
 case 'reset':if(!resetArm){resetArm=true;el.textContent='정말 모든 기록을 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArm=false},4000)}else{resetArm=false;const snd=D.sound;D=clone(DEF);D.sound=snd;save();go('home')}break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nmfirst')document.querySelector('[data-act="setname"]')?.click();if(view==='run'&&S&&!S.answered&&cur().type==='choice'&&/^[1-5]$/.test(e.key)){const k=+e.key-1;if(k<cur().choices.length){const bt=document.querySelector(`.ch[data-i="${k}"]`);if(bt&&!bt.disabled)submit(k)}}});
render();

</script>

</body></html>
