<style>

:root{

  --lit:#5C4718; --lit-edge:#8A6A22; --glow:#FFC24A; --glow-soft:rgba(255,194,74,.30);
  --bad:#FF6B6B; --bad-soft:rgba(255,107,107,.22); --ok:#4FC98F; --focus:#7FA2FF;
  --hl:rgba(127,162,255,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0E1220; --panel:#161B2B; --ink:#E7EAF2; --muted:#98A0B4; --line:#2B3246;
  --cell:#21283A; --wall:#04060C; --wall-ink:#E7EAF2;
  --lit:#5C4718; --lit-edge:#8A6A22; --glow:#FFC24A; --glow-soft:rgba(255,194,74,.30);

  --hl:rgba(127,162,255,.25); color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.6;

.wrap{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(28px,5vw,40px);line-height:1.1;margin:0;letter-spacing:-.01em;text-wrap:balance}

.levels{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--display);font-size:15px;min-width:38px;height:38px;padding:0 10px;border-radius:19px;border:1.5px solid var(--line);
  background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.chip.cur{border-color:var(--glow);box-shadow:0 0 0 3px var(--glow-soft)}
.chip.done{background:var(--lit);border-color:var(--lit-edge)}

.chip:focus-visible,button:focus-visible,.cell:focus-visible{outline:2.5px solid var(--focus);outline-offset:2px}
main{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:22px;align-items:start}
@media (max-width:820px){main{grid-template-columns:minmax(0,1fr)}}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.boardbox{width:min(100%,560px,78vh);margin:0 auto;aspect-ratio:1}
.board{display:grid;width:100%;height:100%;gap:3px;padding:3px;background:var(--line);border-radius:10px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.cell{position:relative;border:0;border-radius:4px;background:var(--cell);padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);color:var(--muted);transition:background-color .22s ease;transition-delay:calc(var(--d,0)*38ms);overflow:hidden}
.cell.lit{background:var(--lit)}
.cell.wall{background:var(--wall);color:var(--wall-ink);cursor:default}
.cell.wall .num{font-size:var(--fs);line-height:1}
.cell.wall.ok .num{color:var(--glow)}
.cell.wall.over .num{color:var(--bad)}
.cell.bulb{background:var(--lit)}
.cell.bulb::before{content:"";position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,var(--glow-soft),transparent 70%)}
.cell svg{width:66%;height:66%;position:relative}
.cell .bulbsvg .glass{fill:var(--glow)}
.cell .bulbsvg .base{fill:var(--ink)}
.cell.conflict{background:var(--bad-soft)}
.cell.conflict .bulbsvg .glass{fill:var(--bad)}
.cell .mark{font-size:var(--fs);line-height:1;color:var(--muted)}
.cell.hl{box-shadow:inset 0 0 0 3px var(--focus)}
.cell.hl:not(.lit):not(.bulb){background:var(--hl)}
.cell .tag{position:absolute;top:3px;left:5px;font-size:calc(var(--fs)*.55);color:var(--focus);font-family:var(--display)}
.cell.pulse{animation:pulse .9s ease 2}
@keyframes pulse{50%{box-shadow:inset 0 0 0 4px var(--focus)}}
.cell.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.board.won .cell:not(.wall){animation:win 1.2s ease}
@keyframes win{40%{background:var(--lit-edge)}}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.btn{font-family:var(--body);font-size:14px;font-weight:700;height:40px;padding:0 14px;border-radius:8px;border:1.5px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;gap:6px}

.seg svg{width:16px;height:16px}

.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:700}

.panel p{margin:0}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:r}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{border-top:1.5px solid var(--line);padding-top:6px}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.progress i.on{background:var(--glow)}
.msg{font-size:14px;padding:10px 12px;border-radius:8px;background:var(--bg);color:var(--ink)}
.msg.good{background:var(--lit)}
.msg.bad{background:var(--bad-soft)}
.help{font-size:13px;color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px}
.overlay{position:fixed;inset:0;background:rgba(5,8,16,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
.card{background:var(--panel);color:var(--ink);border-radius:14px;padding:26px;max-width:380px;width:100%;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.card h3{font-family:var(--display);font-weight:400;font-size:30px;margin:0}
.card .big{width:64px;height:64px}
.headright{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
@media (max-width:820px){.headright{align-items:flex-start}}
.linkbtn{font-family:var(--body);font-size:13px;font-weight:700;color:var(--muted);background:none;border:0;padding:4px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.linkbtn:hover{color:var(--bad)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;z-index:30;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>세상을 비춰라<small>아카리 퍼즐 · 모든 칸에 빛을 비추세요</small></h1>
    <div class="headright">
      <nav class="levels" id="levels" aria-label="단계 선택"></nav>
      <button class="linkbtn" id="resetAll">기록 초기화</button>
    </div>
  </header>
  <main>
    <section class="stage">
      <div class="boardbox"><div class="board" id="board" role="grid" aria-label="퍼즐 판"></div></div>
      <div class="tools" id="tools">
        <div class="seg" role="group" aria-label="놓을 것">
          <button id="modeBulb" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z" fill="currentColor"/><rect x="8.5" y="18.5" width="7" height="3" rx="1" fill="currentColor"/></svg>전구</button>
          <button id="modeX" aria-pressed="false"><span style="font-size:17px;line-height:1">×</span>표시</button>
        </div>
        <button class="btn" id="undo">되돌리기</button>
        <button class="btn" id="hint">힌트</button>
        <button class="btn" id="reset">다시 하기</button>
      </div>
      <p class="help" style="text-align:center;margin:0">칸을 누르면 선택한 것을 놓고, 한 번 더 누르면 지워요. PC에서는 오른쪽 클릭, 휴대폰에서는 길게 누르면 × 표시예요.</p>
    </section>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
const LEVELS = [{"size":"5×5","diff":"입문","grid":[".#.3.","2....",".....","..#1.","....."],"sol":[[0,0],[0,2],[0,4],[1,3],[2,0],[3,1],[4,3]]},{"size":"5×5","diff":"입문","grid":[".0...",".0.#.",".....",".1.4.",".#..."],"sol":[[0,3],[2,3],[3,2],[3,4],[4,0],[4,3]]},{"size":"6×6","diff":"쉬움","grid":[".##...","#.1...","...#.1","0.2...","...#.#","...02."],"sol":[[0,0],[0,3],[1,5],[2,2],[3,3],[4,1],[4,4],[5,0],[5,5]]},{"size":"7×7","diff":"보통","grid":["..3....",".......","..1.#.#",".......","#.1.2..",".......","....#.."],"sol":[[0,1],[0,3],[1,2],[2,0],[3,4],[4,5],[5,2],[6,0],[6,6]]},{"size":"7×7","diff":"보통","grid":["1.#1...","#.2..#.",".....0.",".......",".2#.0..","#...0.#","......."],"sol":[[0,1],[0,5],[1,3],[2,2],[3,6],[4,0],[5,1],[6,5]]},{"size":"7×7","diff":"보통","grid":["...2...",".....#.","..2.2..","#.....0","..1.1..",".2.....","...#..."],"sol":[[0,2],[0,4],[1,1],[1,6],[2,0],[2,3],[2,5],[3,2],[5,0],[5,4],[6,1],[6,6]]},{"size":"8×8","diff":"어려움","grid":["....#..1",".#2..1#.",".0......","...0##.1","#.###...","......#.",".2#..#1.","#..3...."],"sol":[[0,2],[0,5],[1,3],[1,7],[2,4],[3,0],[3,6],[4,5],[5,1],[6,0],[6,3],[6,7],[7,2],[7,4]]},{"size":"9×9","diff":"어려움","grid":[".2.2..#.1",".1#..2...","...2..##.","......#0.",".........",".#1......",".#0..2...","...1..#1.","#.#..#.#."],"sol":[[0,0],[0,2],[0,5],[0,7],[1,3],[1,6],[2,1],[2,4],[3,2],[4,5],[5,3],[6,6],[7,1],[7,5],[7,8],[8,3],[8,6]]},{"size":"10×10","diff":"도전","grid":[".1....#..0","....2....#",".....1..2.",".0.##.##..",".#......3.",".#......#.","..2#.##.#.",".#..#.....","1....2....","#..#....1."],"sol":[[0,0],[0,4],[0,7],[1,3],[1,8],[2,2],[2,6],[3,8],[4,7],[4,9],[5,5],[6,1],[6,4],[7,2],[7,5],[8,1],[8,8],[9,5]]},{"size":"10×10","diff":"도전","grid":["#.##2.3.1.",".#...#....","...2......","..2.......","......01.#","1.#1......",".......1..","......2...","....#...#.",".1.2.###.2"],"sol":[[0,1],[0,5],[0,7],[1,4],[1,6],[2,2],[2,9],[3,3],[4,0],[4,8],[5,5],[6,3],[7,1],[7,7],[8,0],[8,6],[8,9],[9,2],[9,4],[9,8]]}];
const TUT_GRID=[".....0.","1...2..",".#.....",".......",".....#.","..#...3",".2....."];
const TUT=[
 {title:"아카리 퍼즐의 규칙",intro:true,
  text:"검은 칸 사이사이에 전구를 놓아 판 전체를 밝히는 퍼즐이에요. 오른쪽 예시를 함께 풀면서 규칙을 익혀 봅시다."},
 {title:"0 주위에는 전구가 없어요",mode:"x",targets:{"0,4":"x","0,6":"x","1,5":"x"},
  text:"맨 윗줄의 <b>0</b>은 동서남북 네 칸에 전구가 하나도 없다는 뜻이에요. 표시된 세 칸에 <b>×</b>를 놓아 \"여기엔 전구 없음\"을 기록하세요."},
 {title:"3은 자리가 딱 세 개",mode:"bulb",targets:{"4,6":"b","5,5":"b","6,6":"b"},
  text:"오른쪽 아래 <b>3</b>은 판 가장자리라 이웃한 흰 칸이 정확히 세 개뿐이에요. 세 칸 모두 전구를 놓아 보세요. 빛이 검은 칸에 막힐 때까지 십자로 퍼지는 걸 볼 수 있어요."},
 {title:"이미 밝은 칸엔 놓을 수 없어요",mode:"bulb",targets:{"5,1":"b","6,0":"b"},
  text:"아래쪽 <b>2</b>의 오른쪽 칸은 방금 놓은 전구 빛을 받고 있어요. 전구끼리 서로 비추면 안 되니 그 칸은 쓸 수 없죠. 남은 두 칸에 전구를 놓으세요."},
 {title:"위쪽 2도 두 자리뿐",mode:"bulb",targets:{"1,3":"b","2,4":"b"},
  text:"위쪽 <b>2</b>는 오른쪽과 위쪽 칸이 0 때문에 막혀 있어요. 왼쪽과 아래쪽 두 칸에 전구를 놓으세요."},
 {title:"1의 남은 한 자리",mode:"bulb",targets:{"0,0":"b"},
  text:"왼쪽 <b>1</b>의 오른쪽과 아래쪽은 이미 빛을 받고 있어요. 남은 위쪽 칸에 전구를 놓으세요."},
 {title:"마지막 추리",mode:"bulb",targets:{"3,5":"b","4,2":"b"},
  tags:{"3,2":"①","3,5":"②","4,2":"③","1,5":"★"},
  text:"아직 어두운 칸이 남았어요. ①에 전구를 놓으면 ②와 ③은 밝아지지만 <b>★</b> 칸을 비출 방법이 사라져요(★에는 0 때문에 전구도 못 놓죠). 그래서 정답은 <b>②와 ③</b>이에요. 두 칸에 전구를 놓으세요."},
 {title:"모든 칸이 밝아졌어요!",done:true,
  text:"이제 규칙을 다 익혔어요. 숫자가 맞으면 노랗게, 넘치면 빨갛게 바뀌고 서로 비추는 전구는 빨간색으로 알려 줘요. 1단계부터 도전해 보세요."}
];
const BULB='<svg class="bulbsvg" viewBox="0 0 24 24" aria-hidden="true"><path class="glass" d="M12 2.5a6.8 6.8 0 0 0-3.9 12.4V17h7.8v-2.1A6.8 6.8 0 0 0 12 2.5z"/><rect class="base" x="8.6" y="18" width="6.8" height="2" rx=".8"/><rect class="base" x="9.6" y="20.6" width="4.8" height="1.6" rx=".8"/></svg>';
const DIRS=[[1,0],[-1,0],[0,1],[0,-1]];
const $=id=>document.getElementById(id);

let S={level:-1,tutStep:0,marks:{},history:[],mode:"bulb",start:0,elapsed:0,hints:0,won:false,lastBulb:null};
let cleared={};
try{cleared=JSON.parse(localStorage.getItem("akari-cleared")||"{}")}catch(e){}
function saveCleared(){try{localStorage.setItem("akari-cleared",JSON.stringify(cleared))}catch(e){}}

function grid(){return S.level<0?TUT_GRID:LEVELS[S.level].grid}
function isWhite(g,r,c){return r>=0&&c>=0&&r<g.length&&c<g[0].length&&g[r][c]==="."}

function compute(){
  const g=grid(),H=g.length,W=g[0].length;
  const lit={},dist={},conflict={},bulbs=[];
  for(const k in S.marks)if(S.marks[k]==="b")bulbs.push(k.split(",").map(Number));
  for(const [r,c] of bulbs){
    const key=r+","+c; lit[key]=1;
    const isLast=S.lastBulb===key;
    if(isLast)dist[key]=0;
    for(const [dr,dc] of DIRS){
      let rr=r+dr,cc=c+dc,d=1;
      while(isWhite(g,rr,cc)){
        const k2=rr+","+cc; lit[k2]=1;
        if(isLast)dist[k2]=d;
        if(S.marks[k2]==="b"){conflict[key]=1;conflict[k2]=1}
        rr+=dr;cc+=dc;d++;
      }
    }
  }
  const clue={};let cluesOk=true;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const ch=g[r][c]; if(!/[0-4]/.test(ch))continue;
    let n=0; for(const [dr,dc] of DIRS)if(S.marks[(r+dr)+","+(c+dc)]==="b")n++;
    const t=+ch; clue[r+","+c]=n===t?"ok":n>t?"over":"";
    if(n!==t)cluesOk=false;
  }
  let whites=0,litN=0;
  for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(g[r][c]==="."){whites++;if(lit[r+","+c])litN++}
  return{lit,dist,conflict,clue,solved:cluesOk&&litN===whites&&!Object.keys(conflict).length,litN,whites,bulbs:bulbs.length};
}

function buildBoard(){
  const g=grid(),H=g.length,W=g[0].length,b=$("board");
  b.innerHTML="";b.classList.remove("won");
  b.style.gridTemplateColumns=`repeat(${W},1fr)`;b.style.gridTemplateRows=`repeat(${H},1fr)`;
  b.style.setProperty("--fs",`clamp(14px,${(52/W).toFixed(2)}vmin,${Math.round(300/W)}px)`);
  b.style.gap=W>8?"2px":"3px";
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){
    const el=document.createElement("button");
    el.className="cell";el.dataset.k=r+","+c;el.setAttribute("role","gridcell");
    const ch=g[r][c];
    if(ch!=="."){el.classList.add("wall");el.tabIndex=-1;el.setAttribute("aria-label",/[0-4]/.test(ch)?`숫자 ${ch} 검은 칸`:"검은 칸");
      if(/[0-4]/.test(ch))el.innerHTML=`<span class="num">${ch}</span>`;}
    bindCell(el,ch==="."); b.appendChild(el);
  }
}

function render(){
  const R=compute(),t=S.level<0?TUT[S.tutStep]:null;
  document.querySelectorAll("#board .cell").forEach(el=>{
    const k=el.dataset.k;
    if(el.classList.contains("wall")){el.classList.toggle("ok",R.clue[k]==="ok");el.classList.toggle("over",R.clue[k]==="over");return}
    const m=S.marks[k];
    el.style.setProperty("--d",R.dist[k]!=null&&!el.classList.contains("lit")?R.dist[k]:0);
    el.classList.toggle("lit",!!R.lit[k]);
    el.classList.toggle("bulb",m==="b");
    el.classList.toggle("conflict",!!R.conflict[k]);
    el.classList.toggle("hl",!!(t&&t.targets&&t.targets[k]&&!targetDone(k,t.targets[k])));
    let html=m==="b"?BULB:m==="x"?'<span class="mark">×</span>':"";
    if(t&&t.tags&&t.tags[k])html+=`<span class="tag">${t.tags[k]}</span>`;
    el.innerHTML=html;
    el.setAttribute("aria-label",`${+k.split(",")[0]+1}행 ${+k.split(",")[1]+1}열, ${m==="b"?"전구":m==="x"?"× 표시":R.lit[k]?"밝음":"어두움"}`);
  });
  renderPanel(R);
  return R;
}
function targetDone(k,want){return want==="b"?S.marks[k]==="b":S.marks[k]==="x"}

function bindCell(el,white){
  if(!white)return;
  let timer=null,longed=false;
  el.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse")return;longed=false;timer=setTimeout(()=>{longed=true;act(el.dataset.k,"x");if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}} ,420)});
  ["pointerup","pointerleave","pointercancel"].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(timer)));
  el.addEventListener("click",e=>{if(longed){longed=false;return}act(el.dataset.k,S.mode)});
  el.addEventListener("contextmenu",e=>{e.preventDefault();if(!longed)act(el.dataset.k,"x")});
}

function act(k,what){
  if(S.won)return;
  const want=what==="bulb"||what==="b"?"b":"x";
  if(S.level<0){
    const t=TUT[S.tutStep];
    if(!t.targets||!t.targets[k]){shake(k);flashMsg(t.targets?"표시된 칸을 눌러 보세요.":"");return}
    if(t.targets[k]!==want){shake(k);flashMsg(t.targets[k]==="b"?"이 칸에는 전구를 놓아야 해요. 위에서 '전구'를 고르세요.":"이 칸에는 × 표시를 해야 해요. 위에서 '표시'를 고르세요.");return}
  }
  S.history.push(JSON.stringify(S.marks));
  if(S.marks[k]===want)delete S.marks[k];else S.marks[k]=want;
  S.lastBulb=S.marks[k]==="b"?k:null;
  if(!S.start&&S.level>=0)S.start=Date.now();
  const R=render();S.lastBulb=null;
  if(S.level<0){const t=TUT[S.tutStep],step=S.tutStep;if(t.targets&&Object.entries(t.targets).every(([kk,w])=>targetDone(kk,w)))setTimeout(()=>{if(S.level<0&&S.tutStep===step&&Object.entries(t.targets).every(([kk,w])=>targetDone(kk,w))){S.tutStep++;applyTutMode();render()}},550)}
  else if(R.solved)win();
}
function shake(k){const el=document.querySelector(`.cell[data-k="${k}"]`);if(!el)return;el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake")}
let flashTimer;
function flashMsg(s){const el=$("flash");if(!el||!s)return;el.textContent=s;el.hidden=false;clearTimeout(flashTimer);flashTimer=setTimeout(()=>el.hidden=true,2600)}

function setMode(m){S.mode=m;$("modeBulb").setAttribute("aria-pressed",m==="bulb");$("modeX").setAttribute("aria-pressed",m==="x")}
function applyTutMode(){const t=TUT[S.tutStep];if(t&&t.mode)setMode(t.mode)}

function fmt(ms){const s=Math.floor(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}

function renderPanel(R){
  const p=$("panel");
  if(S.level<0){
    const t=TUT[S.tutStep],steps=TUT.length-2,cur=Math.min(Math.max(S.tutStep,0),steps+1);
    let h=`<div class="eyebrow">예시로 규칙 익히기</div>`;
    if(!t.intro&&!t.done)h+=`<div class="progress">${Array.from({length:steps},(_,i)=>`<i class="${i<cur?"on":""}"></i>`).join("")}</div><div class="eyebrow">${cur} / ${steps} 단계</div>`;
    h+=`<h2>${t.title}</h2><p>${t.text}</p>`;
    if(t.intro)h+=`<ol class="rules"><li>전구는 흰 칸 어디에나 놓을 수 있어요. 빛은 검은 칸에 막힐 때까지 동서남북 십자로 뻗어요.</li><li>검은 칸의 숫자는 그 칸 동서남북에 붙어 있는 전구의 개수예요.</li><li>이미 빛이 비추는 칸에는 전구를 놓을 수 없어요. 전구끼리 서로 비추면 안 돼요.</li><li>모든 흰 칸에 빛이 들어오면 성공!</li></ol><div class="row"><button class="btn primary" id="tutGo">예시 풀어 보기</button><button class="btn" id="tutSkip">건너뛰고 1단계로</button></div>`;
    else if(t.done)h+=`<div class="row"><button class="btn primary" id="toL1">1단계 시작</button><button class="btn" id="tutAgain">예시 다시 보기</button></div>`;
    h+=`<div class="msg bad" id="flash" hidden></div>`;
    p.innerHTML=h;
    const on=(id,f)=>{const e=$(id);if(e)e.onclick=f};
    on("tutGo",()=>{S.tutStep=1;applyTutMode();render()});
    on("tutSkip",()=>loadLevel(0));on("toL1",()=>loadLevel(0));on("tutAgain",()=>loadLevel(-1));
    document.querySelectorAll("#tools button").forEach(b=>b.disabled=!!(t.intro||t.done)||b.id==="hint"||b.id==="undo");
    if(t.done)$("board").classList.add("won");
    return;
  }
  document.querySelectorAll("#tools button").forEach(b=>b.disabled=S.won);
  const L=LEVELS[S.level];
  p.innerHTML=`<div class="eyebrow">${S.level+1}단계 · ${L.size} · ${L.diff}</div>
  <h2>${["첫 번째 판","0이 두 개","가장자리 숫자","워크시트 퍼즐","0이 가르는 길","숫자를 엮어서","빈 벽을 조심","넓어진 판","큰 판 도전","마지막 판"][S.level]}</h2>
  <p class="help">${S.level<2?"숫자 칸부터 살펴보세요. 이웃한 흰 칸 개수와 숫자가 같다면 모두 전구예요.":S.level<5?"숫자가 없는 검은 칸은 빛을 막기만 해요. 어두운 칸을 비출 수 있는 자리가 하나뿐인 곳을 찾아보세요.":"막히면 '이 칸을 비출 수 있는 자리'를 모두 떠올려 보세요. 후보가 하나라면 거기가 정답이에요."}</p>
  <div class="stats"><div class="stat"><b id="clock">${fmt(S.elapsed)}</b><span>시간</span></div><div class="stat"><b>${R.litN}/${R.whites}</b><span>밝힌 칸</span></div><div class="stat"><b>${R.bulbs}</b><span>전구</span></div></div>
  <div class="msg ${Object.keys(R.conflict).length?"bad":""}" id="status">${Object.keys(R.conflict).length?"빨간 전구끼리 서로 비추고 있어요. 하나를 치워 보세요.":Object.values(R.clue).includes("over")?"빨간 숫자는 전구가 너무 많다는 뜻이에요.":R.solved?"완성!":"어두운 칸이 "+(R.whites-R.litN)+"개 남았어요."}</div>
  <div class="msg bad" id="flash" hidden></div>
  ${S.hints?`<p class="help">힌트 ${S.hints}번 사용</p>`:""}
  ${cleared[S.level]?`<p class="help">최고 기록 ${fmt(cleared[S.level].t)}${cleared[S.level].h?` (힌트 ${cleared[S.level].h}번)`:""}</p>`:""}`;
}

function hint(){
  if(S.level<0||S.won)return;
  const sol=new Set(LEVELS[S.level].sol.map(x=>x.join(",")));
  for(const k in S.marks)if(S.marks[k]==="b"&&!sol.has(k)){pulse(k);flashMsg("깜빡이는 전구는 정답 위치가 아니에요.");S.hints++;render();return}
  for(const k in S.marks)if(S.marks[k]==="x"&&sol.has(k)){pulse(k);flashMsg("깜빡이는 칸에는 사실 전구가 들어가요.");S.hints++;render();return}
  const R=compute();
  const cand=[...sol].filter(k=>S.marks[k]!=="b");
  // prefer a bulb that lights a currently dark cell
  const k=cand.find(k=>!R.lit[k])||cand[0];
  if(!k)return;
  if(!S.start)S.start=Date.now();
  S.hints++;S.history.push(JSON.stringify(S.marks));S.marks[k]="b";S.lastBulb=k;const R2=render();S.lastBulb=null;pulse(k);
  if(R2.solved)win();
}
function pulse(k){const el=document.querySelector(`.cell[data-k="${k}"]`);if(!el)return;el.classList.remove("pulse");void el.offsetWidth;el.classList.add("pulse")}

function win(){
  S.won=true;S.elapsed=Date.now()-S.start;$("board").classList.add("won");
  const prev=cleared[S.level];
  if(!prev||S.elapsed<prev.t)cleared[S.level]={t:S.elapsed,h:S.hints};saveCleared();buildLevels();render();
  const last=S.level===LEVELS.length-1;
  setTimeout(()=>{
    const o=$("overlay");o.hidden=false;
    o.innerHTML=`<div class="card" role="dialog" aria-modal="true"><div class="big cell bulb" style="background:transparent">${BULB}</div><h3>${last?"모든 단계 완료!":S.level+1+"단계 완료!"}</h3>
    <p>${fmt(S.elapsed)} 만에 모든 칸을 밝혔어요${S.hints?` (힌트 ${S.hints}번)`:""}.</p>
    <div class="row" style="justify-content:center">${last?"":`<button class="btn primary" id="next">${S.level+2}단계로</button>`}<button class="btn" id="stay">판 보기</button></div></div>`;
    $("stay").onclick=()=>o.hidden=true;
    if(!last)$("next").onclick=()=>{o.hidden=true;loadLevel(S.level+1)};
    ($("next")||$("stay")).focus();
  },900);
}

function unlocked(i){return i<=0||cleared[i-1]}
function buildLevels(){
  const n=$("levels");n.innerHTML="";
  const mk=(label,i,title)=>{const b=document.createElement("button");b.className="chip";b.textContent=label;b.title=title;
    if(i===S.level)b.classList.add("cur");if(i>=0&&cleared[i])b.classList.add("done");
    if(!unlocked(i)){b.disabled=true;b.title+=" (앞 단계를 먼저 풀어요)"}
    b.onclick=()=>loadLevel(i);n.appendChild(b)};
  mk("예시",-1,"규칙 익히기");
  LEVELS.forEach((L,i)=>mk(String(i+1),i,`${i+1}단계 · ${L.size} · ${L.diff}`));
}

function loadLevel(i,keep){
  S.level=i;S.tutStep=0;S.marks=keep?keep.marks:{};S.history=[];S.start=0;S.elapsed=0;S.hints=keep?keep.hints:0;S.won=false;
  $("overlay").hidden=true;
  if(i<0){S.tutStep=keep?keep.tutStep:0;applyTutMode()}else setMode("bulb");
  buildLevels();buildBoard();render();
  try{localStorage.setItem("akari-last",String(i))}catch(e){}
}

$("modeBulb").onclick=()=>setMode("bulb");
$("modeX").onclick=()=>setMode("x");
$("undo").onclick=()=>{if(S.won||!S.history.length)return;S.marks=JSON.parse(S.history.pop());render()};
$("reset").onclick=()=>{if(S.won)return;if(S.level<0){S.marks={};S.tutStep=1;applyTutMode();buildBoard();render();return}S.history.push(JSON.stringify(S.marks));S.marks={};render()};
$("hint").onclick=hint;
function confirmResetAll(){
  const o=$("overlay"),n=Object.keys(cleared).length;o.hidden=false;
  o.innerHTML=`<div class="card" role="dialog" aria-modal="true" aria-labelledby="raTitle"><h3 id="raTitle">기록을 초기화할까요?</h3>
  <p>${n?`완료한 ${n}개 단계와 최고 기록이 모두 지워지고`:"저장된 기록을 지우고"}, 2단계부터 다시 잠겨요. 예시부터 새로 시작합니다. 되돌릴 수 없어요.</p>
  <div class="row" style="justify-content:center"><button class="btn danger" id="raYes">초기화</button><button class="btn" id="raNo">취소</button></div></div>`;
  $("raNo").onclick=()=>{o.hidden=true;$("resetAll").focus()};
  $("raYes").onclick=()=>{
    cleared={};try{localStorage.removeItem("akari-cleared");localStorage.removeItem("akari-last")}catch(e){}
    o.hidden=true;loadLevel(-1);toast("기록을 초기화했어요.");
  };
  $("raNo").focus();
}
$("resetAll").onclick=confirmResetAll;
let toastTimer;
function toast(s){const t=$("toast");t.textContent=s;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,2400)}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("overlay").hidden){const no=$("raNo")||$("stay");if(no)no.click()}});
setInterval(()=>{if(S.level>=0&&S.start&&!S.won){S.elapsed=Date.now()-S.start;const c=$("clock");if(c)c.textContent=fmt(S.elapsed)}},500);

window.claude?.hot?.snapshot?.(()=>({level:S.level,marks:S.marks,tutStep:S.tutStep,hints:S.hints}));
function start(d){
  if(d&&d.level!=null){loadLevel(d.level,d);return}
  let last=-1;try{const v=localStorage.getItem("akari-last");if(v!=null&&unlocked(+v))last=+v}catch(e){}
  loadLevel(last);
}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body></html>
