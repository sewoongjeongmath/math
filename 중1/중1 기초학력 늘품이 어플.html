<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>수학 퀘스트 32</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 레이아웃: 모눈 공책 위에 붙인 학습 카드. 상단 고정 바 + 960px 중앙 칼럼 */
:root{
 --paper:#F5F7FB; --gridl:#E2E8F1; --card:#FFFFFF; --card2:#F0F3F9; --ink:#1D2846; --ink-2:#4A5675; --ink-3:#8590AA; --line:#D3DAE6;
 --hl:#FFDD3C; --hl-soft:#FFF2A6; --ok:#0F9466; --ok-soft:#DCF4E9; --no:#DB3B33; --no-soft:#FDE3E1; --pen:#2857D6; --pen-soft:#E2EAFF;
 --p1:#EE6A33; --p2:#7656EE; --p3:#1795D3; --p4:#159F74; --p5:#D69A00; --p6:#D4447F; --p7:#3A68D6; --p8:#0E9AA0; --p9:#B5562E;
 --shadow:0 1px 0 rgba(29,40,70,.06),0 6px 18px -8px rgba(29,40,70,.25);
 --f-disp:'Jua','Gowun Dodum',system-ui,sans-serif; --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --f-hand:'Gaegu','Gowun Dodum',cursive;
 --r:14px; --on-pen:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --paper:#11162A; --gridl:#1A2138; --card:#192037; --card2:#20283F; --ink:#E9EDF8; --ink-2:#B6BFD6; --ink-3:#7F8AA6; --line:#2C3654;
 --hl:#F0C928; --hl-soft:#4A4220; --ok:#3BCB93; --ok-soft:#173A2E; --no:#FF6B62; --no-soft:#46201F; --pen:#87A6FF; --pen-soft:#23305C;
 --p1:#FF8452; --p2:#9A80FF; --p3:#45B6EE; --p4:#3CC496; --p5:#F0B930; --p6:#F06BA1; --p7:#6E95FF; --p8:#2CC6CC; --p9:#E58357; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); --on-pen:#0E1326; color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#11162A; --gridl:#1A2138; --card:#192037; --card2:#20283F; --ink:#E9EDF8; --ink-2:#B6BFD6; --ink-3:#7F8AA6; --line:#2C3654;
 --hl:#F0C928; --hl-soft:#4A4220; --ok:#3BCB93; --ok-soft:#173A2E; --no:#FF6B62; --no-soft:#46201F; --pen:#87A6FF; --pen-soft:#23305C;
 --p1:#FF8452; --p2:#9A80FF; --p3:#45B6EE; --p4:#3CC496; --p5:#F0B930; --p6:#F06BA1; --p7:#6E95FF; --p8:#2CC6CC; --p9:#E58357; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); --on-pen:#0E1326; color-scheme:dark}
.p1{--pc:var(--p1)}.p2{--pc:var(--p2)}.p3{--pc:var(--p3)}.p4{--pc:var(--p4)}.p5{--pc:var(--p5)}.p6{--pc:var(--p6)}.p7{--pc:var(--p7)}.p8{--pc:var(--p8)}.p9{--pc:var(--p9)}
*{box-sizing:border-box}
body{background:var(--paper);background-image:linear-gradient(var(--gridl) 1px,transparent 1px),linear-gradient(90deg,var(--gridl) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:.4em 0}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .1em}
.v{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.05em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .18em}
.fr>span{display:block}
sup{font-size:.7em;line-height:0}
.cap{font-size:.85rem;color:var(--ink-3)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:22px}

/* 상단바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.logo{border:0;background:none;font-family:var(--f-disp);font-size:1.25rem;display:flex;align-items:baseline;gap:2px;padding:0;white-space:nowrap}
.logo b{font-weight:400;color:var(--pen)}
.logo span{font-size:.75rem;background:var(--ink);color:var(--card);border-radius:6px;padding:0 5px;margin-left:4px;transform:translateY(-3px)}
.lvbox{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:300px;margin-left:auto}
.lv{font-family:var(--f-disp);color:var(--pen);white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:40px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pen),var(--p2));border-radius:99px;transition:width .5s}
.xpn{font-size:.75rem;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.nbtn,.ibtn{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:.88rem;white-space:nowrap}
.nbtn b{display:inline-block;margin-left:5px;background:var(--no);color:#fff;border-radius:99px;padding:0 7px;font-size:.78rem}
@media (max-width:620px){.xpn,.ibtn[data-act="sound"]{display:none}.lvbox{max-width:none}.logo span{display:none}}
@media (max-width:420px){.ibtn{display:none}}

/* 버튼 */
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:9px 16px;font-family:var(--f-disp);font-size:1rem;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--pen);color:var(--on-pen);border-color:var(--ink)}
.btn.big{font-size:1.15rem;padding:12px 22px}
.btn.small{font-size:.9rem;padding:5px 12px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost{border-color:var(--line);box-shadow:none;background:transparent}
.btn.danger{color:var(--no)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.boss{background:var(--pc);color:#fff;font-size:.92rem;padding:7px 13px}
.back{align-self:flex-start;border:0;background:none;color:var(--ink-2);padding:4px 0;font-size:.95rem}
.back.arm{color:var(--no);font-weight:700}

/* 홈 */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--hl)}
.hero h1{font-size:clamp(1.6rem,4.5vw,2.3rem)}
.hello{min-width:0}
.eyebrow{font-size:.82rem;letter-spacing:.08em;color:var(--pen);font-weight:700}
.hero-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.goal{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:12px 16px;align-self:start}
.g-h{font-family:var(--f-disp);font-size:1.1rem}.g-s{font-size:.86rem;color:var(--ink-2)}
.ring .rg-b{fill:none;stroke:var(--line);stroke-width:9}.ring .rg-f{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .6s}
.ring .rg-t{font-family:var(--f-disp);font-size:22px;fill:var(--ink);text-anchor:middle}.ring .rg-s{font-size:11px;fill:var(--ink-3);text-anchor:middle}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.cont{display:flex;align-items:center;gap:14px;flex-wrap:wrap;text-align:left;border:2px dashed var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--card));border-radius:16px;padding:14px 18px}
.cont-l{font-size:.85rem;color:var(--pc);font-weight:700}
.cont-t{font-family:var(--f-disp);font-size:1.25rem;flex:1;min-width:0;display:flex;gap:8px;align-items:center}
.cont-a{font-family:var(--f-disp);color:var(--pc)}
.part{display:flex;flex-direction:column;gap:12px}
.part-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--pc);padding-bottom:8px}
.pnum{font-family:var(--f-disp);color:var(--pc);font-size:.9rem;letter-spacing:.06em}
.part-h h2{font-size:1.6rem}.part-h p{color:var(--ink-3);font-size:.88rem;margin:0}
.part-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pstars{font-family:var(--f-disp);color:var(--p5)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--pc)}
.tile .tn{grid-row:1/4;font-family:var(--f-disp);font-size:1.05rem;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,var(--card));color:var(--pc)}
.tile .tt{font-weight:700;line-height:1.3}
.tile.mast{border-color:var(--p5);background:color-mix(in srgb,var(--hl) 12%,var(--card))}
.tile.nexty{border:2px solid var(--pc)}
.tile.nexty::after{content:'추천';position:absolute;top:-9px;right:10px;background:var(--pc);color:#fff;font-size:.72rem;padding:0 8px;border-radius:99px}
.ts{font-size:.95rem;letter-spacing:1px}
.st{color:var(--line)}.st.on{color:var(--p5)}
.tmeta{display:flex;gap:6px;flex-wrap:wrap}
.chk{font-size:.72rem;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:0 6px}
.wn{font-size:.72rem;color:var(--no);background:var(--no-soft);border-radius:6px;padding:0 6px}
.cont .tn{font-family:var(--f-disp);color:var(--pc)}
.foot{color:var(--ink-3);font-size:.82rem;text-align:center}

/* 단원 */
.tophead{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px 20px 0;box-shadow:6px 6px 0 var(--pc);display:flex;flex-direction:column;gap:4px}
.crumb{font-size:.85rem;color:var(--pc);font-weight:700}
.tophead h1{font-size:clamp(1.5rem,4.5vw,2.1rem);display:flex;gap:12px;align-items:center}
.tnum{font-size:.8em;color:#fff;background:var(--pc);border-radius:12px;padding:0 10px}
.tstat{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--ink-2);font-size:.88rem}
.tstat .st{font-size:1.1rem}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:4px solid transparent;font-family:var(--f-disp);font-size:1.02rem;color:var(--ink-3);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--pc)}
.lesson{display:flex;flex-direction:column;gap:14px}
.lcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px clamp(16px,4vw,32px);box-shadow:var(--shadow);min-width:0}
.lstep{font-size:.82rem;color:var(--pc,var(--pen));font-weight:700;letter-spacing:.05em}
.lcard h2{font-size:1.55rem;margin:4px 0 10px}
.lbody{font-size:1.08rem;max-width:68ch;display:flex;flex-direction:column;gap:10px}
.lbody p{margin:0}
.ex{background:var(--card2);border-left:5px solid var(--pc,var(--pen));border-radius:10px;padding:12px 16px;line-height:1.9}
.ex-h{font-weight:700;color:var(--ink-2);font-size:.92rem}
.big-ex{font-size:1.35rem;text-align:center;font-family:var(--f-body)}
.tip{background:var(--hl-soft);border-radius:10px;padding:8px 14px;font-size:.98rem}
.tip::before{content:'TIP ';font-family:var(--f-disp);color:var(--p5)}
ol.big,ul.big{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
span.ok{color:var(--ok);font-weight:700}span.no{color:var(--no);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.row2>div{min-width:0;text-align:center}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.ladder{font-family:var(--f-body);font-size:1.15rem;display:inline-flex;flex-direction:column;gap:2px;background:var(--card2);padding:10px 18px;border-radius:10px;align-self:flex-start}
.ladder span{color:var(--pen);font-weight:700}
.ladder .last{padding-left:1.6em}
.tree{display:flex;flex-direction:column;align-items:center;gap:8px}
.tr-r{font-family:var(--f-disp);background:var(--pc,var(--pen));color:#fff;padding:2px 16px;border-radius:99px}
.tr-c{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tr-c>div{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.tr-n{font-family:var(--f-disp)}.tr-s{font-size:.92rem;color:var(--ink-2)}
.tag-b,.tag-e{font-size:.6em;background:var(--pen-soft);color:var(--pen);border-radius:6px;padding:0 6px;vertical-align:middle}
.scale{display:flex;justify-content:center;align-items:center;gap:20px;font-size:1.6rem}
.pan{background:var(--card2);border:2px solid var(--ink);border-radius:0 0 40px 40px;padding:6px 26px}
.beam{font-size:2rem}
.shape-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shape-row>div{display:flex;flex-direction:column;align-items:center;font-size:.85rem;background:var(--card2);border-radius:10px;padding:6px}
@media (max-width:480px){.shape-row{grid-template-columns:repeat(2,1fr)}}
.lnav{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:99px;border:2px solid var(--ink-3);background:transparent;padding:0}
.dot.on{background:var(--pc,var(--pen));border-color:var(--pc,var(--pen));width:28px}
.dot.past{background:var(--ink-3)}
.panel{display:flex;flex-direction:column;gap:12px}
.pgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard.main{border:2px solid var(--ink)}
.pcard h2{font-size:1.5rem}.pcard h3{font-size:1.2rem}
.rules{margin:0;padding-left:1.2em;color:var(--ink-2)}
.types{display:flex;flex-direction:column;gap:8px}
.type{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:9px 12px;min-width:0}
.type:hover{border-color:var(--pc)}
.tyn{font-family:var(--f-disp);color:var(--pc);white-space:nowrap}
.tyq{font-size:.9rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.speedcard{align-items:center;text-align:center;max-width:520px;align-self:center;width:100%}
.bigrec{display:flex;align-items:baseline;gap:8px;color:var(--ink-2)}
.bigrec b{font-family:var(--f-disp);font-size:3rem;color:var(--pc);font-weight:400}

/* 표 */
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;margin:6px auto;font-size:.98rem;background:var(--card);min-width:200px}
.tbl th,.tbl td{border:1.5px solid var(--line);padding:6px 12px;text-align:center}
.tbl td{white-space:nowrap}.tbl.stem td:last-child{white-space:normal}
.tbl th{background:var(--card2);font-weight:700}
.tbl.stem td:first-child{font-weight:700;width:60px}
.tbl.stem td:last-child{text-align:left;letter-spacing:.1em;min-width:160px}
.qbox{background:var(--card2);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:1.05rem}
.numlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.numlist span{background:var(--card2);border:1.5px solid var(--line);border-radius:8px;padding:2px 12px;font-size:1.1rem;font-variant-numeric:tabular-nums}

/* 그림 */
.fig{display:flex;justify-content:center;margin:6px 0;overflow-x:auto}
.fig svg,.lbody svg{width:100%;height:auto;display:block;margin:0 auto}
.lbody .row2 svg{max-width:100%}
.s{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.s.thin{stroke-width:1.2;stroke:var(--ink-3)}
.s.grid{stroke:var(--line);stroke-width:1}
.s.dash{stroke-dasharray:5 4}
.s.acc{stroke:var(--pen)}
.s.wide{stroke-width:3.2}
.s.sec{fill:var(--hl-soft)}
.s.bar{fill:var(--pen-soft);stroke:var(--pen)}
.d{fill:var(--ink)}.d.acc{fill:var(--pen)}
.t{fill:var(--ink);font-size:15px;text-anchor:middle;dominant-baseline:middle;font-family:var(--f-body)}
.t.sm{font-size:13px}.t.xs{font-size:11px;fill:var(--ink-2)}.t.b{font-weight:700}.t.acc-t{fill:var(--pen)}
.it,.t.it{font-style:italic;font-family:Georgia,'Times New Roman',serif}

/* 문제 풀이 */
.run{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 80px;display:flex;flex-direction:column;gap:14px}
.run-top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:8px 0;z-index:5;flex-wrap:wrap}
.prog{flex:1;height:12px;background:var(--card2);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.prog.ghostp{background:transparent;border-color:transparent}
.prog i{display:block;height:100%;background:var(--pc);transition:width .4s}
.rstat{display:flex;gap:8px;align-items:center;font-family:var(--f-disp)}
.sc{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:2px 12px}
.combo{border-radius:99px;padding:2px 12px;background:var(--card2);color:var(--ink-3)}
.combo.hot{background:var(--p1);color:#fff;animation:pulse 1s infinite}
.timer{background:var(--ink);color:var(--card);border-radius:99px;padding:2px 14px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.timer.low{background:var(--no);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.qcard{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:20px clamp(16px,4vw,28px);box-shadow:6px 6px 0 var(--pc);display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ntag{font-size:.8rem;font-weight:700;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--card));border-radius:8px;padding:2px 10px}
.q{font-size:1.2rem;line-height:1.75}
.big-ex{display:block;margin-top:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.svgch{grid-template-columns:repeat(2,1fr)}
@media (max-width:560px){.choices{grid-template-columns:1fr}.choices.svgch{grid-template-columns:1fr 1fr}}
.ch{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.1rem;min-height:56px;transition:border-color .1s,transform .1s}
.ch:hover:not(:disabled){border-color:var(--pen);transform:translateY(-1px)}
.ch .cn{font-family:var(--f-disp);color:var(--ink-3)}
.ch .cv{min-width:0}
.ch.wrong{border-color:var(--no);background:var(--no-soft);opacity:.8}
.ch.wrong .cv{text-decoration:line-through;text-decoration-color:var(--no)}

// ================= 기본 도구 =================
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

function norm(s){return String(s).replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/×/g,'*').replace(/,/g,'').toLowerCase()}
function stripUnit(s){return s.replace(/(cm²|cm³|cm2|cm3|cm\^2|cm\^3|㎠|㎤|cm|개|°|도|명|원|분|초|시간|살|km|m|권|번|층|점|kg|g|회|마리|일|장|쪽|자루|송이|배)$/,'')}

  const mm=String(s).replace(/[−–—]/g,'-').match(/^\s*(-?)(\d+)\s*(?:\s|과|와|\+)\s*(\d+)\s*\/\s*(\d+)\s*$/);

const SV=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" style="max-width:${w}px" role="img">${inner}</svg>`;

 let pts=[];const faces=[];for(const [c,r,z] of cubes){const T=[P(c,r,z+1),P(c+1,r,z+1),P(c+1,r+1,z+1),P(c,r+1,z+1)],Rt=[P(c+1,r,z),P(c+1,r+1,z),P(c+1,r+1,z+1),P(c+1,r,z+1)],F=[P(c,r+1,z),P(c+1,r+1,z),P(c+1,r+1,z+1),P(c,r+1,z+1)];faces.push([T,'cu-t'],[Rt,'cu-r'],[F,'cu-f']);pts.push(...T,...Rt,...F)}

 let s=faces.map(([f,cl])=>pg(f.map(p=>[p[0]-mnx,p[1]-mny]),'s '+cl)).join('');const fr_=P(C/2,R,0);s+=tx(fr_[0]-mnx-26,fr_[1]-mny+18,'앞','t xs');const sd=P(C,R/2,0);s+=tx(sd[0]-mnx+24,sd[1]-mny+16,'옆','t xs');
 return SV(Math.ceil(W),Math.ceil(H),s)}

function randHM(){const R=R_(2,3),C=R_(2,3);let hm;do{hm=Array.from({length:R},()=>Array.from({length:C},()=>R_(0,3)))}while(hm.flat().filter(x=>x>0).length<3||hm.some(r=>r.every(x=>!x))||[...Array(C).keys()].some(c=>hm.every(r=>!r[c])));return hm}

 ()=>{const n=R(3,6);return prob('다음 전개도를 접으면 어떤 입체도형이 될까요?',mc(NM[n]+'각기둥',[NM[n]+'각뿔',NM[n+1]+'각기둥',NM[n===3?5:n-1]+'각기둥']),'밑면의 모양과 옆면의 개수를 보세요.',`밑면이 ${NM[n]}각형, 옆면이 ${n}개 → <b>${NM[n]}각기둥</b>`,netFig(n))},
 ()=>{const n=R(3,8);return prob(`${NM[n]}각기둥의 전개도에서 <b>옆면</b>은 몇 개일까요?`,inp(n,'개'),'옆면의 수 = 밑면의 변의 수',`<b>${n}개</b>`)},
 ()=>{const n=R(3,8);return prob(`${NM[n]}각기둥의 전개도를 이루는 면은 모두 몇 개일까요?`,inp(n+2,'개'),'옆면 n개 + 밑면 2개',`${n} + 2 = <b>${n+2}개</b>`)},
 ()=>{const n=R(3,6),a=R(2,9);return prob(`밑면이 한 변 ${a} cm인 정${NM[n]}각형인 각기둥의 전개도에서, 옆면 ${n}개를 이어 붙인 직사각형의 가로 길이는?`,inp(n*a,'cm'),'옆면 가로 길이의 합 = 밑면의 둘레',`${a} × ${n} = <b>${n*a} cm</b>`)},
 ()=>{const h=R(3,15),n=R(3,6);return prob(`높이가 ${h} cm인 ${NM[n]}각기둥의 전개도에서 옆면 하나의 세로 길이는?`,inp(h,'cm'),'옆면의 세로 = 각기둥의 높이',`<b>${h} cm</b>`)}
]);

T(6,2,'각뿔',[
 {t:'각뿔이란?',b:`<p>밑면이 <b>다각형 1개</b>이고 옆면이 모두 <mark>삼각형</mark>인 입체도형이에요.</p>${prismFig(4,true)}<ul class="big"><li><b>각뿔의 꼭짓점</b>: 옆면이 모두 만나는 점</li><li><b>높이</b>: 각뿔의 꼭짓점에서 밑면에 수직인 선분의 길이</li></ul>`},
 {t:'구성 요소 세기',b:`${tableHTML(['','n각뿔','사각뿔 예'],[['면','n + 1','5'],['모서리','n × 2','8'],['꼭짓점','n + 1','5']])}`},
 {t:'각기둥과 비교',b:`${tableHTML(['','각기둥','각뿔'],[['밑면','2개','1개'],['옆면 모양','직사각형','삼각형']])}`}
],[
 ()=>{const n=R(3,8);const k=R(0,2);const nm=['면','모서리','꼭짓점'][k];const v=[n+1,2*n,n+1][k];return prob(`${NM[n]}각뿔의 <b>${nm}</b>의 수는?`,inp(v,'개'),['면 = n + 1','모서리 = n × 2','꼭짓점 = n + 1'][k],`n = ${n} → <b>${v}개</b>`,prismFig(n,true))},
 ()=>prob('각뿔의 옆면의 모양은?',mcFixed(['직사각형','삼각형','원','오각형'],1),'뾰족한 꼭짓점으로 모여요.','각뿔의 옆면은 모두 <b>삼각형</b>이에요.'),
 ()=>{const n=R(3,8);return prob('다음 입체도형의 이름은?',mc(NM[n]+'각뿔',[NM[n]+'각기둥',NM[Math.min(10,n+1)]+'각뿔',NM[n===3?4:n-1]+'각뿔']),'밑면의 변의 수를 세어요.',`밑면이 ${NM[n]}각형인 각뿔 → <b>${NM[n]}각뿔</b>`,prismFig(n,true))},
 ()=>{const n=R(3,8);const a=n+2,c=n+1;return prob(`${NM[n]}각기둥과 ${NM[n]}각뿔의 <b>면의 수의 차</b>는?`,inp(1,'개'),'각기둥: n + 2, 각뿔: n + 1',`${a} − ${c} = <b>1개</b>`)},
 ()=>{const n=R(3,8);const E=2*n;return prob(`모서리가 ${E}개인 각뿔의 이름은?`,mc(NM[n]+'각뿔',[NM[Math.min(10,n*2>10?n+1:n*2)]+'각뿔',NM[n]+'각기둥',NM[Math.max(3,n-1)]+'각뿔']),'n각뿔의 모서리는 n × 2개',`${E} ÷ 2 = ${n} → <b>${NM[n]}각뿔</b>`)}
]);

T(7,3,'(소수) ÷ (자연수)',[
 {t:'자연수 나눗셈을 이용해요',b:`<div class="ex">624 ÷ 2 = 312<br>62.4 ÷ 2 = 31.2 &nbsp;(${fr(1,10)}배)<br>6.24 ÷ 2 = 3.12 &nbsp;(${fr(1,100)}배)</div><p>나누어지는 수가 ${fr(1,10)}배, ${fr(1,100)}배가 되면 몫도 ${fr(1,10)}배, ${fr(1,100)}배!</p>`},
 {t:'세로셈에서 소수점',b:`<p>몫의 소수점은 <mark>나누어지는 수의 소수점 바로 위</mark>에 찍어요.</p><div class="ex">8.4 ÷ 4 = 2.1<br>2.4 ÷ 4 = <b>0.6</b> (몫의 일의 자리에 0을 써요)<br>6.24 ÷ 6 = <b>1.04</b> (중간에 0)</div>`},
 {t:'나누어떨어지지 않으면 0을 내려요',b:`<div class="ex">3.4 ÷ 4 = 3.40 ÷ 4 = <b>0.85</b></div><p class="tip">소수 끝에 0을 붙여도 크기는 같아요. 3.4 = 3.40</p>`}
],[
 ()=>{const k=R(2,9),q=R(11,99);const a=k*q;return prob(`${D_(Q(a,10))} ÷ ${k} = ?`,inp(Q(q,10),'',D_(Q(q,10))),'자연수 나눗셈 '+a+' ÷ '+k+'를 먼저 해 보세요.',`${a} ÷ ${k} = ${q}<br>${D_(Q(a,10))} ÷ ${k} = <b>${D_(Q(q,10))}</b>`)},
 ()=>{const k=R(2,9),q=R(1,9);const a=k*q;return prob(`${D_(Q(a,10))} ÷ ${k} = ?`,inp(Q(q,10),'',D_(Q(q,10))),'나누어지는 수가 나누는 수보다 작으면 몫의 일의 자리는 0',`<b>${D_(Q(q,10))}</b>`)},
 ()=>{const k=pick([2,4,5,6,8]);let q;do{q=R(11,240)}while(q%10===0||(k*q)%10===0);const a=k*q;return prob(`${D_(Q(a,100))} ÷ ${k} = ?`,inp(Q(q,100),'',D_(Q(q,100))),'몫의 소수점은 나누어지는 수의 소수점 위에!',`${a} ÷ ${k} = ${q} → <b>${D_(Q(q,100))}</b>`)},
 ()=>{const k=pick([2,4,5]);let a;do{a=R(11,99)}while(a%k===0);return prob(`${D_(Q(a,10))} ÷ ${k} = ?`,inp(Q(a,10*k),'',D_(Q(a,10*k))),'나누어떨어지지 않으면 소수 끝에 0을 붙여 계속 나눠요.',`${D_(Q(a,10))} = ${D_(Q(a,10))}0<br>÷ ${k} = <b>${D_(Q(a,10*k))}</b>`)},
 ()=>{const k=R(3,8),q=R(12,99);const a=k*q;return prob(`${a} ÷ ${k} = ${q}일 때, ${D_(Q(a,100))} ÷ ${k}의 몫은?`,inp(Q(q,100),'',D_(Q(q,100))),'나누어지는 수가 1/100배가 되었어요.',`${a} → ${D_(Q(a,100))} (${fr(1,100)}배)<br>몫도 ${fr(1,100)}배: <b>${D_(Q(q,100))}</b>`)},
 ()=>{const k=R(2,6),q=R(11,60);const a=k*q;return prob(`리본 ${D_(Q(a,10))} m를 ${k}명이 똑같이 나누면 한 명은 몇 m를 가질까요?`,inp(Q(q,10),'m',D_(Q(q,10))),'(전체) ÷ (사람 수)',`${D_(Q(a,10))} ÷ ${k} = <b>${D_(Q(q,10))} m</b>`)}
]);

T(8,3,'(자연수) ÷ (자연수) ⑵',[
 {t:'몫을 소수로 나타내기',b:`<p>나누어떨어지지 않을 때 <b>0을 내려</b> 계속 나누면 몫을 소수로 나타낼 수 있어요.</p><div class="ex">7 ÷ 2 = 3.5<br>3 ÷ 4 = 0.75<br>9 ÷ 8 = 1.125</div>`},
 {t:'분수로 바꿔 생각하기',b:`<div class="ex">3 ÷ 4 = ${fr(3,4)} = ${fsx(75,100)} = 0.75<br>7 ÷ 5 = ${fr(7,5)} = ${fsx(14,10)} = 1.4</div><p class="tip">분모를 10, 100으로 만들면 소수로 바꾸기 쉬워요.</p>`}
],[
 ()=>{const k=pick([2,4,5,8,10,20,25]);let a;do{a=R(1,40)}while(a%k===0);return prob(`${a} ÷ ${k}의 몫을 소수로 나타내세요.`,inp(Q(a,k),'',D_(Q(a,k))),'0을 내려 계속 나눠 보세요.',`${a} ÷ ${k} = <b>${D_(Q(a,k))}</b>`)},
 ()=>{const k=pick([2,4,5]);let a;do{a=R(1,k-1)}while(false);return prob(`${a} ÷ ${k} = ?<div class="cap">소수로 입력</div>`,inp(Q(a,k),'',D_(Q(a,k))),'몫이 1보다 작아요. 일의 자리에 0!',`${a} ÷ ${k} = ${fr(a,k)} = <b>${D_(Q(a,k))}</b>`)},
 ()=>{const k=pick([2,4,5,8]);let a;do{a=R(1,30)}while(a%k===0);return prob(`${a} ÷ ${k}의 몫을 소수로 바르게 나타낸 것은?`,mc(D_(Q(a,k)),[D_(Q(a*10,k)),D_(Q(a,k*10)),D_(Q(k,a)),D_(Q(a+1,k))]),'몫의 소수점 위치를 확인해요.',`<b>${D_(Q(a,k))}</b>`)},
 ()=>{const k=pick([2,4,5,8]);let a;do{a=R(3,30)}while(a%k===0);return prob(`물 ${a} L를 ${k}개의 병에 똑같이 나누어 담으면 한 병에 몇 L씩 담을까요? (소수로)`,inp(Q(a,k),'L',D_(Q(a,k))),'(전체) ÷ (병 수)',`${a} ÷ ${k} = <b>${D_(Q(a,k))} L</b>`)}
]);

T(9,4,'두 수 비교하기',[
 {t:'두 가지 비교 방법',b:`<p>한 모둠에 학생 4명, 모자 2개씩이에요.</p>${tableHTML(['모둠 수','1','2','3','4'],[['학생 수','4','8','12','16'],['모자 수','2','4','6','8']])}<ul class="big"><li><b>뺄셈으로 비교</b>: 학생이 모자보다 2, 4, 6, 8명 많다 → <mark>계속 변해요</mark></li><li><b>나눗셈으로 비교</b>: 학생 수는 모자 수의 항상 2배 → <mark>변하지 않아요</mark></li></ul>`}
],[
 ()=>{const k=R(2,6),m=R(1,4);const g=R(2,8);return prob(`한 모둠에 학생 ${k*m}명, 의자 ${m}개씩이에요. 모둠이 ${g}개일 때 학생은 의자보다 몇 명 더 많을까요?`,inp((k*m-m)*g,'명'),'학생 수와 의자 수를 각각 구해 빼요.',`학생: ${k*m*g}명, 의자: ${m*g}개<br>${k*m*g} − ${m*g} = <b>${(k*m-m)*g}명</b>`)},
 ()=>{const k=R(2,6),m=R(1,5);const g=R(2,8);return prob(`한 모둠에 학생 ${k*m}명, 의자 ${m}개씩이에요. 학생 수는 의자 수의 몇 배일까요?`,inp(k,'배'),'나눗셈으로 비교해요.',`${k*m} ÷ ${m} = <b>${k}배</b> (모둠 수와 상관없이 같아요)`)},
 ()=>prob('모둠 수가 늘어나도 <b>변하지 않는</b> 비교 방법은?',mcFixed(['뺄셈으로 비교','나눗셈으로 비교'],1),'표를 만들어 비교해 보세요.','학생 수 ÷ 모자 수는 모둠 수와 상관없이 일정해요 → <b>나눗셈으로 비교</b>'),
 ()=>{const k=R(2,5),g=R(3,9);return prob(`한 상자에 사과가 ${k}개씩 들어 있어요. 상자가 ${g}개이면 사과는 모두 몇 개일까요?`,inp(k*g,'개'),'(한 상자의 개수) × (상자 수)',`${k} × ${g} = <b>${k*g}개</b>`)}
]);

const RATIO_READ=(a,b2)=>[`${a} : ${b2}`,`${a} 대 ${b2}`,`${a}와 ${b2}의 비`,`${b2}에 대한 ${a}의 비`,`${a}의 ${b2}에 대한 비`];
T(10,4,'비와 비율',[
 {t:'비',b:`<p>두 수를 나눗셈으로 비교하기 위해 기호 <b>:</b>를 사용해요.</p><div class="ex big-ex">3 : 5</div><p>읽는 법: 3 대 5, 3과 5의 비, <mark>5에 대한 3의 비</mark>, 3의 5에 대한 비</p>`},
 {t:'기준량과 비교하는 양',b:`<div class="ex">3 : 5 에서<br>기호 <b>:</b> 의 오른쪽 5 → <b>기준량</b><br>기호 <b>:</b> 의 왼쪽 3 → <b>비교하는 양</b></div><p class="tip">“~에 대한”이 붙은 쪽이 기준량이에요.</p>`},
 {t:'비율',b:`<div class="ex big-ex">(비율) = (비교하는 양) ÷ (기준량)</div><div class="ex">3 : 5의 비율 = 3 ÷ 5 = ${fr(3,5)} = 0.6</div>`}
],[
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c);const ways=[[`${c}에 대한 ${a}의 비`,`${a} : ${c}`],[`${a}의 ${c}에 대한 비`,`${a} : ${c}`],[`${a}와 ${c}의 비`,`${a} : ${c}`],[`${a} 대 ${c}`,`${a} : ${c}`]];const w=pick(ways);return prob(`“${w[0]}”를 기호로 나타내면?`,mc(w[1],[`${c} : ${a}`,`${a} : ${a+c}`,`${c} : ${a+c}`]),'“~에 대한” 쪽이 오른쪽(기준량)!',`<b>${w[1]}</b>`)},
 ()=>{let a,c;do{a=R(1,20);c=R(1,20)}while(a===c);const ask=Math.random()<.5;return prob(`비 ${a} : ${c}에서 <b>${ask?'기준량':'비교하는 양'}</b>은?`,inp(ask?c:a),'기호 : 의 오른쪽이 기준량, 왼쪽이 비교하는 양',`${ask?'기준량':'비교하는 양'}: <b>${ask?c:a}</b>`)},
 ()=>{const c=pick([2,4,5,10,20,25]);let a;do{a=R(1,30)}while(a===c);return prob(`비 ${a} : ${c}의 비율을 소수로 나타내세요.`,inp(Q(a,c),'',D_(Q(a,c))),'(비교하는 양) ÷ (기준량)',`${a} ÷ ${c} = <b>${D_(Q(a,c))}</b>`)},
 ()=>{let a,c;do{a=R(1,9);c=R(2,12)}while(a===c);return prob(`비 ${a} : ${c}의 비율을 분수로 나타내세요.`,inp(Q(a,c)),'비교하는 양이 분자, 기준량이 분모',`${a} : ${c} → <b>${fr(a,c)}</b>`)},
 ()=>{const tot=pick([20,25,30,40]);const b0=R(5,tot-5);return prob(`우리 반 ${tot}명 중 남학생이 ${b0}명이에요. 반 전체 학생 수에 대한 남학생 수의 비를 고르면?`,mc(`${b0} : ${tot}`,[`${tot} : ${b0}`,`${b0} : ${tot-b0}`,`${tot-b0} : ${b0}`]),'“전체에 대한” → 전체가 기준량(오른쪽)',`비교하는 양: 남학생 ${b0}, 기준량: 전체 ${tot} → <b>${b0} : ${tot}</b>`)}
]);

T(11,4,'백분율',[
 {t:'백분율(%)',b:`<p>기준량을 <b>100</b>으로 할 때의 비율을 백분율이라고 해요. 기호 <b>%</b>(퍼센트)를 써요.</p><div class="ex big-ex">(백분율) = (비율) × 100</div><div class="ex">${fr(3,4)} × 100 = 75 → <b>75%</b><br>0.2 × 100 = 20 → <b>20%</b></div>`},
 {t:'백분율 → 비율',b:`<div class="ex">35% = ${fsx(35,100)} = 0.35<br>8% = 0.08</div>`},
 {t:'생활 속 백분율',b:`<div class="ex">10000원짜리 물건을 8000원에 샀다면<br>할인 금액 2000원 → 할인율 = 2000 ÷ 10000 × 100 = <b>20%</b></div>`}
],[
 ()=>{const d=pick([2,4,5,10,20,25,50]);const n=R(1,d-1);return prob(`${fr(n,d)}를 백분율로 나타내면 몇 %일까요?`,inp(n*100/d,'%'),'비율 × 100',`${fr(n,d)} × 100 = <b>${n*100/d}%</b>`)},
 ()=>{const p=R(1,99);return prob(`${D_(Q(p,100))}를 백분율로 나타내면 몇 %일까요?`,inp(p,'%'),'소수 × 100',`${D_(Q(p,100))} × 100 = <b>${p}%</b>`)},
 ()=>{const p=R(1,99);return prob(`${p}%를 소수로 나타내세요.`,inp(Q(p,100),'',D_(Q(p,100))),'% 값 ÷ 100',`${p} ÷ 100 = <b>${D_(Q(p,100))}</b>`)},
 ()=>{const price=pick([5000,8000,10000,20000,4000]);const pct=pick([10,20,25,30,40,50]);const sale=price*(100-pct)/100;return prob(`${price.toLocaleString()}원짜리 물건을 ${sale.toLocaleString()}원에 샀어요. 할인율은 몇 %일까요?`,inp(pct,'%'),'(할인 금액) ÷ (원래 가격) × 100',`할인 금액: ${(price-sale).toLocaleString()}원<br>${price-sale} ÷ ${price} × 100 = <b>${pct}%</b>`)},
 ()=>{const tot=pick([20,25,50,200,400]);const p=pick([10,20,25,30,40,45,60,75]);const v=tot*p/100;if(v%1)return TOPICS[11].gens[4]();return prob(`전체 ${tot}명 중 ${v}명이 찬성했어요. 찬성한 학생은 몇 %일까요?`,inp(p,'%'),'(찬성 수) ÷ (전체) × 100',`${v} ÷ ${tot} × 100 = <b>${p}%</b>`)}
]);

function pictoData(){const big=pick([100,10,1000]);const small=big/10;const regions=shuf(['가 마을','나 마을','다 마을','라 마을','마 마을']).slice(0,4).sort();const rows=regions.map(r=>[r,small*R(10,49)]);const unit=big===1000?'kg':big===100?'그루':'명';return{big,small,rows,unit}}
T(12,4,'그림그래프',[
 {t:'그림그래프',b:`<p>수량을 <b>그림</b>으로 나타낸 그래프예요. 큰 그림과 작은 그림이 나타내는 수가 달라요.</p>${pictoTable([['가 마을',230],['나 마을',140]],100,10,'그루')}<div class="ex">가 마을: 큰 그림 2개(200) + 작은 그림 3개(30) = <b>230그루</b></div>`}
],[
 ()=>{const D=pictoData();const r=pick(D.rows);return prob(`그림그래프에서 ${r[0]}의 수량은?${pictoTable(D.rows,D.big,D.small,D.unit)}`,inp(r[1],D.unit),'큰 그림 수 × '+D.big+' + 작은 그림 수 × '+D.small,`큰 그림 ${Math.floor(r[1]/D.big)}개, 작은 그림 ${Math.round(r[1]%D.big/D.small)}개<br>→ <b>${r[1]}${D.unit}</b>`)},
 ()=>{let D;do{D=pictoData()}while(new Set(D.rows.map(r=>r[1])).size<4);const big=Math.random()<.5;const r=D.rows.slice().sort((a,b2)=>big?b2[1]-a[1]:a[1]-b2[1])[0];return prob(`그림그래프에서 수량이 가장 <b>${big?'많은':'적은'}</b> 곳은?${pictoTable(D.rows,D.big,D.small,D.unit)}`,mcFixed(D.rows.map(x=>x[0]),D.rows.indexOf(r)),'큰 그림의 수를 먼저 비교해요.',`<b>${r[0]}</b> (${r[1]}${D.unit})`)},
 ()=>{const D=pictoData();const t=sum(D.rows.map(r=>r[1]));return prob(`그림그래프에서 네 곳의 수량을 모두 더하면?${pictoTable(D.rows,D.big,D.small,D.unit)}`,inp(t,D.unit),'각각 읽은 뒤 더해요.',`${D.rows.map(r=>r[1]).join(' + ')} = <b>${t}${D.unit}</b>`)},
 ()=>{const v=R(11,49)*10;const ok=`큰 그림 ${Math.floor(v/100)}개, 작은 그림 ${v%100/10}개`;return prob(`큰 그림이 100, 작은 그림이 10을 나타낼 때, ${v}을(를) 나타내려면?`,mc(ok,[`큰 그림 ${v%100/10}개, 작은 그림 ${Math.floor(v/100)}개`,`큰 그림 ${Math.floor(v/100)+1}개, 작은 그림 ${v%100/10}개`,`큰 그림 ${v/10}개`]),'백의 자리 → 큰 그림, 십의 자리 → 작은 그림',`${v} = ${Math.floor(v/100)*100} + ${v%100} → <b>${ok}</b>`)}
]);

function pctItems(){const names=shuf(['축구','농구','야구','배구','수영','태권도']).slice(0,R(4,5));let ps;do{ps=names.map(()=>R(1,8)*5);}while(sum(ps.slice(0,-1))>=95||sum(ps.slice(0,-1))<55);ps[ps.length-1]=100-sum(ps.slice(0,-1));return names.map((n,i)=>({name:n,p:ps[i]})).sort((a,b2)=>b2.p-a.p)}
T(13,4,'띠그래프',[
 {t:'띠그래프',b:`<p>전체에 대한 각 부분의 비율을 <b>띠 모양</b>에 나타낸 그래프예요. 전체는 100%!</p>${stripFig([{name:'축구',p:40},{name:'농구',p:25},{name:'야구',p:20},{name:'기타',p:15}])}<p class="tip">각 항목의 백분율을 모두 더하면 100%예요.</p>`},
 {t:'띠그래프 그리는 순서',b:`<ol class="big"><li>각 항목의 백분율을 구해요.</li><li>백분율의 합이 100%인지 확인해요.</li><li>백분율만큼 띠를 나누고 이름과 %를 써요.</li></ol>`},
 {t:'띠그래프 읽기',b:`<div class="ex">전체 학생 200명, 축구 40%<br>→ 축구를 좋아하는 학생: 200 × 0.4 = <b>80명</b></div>`}
],[
 ()=>{const it=pctItems();const x=pick(it);return prob(`띠그래프에서 ${x.name}을(를) 좋아하는 학생은 전체의 몇 %일까요?`,inp(x.p,'%'),'띠에 적힌 %를 읽어요.',`<b>${x.p}%</b>`,stripFig(it))},
 ()=>{const it=pctItems();const tot=pick([20,40,100,200,300]);const x=pick(it.filter(i=>(tot*i.p)%100===0))||it[0];return prob(`전체 학생이 ${tot}명일 때, 띠그래프에서 ${x.name}을(를) 좋아하는 학생은 몇 명일까요?`,inp(Q(tot*x.p,100),'명',D_(Q(tot*x.p,100))),'(전체) × (백분율) ÷ 100',`${tot} × ${x.p} ÷ 100 = <b>${D_(Q(tot*x.p,100))}명</b>`,stripFig(it))},
 ()=>{const it=pctItems();const h=R(0,it.length-1);return prob(`띠그래프에서 ${it[h].name}의 백분율이 지워졌어요. 몇 %일까요?${tableHTML(['종목',...it.map(i=>i.name)],[['%',...it.map((i,k)=>k===h?'?':i.p)]])}`,inp(it[h].p,'%'),'모두 더하면 100%',`100 − (${it.filter((_,k)=>k!==h).map(i=>i.p).join(' + ')}) = <b>${it[h].p}%</b>`)},
 ()=>{let it;do{it=pctItems()}while(it[0].p%it[it.length-1].p!==0||it[0].p===it[it.length-1].p);const a=it[0],c=it[it.length-1];return prob(`띠그래프에서 ${a.name}은(는) ${c.name}의 몇 배일까요?`,inp(a.p/c.p,'배'),'백분율끼리 나눠요.',`${a.p} ÷ ${c.p} = <b>${a.p/c.p}배</b>`,stripFig(it))}
]);

T(14,4,'원그래프',[
 {t:'원그래프',b:`<p>전체에 대한 각 부분의 비율을 <b>원 모양</b>에 나타낸 그래프예요.</p>${pieFig([{name:'빵',p:40},{name:'밥',p:30},{name:'면',p:20},{name:'기타',p:10}])}`},
 {t:'원그래프의 특징',b:`<ul class="big"><li>원의 중심을 따라 나눈 크기가 백분율이에요.</li><li>전체는 <b>100%</b></li><li>25%는 원의 ${fr(1,4)}, 50%는 원의 ${fr(1,2)}</li></ul>`}
],[
 ()=>{const it=pctItems();const x=pick(it);return prob(`원그래프에서 ${x.name}은(는) 전체의 몇 %일까요?`,inp(x.p,'%'),'조각에 적힌 %를 읽어요.',`<b>${x.p}%</b>`,pieFig(it))},
 ()=>{const it=pctItems();return prob('원그래프에서 가장 많은 학생이 좋아하는 종목은?',mcFixed(it.map(i=>i.name),0),'가장 큰 조각을 찾아요.',`<b>${it[0].name}</b> (${it[0].p}%)`,pieFig(it))},
 ()=>{const it=pctItems();const tot=pick([40,100,200,400]);const x=pick(it.filter(i=>(tot*i.p)%100===0))||it[0];return prob(`조사한 학생이 ${tot}명일 때, 원그래프에서 ${x.name}을(를) 좋아하는 학생은 몇 명일까요?`,inp(Q(tot*x.p,100),'명',D_(Q(tot*x.p,100))),'(전체) × (백분율) ÷ 100',`${tot} × ${x.p} ÷ 100 = <b>${D_(Q(tot*x.p,100))}명</b>`,pieFig(it))},
 ()=>{const p=pick([25,50,75,10,20]);return prob(`원그래프에서 ${p}%는 원 전체의 얼마일까요?`,mc(fsx(...[Q(p,100)].map(q=>[q.n,q.d])[0]),[fsx(1,p),fsx(p,10),fsx(1,3)]),'백분율을 분수로 바꿔요.',`${p}% = ${fsx(p,100)} = <b>${fr(p,100)}</b>`)}
]);

// ---------- PART 5 ----------
T(15,5,'직육면체의 부피 구하기',[
 {t:'부피의 단위',b:`<p>한 모서리가 1 cm인 정육면체의 부피를 <b>1 cm³</b>(1 세제곱센티미터)라고 해요.</p><p>쌓기나무 몇 개로 채울 수 있는지 세면 부피예요.</p>`},
 {t:'직육면체의 부피',b:`${boxFig(4,3,2,['4 cm','3 cm','2 cm'])}<div class="ex big-ex">(부피) = (가로) × (세로) × (높이)</div><div class="ex">4 × 3 × 2 = <b>24 cm³</b></div>`},
 {t:'정육면체와 m³',b:`<div class="ex">정육면체의 부피 = (한 모서리) × (한 모서리) × (한 모서리)</div><div class="ex">1 m³ = 100 cm × 100 cm × 100 cm = <b>1000000 cm³</b></div>`}
],[
 ()=>{const a=R(2,5),c=R(2,4),d=R(1,3);return prob('1 cm³인 쌓기나무로 다음 직육면체를 만들었어요. 부피는 몇 cm³일까요?',inp(a*c*d,'cm³'),'(한 층의 개수) × (층 수)',`한 층: ${a} × ${c} = ${a*c}개, ${d}층<br>${a*c} × ${d} = <b>${a*c*d} cm³</b>`,isoFig(Array.from({length:c},()=>Array(a).fill(d))))},
 ()=>{const a=R(2,12),c=R(2,10),d=R(2,10);return prob('다음 직육면체의 부피는?',inp(a*c*d,'cm³'),'가로 × 세로 × 높이',`${a} × ${c} × ${d} = <b>${a*c*d} cm³</b>`,boxFig(a,c,d,[a+' cm',c+' cm',d+' cm']))},
 ()=>{const a=R(2,10);return prob(`한 모서리가 ${a} cm인 정육면체의 부피는?`,inp(a**3,'cm³'),'세 모서리의 길이가 모두 같아요.',`${a} × ${a} × ${a} = <b>${a**3} cm³</b>`)},
 ()=>{const a=R(2,10),c=R(2,10),h=R(2,10);return prob(`가로 ${a} cm, 세로 ${c} cm인 직육면체의 부피가 ${a*c*h} cm³일 때, 높이는?`,inp(h,'cm'),'(부피) ÷ (가로 × 세로)',`${a*c*h} ÷ (${a} × ${c}) = ${a*c*h} ÷ ${a*c} = <b>${h} cm</b>`)},
 ()=>{const k=R(2,9);return prob(`${k} m³는 몇 cm³일까요?`,mc(`${(k*1000000).toLocaleString()} cm³`,[`${(k*100).toLocaleString()} cm³`,`${(k*10000).toLocaleString()} cm³`,`${(k*1000).toLocaleString()} cm³`]),'1 m³ = 1000000 cm³',`${k} × 1000000 = <b>${(k*1000000).toLocaleString()} cm³</b>`)}
]);

T(16,5,'직육면체의 겉넓이 구하기',[
 {t:'겉넓이',b:`<p>직육면체 <b>여섯 면의 넓이의 합</b>이에요. 마주 보는 면은 넓이가 같아요!</p>${boxFig(4,3,2,['4 cm','3 cm','2 cm'])}<div class="ex big-ex">(겉넓이) = (한 꼭짓점에서 만나는 세 면의 넓이의 합) × 2</div><div class="ex">(4×3 + 3×2 + 4×2) × 2 = 26 × 2 = <b>52 cm²</b></div>`},
 {t:'정육면체의 겉넓이',b:`<div class="ex big-ex">(한 면의 넓이) × 6</div><div class="ex">한 모서리 5 cm → 5 × 5 × 6 = <b>150 cm²</b></div>`}
],[
 ()=>{const a=R(2,10),c=R(2,9),d=R(2,8);const S=2*(a*c+c*d+a*d);return prob('다음 직육면체의 겉넓이는?',inp(S,'cm²'),'세 면의 넓이를 더해서 2배!',`(${a}×${c} + ${c}×${d} + ${a}×${d}) × 2 = ${a*c+c*d+a*d} × 2 = <b>${S} cm²</b>`,boxFig(a,c,d,[a+' cm',c+' cm',d+' cm']))},
 ()=>{const a=R(2,12);return prob(`한 모서리가 ${a} cm인 정육면체의 겉넓이는?`,inp(6*a*a,'cm²'),'한 면의 넓이 × 6',`${a} × ${a} × 6 = <b>${6*a*a} cm²</b>`)},
 ()=>{const a=R(2,10),c=R(2,9),d=R(2,8);return prob(`가로 ${a} cm, 세로 ${c} cm, 높이 ${d} cm인 직육면체에서 <b>가장 넓은 면</b>의 넓이는?`,inp(Math.max(a*c,c*d,a*d),'cm²'),'세 종류의 면 넓이를 비교해요.',`${a*c}, ${c*d}, ${a*d} 중 가장 큰 값 → <b>${Math.max(a*c,c*d,a*d)} cm²</b>`)},
 ()=>{const S=pick([6,24,54,96,150,216,294,384,486,600]);const a=Math.sqrt(S/6);return prob(`겉넓이가 ${S} cm²인 정육면체의 한 모서리의 길이는?`,inp(a,'cm'),'겉넓이 ÷ 6 = 한 면의 넓이',`${S} ÷ 6 = ${S/6} = ${a} × ${a} → <b>${a} cm</b>`)}
]);

// ---------- PART 6 ----------
T(17,6,'(분수) ÷ (분수)',[
 {t:'분모가 같을 때',b:`<p><mark>분자끼리 나눠요.</mark></p><div class="ex">${fr(6,7)} ÷ ${fr(2,7)} = 6 ÷ 2 = <b>3</b><br>${fr(5,9)} ÷ ${fr(2,9)} = 5 ÷ 2 = ${fr(5,2)} = ${mixed(5,2)}</div>`},
 {t:'분모가 다를 때',b:`<p>통분한 뒤 분자끼리 나눠요.</p><div class="ex">${fr(3,4)} ÷ ${fr(1,8)} = ${fsx(6,8)} ÷ ${fsx(1,8)} = 6 ÷ 1 = <b>6</b></div>`}
],[
 ()=>{const d=R(5,13),c=R(1,4),k=R(2,4);if(c*k>=d+5)return TOPICS[17].gens[0]();const n=c*k;return prob(`${fsx(n,d)} ÷ ${fsx(c,d)} = ?`,inp(k),'분모가 같으면 분자끼리 나눠요.',`${n} ÷ ${c} = <b>${k}</b>`)},
 ()=>{let d,n,c;do{d=R(4,13);n=R(1,d-1);c=R(1,d-1)}while(n%c===0||n===c);return prob(`${fsx(n,d)} ÷ ${fsx(c,d)} = ?`,inp(Q(n,c)),'분자끼리 나누면 '+n+' ÷ '+c,`${n} ÷ ${c} = <b>${fr(n,c)}</b>${n>c?' = '+mixed(n,c):''}`)},
 ()=>{const d1=pick([2,3,4]),k=pick([2,3]);const d2=d1*k;let n1,n2;do{n1=R(1,d1-1||1);n2=R(1,d2-1)}while(gcd(n2,d2)!==1||(n1*k)%n2!==0&&false);return prob(`${fr(n1,d1)} ÷ ${fr(n2,d2)} = ?`,inp(Q(n1*k,n2)),'분모를 '+d2+'로 통분해요.',`${fsx(n1*k,d2)} ÷ ${fsx(n2,d2)} = ${n1*k} ÷ ${n2} = <b>${fr(n1*k,n2)}</b>`)},
 ()=>{const d=R(5,12),c=R(1,3),k=R(2,5);const n=c*k;if(n>=d)return TOPICS[17].gens[3]();return prob(`주스 ${fsx(n,d)} L를 한 컵에 ${fsx(c,d)} L씩 나누어 담으면 몇 컵이 될까요?`,inp(k,'컵'),'(전체) ÷ (한 컵의 양)',`${fsx(n,d)} ÷ ${fsx(c,d)} = ${n} ÷ ${c} = <b>${k}컵</b>`)}
]);

T(18,6,'(자연수) ÷ (분수)',[
 {t:'단위분수로 나누기',b:`<div class="ex">3 ÷ ${fr(1,4)} = 3 × 4 = <b>12</b></div><p>1을 ${fr(1,4)}씩 나누면 4개 → 3을 나누면 12개!</p>`},
 {t:'일반 분수로 나누기',b:`<div class="ex steps">6 ÷ ${fr(2,3)}<br>= (6 ÷ 2) × 3 &nbsp;← 분자로 나누고 분모를 곱해요<br>= <b>9</b></div>`}
],[
 ()=>{const a=R(1,9),d=R(2,9);return prob(`${a} ÷ ${fsx(1,d)} = ?`,inp(a*d),'단위분수로 나누면 분모를 곱해요.',`${a} × ${d} = <b>${a*d}</b>`)},
 ()=>{let n,d,k;do{d=R(2,9);n=R(2,d+3);k=R(1,6)}while(gcd(n,d)!==1||n===d);const a=n*k;return prob(`${a} ÷ ${fr(n,d)} = ?`,inp(k*d),'(자연수 ÷ 분자) × 분모',`(${a} ÷ ${n}) × ${d} = ${k} × ${d} = <b>${k*d}</b>`)},
 ()=>{let n,d,a;do{d=R(2,9);n=R(2,d-1);a=R(1,9)}while(gcd(n,d)!==1||a%n===0);return prob(`${a} ÷ ${fr(n,d)} = ?`,inp(Q(a*d,n)),'나누는 분수의 분자와 분모를 바꾸어 곱해요.',`${a} × ${fr(d,n)} = <b>${fr(a*d,n)}</b>`)},
 ()=>{let n,d,k;do{d=R(2,6);n=R(1,d-1);k=R(2,8)}while(gcd(n,d)!==1);const a=n*k;return prob(`물 ${a} L를 ${fr(n,d)} L씩 병에 나누어 담으면 몇 병이 될까요?`,inp(k*d,'병'),'(전체) ÷ (한 병의 양)',`${a} ÷ ${fr(n,d)} = (${a} ÷ ${n}) × ${d} = <b>${k*d}병</b>`)}
]);

T(19,6,'(분수) ÷ (분수)를 (분수) × (분수)로',[
 {t:'나누는 분수를 뒤집어 곱해요',b:`<div class="ex big-ex">${fsx('▲','■')} ÷ ${fsx('●','★')} = ${fsx('▲','■')} × ${fsx('★','●')}</div><div class="ex">${fr(2,5)} ÷ ${fr(3,4)} = ${fr(2,5)} × ${fr(4,3)} = <b>${fr(8,15)}</b></div><p class="tip">나누는 수(뒤쪽)만 분자·분모를 바꿔요!</p>`},
 {t:'대분수가 있을 때',b:`<div class="ex">${mixed(3,2)} ÷ ${fr(3,4)} = ${fr(3,2)} × ${fr(4,3)} = ${fsx(12,6)} = <b>2</b></div><p>대분수는 먼저 가분수로 바꿔요.</p>`}
],[
 ()=>{let a,b2,c,d;do{a=R(1,8);b2=R(2,9);c=R(1,8);d=R(2,9)}while(gcd(a,b2)!==1||gcd(c,d)!==1||a===b2||c===d);return prob(`${fr(a,b2)} ÷ ${fr(c,d)}를 곱셈식으로 바르게 나타낸 것은?`,mc(`${fsx(a,b2)} × ${fsx(d,c)}`,[`${fsx(b2,a)} × ${fsx(c,d)}`,`${fsx(a,b2)} × ${fsx(c,d)}`,`${fsx(b2,a)} × ${fsx(d,c)}`]),'나누는 분수(뒤쪽)의 분자와 분모를 바꿔요.',`<b>${fsx(a,b2)} × ${fsx(d,c)}</b>`)},
 ()=>{let a,b2,c,d;do{a=R(1,8);b2=R(2,9);c=R(1,8);d=R(2,9)}while(gcd(a,b2)!==1||gcd(c,d)!==1||a>=b2||c>=d);return prob(`${fr(a,b2)} ÷ ${fr(c,d)} = ?`,inp(Q(a*d,b2*c)),'뒤집어 곱해요.',`${fr(a,b2)} × ${fr(d,c)} = ${fsx(a*d,b2*c)}${gcd(a*d,b2*c)>1?' = <b>'+fr(a*d,b2*c)+'</b>':''}`)},
 ()=>{let w,n,d,c,e;do{w=R(1,3);d=R(2,6);n=R(1,d-1);c=R(1,5);e=R(2,7)}while(gcd(n,d)!==1||gcd(c,e)!==1||c>=e);const N0=w*d+n;return prob(`${mixed(N0,d)} ÷ ${fr(c,e)} = ?<div class="cap">가분수 또는 대분수로 입력</div>`,inp(Q(N0*e,d*c)),'대분수를 가분수로 바꾼 뒤 뒤집어 곱해요.',`${fr(N0,d)} × ${fr(e,c)} = <b>${fr(N0*e,d*c)}</b>`)},
 ()=>{let a,b2,c,d;do{a=R(1,8);b2=R(2,9);c=R(1,8);d=R(2,9)}while(gcd(a,b2)!==1||gcd(c,d)!==1||a>=b2||c>=d);const [it,u]=['페인트','L'];return prob(`${it} ${fr(c,d)}${u}로 벽 ${fr(a,b2)} m²를 칠했어요. ${it} 1${u}로는 몇 m²를 칠할 수 있을까요?`,inp(Q(a*d,b2*c),'m²'),'(칠한 넓이) ÷ (사용한 양)',`${fr(a,b2)} ÷ ${fr(c,d)} = ${fr(a,b2)} × ${fr(d,c)} = <b>${fr(a*d,b2*c)} m²</b>`)}
]);

T(20,6,'(소수) ÷ (소수)',[
 {t:'자연수의 나눗셈으로 바꾸기',b:`<p>나누는 수와 나누어지는 수에 <b>똑같이 10배, 100배</b>를 해도 몫은 같아요.</p><div class="ex">1.8 ÷ 0.3 = 18 ÷ 3 = <b>6</b><br>2.56 ÷ 0.32 = 256 ÷ 32 = <b>8</b></div>`},
 {t:'세로셈에서 소수점 옮기기',b:`<div class="ex steps">2.56 ÷ 0.8<br>→ 25.6 ÷ 8 &nbsp;(둘 다 소수점을 오른쪽으로 한 칸)<br>= <b>3.2</b></div><p class="tip">나누는 수가 자연수가 되도록 소수점을 옮겨요.</p>`}
],[
 ()=>{const c=R(2,9),k=R(2,9);return prob(`${D_(Q(c*k,10))} ÷ ${D_(Q(c,10))} = ?`,inp(k),'둘 다 10배 하면 자연수의 나눗셈!',`${c*k} ÷ ${c} = <b>${k}</b>`)},
 ()=>{const c=R(11,49),k=R(2,9);return prob(`${D_(Q(c*k,100))} ÷ ${D_(Q(c,100))} = ?`,inp(k),'둘 다 100배 해요.',`${c*k} ÷ ${c} = <b>${k}</b>`)},
 ()=>{const c=R(2,9),q=R(11,99);return prob(`${D_(Q(c*q,100))} ÷ ${D_(Q(c,10))} = ?`,inp(Q(q,10),'',D_(Q(q,10))),'나누는 수를 자연수로 만들려면 10배!',`${D_(Q(c*q,10))} ÷ ${c} = <b>${D_(Q(q,10))}</b>`)},
 ()=>{const c=R(2,9),k=R(2,9);const a=c*k;return prob(`${D_(Q(a,10))} ÷ ${D_(Q(c,10))}와 몫이 같은 것은?`,mc(`${a} ÷ ${c}`,[`${a} ÷ ${c*10}`,`${a*10} ÷ ${c}`,`${D_(Q(a,10))} ÷ ${c}`]),'두 수에 똑같이 10을 곱해요.',`둘 다 ×10 → <b>${a} ÷ ${c}</b>`)},
 ()=>{const c=R(2,9),k=R(2,9);return prob(`리본 ${D_(Q(c*k,10))} m를 ${D_(Q(c,10))} m씩 자르면 몇 도막이 될까요?`,inp(k,'도막'),'(전체) ÷ (한 도막)',`${D_(Q(c*k,10))} ÷ ${D_(Q(c,10))} = ${c*k} ÷ ${c} = <b>${k}도막</b>`)}
]);

T(21,6,'(자연수) ÷ (소수)',[
 {t:'똑같이 10배, 100배',b:`<div class="ex">6 ÷ 1.5 = 60 ÷ 15 = <b>4</b><br>9 ÷ 0.25 = 900 ÷ 25 = <b>36</b></div><p class="tip">자연수 뒤에 0을 붙이는 것을 잊지 마세요!</p>`}
],[
 ()=>{const c=R(2,9),k=R(2,20);const a=c*k;if(a%10===0||Math.random()<.3){}const num=Q(a,10);if(num.d!==1)return TOPICS[21].gens[0]();return prob(`${num.n} ÷ ${D_(Q(c,10))} = ?`,inp(k),'두 수에 똑같이 10을 곱해요.',`${num.n*10} ÷ ${c} = <b>${k}</b>`)},
 ()=>{const c=pick([5,15,25,35,45,75,12,24]),k=R(2,12);const a=Q(c*k,10);if(a.d!==1)return TOPICS[21].gens[1]();return prob(`${a.n} ÷ ${D_(Q(c,10))} = ?`,inp(k),'×10 하면 자연수끼리의 나눗셈!',`${a.n*10} ÷ ${c} = <b>${k}</b>`)},
 ()=>{const c=pick([25,75,125,5,4]),k=R(2,12);const a=Q(c*k,100);if(a.d!==1)return TOPICS[21].gens[2]();return prob(`${a.n} ÷ ${D_(Q(c,100))} = ?`,inp(k),'×100 해요.',`${a.n*100} ÷ ${c} = <b>${k}</b>`)},
 ()=>{const c=pick([5,15,25]),k=R(2,10);const a=Q(c*k,10);if(a.d!==1)return TOPICS[21].gens[3]();return prob(`밀가루 ${a.n} kg을 한 봉지에 ${D_(Q(c,10))} kg씩 나누어 담으면 몇 봉지가 될까요?`,inp(k,'봉지'),'(전체) ÷ (한 봉지)',`${a.n} ÷ ${D_(Q(c,10))} = ${a.n*10} ÷ ${c} = <b>${k}봉지</b>`)}
]);

function roundQ(q,k){const p=10**k;const v=q.n*p/q.d;return Q(Math.round(v+1e-9),p)}
T(22,6,'나눗셈의 몫 구하기',[
 {t:'몫을 반올림하기',b:`<p>몫이 나누어떨어지지 않으면 <b>반올림</b>해서 나타내요.</p><div class="ex">10 ÷ 3 = 3.333…<br>소수 첫째 자리까지 → 3.3<br>소수 둘째 자리까지 → 3.33</div><p class="tip">바로 다음 자리가 5 이상이면 올리고, 4 이하면 버려요.</p>`},
 {t:'나누어 주고 남는 양',b:`<div class="ex">끈 14.5 m를 3 m씩 자르면?<br>14.5 − 3 − 3 − 3 − 3 = 2.5<br>→ <b>4도막</b>, 남는 끈 <b>2.5 m</b></div><p class="tip">몫은 자연수까지만 구해요.</p>`}
],[
 ()=>{let a,c;do{a=R(5,40);c=pick([3,6,7,9,11])}while(a%c===0);const r=roundQ(Q(a,c),1);return prob(`${a} ÷ ${c}의 몫을 반올림하여 <b>소수 첫째 자리</b>까지 나타내세요.`,inp(r,'',D_(r)),'소수 둘째 자리까지 구한 뒤 반올림해요.',`${a} ÷ ${c} = ${(a/c).toFixed(3)}…<br>→ <b>${D_(r)}</b>`)},
 ()=>{let a,c;do{a=R(5,40);c=pick([3,6,7,9,11])}while(a%c===0);const r=roundQ(Q(a,c),2);return prob(`${a} ÷ ${c}의 몫을 반올림하여 <b>소수 둘째 자리</b>까지 나타내세요.`,inp(r,'',D_(r)),'소수 셋째 자리에서 반올림해요.',`${a} ÷ ${c} = ${(a/c).toFixed(4)}…<br>→ <b>${D_(r)}</b>`)},
 ()=>{const c=R(2,6);const k=R(2,9);const rem=R(1,c*10-1)/10;const tot=Math.round((c*k+rem)*10)/10;if(rem>=c)return TOPICS[22].gens[2]();return prob(`끈 ${tot} m를 ${c} m씩 자르면 몇 도막까지 자를 수 있을까요?`,inp(k,'도막'),'몫을 자연수까지만 구해요.',`${tot} ÷ ${c} = ${k} … ${rem}<br>→ <b>${k}도막</b>`)},
 ()=>{const c=R(2,6);const k=R(2,9);const r10=R(1,c*10-1);const rem=r10/10;const tot=(c*k*10+r10)/10;return prob(`쌀 ${tot} kg을 한 봉지에 ${c} kg씩 담으면, 담고 남는 쌀은 몇 kg일까요?`,inp(Q(r10,10),'kg',D_(Q(r10,10))),`${c} kg씩 몇 봉지 담을 수 있는지 먼저 구해요.`,`${tot} − ${c} × ${k} = <b>${D_(Q(r10,10))} kg</b>`)}
]);

const hmSum=hm=>hm.flat().reduce((a,b2)=>a+b2,0);
T(23,7,'쌓기나무의 개수 구하기',[
 {t:'보이지 않는 쌓기나무',b:`<p>쌓은 모양만 보면 뒤에 숨은 쌓기나무를 알 수 없어요. 그래서 <b>위에서 본 모양</b>을 함께 봐요.</p>${isoFig([[2,1],[1,1]])}`},
 {t:'위에서 본 모양에 수 쓰기',b:`<p>위에서 본 모양의 각 칸에 <mark>그 자리에 쌓인 개수</mark>를 써요.</p>${gridView([[1,1],[1,1]],[[2,1],[1,1]])}<div class="ex">2 + 1 + 1 + 1 = <b>5개</b></div>`},
 {t:'층별로 세기',b:`<p>1층, 2층, 3층에 놓인 개수를 각각 세어 더해도 돼요.</p><div class="ex">1층: 위에서 본 모양의 칸 수<br>2층: 2 이상 적힌 칸 수<br>3층: 3 이상 적힌 칸 수</div>`}
],[
 ()=>{const hm=randHM();const t=hmSum(hm);return prob('쌓기나무로 쌓은 모양과 위에서 본 모양(수는 쌓인 개수)이에요. 쌓기나무는 모두 몇 개일까요?<div class="row2">'+'<div>'+isoFig(hm)+'</div><div>'+gridView(viewsOf(hm).top,hm.map(r=>r.map(h=>h||'')))+'<div class="cap">위에서 본 모양</div></div></div>',inp(t,'개'),'칸에 적힌 수를 모두 더해요.',`${hm.flat().filter(x=>x).join(' + ')} = <b>${t}개</b>`)},
 ()=>{const hm=randHM();const L=R(1,Math.max(...hm.flat()));const cnt=hm.flat().filter(h=>h>=L).length;return prob(`위에서 본 모양에 쌓인 개수를 적었어요. <b>${L}층</b>에 있는 쌓기나무는 몇 개일까요?<div class="fig">${gridView(viewsOf(hm).top,hm.map(r=>r.map(h=>h||'')))}</div>`,inp(cnt,'개'),`${L} 이상인 칸의 수를 세어요.`,`${L} 이상 적힌 칸: <b>${cnt}개</b>`)},
 ()=>{const C=R(2,4);const hs=Array.from({length:C},()=>R(1,3));const hm=[hs];return prob('쌓기나무로 쌓은 모양이에요. (뒤에 숨은 쌓기나무는 없어요) 모두 몇 개일까요?',inp(sum(hs),'개'),'한 줄씩 높이를 세어 더해요.',`${hs.join(' + ')} = <b>${sum(hs)}개</b>`,isoFig(hm))},
 ()=>{const hm=randHM();const t=hmSum(hm);const box=hm.length*hm[0].length*Math.max(...hm.flat());return prob(`위에서 본 모양에 쌓인 개수를 적었어요. 이 모양을 가장 작은 직육면체로 만들려면 쌓기나무가 몇 개 더 필요할까요?<div class="fig">${gridView(hm.map(r=>r.map(()=>1)),hm.map(r=>r.map(h=>h)))}</div>`,inp(box-t,'개'),`직육면체: ${hm[0].length} × ${hm.length} × ${Math.max(...hm.flat())}`,`직육면체: ${box}개, 지금: ${t}개 → <b>${box-t}개</b>`)}
]);

function viewMC(hm,kind){const V=viewsOf(hm);const tgt=V[kind];const svg=g=>gridView(g);const cands=[V.top,V.front,V.side,V.front.map(r=>r.slice().reverse()),V.side.map(r=>r.slice().reverse())];const seen=new Set([JSON.stringify(tgt)]);const wr=[];for(const c of cands){const k=JSON.stringify(c);if(!seen.has(k)){seen.add(k);wr.push(svg(c))}}
 let tries=0;while(wr.length<3&&tries<30){tries++;const g=tgt.map(r=>r.slice());const rr=R(0,g.length-1),cc=R(0,g[0].length-1);g[rr][cc]=1-g[rr][cc];const k=JSON.stringify(g);if(!seen.has(k)&&g.flat().some(x=>x)){seen.add(k);wr.push(svg(g))}}
 return mc(svg(tgt),wr)}
T(24,7,'위, 앞, 옆에서 본 모양',[
 {t:'세 방향에서 보기',b:`<p>쌓기나무 모양을 <b>위</b>, <b>앞</b>, <b>옆</b>에서 보면 서로 다른 모양이 보여요.</p>${isoFig([[1,2],[1,1]])}<div class="row2"><div>${gridView([[1,1],[1,1]])}<div class="cap">위</div></div><div>${gridView([[0,1],[1,1]])}<div class="cap">앞</div></div></div>`},
 {t:'앞에서 본 모양 그리는 법',b:`<p>왼쪽 줄부터 차례로, 그 줄에서 <mark>가장 높이 쌓인 개수</mark>만큼 칸을 그려요.</p><p class="tip">옆에서 본 모양도 같은 방법! 각 줄에서 가장 높은 개수만 보여요.</p>`},

],[
 ()=>{const hm=randHM();return prob(`쌓기나무 모양을 <b>앞</b>에서 본 모양은? (위에서 본 모양의 수는 쌓인 개수, 아래쪽이 앞)<div class="fig">${gridView(viewsOf(hm).top,hm.map(r=>r.map(h=>h||'')))}</div>`,viewMC(hm,'front'),'왼쪽 줄부터 각 세로줄에서 가장 큰 수를 찾아요.',`각 줄에서 가장 높은 개수: ${viewsOf(hm).fh.join(', ')}<br>→ 그 높이만큼 쌓인 모양`)},
 ()=>{const hm=randHM();return prob(`쌓기나무 모양을 <b>오른쪽 옆</b>에서 본 모양은? (위에서 본 모양의 수는 쌓인 개수, 아래쪽이 앞)<div class="fig">${gridView(viewsOf(hm).top,hm.map(r=>r.map(h=>h||'')))}</div>`,viewMC(hm,'side'),'오른쪽에서 보면 앞쪽이 오른쪽에 보여요. 각 가로줄에서 가장 큰 수!',`뒤에서부터 각 가로줄의 가장 높은 개수: ${viewsOf(hm).sh.join(', ')}`)},
 ()=>{const hm=randHM();return prob(`쌓기나무로 쌓은 모양을 <b>위</b>에서 본 모양은?`,viewMC(hm,'top'),'쌓기나무가 놓인 바닥 자리를 생각해요.','바닥에 놓인 자리를 그대로 그린 모양이에요.',isoFig(hm))},
 ()=>{const hm=randHM();const fh=viewsOf(hm).fh;return prob(`위에서 본 모양에 쌓인 개수를 적었어요. 앞에서 보았을 때 가장 높은 곳은 몇 층일까요?<div class="fig">${gridView(viewsOf(hm).top,hm.map(r=>r.map(h=>h||'')))}</div>`,inp(Math.max(...fh),'층'),'가장 큰 수를 찾아요.',`<b>${Math.max(...fh)}층</b>`)}
]);

T(25,8,'비의 성질 알아보기',[
 {t:'전항과 후항',b:`<div class="ex big-ex">3 : 5</div><p>기호 : 앞에 있는 3을 <b>전항</b>, 뒤에 있는 5를 <b>후항</b>이라고 해요.</p>`},
 {t:'비의 성질',b:`<ol class="big"><li>전항과 후항에 <b>0이 아닌 같은 수를 곱해도</b> 비율은 같아요.</li><li>전항과 후항을 <b>0이 아닌 같은 수로 나누어도</b> 비율은 같아요.</li></ol><div class="ex">2 : 3 = 4 : 6 = 6 : 9 (×2, ×3)<br>12 : 8 = 3 : 2 (÷4)</div>`}
],[
 ()=>{let a,c;do{a=R(1,20);c=R(1,20)}while(a===c);const ask=Math.random()<.5;return prob(`비 ${a} : ${c}에서 <b>${ask?'전항':'후항'}</b>은?`,inp(ask?a:c),'기호 : 앞이 전항, 뒤가 후항',`<b>${ask?a:c}</b>`)},
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c||gcd(a,c)!==1);const k=R(2,6);const hide=Math.random()<.5;return prob(`□에 알맞은 수는?<div class="big-ex">${a} : ${c} = ${hide?'□':a*k} : ${hide?c*k:'□'}</div>`,inp(hide?a*k:c*k),'전항과 후항에 같은 수를 곱해요.',`× ${k} → ${a*k} : ${c*k} → □ = <b>${hide?a*k:c*k}</b>`)},
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c||gcd(a,c)!==1);const k=R(2,6);return prob(`□에 알맞은 수는?<div class="big-ex">${a*k} : ${c*k} = ${a} : □</div>`,inp(c),'전항과 후항을 같은 수로 나눠요.',`÷ ${k} → <b>${c}</b>`)},
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c||gcd(a,c)!==1);const ok=[`${a*2} : ${c*2}`,`${a*3} : ${c*3}`,`${a*5} : ${c*5}`];const bad=`${a+2} : ${c+2}`;return prob(`${a} : ${c}와 비율이 <b>다른</b> 것은?`,mc(bad,ok),'더하면 비율이 달라져요. 곱하거나 나눠야 해요.',`${bad}는 전항·후항에 2를 <b>더한</b> 것이라 비율이 달라요.`)}
]);

T(26,8,'간단한 자연수의 비로 나타내기',[
 {t:'자연수의 비',b:`<p>전항과 후항을 <b>최대공약수</b>로 나눠요.</p><div class="ex">12 : 18 → ÷6 → <b>2 : 3</b></div>`},
 {t:'소수의 비',b:`<p>10, 100 …을 곱해 자연수로 만들어요.</p><div class="ex">0.4 : 0.6 → ×10 → 4 : 6 → ÷2 → <b>2 : 3</b></div>`},
 {t:'분수의 비',b:`<p>두 분모의 <b>최소공배수</b>를 곱해요.</p><div class="ex">${fr(1,2)} : ${fr(1,3)} → ×6 → <b>3 : 2</b></div><div class="ex">0.5 : ${fr(1,4)} → ${fr(1,2)} : ${fr(1,4)} → ×4 → <b>2 : 1</b></div>`}
],[
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c||gcd(a,c)!==1);const k=R(2,9);return prob(`${a*k} : ${c*k}를 가장 간단한 자연수의 비로 나타내면?`,mc(`${a} : ${c}`,[`${c} : ${a}`,`${a*2} : ${c*2}`,`${a+1} : ${c+1}`]),'최대공약수로 나눠요.',`÷ ${k} → <b>${a} : ${c}</b>`)},
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c||gcd(a,c)!==1);const k=R(1,4);return prob(`${D_(Q(a*k,10))} : ${D_(Q(c*k,10))}를 가장 간단한 자연수의 비로 나타내면?`,mc(`${a} : ${c}`,[`${c} : ${a}`,`${a*k} : ${c*k*10}`,`${a*10} : ${c}`].filter(x=>x!==`${a} : ${c}`)),'10을 곱해 자연수로 만들어요.',`×10 → ${a*k} : ${c*k}${k>1?` → ÷${k} → `:' → '}<b>${a} : ${c}</b>`)},
 ()=>{let p,q;do{p=R(2,6);q=R(2,6)}while(p===q);const L=lcm(p,q);const a=L/p,c=L/q;const g=gcd(a,c);return prob(`${fr(1,p)} : ${fr(1,q)}를 가장 간단한 자연수의 비로 나타내면?`,mc(`${a/g} : ${c/g}`,[`${p} : ${q}`,`${c/g} : ${a/g}`,`1 : ${L}`,`${p*q} : 1`]),'두 분모의 최소공배수를 곱해요.',`×${L} → ${g>1?`${a} : ${c} → ÷${g} → `:''}<b>${a/g} : ${c/g}</b>`)},
 ()=>{const opts=[[5,fr(1,2),'1 : 1','×2 → 1 : 1'],[4,fr(1,5),'2 : 1','0.4 = 2/5 → ×5 → 2 : 1'],[2,fr(3,5),'1 : 3','0.2 = 1/5 → ×5 → 1 : 3'],[6,fr(3,10),'2 : 1','×10 → 6 : 3 → 2 : 1']];const o=pick(opts);return prob(`0.${o[0]} : ${o[1]}를 가장 간단한 자연수의 비로 나타내면?`,mc(o[2],['1 : 2','3 : 1','2 : 5','5 : 2'].filter(x=>x!==o[2])),'소수를 분수로 바꾸거나 분수를 소수로 바꿔 통일해요.',`${o[3].replace(/→ ([^→]*)$/,'→ <b>$1</b>')}`)}
]);

T(27,8,'비례식의 성질 알아보기',[
 {t:'비례식',b:`<p>비율이 같은 두 비를 등호로 나타낸 식이에요.</p><div class="ex big-ex">2 : 3 = 4 : 6</div><p>바깥쪽 2와 6은 <b>외항</b>, 안쪽 3과 4는 <b>내항</b></p>`},
 {t:'비례식의 성질',b:`<div class="ex big-ex">(외항의 곱) = (내항의 곱)</div><div class="ex">2 × 6 = 12, 3 × 4 = 12</div><div class="ex steps">3 : 4 = □ : 20<br>3 × 20 = 4 × □<br>60 = 4 × □ → □ = <b>15</b></div>`}
],[
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c);const k=R(2,8);const pos=R(0,3);const vals=[a,c,a*k,c*k];const ans=vals[pos];const disp=vals.map((x,i)=>i===pos?'□':x);return prob(`비례식에서 □에 알맞은 수는?<div class="big-ex">${disp[0]} : ${disp[1]} = ${disp[2]} : ${disp[3]}</div>`,inp(ans),'외항의 곱 = 내항의 곱',`${pos===0||pos===3?'외항':'내항'}에 □ → ${disp[0]} × ${disp[3]} = ${disp[1]} × ${disp[2]}<br>□ = <b>${ans}</b>`)},
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c);const k=R(2,6);const ask=Math.random()<.5;return prob(`비례식 ${a} : ${c} = ${a*k} : ${c*k}에서 <b>${ask?'외항':'내항'}</b>을 모두 고르면?`,mc(ask?`${a}, ${c*k}`:`${c}, ${a*k}`,[ask?`${c}, ${a*k}`:`${a}, ${c*k}`,`${a}, ${c}`,`${a*k}, ${c*k}`]),'바깥쪽 두 수가 외항, 안쪽 두 수가 내항',`외항: ${a}, ${c*k} / 내항: ${c}, ${a*k}`)},
 ()=>{let a,c;do{a=R(1,9);c=R(1,9)}while(a===c||gcd(a,c)!==1);const k=R(2,5);const ok=`${a} : ${c} = ${a*k} : ${c*k}`;return prob('다음 중 옳은 비례식은?',mc(ok,[`${a} : ${c} = ${c*k} : ${a*k}`,`${a} : ${c} = ${a+k} : ${c+k}`,`${a} : ${c} = ${a*k} : ${c*(k+1)}`]),'외항의 곱과 내항의 곱이 같은지 확인해요.',`${a} × ${c*k} = ${a*c*k}, ${c} × ${a*k} = ${a*c*k} ✔`)},
 ()=>{let a,c;do{a=R(1,5);c=R(2,6)}while(a===c||gcd(a,c)!==1);const k=R(2,8);return prob(`밀가루와 설탕을 ${a} : ${c}로 섞어요. 설탕을 ${c*k}컵 넣으면 밀가루는 몇 컵 넣어야 할까요?`,inp(a*k,'컵'),`${a} : ${c} = □ : ${c*k}`,`${a} × ${c*k} = ${c} × □ → □ = <b>${a*k}컵</b>`)}
]);

T(28,8,'비례배분',[
 {t:'비례배분이란?',b:`<p>전체를 주어진 비로 나누는 것이에요.</p><div class="ex steps">사탕 20개를 가 : 나 = 2 : 3으로 나누면<br>가: 20 × ${fsx(2,'2 + 3')} = 20 × ${fr(2,5)} = <b>8개</b><br>나: 20 × ${fsx(3,'2 + 3')} = 20 × ${fr(3,5)} = <b>12개</b></div><p class="tip">두 결과를 더하면 전체(20)가 돼야 해요.</p>`}
],[
 ()=>{let a,c;do{a=R(1,7);c=R(1,7)}while(a===c||gcd(a,c)!==1);const t=(a+c)*R(2,12);const ask=Math.random()<.5;return prob(`${t}을(를) ${a} : ${c}로 나눌 때 <b>${ask?'앞':'뒤'}</b>의 몫은?`,inp(ask?t*a/(a+c):t*c/(a+c)),`전체 × ${ask?a:c}/(${a} + ${c})`,`${t} × ${fsx(ask?a:c,a+c)} = <b>${ask?t*a/(a+c):t*c/(a+c)}</b>`)},
 ()=>{let a,c;do{a=R(1,5);c=R(1,5)}while(a===c||gcd(a,c)!==1);const t=(a+c)*R(2,10);return prob(`색종이 ${t}장을 형과 동생이 ${a} : ${c}로 나누어 가지려고 해요. 형은 몇 장을 가질까요?`,inp(t*a/(a+c),'장'),`형의 몫 = 전체 × ${fsx(a,a+c)}`,`${t} × ${fsx(a,a+c)} = <b>${t*a/(a+c)}장</b>`)},
 ()=>{let a,c;do{a=R(1,5);c=R(1,5)}while(a===c||gcd(a,c)!==1);const t=(a+c)*R(1,10)*1000;return prob(`용돈 ${t.toLocaleString()}원을 언니와 나가 ${a} : ${c}로 나누면 나는 얼마를 받을까요?`,inp(t*c/(a+c),'원'),`나의 몫 = 전체 × ${fsx(c,a+c)}`,`${t} × ${fsx(c,a+c)} = <b>${(t*c/(a+c)).toLocaleString()}원</b>`)},
 ()=>{let a,c;do{a=R(1,5);c=R(1,5)}while(a===c||gcd(a,c)!==1);const k=R(2,9);return prob(`어떤 수를 ${a} : ${c}로 나누었더니 앞의 몫이 ${a*k}였어요. 어떤 수는?`,inp((a+c)*k),'한 칸의 크기를 먼저 구해요.',`한 칸: ${a*k} ÷ ${a} = ${k}<br>전체: ${k} × (${a} + ${c}) = <b>${(a+c)*k}</b>`)}
]);

T(29,9,'원주율',[
 {t:'원주와 원주율',b:`<p>원의 둘레를 <b>원주</b>라고 해요. 원주는 지름의 약 3.14배예요.</p><div class="ex big-ex">(원주율) = (원주) ÷ (지름) ≈ 3.14</div>${circFig('지름',true)}`},
 {t:'원주 구하기',b:`<div class="ex big-ex">(원주) = (지름) × 3.14</div><div class="ex">지름 10 cm → 10 × 3.14 = <b>31.4 cm</b><br>반지름 5 cm → 지름 10 cm → 31.4 cm</div><p class="tip">반지름이 주어지면 2배 해서 지름부터!</p>`},
 {t:'지름 구하기',b:`<div class="ex">(지름) = (원주) ÷ 3.14<br>원주 62.8 cm → 62.8 ÷ 3.14 = <b>20 cm</b></div>`}
],[
 ()=>{const d=R(2,30);return prob(`지름이 ${d} cm인 원의 원주는? (원주율 3.14)`,inp(Q(d*314,100),'cm',D_(Q(d*314,100))),'지름 × 3.14',`${d} × 3.14 = <b>${D_(Q(d*314,100))} cm</b>`,circFig(d+' cm',true))},
 ()=>{const r=R(2,15);return prob(`반지름이 ${r} cm인 원의 원주는? (원주율 3.14)`,inp(Q(2*r*314,100),'cm',D_(Q(2*r*314,100))),'반지름 × 2 = 지름',`${r} × 2 × 3.14 = <b>${D_(Q(2*r*314,100))} cm</b>`,circFig(r+' cm'))},
 ()=>{const d=R(2,30);return prob(`원주가 ${D_(Q(d*314,100))} cm인 원의 지름은? (원주율 3.14)`,inp(d,'cm'),'원주 ÷ 3.14',`${D_(Q(d*314,100))} ÷ 3.14 = <b>${d} cm</b>`)},
 ()=>prob('원주율에 대한 설명으로 옳은 것은?',mc('원의 크기와 상관없이 원주율은 일정하다.',['원이 클수록 원주율이 커진다.','원주율은 지름 ÷ 원주이다.','원주율은 정확히 3이다.']),'원주 ÷ 지름은 어느 원이든 같아요.','원주율(원주 ÷ 지름)은 원의 크기와 상관없이 약 3.14로 일정해요.'),
 ()=>{const d=pick([50,60,40,70]);const n=R(2,5);return prob(`지름이 ${d} cm인 바퀴가 ${n}바퀴 굴러간 거리는 몇 cm일까요? (원주율 3.14)`,inp(Q(d*314*n,100),'cm',D_(Q(d*314*n,100))),'한 바퀴 = 원주',`${d} × 3.14 × ${n} = <b>${D_(Q(d*314*n,100))} cm</b>`)}
]);

T(30,9,'원의 넓이 구하기',[
 {t:'원의 넓이',b:`<p>원을 잘게 잘라 붙이면 직사각형에 가까워져요. 가로는 원주의 ${fr(1,2)}, 세로는 반지름!</p><div class="ex big-ex">(원의 넓이) = (반지름) × (반지름) × 3.14</div><div class="ex">반지름 10 cm → 10 × 10 × 3.14 = <b>314 cm²</b></div>`},
 {t:'지름이 주어질 때',b:`<div class="ex">지름 8 cm → 반지름 4 cm<br>4 × 4 × 3.14 = <b>50.24 cm²</b></div><p class="tip">지름이 나오면 꼭 반으로 나눠서 반지름부터!</p>`}
],[
 ()=>{const r=R(1,15);return prob(`반지름이 ${r} cm인 원의 넓이는? (원주율 3.14)`,inp(Q(r*r*314,100),'cm²',D_(Q(r*r*314,100))),'반지름 × 반지름 × 3.14',`${r} × ${r} × 3.14 = <b>${D_(Q(r*r*314,100))} cm²</b>`,circFig(r+' cm'))},
 ()=>{const r=R(1,12);return prob(`지름이 ${2*r} cm인 원의 넓이는? (원주율 3.14)`,inp(Q(r*r*314,100),'cm²',D_(Q(r*r*314,100))),'지름 ÷ 2 = 반지름',`반지름 ${r} cm → ${r} × ${r} × 3.14 = <b>${D_(Q(r*r*314,100))} cm²</b>`,circFig(2*r+' cm',true))},
 ()=>{const r=R(1,12);return prob(`넓이가 ${D_(Q(r*r*314,100))} cm²인 원의 반지름은? (원주율 3.14)`,inp(r,'cm'),'넓이 ÷ 3.14 = 반지름 × 반지름',`${D_(Q(r*r*314,100))} ÷ 3.14 = ${r*r} = ${r} × ${r} → <b>${r} cm</b>`)},
 ()=>{const r=pick([2,4,6,8,10]);return prob(`반지름이 ${r} cm인 <b>반원</b>의 넓이는? (원주율 3.14)`,inp(Q(r*r*314,200),'cm²',D_(Q(r*r*314,200))),'원의 넓이의 반',`${r} × ${r} × 3.14 ÷ 2 = <b>${D_(Q(r*r*314,200))} cm²</b>`)}
]);

T(31,9,'원기둥',[
 {t:'원기둥',b:`${cylFig('','')}<ul class="big"><li><b>밑면</b>: 서로 평행하고 합동인 두 원</li><li><b>옆면</b>: 두 밑면과 만나는 <mark>굽은 면</mark></li><li><b>높이</b>: 두 밑면에 수직인 선분의 길이</li></ul>`},
 {t:'원기둥의 전개도',b:`<p>펼치면 원 2개와 <b>직사각형</b> 1개!</p><div class="ex">직사각형의 가로 = 밑면의 둘레 (지름 × 3.14)<br>직사각형의 세로 = 원기둥의 높이</div>`},
 {t:'각기둥과 비교',b:`${tableHTML(['','원기둥','각기둥'],[['밑면 모양','원','다각형'],['옆면','굽은 면','직사각형(평평)'],['꼭짓점','없음','있음']])}`}
],[
 ()=>{const r=R(1,10),h=R(2,15);return prob(`밑면의 반지름이 ${r} cm, 높이가 ${h} cm인 원기둥의 전개도에서 옆면의 <b>가로</b> 길이는? (원주율 3.14)`,inp(Q(2*r*314,100),'cm',D_(Q(2*r*314,100))),'옆면의 가로 = 밑면의 둘레',`${2*r} × 3.14 = <b>${D_(Q(2*r*314,100))} cm</b>`,cylFig(r+' cm',h+' cm'))},
 ()=>{const r=R(1,10),h=R(2,15);return prob(`밑면의 반지름이 ${r} cm, 높이가 ${h} cm인 원기둥의 전개도에서 옆면의 <b>세로</b> 길이는?`,inp(h,'cm'),'옆면의 세로 = 높이',`<b>${h} cm</b>`,cylFig(r+' cm',h+' cm'))},
 ()=>{const Tt=['원기둥의 두 밑면은 합동인 원이다.','원기둥의 옆면은 굽은 면이다.','원기둥에는 꼭짓점이 없다.','원기둥의 전개도에서 옆면은 직사각형이다.'];const Ff=[['원기둥의 밑면은 1개이다.','2개예요.'],['원기둥에는 꼭짓점이 2개 있다.','꼭짓점이 없어요.'],['원기둥의 옆면은 평평한 직사각형이다.','굽은 면이에요. 펼치면 직사각형이에요.'],['원기둥의 전개도에서 옆면은 원이다.','직사각형이에요.']];const f=pick(Ff);return prob('원기둥에 대한 설명으로 <b>옳지 않은</b> 것은?',mc(f[0],shuf(Tt).slice(0,3)),'밑면 2개, 굽은 옆면, 꼭짓점 없음',`“${f[0]}” → ${f[1]}`)},
 ()=>{const r=R(1,8),h=R(2,12);const w=2*r*314/100;return prob(`밑면의 반지름이 ${r} cm, 높이가 ${h} cm인 원기둥의 <b>옆면의 넓이</b>는? (원주율 3.14)`,inp(Q(2*r*314*h,100),'cm²',D_(Q(2*r*314*h,100))),'옆면 = (밑면의 둘레) × (높이)인 직사각형',`${D_(Q(2*r*314,100))} × ${h} = <b>${D_(Q(2*r*314*h,100))} cm²</b>`)}
]);

T(32,9,'원뿔과 구',[
 {t:'원뿔',b:`${cylFig('','',true,'')}<ul class="big"><li><b>밑면</b>: 원 1개</li><li><b>원뿔의 꼭짓점</b>: 뾰족한 점</li><li><b>모선</b>: 꼭짓점과 밑면 둘레의 한 점을 이은 선분 (무수히 많아요)</li><li><b>높이</b>: 꼭짓점에서 밑면에 수직인 선분의 길이</li></ul>`},
 {t:'구',b:`${sphereFig('반지름')}<p>공처럼 둥근 입체도형이에요.</p><ul class="big"><li><b>구의 중심</b>: 가장 안쪽의 점</li><li><b>구의 반지름</b>: 중심에서 겉면의 한 점까지의 거리</li></ul>`},
 {t:'비교하기',b:`${tableHTML(['','원기둥','원뿔','구'],[['밑면','2개','1개','없음'],['꼭짓점','없음','1개','없음'],['앞에서 본 모양','직사각형','삼각형','원']])}`}
],[
 ()=>{const opts=[['밑면이 1개이고 뾰족한 꼭짓점이 있는 입체도형','원뿔'],['공처럼 둥근 입체도형','구'],['서로 평행하고 합동인 두 원이 밑면인 입체도형','원기둥']];const o=pick(opts);return prob(`다음 설명에 알맞은 입체도형은?<div class="qbox">${o[0]}</div>`,mc(o[1],['원뿔','구','원기둥','각뿔'].filter(x=>x!==o[1])),'밑면의 개수와 꼭짓점을 떠올려요.',`<b>${o[1]}</b>`)},
 ()=>{const r=R(3,8),h=R(4,12),l=Math.round(Math.sqrt(r*r+h*h)*10)/10;const ask=Math.random()<.5;return prob(`원뿔에서 ${ask?'높이':'밑면의 반지름'}는 몇 cm일까요? (그림: 반지름 ${r} cm, 높이 ${h} cm, 모선 약 ${l} cm)`,inp(ask?h:r,'cm'),ask?'꼭짓점에서 밑면에 수직인 선분':'밑면 원의 반지름',`<b>${ask?h:r} cm</b>`,cylFig(r+' cm',h+' cm',true,l+' cm'))},
 ()=>{const r=R(2,15);const ask=Math.random()<.5;return prob(ask?`반지름이 ${r} cm인 구의 지름은?`:`지름이 ${2*r} cm인 구의 반지름은?`,inp(ask?2*r:r,'cm'),'지름 = 반지름 × 2',`<b>${ask?2*r:r} cm</b>`,sphereFig((ask?r:'?')+' cm'))},

 case 'hint':{const hb=document.getElementById('hintbox');if(hb){hb.hidden=false;el.remove()}break}
 case 'next':next();break;
 case 'quit':if(!quitArm){quitArm=true;el.textContent='정말 그만둘까요? 한 번 더 누르면 종료';el.classList.add('arm');setTimeout(()=>{quitArm=false;const q=document.getElementById('quitbtn');if(q){q.textContent='✕ 그만하기';q.classList.remove('arm')}},3000)}else{quitArm=false;clearInterval(TIMER);const back=S&&S.tid?{tid:S.tid}:null;S=null;back?go('topic',{tid:back.tid,tab:'quiz'}):go('home')}break;
 case 'ndel':{const id=el.dataset.id;if(delArm!==id){delArm=id;el.textContent='정말 지울까요?';el.classList.add('arm');setTimeout(()=>{if(delArm===id)delArm=null},3000)}else{D.wrong=D.wrong.filter(w=>w.id!==id);delArm=null;save();render()}break}
 case 'rename':{const v=document.getElementById('nm').value.trim();if(v){D.name=v;save();toast('이름을 바꿨어요');render()}break}
 case 'setname':{const v=(document.getElementById('nmfirst').value||'').trim()||'수학 탐험가';D.name=v;save();document.getElementById('namebox')?.remove();render();break}
 case 'reset':if(!resetArm){resetArm=true;el.textContent='정말 모든 기록을 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArm=false},4000)}else{resetArm=false;const snd=D.sound;D=clone(DEF);D.sound=snd;save();go('home')}break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nmfirst')document.querySelector('[data-act="setname"]')?.click();if(view==='run'&&S&&!S.answered&&cur().type==='choice'&&/^[1-5]$/.test(e.key)){const k=+e.key-1;if(k<cur().choices.length){const bt=document.querySelector(`.ch[data-i="${k}"]`);if(bt&&!bt.disabled)submit(k)}}});
render();

</script>
