<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>수학 퀘스트 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Jua&display=swap">
<style>
/* 레이아웃: 모눈 공책 위에 붙인 학습 카드. 상단 고정 바 + 960px 중앙 칼럼 */
:root{
 --paper:#F5F7FB; --gridl:#E2E8F1; --card:#FFFFFF; --card2:#F0F3F9; --ink:#1D2846; --ink-2:#4A5675; --ink-3:#8590AA; --line:#D3DAE6;
 --hl:#FFDD3C; --hl-soft:#FFF2A6; --ok:#0F9466; --ok-soft:#DCF4E9; --no:#DB3B33; --no-soft:#FDE3E1; --pen:#2857D6; --pen-soft:#E2EAFF;
 --p1:#EE6A33; --p2:#7656EE; --p3:#1795D3; --p4:#159F74; --p5:#D69A00; --p6:#D4447F; --p7:#3A68D6; --p8:#0E9AA0; --p9:#B5562E;
 --shadow:0 1px 0 rgba(29,40,70,.06),0 6px 18px -8px rgba(29,40,70,.25);
 --f-disp:'Jua','Gowun Dodum',system-ui,sans-serif; --f-body:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; --f-hand:'Gaegu','Gowun Dodum',cursive;
 --r:14px; --on-pen:#FFFFFF;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --paper:#11162A; --gridl:#1A2138; --card:#192037; --card2:#20283F; --ink:#E9EDF8; --ink-2:#B6BFD6; --ink-3:#7F8AA6; --line:#2C3654;
 --hl:#F0C928; --hl-soft:#4A4220; --ok:#3BCB93; --ok-soft:#173A2E; --no:#FF6B62; --no-soft:#46201F; --pen:#87A6FF; --pen-soft:#23305C;
 --p1:#FF8452; --p2:#9A80FF; --p3:#45B6EE; --p4:#3CC496; --p5:#F0B930; --p6:#F06BA1; --p7:#6E95FF; --p8:#2CC6CC; --p9:#E58357; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); --on-pen:#0E1326; color-scheme:dark}}
:root[data-theme="dark"]{
 --paper:#11162A; --gridl:#1A2138; --card:#192037; --card2:#20283F; --ink:#E9EDF8; --ink-2:#B6BFD6; --ink-3:#7F8AA6; --line:#2C3654;
 --hl:#F0C928; --hl-soft:#4A4220; --ok:#3BCB93; --ok-soft:#173A2E; --no:#FF6B62; --no-soft:#46201F; --pen:#87A6FF; --pen-soft:#23305C;
 --p1:#FF8452; --p2:#9A80FF; --p3:#45B6EE; --p4:#3CC496; --p5:#F0B930; --p6:#F06BA1; --p7:#6E95FF; --p8:#2CC6CC; --p9:#E58357; --shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px -10px rgba(0,0,0,.7); --on-pen:#0E1326; color-scheme:dark}
.p1{--pc:var(--p1)}.p2{--pc:var(--p2)}.p3{--pc:var(--p3)}.p4{--pc:var(--p4)}.p5{--pc:var(--p5)}.p6{--pc:var(--p6)}.p7{--pc:var(--p7)}.p8{--pc:var(--p8)}.p9{--pc:var(--p9)}
*{box-sizing:border-box}
body{background:var(--paper);background-image:linear-gradient(var(--gridl) 1px,transparent 1px),linear-gradient(90deg,var(--gridl) 1px,transparent 1px);background-size:24px 24px;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--pen);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
p{margin:.4em 0}
mark{background:linear-gradient(transparent 55%,var(--hl) 55%);color:inherit;padding:0 .1em}
.v{font-family:Georgia,'Times New Roman',serif;font-style:italic;font-size:1.05em}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.15;margin:0 .12em}
.fr>span:first-child{border-bottom:1.6px solid currentColor;padding:0 .18em}
.fr>span{display:block}
sup{font-size:.7em;line-height:0}
.cap{font-size:.85rem;color:var(--ink-3)}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:22px}

/* 상단바 */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1.5px solid var(--line)}
.logo{border:0;background:none;font-family:var(--f-disp);font-size:1.25rem;display:flex;align-items:baseline;gap:2px;padding:0;white-space:nowrap}
.logo b{font-weight:400;color:var(--pen)}
.logo span{font-size:.75rem;background:var(--ink);color:var(--card);border-radius:6px;padding:0 5px;margin-left:4px;transform:translateY(-3px)}
.lvbox{display:flex;align-items:center;gap:8px;flex:1;min-width:0;max-width:300px;margin-left:auto}
.lv{font-family:var(--f-disp);color:var(--pen);white-space:nowrap}
.xpbar{flex:1;height:10px;background:var(--card2);border-radius:99px;overflow:hidden;border:1px solid var(--line);min-width:40px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--pen),var(--p2));border-radius:99px;transition:width .5s}
.xpn{font-size:.75rem;color:var(--ink-3);font-variant-numeric:tabular-nums;white-space:nowrap}
.nbtn,.ibtn{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:4px 12px;font-size:.88rem;white-space:nowrap}
.nbtn b{display:inline-block;margin-left:5px;background:var(--no);color:#fff;border-radius:99px;padding:0 7px;font-size:.78rem}
@media (max-width:620px){.xpn,.ibtn[data-act="sound"]{display:none}.lvbox{max-width:none}.logo span{display:none}}
@media (max-width:420px){.ibtn{display:none}}

/* 버튼 */
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:9px 16px;font-family:var(--f-disp);font-size:1rem;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn.primary{background:var(--pen);color:var(--on-pen);border-color:var(--ink)}
.btn.big{font-size:1.15rem;padding:12px 22px}
.btn.small{font-size:.9rem;padding:5px 12px;box-shadow:0 2px 0 var(--ink)}
.btn.ghost{border-color:var(--line);box-shadow:none;background:transparent}
.btn.danger{color:var(--no)}
.btn:disabled{opacity:.45;box-shadow:none}
.btn.boss{background:var(--pc);color:#fff;font-size:.92rem;padding:7px 13px}
.back{align-self:flex-start;border:0;background:none;color:var(--ink-2);padding:4px 0;font-size:.95rem}
.back.arm{color:var(--no);font-weight:700}

/* 홈 */
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:22px;box-shadow:6px 6px 0 var(--hl)}
.hero h1{font-size:clamp(1.6rem,4.5vw,2.3rem)}
.hello{min-width:0}
.eyebrow{font-size:.82rem;letter-spacing:.08em;color:var(--pen);font-weight:700}
.hero-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.goal{display:flex;align-items:center;gap:12px;background:var(--card2);border-radius:16px;padding:12px 16px;align-self:start}
.g-h{font-family:var(--f-disp);font-size:1.1rem}.g-s{font-size:.86rem;color:var(--ink-2)}
.ring .rg-b{fill:none;stroke:var(--line);stroke-width:9}.ring .rg-f{fill:none;stroke:var(--ok);stroke-width:9;stroke-linecap:round;transition:stroke-dasharray .6s}
.ring .rg-t{font-family:var(--f-disp);font-size:22px;fill:var(--ink);text-anchor:middle}.ring .rg-s{font-size:11px;fill:var(--ink-3);text-anchor:middle}
@media (max-width:640px){.hero{grid-template-columns:1fr}}
.cont{display:flex;align-items:center;gap:14px;flex-wrap:wrap;text-align:left;border:2px dashed var(--pc);background:color-mix(in srgb,var(--pc) 10%,var(--card));border-radius:16px;padding:14px 18px}
.cont-l{font-size:.85rem;color:var(--pc);font-weight:700}
.cont-t{font-family:var(--f-disp);font-size:1.25rem;flex:1;min-width:0;display:flex;gap:8px;align-items:center}
.cont-a{font-family:var(--f-disp);color:var(--pc)}
.part{display:flex;flex-direction:column;gap:12px}
.part-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:3px solid var(--pc);padding-bottom:8px}
.pnum{font-family:var(--f-disp);color:var(--pc);font-size:.9rem;letter-spacing:.06em}
.part-h h2{font-size:1.6rem}.part-h p{color:var(--ink-3);font-size:.88rem;margin:0}
.part-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pstars{font-family:var(--f-disp);color:var(--p5)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:10px}
.tile{position:relative;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;column-gap:10px;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:12px;box-shadow:var(--shadow);transition:transform .12s,border-color .12s}
.tile:hover{transform:translateY(-2px);border-color:var(--pc)}
.tile .tn{grid-row:1/4;font-family:var(--f-disp);font-size:1.05rem;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,var(--card));color:var(--pc)}
.tile .tt{font-weight:700;line-height:1.3}
.tile.mast{border-color:var(--p5);background:color-mix(in srgb,var(--hl) 12%,var(--card))}
.tile.nexty{border:2px solid var(--pc)}
.tile.nexty::after{content:'추천';position:absolute;top:-9px;right:10px;background:var(--pc);color:#fff;font-size:.72rem;padding:0 8px;border-radius:99px}
.ts{font-size:.95rem;letter-spacing:1px}
.st{color:var(--line)}.st.on{color:var(--p5)}
.tmeta{display:flex;gap:6px;flex-wrap:wrap}
.chk{font-size:.72rem;color:var(--ok);background:var(--ok-soft);border-radius:6px;padding:0 6px}
.wn{font-size:.72rem;color:var(--no);background:var(--no-soft);border-radius:6px;padding:0 6px}
.cont .tn{font-family:var(--f-disp);color:var(--pc)}
.foot{color:var(--ink-3);font-size:.82rem;text-align:center}

/* 단원 */
.tophead{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:16px 20px 0;box-shadow:6px 6px 0 var(--pc);display:flex;flex-direction:column;gap:4px}
.crumb{font-size:.85rem;color:var(--pc);font-weight:700}
.tophead h1{font-size:clamp(1.5rem,4.5vw,2.1rem);display:flex;gap:12px;align-items:center}
.tnum{font-size:.8em;color:#fff;background:var(--pc);border-radius:12px;padding:0 10px}
.tstat{display:flex;gap:14px;flex-wrap:wrap;align-items:center;color:var(--ink-2);font-size:.88rem}
.tstat .st{font-size:1.1rem}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{border:0;background:none;padding:10px 14px;border-bottom:4px solid transparent;font-family:var(--f-disp);font-size:1.02rem;color:var(--ink-3);white-space:nowrap}
.tabs button.on{color:var(--ink);border-color:var(--pc)}
.lesson{display:flex;flex-direction:column;gap:14px}
.lcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:22px clamp(16px,4vw,32px);box-shadow:var(--shadow);min-width:0}
.lstep{font-size:.82rem;color:var(--pc,var(--pen));font-weight:700;letter-spacing:.05em}
.lcard h2{font-size:1.55rem;margin:4px 0 10px}
.lbody{font-size:1.08rem;max-width:68ch;display:flex;flex-direction:column;gap:10px}
.lbody p{margin:0}
.ex{background:var(--card2);border-left:5px solid var(--pc,var(--pen));border-radius:10px;padding:12px 16px;line-height:1.9}
.ex-h{font-weight:700;color:var(--ink-2);font-size:.92rem}
.big-ex{font-size:1.35rem;text-align:center;font-family:var(--f-body)}
.tip{background:var(--hl-soft);border-radius:10px;padding:8px 14px;font-size:.98rem}
.tip::before{content:'TIP ';font-family:var(--f-disp);color:var(--p5)}
ol.big,ul.big{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px}
span.ok{color:var(--ok);font-weight:700}span.no{color:var(--no);font-weight:700}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.row2>div{min-width:0;text-align:center}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.ladder{font-family:var(--f-body);font-size:1.15rem;display:inline-flex;flex-direction:column;gap:2px;background:var(--card2);padding:10px 18px;border-radius:10px;align-self:flex-start}
.ladder span{color:var(--pen);font-weight:700}
.ladder .last{padding-left:1.6em}
.tree{display:flex;flex-direction:column;align-items:center;gap:8px}
.tr-r{font-family:var(--f-disp);background:var(--pc,var(--pen));color:#fff;padding:2px 16px;border-radius:99px}
.tr-c{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
.tr-c>div{background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.tr-n{font-family:var(--f-disp)}.tr-s{font-size:.92rem;color:var(--ink-2)}
.tag-b,.tag-e{font-size:.6em;background:var(--pen-soft);color:var(--pen);border-radius:6px;padding:0 6px;vertical-align:middle}
.scale{display:flex;justify-content:center;align-items:center;gap:20px;font-size:1.6rem}
.pan{background:var(--card2);border:2px solid var(--ink);border-radius:0 0 40px 40px;padding:6px 26px}
.beam{font-size:2rem}
.shape-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.shape-row>div{display:flex;flex-direction:column;align-items:center;font-size:.85rem;background:var(--card2);border-radius:10px;padding:6px}
@media (max-width:480px){.shape-row{grid-template-columns:repeat(2,1fr)}}
.lnav{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:12px;height:12px;border-radius:99px;border:2px solid var(--ink-3);background:transparent;padding:0}
.dot.on{background:var(--pc,var(--pen));border-color:var(--pc,var(--pen));width:28px}
.dot.past{background:var(--ink-3)}
.panel{display:flex;flex-direction:column;gap:12px}
.pgrid{display:grid;grid-template-columns:1fr 1.2fr;gap:14px}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
.pcard{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.pcard.main{border:2px solid var(--ink)}
.pcard h2{font-size:1.5rem}.pcard h3{font-size:1.2rem}
.rules{margin:0;padding-left:1.2em;color:var(--ink-2)}
.types{display:flex;flex-direction:column;gap:8px}
.type{display:flex;gap:10px;align-items:center;text-align:left;background:var(--card2);border:1.5px solid transparent;border-radius:12px;padding:9px 12px;min-width:0}
.type:hover{border-color:var(--pc)}
.tyn{font-family:var(--f-disp);color:var(--pc);white-space:nowrap}
.tyq{font-size:.9rem;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.speedcard{align-items:center;text-align:center;max-width:520px;align-self:center;width:100%}
.bigrec{display:flex;align-items:baseline;gap:8px;color:var(--ink-2)}
.bigrec b{font-family:var(--f-disp);font-size:3rem;color:var(--pc);font-weight:400}

/* 표 */
.tbl-wrap{overflow-x:auto;max-width:100%}
.tbl{border-collapse:collapse;margin:6px auto;font-size:.98rem;background:var(--card);min-width:200px}
.tbl th,.tbl td{border:1.5px solid var(--line);padding:6px 12px;text-align:center}
.tbl td{white-space:nowrap}.tbl.stem td:last-child{white-space:normal}
.tbl th{background:var(--card2);font-weight:700}
.tbl.stem td:first-child{font-weight:700;width:60px}
.tbl.stem td:last-child{text-align:left;letter-spacing:.1em;min-width:160px}
.qbox{background:var(--card2);border-radius:10px;padding:10px 14px;margin-top:8px;font-size:1.05rem}
.numlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.numlist span{background:var(--card2);border:1.5px solid var(--line);border-radius:8px;padding:2px 12px;font-size:1.1rem;font-variant-numeric:tabular-nums}

/* 그림 */
.fig{display:flex;justify-content:center;margin:6px 0;overflow-x:auto}
.fig svg,.lbody svg{width:100%;height:auto;display:block;margin:0 auto}
.lbody .row2 svg{max-width:100%}
.s{stroke:var(--ink);stroke-width:2;fill:none;stroke-linejoin:round;stroke-linecap:round}
.s.thin{stroke-width:1.2;stroke:var(--ink-3)}
.s.grid{stroke:var(--line);stroke-width:1}
.s.dash{stroke-dasharray:5 4}
.s.acc{stroke:var(--pen)}
.s.wide{stroke-width:3.2}
.s.sec{fill:var(--hl-soft)}
.s.bar{fill:var(--pen-soft);stroke:var(--pen)}
.d{fill:var(--ink)}.d.acc{fill:var(--pen)}
.t{fill:var(--ink);font-size:15px;text-anchor:middle;dominant-baseline:middle;font-family:var(--f-body)}
.t.sm{font-size:13px}.t.xs{font-size:11px;fill:var(--ink-2)}.t.b{font-weight:700}.t.acc-t{fill:var(--pen)}
.it,.t.it{font-style:italic;font-family:Georgia,'Times New Roman',serif}

/* 문제 풀이 */
.run{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:12px 80px;display:flex;flex-direction:column;gap:14px}
.run-top{display:flex;align-items:center;gap:12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:8px 0;z-index:5;flex-wrap:wrap}
.prog{flex:1;height:12px;background:var(--card2);border:1.5px solid var(--line);border-radius:99px;overflow:hidden;min-width:80px}
.prog.ghostp{background:transparent;border-color:transparent}
.prog i{display:block;height:100%;background:var(--pc);transition:width .4s}
.rstat{display:flex;gap:8px;align-items:center;font-family:var(--f-disp)}
.sc{background:var(--card);border:1.5px solid var(--line);border-radius:99px;padding:2px 12px}
.combo{border-radius:99px;padding:2px 12px;background:var(--card2);color:var(--ink-3)}
.combo.hot{background:var(--p1);color:#fff;animation:pulse 1s infinite}
.timer{background:var(--ink);color:var(--card);border-radius:99px;padding:2px 14px;font-variant-numeric:tabular-nums;min-width:62px;text-align:center}
.timer.low{background:var(--no);animation:pulse .6s infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.qcard{background:var(--card);border:2px solid var(--ink);border-radius:20px;padding:20px clamp(16px,4vw,28px);box-shadow:6px 6px 0 var(--pc);display:flex;flex-direction:column;gap:14px;min-width:0}
.qmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ntag{font-size:.8rem;font-weight:700;color:var(--pc);background:color-mix(in srgb,var(--pc) 13%,var(--card));border-radius:8px;padding:2px 10px}
.q{font-size:1.2rem;line-height:1.75}
.big-ex{display:block;margin-top:6px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.svgch{grid-template-columns:repeat(2,1fr)}
@media (max-width:560px){.choices{grid-template-columns:1fr}.choices.svgch{grid-template-columns:1fr 1fr}}
.ch{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:1.1rem;min-height:56px;transition:border-color .1s,transform .1s}
.ch:hover:not(:disabled){border-color:var(--pen);transform:translateY(-1px)}
.ch .cn{font-family:var(--f-disp);color:var(--ink-3)}
.ch .cv{min-width:0}
.ch.wrong{border-color:var(--no);background:var(--no-soft);opacity:.8}
.ch.wrong .cv{text-decoration:line-through;text-decoration-color:var(--no)}

 {id:5,name:'삼각형과 사각형',sub:'이등변삼각형·외심·내심·사각형',col:'p5',boss:'삼각 요새'},
 {id:6,name:'닮음과 피타고라스',sub:'닮음·무게중심·피타고라스',col:'p6',boss:'거울 골렘'},

// ================= 기본 도구 =================
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;

const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a};

const isPrime=n=>{if(n<2)return false;for(let i=2;i*i<=n;i++)if(n%i===0)return false;return true};

const N=n=>(n<0?'−'+(-n):''+n);

const Q=(n,d=1)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
function frRaw(n,d){if(d===1)return N(n);return (n<0?'−':'')+`<span class="fr"><span>${Math.abs(n)}</span><span>${d}</span></span>`}

function Pfr(n,d=1){const q=Q(n,d);const s=frRaw(q.n,q.d);return q.n<0?'('+s+')':s}

const lin=(a,c,x='x')=>poly([[a,x],[c,'']]);

// 객관식 만들기: correct(문자열), wrongs(후보)
function mc(correct,wrongs,n=4){
  correct=String(correct);const seen=new Set([correct]);const ch=[correct];
  for(const w of wrongs){if(ch.length>=n)break;if(w==null)continue;const k=String(w);if(seen.has(k))continue;seen.add(k);ch.push(k)}

function inp(ans,unit='',show){
  if(typeof ans==='number')ans=Q(ans);
  if(ans&&ans.text)return{type:'input',accept:ans.text,show:ans.show||ans.text[0],unit};

}
function prob(q,spec,hint,ex,fig){return Object.assign({q,hint,ex,fig:fig||''},spec)}

function norm(s){return String(s).replace(/\s+/g,'').replace(/[−–—]/g,'-').replace(/×/g,'*').replace(/,/g,'').toLowerCase()}
function stripUnit(s){return s.replace(/(cm²|cm³|cm2|cm3|cm\^2|cm\^3|㎠|㎤|cm|개|°|도|명|원|분|초|시간|살|km|m|권|번|층|점|kg|g|회|마리|일|장|쪽|자루|송이|배)$/,'')}
function parseRat(s){
  const mm=String(s).replace(/[−–—]/g,'-').match(/^\s*(-?)(\d+)\s*(?:\s|과|와|\+)\s*(\d+)\s*\/\s*(\d+)\s*$/);
  if(mm&&+mm[4]){const w=+mm[2],n=+mm[3],d=+mm[4];return Q((mm[1]==='-'?-1:1)*(w*d+n),d)}

// ================= 그림(SVG) =================
const SV=(w,h,inner)=>`<svg viewBox="0 0 ${w} ${h}" style="max-width:${w}px" role="img">${inner}</svg>`;

function numberLine(min,max,pts=[],opt={}){
  const u=Math.min(46,520/(max-min));const W=u*(max-min)+60,H=opt.h||78,y=44;const X0=30;

  for(let i=min;i<=max;i++){const x=X0+(i-min)*u;s+=ln(x,y-6,x,y+6);if(opt.labels!==false)s+=tx(x,y+22,N(i),'t sm')}

function coordPlane(pts=[],r=5,opt={}){
  const u=24,S=(2*r+2)*u,c=S/2;let s='';
  for(let i=-r;i<=r;i++){s+=ln(c+i*u,u,c+i*u,S-u,'s grid');s+=ln(u,c+i*u,S-u,c+i*u,'s grid')}
  s+=ln(6,c,S-6,c)+arrowHead(S-6,c,'r')+ln(c,S-6,c,6)+arrowHead(c,6,'u');
  s+=tx(S-10,c+14,'x','t it')+tx(c+12,12,'y','t it')+tx(c-10,c+14,'O','t sm');
  for(let i=-r;i<=r;i++){if(!i)continue;s+=tx(c+i*u,c+14,N(i),'t xs')+tx(c-12,c-i*u,N(i),'t xs')}
  if(opt.lines)for(const L of opt.lines){s+=ln(c+L[0]*u,c-L[1]*u,c+L[2]*u,c-L[3]*u,'s acc')}
  for(const p of pts){s+=dot(c+p.x*u,c-p.y*u,'d acc',5);if(p.lab)s+=tx(c+p.x*u+(p.dx??12),c-p.y*u-(p.dy??12),p.lab,'t b')}
  return SV(S,S,s);
}
// 직육면체 ABCD-EFGH (윗면 ABCD)
const CUBE_V={A:[0,0,1],B:[1,0,1],C:[1,1,1],D:[0,1,1],E:[0,0,0],F:[1,0,0],G:[1,1,0],H:[0,1,0]};
const CUBE_E=['AB','BC','CD','DA','EF','FG','GH','HE','AE','BF','CG','DH'];
function cubeFig(highlight=[]){
  const pr=([x,y,z])=>[70+x*170+y*80,215-z*130-y*60];
  let s='';
  for(const e of CUBE_E){const p=pr(CUBE_V[e[0]]),q=pr(CUBE_V[e[1]]);const hid=e.includes('H');const hi=highlight.includes(e);s+=ln(p[0],p[1],q[0],q[1],'s'+(hid?' dash':'')+(hi?' acc wide':''))}
  const off={A:[-12,8],B:[8,14],C:[12,-6],D:[-12,-8],E:[-12,10],F:[8,14],G:[14,0],H:[-14,-4]};
  for(const k in CUBE_V){const p=pr(CUBE_V[k]);s+=tx(p[0]+off[k][0],p[1]+off[k][1],k,'t b')}
  return SV(340,240,s);
}
function edgeRel(e1,e2){
  if(e1===e2)return 'same';
  const d=e=>{const p=CUBE_V[e[0]],q=CUBE_V[e[1]];return[q[0]-p[0],q[1]-p[1],q[2]-p[2]]};
  const a=d(e1),c=d(e2);const cr=[a[1]*c[2]-a[2]*c[1],a[2]*c[0]-a[0]*c[2],a[0]*c[1]-a[1]*c[0]];
  if(!cr[0]&&!cr[1]&&!cr[2])return 'par';
  if(e1[0]===e2[0]||e1[0]===e2[1]||e1[1]===e2[0]||e1[1]===e2[1])return 'meet';
  return 'skew';
}
// 평행선과 한 직선 (theta: 오른쪽 위로 기울어진 각)
function paraFig(theta,labs={},opt={}){
  const yP=70,yQ=170,dx=100/Math.tan(rad(theta));const P=[200+dx/2,yP],Qp=[200-dx/2,yQ];
  const ext=60/Math.sin(rad(theta));const ux=Math.cos(rad(theta)),uy=-Math.sin(rad(theta));
  let s=ln(20,yP,380,yP)+ln(20,yQ,380,yQ);
  s+=ln(Qp[0]-ux*ext,Qp[1]-uy*ext,P[0]+ux*ext,P[1]+uy*ext);
  if(opt.parallel!==false){s+=tx(392,yP,v('l'),'t')+tx(392,yQ,v('m'),'t');s+=`<path d="M300,${yP-5} l8,5 l-8,5" class="s"/><path d="M300,${yQ-5} l8,5 l-8,5" class="s"/>`}
  else{s+=tx(392,yP,v('l'),'t')+tx(392,yQ,v('m'),'t')}
  const pos={ur:theta/2,ul:(theta+180)/2,ll:180+theta/2,lr:270+theta/2};
  for(const [pt,key] of [[P,'P'],[Qp,'Q']]){
    const L=labs[key]||{};for(const k in L){const a=rad(pos[k]);const rr=k==='ur'||k==='ll'?(theta<50?44:32):30;s+=tx(pt[0]+Math.cos(a)*rr,pt[1]-Math.sin(a)*rr,L[k],'t b acc-t')}
  }
  return SV(410,240,s);
}

    const a1=rad(all[i]),a2=rad(all[i+1]);const rr=24+i*3;

function crossFig(theta,labs){ // labs: [오른쪽, 위, 왼쪽, 아래]
  const O=[200,110];let s=ln(40,O[1],360,O[1]);const ux=Math.cos(rad(theta)),uy=Math.sin(rad(theta));

// 삼각형: 각 B, 각 C (도). labs={A,B,C} 각 표시, ext: C의 외각 라벨
function triFig(Bdeg,Cdeg,labs={},opt={}){
  const Bp=[60,190],Cp=[300,190];const tb=Math.tan(rad(Bdeg)),tc=Math.tan(rad(Cdeg));
  const xA=(Bp[0]*tb+Cp[0]*tc)/(tb+tc);const hA=(xA-Bp[0])*tb;let Ap=[xA,190-hA];
  const sc=Math.min(1,160/hA);if(sc<1){Ap=[xA,190-hA*sc]}
  let s=pg([Ap,Bp,Cp],'s');
  if(opt.ext)s+=ln(Cp[0],Cp[1],Cp[0]+70,Cp[1],'s dash');
  const n=opt.names||['A','B','C'];
  s+=tx(Ap[0],Ap[1]-12,n[0],'t b')+tx(Bp[0]-12,Bp[1]+10,n[1],'t b')+tx(Cp[0]+4,Cp[1]+16,n[2],'t b');
  const cen=[(Ap[0]+Bp[0]+Cp[0])/3,(Ap[1]+Bp[1]+Cp[1])/3];
  const at=(p,k)=>{const d=[cen[0]-p[0],cen[1]-p[1]];const L=Math.hypot(...d);return [p[0]+d[0]/L*k,p[1]+d[1]/L*k]};
  if(labs.A){const q=at(Ap,34);s+=tx(q[0],q[1],labs.A,'t b acc-t')}
  if(labs.B){const q=at(Bp,40);s+=tx(q[0],q[1],labs.B,'t b acc-t')}
  if(labs.C){const q=at(Cp,40);s+=tx(q[0],q[1],labs.C,'t b acc-t')}
  if(opt.ext)s+=tx(Cp[0]+38,Cp[1]-16,opt.ext,'t b acc-t');
  if(opt.side){for(const sd of opt.side){const [p,q,l]=sd;const P1={A:Ap,B:Bp,C:Cp}[p],P2={A:Ap,B:Bp,C:Cp}[q];const m=[(P1[0]+P2[0])/2,(P1[1]+P2[1])/2];const d=[m[0]-cen[0],m[1]-cen[1]];const L=Math.hypot(...d);s+=tx(m[0]+d[0]/L*16,m[1]+d[1]/L*16,l,'t sm')}}
  return SV(400,215,s);
}

function stemLeaf(data,unitNote){

T(1,1,'소수의 구분과 순환소수',[
 {t:'유한소수와 무한소수',b:`<p><b>유한소수</b>: 소수점 아래 0이 아닌 숫자가 <mark>유한 개</mark> → 0.5, 0.125</p><p><b>무한소수</b>: 소수점 아래 0이 아닌 숫자가 <mark>무한히</mark> 계속 → 0.333…, 3.1415…</p>`},
 {t:'순환소수와 순환마디',b:`<p>소수점 아래 어떤 자리부터 <b>같은 숫자 배열이 한없이 되풀이</b>되는 무한소수를 <b>순환소수</b>라고 해요.</p><p>되풀이되는 부분을 <b>순환마디</b>라고 해요.</p><div class="ex">0.2353535… → 순환마디 <b>35</b><br>1.4444… → 순환마디 <b>4</b></div>`},
 {t:'점으로 간단히 쓰기',b:`<p>순환마디의 <mark>처음과 끝 숫자 위에 점</mark>을 찍어요.</p><div class="ex big-ex">0.333… = 0.${dotted('3')}<br>0.2353535… = 0.2${dotted('35')}<br>0.142142… = 0.${dotted('142')}</div>`}
],[
 ()=>{const d=pick([2,3,4,5,6,7,8,9,11,12,15,16,20,25]);let n;do{n=R(1,d-1)}while(gcd(n,d)!==1);const fin=factor25(d)===1;const e=decExp(n,d);return prob(`분수 ${fr(n,d)}를 소수로 나타내면 어떤 소수일까요?`,mcFixed(['유한소수','무한소수'],fin?0:1),'직접 나눗셈을 해 보세요. 나머지가 0이 되나요?',`${fr(n,d)} = ${fin?'0.'+e.digs.join(''):ellip(0,e.digs.slice(0,e.start).join(''),e.digs.slice(e.start).join(''),2)} → <b>${fin?'유한소수':'무한소수'}</b>`)},
 ()=>{const pre=pick(['','1','2','3','']);let rep;do{rep=String(R(1,999)).slice(0,R(1,3))}while((rep.length>1&&new Set(rep).size===1)||(pre&&pre[pre.length-1]===rep[rep.length-1]));const ip=R(0,3);const ok=rep;const w=[rep+rep[0],rep.length>1?rep.slice(1)+rep[0]:rep+rep,pre+rep,rep.length>1?rep[0]:rep+'0'].filter(x=>x!==ok);
  return prob(`순환소수 ${ellip(ip,pre,rep)}의 순환마디는?`,mc(ok,w),'소수점 아래에서 처음으로 되풀이되기 시작하는 부분을 찾아요.',`${pre?`소수점 아래 ${pre.length+1}째 자리부터 `:''}${rep}이(가) 되풀이 → <b>${rep}</b>`)},
 ()=>{const pre=pick(['','1','4','']);let rep;do{rep=String(R(10,99))}while(rep[0]===rep[1]||(pre&&pre===rep[1]));const ip=R(0,2);const ok=repS(ip,pre,rep);const w=[`${ip}.${pre}${dotted(rep[0])}${rep[1]}`,`${ip}.${pre}${rep[0]}${dotted(rep[1])}`,pre?`${ip}.${dotted(pre+rep)}`:`${ip}.${dotted(rep+rep[0])}`];
  return prob(`${ellip(ip,pre,rep)}를 점을 찍어 바르게 나타낸 것은?`,mc(ok,w),'순환마디의 처음과 끝 숫자 위에 점!',`순환마디 ${rep} → <b>${ok}</b>`)},
 ()=>{const rep=String(R(100,999));if(new Set(rep).size<3)return TOPICS[1].gens[3]();const k=R(10,50);const dg=rep[(k-1)%3];return prob(`순환소수 0.${dotted(rep)}에서 소수점 아래 ${k}번째 자리의 숫자는?`,inp(+dg),'순환마디가 3자리씩 되풀이돼요. '+k+' ÷ 3의 나머지를 보세요.',`${k} ÷ 3 = ${Math.floor(k/3)} … ${k%3}<br>${k%3===0?'나머지 0 → 순환마디의 마지막 숫자':'나머지 '+k%3+' → 순환마디의 '+k%3+'번째 숫자'} → <b>${dg}</b>`)},
 ()=>{const ok=pick(['0.333…','1.272727…','0.4555…','2.010101…']);return prob('다음 중 <b>순환소수</b>인 것은?',mc(ok,['3.141592…','0.1010010001…','0.25','1.414213…']),'같은 배열이 규칙적으로 되풀이되는지 보세요.',`<b>${ok}</b>는 일정한 배열이 되풀이돼요. 원주율(3.1415…)이나 0.1010010001…은 되풀이되는 마디가 없어요.`)}
]);

T(2,1,'유한소수로 나타낼 수 있는 분수',[
 {t:'유한소수가 되는 분수',b:`<p>분수를 <b>기약분수</b>로 만든 뒤 분모를 소인수분해했을 때</p><ul class="big"><li>소인수가 <mark>2나 5뿐</mark> → 유한소수</li><li>2, 5 이외의 소인수가 있음 → 순환소수</li></ul><div class="ex">${fr(3,20)} : 20 = 2<sup>2</sup> × 5 → 유한소수 (0.15)<br>${fr(1,6)} : 6 = 2 × 3 → 순환소수 (0.1${dotted('6')})</div>`},
 {t:'꼭 기약분수로 먼저!',b:`<div class="ex">${fs3(3,12)} = ${fr(1,4)} → 분모 4 = 2<sup>2</sup> → <b>유한소수</b><br>${fs3(6,15)} = ${fr(2,5)} → <b>유한소수</b></div><p class="tip">약분하기 전 분모에 3이 있어도 약분되면 사라질 수 있어요!</p>`},
 {t:'유한소수가 되게 만들기',b:`<div class="ex">${fs3(5,'2 × 3 × 7')} × ${A_}가 유한소수가 되려면<br>분모의 3과 7이 없어져야 해요 → ${A_}는 21의 배수<br>가장 작은 자연수 ${A_} = <b>21</b></div>`}
],[
 ()=>{const goods=[];const bads=[];for(let d=2;d<=40;d++)for(let n=1;n<d;n++){const q=Q(n,d);(factor25(q.d)===1?goods:bads).push([n,d])}const ok=pick(goods.filter(([n,d])=>factor25(d)!==1||Math.random()<.4));const w=shuf(bads).slice(0,3);
  return prob('다음 분수 중 <b>유한소수</b>로 나타낼 수 있는 것은?',mc(fs3(ok[0],ok[1]),w.map(x=>fs3(x[0],x[1]))),'먼저 기약분수로 만들고 분모의 소인수를 봐요.',`${fs3(ok[0],ok[1])}${gcd(ok[0],ok[1])>1?' = '+fr(ok[0],ok[1]):''} → 분모 ${Q(ok[0],ok[1]).d} = ${factStr2(Q(ok[0],ok[1]).d)} → 소인수가 2, 5뿐 → <b>유한소수</b>`)},
 ()=>{const m=pick([3,7,9,11,21,3,7]);const t=pick([2,4,5,8,10,20]);let n;do{n=R(1,30)}while(gcd(n,t)!==1&&false);const d=m*t;const a=m/gcd(n,m);if(a===1)return TOPICS[2].gens[1]();return prob(`${fs3(n,d)} × ${A_}를 소수로 나타내면 유한소수가 돼요. ${A_}가 될 수 있는 가장 작은 자연수는?`,inp(a),'분모를 소인수분해하고, 2와 5 이외의 소인수를 없애야 해요.',`${d} = ${factStr2(d)}<br>분자 ${n}과 약분하고 남는 2·5 이외의 인수: ${a}<br>→ ${A_} = <b>${a}</b>`)},
 ()=>{const d=pick([6,12,14,15,18,22,24,28,30,35,40,45,48,50,56,60]);let n;do{n=R(1,d-1)}while(false);const q=Q(n,d);const fin=factor25(q.d)===1;return prob(`분수 ${fs3(n,d)}를 소수로 나타내면?`,mcFixed(['유한소수','순환소수'],fin?0:1),'기약분수로 만든 뒤 분모의 소인수를 확인해요.',`${fs3(n,d)}${gcd(n,d)>1?' = '+fr(n,d):''}, 분모 ${q.d}${q.d>1?' = '+factStr2(q.d):''} → <b>${fin?'유한소수':'순환소수'}</b>`)},
 ()=>{const ok=pick([`${fs3(7,'2 × 5<sup>2</sup>')}`,`${fs3(3,'2<sup>3</sup>')}`,`${fs3(9,'2<sup>2</sup> × 3')}`]);return prob('다음 중 유한소수로 나타낼 수 <b>있는</b> 것은?',mc(ok,[fs3(1,'3 × 5'),fs3(5,'2 × 7'),fs3(2,'3<sup>2</sup>'),fs3(4,'5 × 11')]),'약분했을 때 분모에 2, 5만 남는지 봐요.',`<b>${ok}</b> → 약분 후 분모의 소인수가 2나 5뿐이에요.${ok.includes('× 3')?' (9와 3이 약분돼요)':''}`)}
]);
function factStr2(n){const m={};let x=n;for(let p=2;p*p<=x;p++)while(x%p===0){m[p]=(m[p]||0)+1;x/=p}if(x>1)m[x]=(m[x]||0)+1;return Object.keys(m).map(Number).sort((a,c)=>a-c).map(p=>m[p]===1?''+p:`${p}<sup>${m[p]}</sup>`).join(' × ')}

T(3,1,'순환소수의 분수 표현',[
 {t:'x로 놓고 빼기',b:`<div class="ex steps">${X} = 0.${dotted('3')} = 0.333…<br>10${X} = 3.333…<br>10${X} − ${X} = 3 → 9${X} = 3<br>${X} = ${fs3(3,9)} = <b>${fr(1,3)}</b></div><p class="tip">소수 부분이 똑같은 두 식을 만들어 빼면 끝없는 부분이 사라져요.</p>`},
 {t:'공식으로 빠르게',b:`${tableHTML(['순환소수','분수'],[[`0.${dotted('a')}`,fs3('a',9)],[`0.${dotted('ab')}`,fs3('ab',99)],[`0.a${dotted('b')}`,fs3('ab − a',90)],[`0.${dotted('abc')}`,fs3('abc',999)]])}<p class="tip">분모: 순환마디 숫자 개수만큼 9, 그 뒤에 순환하지 않는 숫자 개수만큼 0</p>`},
 {t:'예제',b:`<div class="ex">0.${dotted('45')} = ${fs3(45,99)} = ${fr(45,99)}<br>0.1${dotted('6')} = ${fs3('16 − 1',90)} = ${fs3(15,90)} = ${fr(1,6)}<br>1.${dotted('2')} = ${fs3('12 − 1',9)} = ${fr(11,9)}</div>`}
],[
 ()=>{const a=R(1,8);return prob(`순환소수 0.${dotted(a)}를 기약분수로 나타내세요.`,inp(Q(a,9)),'0.ȧ = a/9',`0.${dotted(a)} = ${fs3(a,9)}${gcd(a,9)>1?' = '+fr(a,9):''} → <b>${fr(a,9)}</b>`)},
 ()=>{let ab;do{ab=R(10,98)}while(ab%11===0);return prob(`순환소수 0.${dotted(String(ab))}를 기약분수로 나타내세요.`,inp(Q(ab,99)),'순환마디가 두 자리 → 분모 99',`${fs3(ab,99)}${gcd(ab,99)>1?' = '+fr(ab,99):''} → <b>${fr(ab,99)}</b>`)},
 ()=>{const a=R(1,9),bb=R(0,9);if(a===bb)return TOPICS[3].gens[2]();const num=10*a+bb-a;return prob(`순환소수 0.${a}${dotted(bb)}를 기약분수로 나타내세요.`,inp(Q(num,90)),'0.ab(b에 점) = (ab − a)/90',`${fs3(`${10*a+bb} − ${a}`,90)} = ${fs3(num,90)} = <b>${fr(num,90)}</b>`)},
 ()=>{const k=R(0,2);const forms=[[`0.${dotted('7')}`,`10${X} − ${X}`],[`0.${dotted('35')}`,`100${X} − ${X}`],[`0.2${dotted('5')}`,`100${X} − 10${X}`]];const f=forms[k];return prob(`${X} = ${f[0]}을(를) 분수로 나타낼 때 이용하면 가장 편리한 식은?`,mc(f[1],[`10${X} − ${X}`,`100${X} − ${X}`,`100${X} − 10${X}`,`1000${X} − ${X}`]),'소수점 아래 부분이 똑같아지는 두 식을 골라요.',`<b>${f[1]}</b>을(를) 계산하면 순환하는 부분이 사라져요.`)},
 ()=>{const ip=R(1,3),a=R(1,8);const num=ip*10+a-ip;return prob(`순환소수 ${ip}.${dotted(a)}를 분수로 나타내세요.`,inp(Q(num,9)),`(${ip}${a} − ${ip}) / 9`,`${fs3(`${ip}${a} − ${ip}`,9)} = <b>${fr(num,9)}</b>`)}
]);

// ---------- PART 2 ----------
T(4,2,'지수법칙',[
 {t:'곱셈: 지수끼리 더해요',b:`<div class="ex big-ex">${A_}<sup>m</sup> × ${A_}<sup>n</sup> = ${A_}<sup>m+n</sup></div><div class="ex">${X}<sup>2</sup> × ${X}<sup>3</sup> = (${X}×${X})×(${X}×${X}×${X}) = ${X}<sup>5</sup></div>`},
 {t:'거듭제곱의 거듭제곱: 곱해요',b:`<div class="ex big-ex">(${A_}<sup>m</sup>)<sup>n</sup> = ${A_}<sup>mn</sup></div><div class="ex">(${X}<sup>2</sup>)<sup>3</sup> = ${X}<sup>2</sup> × ${X}<sup>2</sup> × ${X}<sup>2</sup> = ${X}<sup>6</sup></div>`},
 {t:'나눗셈: 지수끼리 빼요',b:`<div class="ex">m &gt; n → ${A_}<sup>m</sup> ÷ ${A_}<sup>n</sup> = ${A_}<sup>m−n</sup><br>m = n → 1<br>m &lt; n → ${fs3(1,A_+'<sup>n−m</sup>')}</div><div class="ex">${X}<sup>5</sup> ÷ ${X}<sup>2</sup> = ${X}<sup>3</sup>, &nbsp;${X}<sup>2</sup> ÷ ${X}<sup>5</sup> = ${fs3(1,X+'<sup>3</sup>')}</div>`},
 {t:'곱이나 몫의 거듭제곱',b:`<div class="ex">(${A_}${B_})<sup>n</sup> = ${A_}<sup>n</sup>${B_}<sup>n</sup><br>(2${X}<sup>2</sup>)<sup>3</sup> = 2<sup>3</sup>${X}<sup>6</sup> = 8${X}<sup>6</sup></div><p class="tip">숫자 계수도 같이 거듭제곱하는 것을 잊지 마세요!</p>`}
],[
 ()=>{const m=R(2,9),n=R(2,9);return prob(`${X}<sup>${m}</sup> × ${X}<sup>${n}</sup> = ${X}<sup>□</sup><br>□에 알맞은 수는?`,inp(m+n),'같은 문자의 곱셈은 지수끼리 더해요.',`${m} + ${n} = <b>${m+n}</b>`)},
 ()=>{const m=R(2,6),n=R(2,5);return prob(`(${X}<sup>${m}</sup>)<sup>${n}</sup> = ${X}<sup>□</sup><br>□에 알맞은 수는?`,inp(m*n),'거듭제곱의 거듭제곱은 지수끼리 곱해요.',`${m} × ${n} = <b>${m*n}</b>`)},
 ()=>{const m=R(2,9),n=R(2,9);const ok=m>n?`${X}<sup>${m-n}</sup>`:m===n?'1':fs3(1,`${X}<sup>${n-m}</sup>`);return prob(`${X}<sup>${m}</sup> ÷ ${X}<sup>${n}</sup>을 간단히 하면?`,mc(ok,[`${X}<sup>${m+n}</sup>`,m===n?`${X}`:`${X}<sup>${Math.abs(m-n)+1}</sup>`,m>n?fs3(1,`${X}<sup>${m-n}</sup>`):`${X}<sup>${n-m}</sup>`,'0']),'지수를 비교해요. 큰 쪽이 분자면 그대로, 분모면 1/x^□',`지수 ${m}, ${n} 비교 → <b>${ok}</b>`)},
 ()=>{const c=R(2,3),p=R(1,3),n=R(2,3);const ok=`${c**n}${X}<sup>${p*n}</sup>`;return prob(`(${c}${p===1?X:X+'<sup>'+p+'</sup>'})<sup>${n}</sup>을 간단히 하면?`,mc(ok,[`${c}${X}<sup>${p*n}</sup>`,`${c*n}${X}<sup>${p*n}</sup>`,`${c**n}${X}<sup>${p+n}</sup>`,`${c*n}${X}<sup>${p+n}</sup>`,`${c**n}${X}<sup>${p*n+1}</sup>`]),'계수도 거듭제곱해요!',`${c}<sup>${n}</sup>${X}<sup>${p}×${n}</sup> = <b>${ok}</b>`)},
 ()=>{const t=R(0,1);if(t===0){const k=R(1,4),x=R(1,5);return prob(`2<sup>□</sup> × 2<sup>${k}</sup> = 2<sup>${k+x}</sup><br>□에 알맞은 수는?`,inp(x),'지수끼리 더해서 '+(k+x)+'이 돼야 해요.',`□ + ${k} = ${k+x} → □ = <b>${x}</b>`)}
  const b0=pick([[4,2],[8,3],[9,2]]);const base=b0[0]===9?3:2;const n=R(2,4);return prob(`${b0[0]}<sup>${n}</sup> = ${base}<sup>□</sup><br>□에 알맞은 수는?`,inp(b0[1]*n),`${b0[0]} = ${base}<sup>${b0[1]}</sup>로 바꿔요.`,`(${base}<sup>${b0[1]}</sup>)<sup>${n}</sup> = ${base}<sup>${b0[1]*n}</sup> → <b>${b0[1]*n}</b>`)}
]);

T(5,2,'단항식의 곱셈과 나눗셈',[
 {t:'단항식의 곱셈',b:`<p><b>계수는 계수끼리, 문자는 문자끼리</b> 곱해요.</p><div class="ex">3${X}<sup>2</sup> × 4${X}<sup>3</sup> = (3 × 4) × (${X}<sup>2</sup> × ${X}<sup>3</sup>) = <b>12${X}<sup>5</sup></b><br>2${X}${Y} × (−5${X}) = <b>−10${X}<sup>2</sup>${Y}</b></div>`},
 {t:'단항식의 나눗셈',b:`<p>분수 꼴로 바꾸거나 역수를 곱해요.</p><div class="ex">12${X}<sup>5</sup> ÷ 3${X}<sup>2</sup> = ${fs3('12'+X+'<sup>5</sup>','3'+X+'<sup>2</sup>')} = <b>4${X}<sup>3</sup></b><br>6${X}<sup>2</sup> ÷ ${fs3(X,2)} = 6${X}<sup>2</sup> × ${fs3(2,X)} = 12${X}</div>`},
 {t:'곱셈과 나눗셈이 섞이면',b:`<p>앞에서부터 차례로, 또는 나눗셈을 역수의 곱셈으로 바꿔서 한 번에 계산해요.</p><div class="ex">4${X}<sup>3</sup> × 3${X} ÷ 6${X}<sup>2</sup> = ${fs3('4 × 3'+X+'<sup>4</sup>','6'+X+'<sup>2</sup>')} = <b>2${X}<sup>2</sup></b></div>`}
],[
 ()=>{const a=RZ(-6,6),c=RZ(-6,6),p=R(1,4),q=R(1,4);const ok=mono(a*c,p+q);return prob(`${mono(a,p)} × ${a===1?'':''}${c<0?'('+mono(c,q)+')':mono(c,q)}을 간단히 하면?`,mc(ok,[mono(a*c,p*q),mono(a+c||1,p+q),mono(-a*c,p+q),mono(a*c,p+q+1)]),'계수끼리 곱하고, 지수는 더해요.',`(${N(a)}) × (${N(c)}) = ${N(a*c)}, ${X}<sup>${p}+${q}</sup> → <b>${ok}</b>`)},
 ()=>{const a=RZ(-5,5),c=RZ(-5,5),p=R(1,3),q=R(1,3),r=R(1,3),s=R(1,3);const ok=mono(a*c,p+r,q+s);return prob(`${mono(a,p,q)} × ${c<0?'('+mono(c,r,s)+')':mono(c,r,s)}을 간단히 하면?`,mc(ok,[mono(a*c,p*r,q*s),mono(a*c,p+q,r+s),mono(-a*c,p+r,q+s),mono(a+c||2,p+r,q+s)]),X+'는 '+X+'끼리, '+Y+'는 '+Y+'끼리 지수를 더해요.',`계수: ${N(a*c)}, ${X}<sup>${p+r}</sup>, ${Y}<sup>${q+s}</sup> → <b>${ok}</b>`)},
 ()=>{const c=RZ(-5,5),k=RZ(-4,4),q=R(1,3),r=R(1,3);const a=c*k,p=q+r;const ok=mono(k,r);return prob(`${mono(a,p)} ÷ ${c<0?'('+mono(c,q)+')':mono(c,q)}을 간단히 하면?`,mc(ok,[mono(k,p+q),mono(a*c,r),mono(-k,r),mono(k,p*q)]),'계수끼리 나누고, 지수는 빼요.',`${N(a)} ÷ ${P(c)} = ${N(k)}, ${X}<sup>${p}−${q}</sup> = ${vx('x',r)} → <b>${ok}</b>`)},
 ()=>{const a=RZ(-4,4),c=RZ(-4,4),d=pick([1,2,-2,3]);const p=R(1,3),q=R(1,3),s=R(1,Math.max(1,p+q-1));if(Math.abs(a*c)%Math.abs(d))return TOPICS[5].gens[3]();const k=a*c/d;const e=p+q-s;const ok=mono(k,e);return prob(`${mono(a,p)} × ${c<0?'('+mono(c,q)+')':mono(c,q)} ÷ ${d<0?'('+mono(d,s)+')':mono(d,s)}을 간단히 하면?`,mc(ok,[mono(k,p+q+s),mono(a*c*d,e),mono(-k,e),mono(k,e+1)]),'곱한 뒤 나누거나, 한 번에 분수로 만들어요.',`계수: ${N(a)} × ${P(c)} ÷ ${P(d)} = ${N(k)}<br>지수: ${p} + ${q} − ${s} = ${e} → <b>${ok}</b>`)},
 ()=>{const a=RZ(-6,6),c=RZ(-6,6),p=R(1,3),q=R(1,3);return prob(`${mono(a,p)} × ${c<0?'('+mono(c,q)+')':mono(c,q)}을 간단히 했을 때 <b>계수</b>는?`,inp(a*c),'계수끼리 곱해요.',`${N(a)} × ${P(c)} = <b>${N(a*c)}</b>`)}
]);

T(6,2,'다항식의 덧셈과 뺄셈',[
 {t:'동류항끼리 계산',b:`<p>문자와 차수가 같은 항(동류항)끼리 모아서 계산해요.</p><div class="ex">(2${X} + 3${Y}) + (4${X} − ${Y}) = 6${X} + 2${Y}</div>`},
 {t:'빼기는 부호를 바꿔서',b:`<div class="ex steps">(3${X}<sup>2</sup> + 2${X} − 1) − (${X}<sup>2</sup> − 4${X} + 3)<br>= 3${X}<sup>2</sup> + 2${X} − 1 − ${X}<sup>2</sup> + 4${X} − 3<br>= <b>2${X}<sup>2</sup> + 6${X} − 4</b></div>`},
 {t:'이차식',b:`<p>차수가 가장 큰 항의 차수가 2인 다항식을 <b>이차식</b>이라고 해요.</p><div class="ex">○ ${X}<sup>2</sup> + 3${X} − 1, &nbsp;2${X}<sup>2</sup> &nbsp;&nbsp; ✕ ${X}<sup>3</sup> + 1, &nbsp;${fs3(1,X+'<sup>2</sup>')}</div>`}
],[
 ()=>{const a=RZ(-5,5),b0=RZ(-5,5),c=RZ(-5,5),d=RZ(-5,5);if(!(a+c)||!(b0+d))return TOPICS[6].gens[0]();const ok=polyT([[a+c,1],[b0+d,0,1]]);return prob(`(${polyT([[a,1],[b0,0,1]])}) + (${polyT([[c,1],[d,0,1]])})를 간단히 하면?`,mc(ok,[polyT([[a+c,1],[b0-d,0,1]]),polyT([[a-c,1],[b0+d,0,1]]),polyT([[a+c+1,1],[b0+d,0,1]]),polyT([[a+c,1],[b0+d+1,0,1]])]),X+'끼리, '+Y+'끼리 모아요.',`${X}: ${N(a)} + ${P(c)} = ${N(a+c)}, ${Y}: ${N(b0)} + ${P(d)} = ${N(b0+d)}<br>→ <b>${ok}</b>`)},
 ()=>{const A=[RZ(-4,4),RZ(-6,6),RZ(-6,6)],B=[RZ(-4,4),RZ(-6,6),RZ(-6,6)];const r=A.map((x,i)=>x-B[i]);if(!r[0])return TOPICS[6].gens[1]();const P2=t=>polyT([[t[0],2],[t[1],1],[t[2],0]]);const ok=P2(r);return prob(`(${P2(A)}) − (${P2(B)})를 간단히 하면?`,mc(ok,[P2([r[0],A[1]+B[1],r[2]]),P2([A[0]+B[0],r[1],r[2]]),P2([r[0],r[1],A[2]+B[2]]),P2(A.map((x,i)=>x+B[i]))]),'빼는 식의 모든 항의 부호를 바꾼 뒤 동류항끼리!',`${X}<sup>2</sup>: ${N(A[0])} − ${P(B[0])} = ${N(r[0])}<br>${X}: ${N(A[1])} − ${P(B[1])} = ${N(r[1])}<br>상수: ${N(A[2])} − ${P(B[2])} = ${N(r[2])}<br>→ <b>${ok}</b>`)},
 ()=>{const A=[RZ(-4,4),RZ(-6,6),RZ(-6,6)],B=[RZ(-4,4),RZ(-6,6),RZ(-6,6)];const sub=Math.random()<.5;const r=A.map((x,i)=>sub?x-B[i]:x+B[i]);const P2=t=>polyT([[t[0],2],[t[1],1],[t[2],0]]);const which=R(0,2);const nm=[`${X}<sup>2</sup>의 계수`,`${X}의 계수`,'상수항'][which];return prob(`(${P2(A)}) ${sub?'−':'+'} (${P2(B)})를 간단히 했을 때 <b>${nm}</b>는?`,inp(r[which]),'해당하는 항끼리만 계산해도 돼요.',`${N(A[which])} ${sub?'−':'+'} ${P(B[which])} = <b>${N(r[which])}</b>`)},
 ()=>{const ok=pick([polyT([[R(1,4),2],[RZ(-5,5),1],[RZ(-5,5),0]]),polyT([[-R(1,4),2],[R(1,5),0]])]);return prob('다음 중 <b>이차식</b>인 것은?',mc(ok,[polyT([[R(1,4),1],[R(1,5),0]]),polyT([[1,3],[R(1,5),0]]),fs3(1,X+'<sup>2</sup>')+' + 1',`${X}<sup>2</sup> + 2${X} − ${X}<sup>2</sup>`]),'정리했을 때 가장 큰 차수가 2인 다항식이에요. 분모에 문자가 있으면 다항식이 아니에요.',`<b>${ok}</b>는 최고차항의 차수가 2 → 이차식`)}
]);

T(7,2,'(단항식) × (다항식)',[
 {t:'분배법칙으로 전개',b:`<div class="ex big-ex">${A_}(${B_} + ${v('c')}) = ${A_}${B_} + ${A_}${v('c')}</div><div class="ex">2${X}(3${X} − 4) = 6${X}<sup>2</sup> − 8${X}<br>−${X}(${X} + 2${Y}) = −${X}<sup>2</sup> − 2${X}${Y}</div><p class="tip">괄호 안의 <mark>모든 항</mark>에 곱해요. 부호도 함께!</p>`}
],[
 ()=>{const k=RZ(-5,5),a=RZ(-5,5),c=RZ(-6,6);const ok=polyT([[k*a,2],[k*c,1]]);return prob(`${mono(k,1)}(${polyT([[a,1],[c,0]])})를 전개하면?`,mc(ok,[polyT([[k*a,2],[c,1]]),polyT([[k*a,1],[k*c,1]]),polyT([[k*a,2],[-k*c,1]]),polyT([[k+a,2],[k*c,1]])]),'두 항 모두에 '+mono(k,1)+'를 곱해요.',`${mono(k,1)} × ${mono(a,1)} = ${mono(k*a,2)}<br>${mono(k,1)} × ${P(c)} = ${mono(k*c,1)}<br>→ <b>${ok}</b>`)},
 ()=>{const k=RZ(-4,4),a=RZ(-4,4),c=RZ(-5,5);const ok=polyT([[k*a,2],[k*c,1,1]]);return prob(`${mono(k,1)}(${polyT([[a,1],[c,0,1]])})를 전개하면?`,mc(ok,[polyT([[k*a,2],[c,1,1]]),polyT([[k*a,2],[k*c,0,1]]),polyT([[-k*a,2],[k*c,1,1]]),polyT([[k*a,1],[k*c,1,1]])]),'괄호 안 모든 항에 곱해요.',`→ <b>${ok}</b>`)},
 ()=>{const k=RZ(-4,4),a=RZ(-4,4),c=RZ(-5,5),d=RZ(-5,5);const r=[k*a,k*c,k*d];const which=R(0,2);return prob(`${mono(k,1)}(${polyT([[a,2],[c,1],[d,0]])})를 전개했을 때 <b>${[`${X}<sup>3</sup>`,`${X}<sup>2</sup>`,X][which]}의 계수</b>는?`,inp(r[which]),mono(k,1)+'를 각 항에 곱해 차수를 확인해요.',`${N(k)} × ${P([a,c,d][which])} = <b>${N(r[which])}</b>`)},
 ()=>{const k=RZ(-4,4),a=RZ(-4,4),c=RZ(-5,5),m=RZ(-3,3),d=RZ(-5,5);const r2=k*a,r1=k*c+m*d;if(!r2)return TOPICS[7].gens[3]();const ok=polyT([[r2,2],[r1,1]]);return prob(`${mono(k,1)}(${polyT([[a,1],[c,0]])}) ${m<0?'−':'+'} ${Math.abs(m)===1?'':Math.abs(m)}${X} × ${d<0?'('+N(d)+')':d}를 간단히 하면?`,mc(ok,[polyT([[r2,2],[k*c-m*d,1]]),polyT([[r2,2],[r1+1,1]]),polyT([[-r2,2],[r1,1]]),polyT([[r2,1],[r1,1]])]),'각각 전개한 뒤 동류항끼리 정리해요.',`${polyT([[k*a,2],[k*c,1]])} ${m*d<0?'−':'+'} ${Math.abs(m*d)}${X}<br>= <b>${ok}</b>`)}
]);

T(8,2,'(다항식) ÷ (단항식)',[
 {t:'각 항을 나눠요',b:`<div class="ex">(6${X}<sup>2</sup> + 4${X}) ÷ 2${X} = ${fs3('6'+X+'<sup>2</sup>','2'+X)} + ${fs3('4'+X,'2'+X)} = <b>3${X} + 2</b></div>`},
 {t:'분수로 나누면 역수를 곱해요',b:`<div class="ex">(4${X}<sup>2</sup> − 2${X}) ÷ ${fs3(X,3)} = (4${X}<sup>2</sup> − 2${X}) × ${fs3(3,X)} = <b>12${X} − 6</b></div>`}
],[
 ()=>{const c=RZ(-4,4),a=RZ(-4,4),b0=RZ(-5,5);const ok=polyT([[a,1],[b0,0]]);return prob(`(${polyT([[a*c,2],[b0*c,1]])}) ÷ ${c<0?'('+mono(c,1)+')':mono(c,1)}를 계산하면?`,mc(ok,[polyT([[a,2],[b0,1]]),polyT([[a,1],[-b0,0]]),polyT([[-a,1],[b0,0]]),polyT([[a*c,1],[b0*c,0]])]),'각 항을 '+mono(c,1)+'(으)로 나눠요.',`${mono(a*c,2)} ÷ ${P(c)}${X} = ${mono(a,1)}<br>${mono(b0*c,1)} ÷ ${P(c)}${X} = ${N(b0)}<br>→ <b>${ok}</b>`)},
 ()=>{const c=RZ(-3,3),a=RZ(-4,4),b0=RZ(-5,5);const ok=polyT([[a,1],[b0,0,1]]);return prob(`(${polyT([[a*c,2,1],[b0*c,1,2]])}) ÷ ${c<0?'('+mono(c,1,1)+')':mono(c,1,1)}를 계산하면?`,mc(ok,[polyT([[a,2],[b0,0,1]]),polyT([[a,1],[b0,0,2]]),polyT([[-a,1],[b0,0,1]]),polyT([[a,1],[-b0,0,1]])]),'계수는 계수끼리, 문자는 지수를 빼요.',`→ <b>${ok}</b>`)},
 ()=>{const k=R(2,4),a=RZ(-4,4),b0=RZ(-5,5);const ok=polyT([[a*k,1],[b0*k,0]]);return prob(`(${polyT([[a,2],[b0,1]])}) ÷ ${fs3(X,k)}를 계산하면?`,mc(ok,[polyT([[a,1],[b0,0]]),polyT([[a*k,2],[b0*k,1]]),fs3(polyT([[a,1],[b0,0]]),k),polyT([[a*k,1],[b0,0]])]),'÷ x/'+k+' → × '+k+'/x',`(${polyT([[a,2],[b0,1]])}) × ${fs3(k,X)} = <b>${ok}</b>`)},
 ()=>{const c=RZ(-4,4),a=RZ(-4,4),b0=RZ(-5,5),d=RZ(-5,5);const which=R(0,1);return prob(`(${polyT([[a*c,3],[b0*c,2],[d*c,1]])}) ÷ ${c<0?'('+mono(c,1)+')':mono(c,1)}를 계산했을 때 <b>${which?X+'의 계수':X+'<sup>2</sup>의 계수'}</b>는?`,inp(which?b0:a),'각 항을 나눈 결과의 차수를 확인해요.',`${which?mono(b0*c,2):mono(a*c,3)} ÷ ${mono(c,1)} = ${which?mono(b0,1):mono(a,2)} → <b>${N(which?b0:a)}</b>`)}
]);

T(9,3,'부등식의 해와 성질',[
 {t:'부등식',b:`<p>부등호(&lt;, &gt;, ≤, ≥)를 사용하여 수나 식의 대소 관계를 나타낸 식이에요.</p>${tableHTML(['말','부등식'],[[`${X}는 3보다 크다 (초과)`,`${X} &gt; 3`],[`${X}는 3보다 작다 (미만)`,`${X} &lt; 3`],[`${X}는 3 이상이다 (작지 않다)`,`${X} ≥ 3`],[`${X}는 3 이하이다 (크지 않다)`,`${X} ≤ 3`]])}`},
 {t:'부등식의 해',b:`<p>부등식을 참이 되게 하는 ${X}의 값이 <b>해</b>예요.</p><div class="ex">2${X} − 1 &gt; 3 에서 ${X} = 3 → 5 &gt; 3 (참) → 해 ○<br>${X} = 1 → 1 &gt; 3 (거짓) → 해 ✕</div>`},
 {t:'부등식의 성질',b:`<ol class="big"><li>양변에 같은 수를 더하거나 빼도 부등호 방향은 그대로</li><li>양변에 같은 <b>양수</b>를 곱하거나 나누어도 그대로</li><li>양변에 같은 <mark>음수</mark>를 곱하거나 나누면 <mark>방향이 바뀌어요</mark></li></ol><div class="ex">${A_} &lt; ${B_} → −2${A_} &gt; −2${B_}</div>`}
],[
 ()=>{const k=R(2,5),c=R(1,9),d=R(5,30);const F=[[`${X}의 ${k}배에 ${c}를 더한 수는 ${d}보다 크지 않다.`,`${k}${X} + ${c} ≤ ${d}`,[`${k}${X} + ${c} &lt; ${d}`,`${k}${X} + ${c} ≥ ${d}`,`${k}(${X} + ${c}) ≤ ${d}`]],[`${X}에서 ${c}를 뺀 수는 ${d} 이상이다.`,`${X} − ${c} ≥ ${d}`,[`${X} − ${c} &gt; ${d}`,`${X} − ${c} ≤ ${d}`,`${c} − ${X} ≥ ${d}`]],[`한 개에 ${k*100}원인 과자 ${X}개의 값은 ${d*100}원 미만이다.`,`${k*100}${X} &lt; ${d*100}`,[`${k*100}${X} ≤ ${d*100}`,`${k*100}${X} &gt; ${d*100}`,`${k*100} + ${X} &lt; ${d*100}`]]];const f=pick(F);
  return prob(`다음 문장을 부등식으로 나타내면?<div class="qbox">${f[0]}</div>`,mc(f[1],f[2]),'크지 않다 = 이하(≤), 작지 않다 = 이상(≥)',`<b>${f[1]}</b>`)},
 ()=>{const k=R(2,5);const Tt=[`${A_} + ${k} &lt; ${B_} + ${k}`,`${A_} − ${k} &lt; ${B_} − ${k}`,`${k}${A_} &lt; ${k}${B_}`,`−${A_} &gt; −${B_}`,`${fs3(A_,k)} &lt; ${fs3(B_,k)}`];const Ff=[`−${k}${A_} &lt; −${k}${B_}`,`${fs3(A_,'−'+k)} &lt; ${fs3(B_,'−'+k)}`,`−${A_} + 1 &lt; −${B_} + 1`];const f=pick(Ff);return prob(`${A_} &lt; ${B_}일 때, 다음 중 <b>옳지 않은</b> 것은?`,mc(f,shuf(Tt).slice(0,3)),'음수를 곱하거나 나누면 부등호 방향이 바뀌어요.',`<b>${f}</b> → 음수를 곱했으므로 방향이 바뀌어야 해요.`)},
 ()=>{const a=RZ(-3,3),c=R(-4,4);const sym=pick(['&gt;','&lt;','≥','≤']);const tst=(x)=>{const L=a*x+c,Rr=0;return sym==='&gt;'?L>Rr:sym==='&lt;'?L<Rr:sym==='≥'?L>=Rr:L<=Rr};const xs=[-2,-1,0,1,2];const sol=xs.filter(tst);
  return prob(`${X}의 값이 −2, −1, 0, 1, 2일 때, 부등식 ${lin(a,c)} ${sym} 0의 해는 모두 몇 개일까요?`,inp(sol.length,'개'),'하나씩 대입해 참인지 확인해요.',xs.map(x=>`${X} = ${N(x)}: ${N(a*x+c)} ${sym} 0 ${tst(x)?'○':'✕'}`).join('<br>')+`<br>→ <b>${sol.length}개</b>`)},
 ()=>{const lo=R(-3,0),hi=lo+R(2,5);const k=pick([2,3,-2,-3]),c=RZ(-5,5);const A2=k*lo+c,B2=k*hi+c;const ok=k>0?`${N(A2)} ≤ ${lin(k,c)} &lt; ${N(B2)}`:`${N(B2)} &lt; ${lin(k,c)} ≤ ${N(A2)}`;
  return prob(`${N(lo)} ≤ ${X} &lt; ${N(hi)}일 때, ${lin(k,c)}의 값의 범위는?`,mc(ok,[`${N(A2)} ≤ ${lin(k,c)} &lt; ${N(B2)}`,`${N(B2)} &lt; ${lin(k,c)} ≤ ${N(A2)}`,`${N(Math.min(A2,B2))} &lt; ${lin(k,c)} ≤ ${N(Math.max(A2,B2))}`,`${N(k*lo)} ≤ ${lin(k,c)} &lt; ${N(k*hi)}`]),k<0?'음수를 곱하면 부등호 방향이 바뀌어요!':'각 변에 '+k+'를 곱하고 '+N(c)+'를 더해요.',`각 변 × ${P(k)}${k<0?' (방향 바뀜)':''}, ${c<0?'−':'+'} ${Math.abs(c)}<br>→ <b>${ok}</b>`)}
]);

T(10,3,'일차부등식의 풀이',[
 {t:'푸는 방법',b:`<p>방정식처럼 <b>이항</b>해서 ${A_}${X} &lt; ${B_} 꼴로 만든 뒤 양변을 ${A_}로 나눠요.</p><div class="ex steps">3${X} − 2 &lt; 7<br>3${X} &lt; 9<br>${X} &lt; 3</div>`},
 {t:'음수로 나눌 때 주의!',b:`<div class="ex steps">−2${X} + 1 ≥ 7<br>−2${X} ≥ 6<br>${X} <mark>≤</mark> −3 &nbsp;← 방향 바뀜</div>`},
 {t:'수직선에 나타내기',b:`<div class="row2"><div>${ineqFig(2,1,false)}<div class="cap">${X} &gt; 2 (빈 점)</div></div><div>${ineqFig(2,-1,true)}<div class="cap">${X} ≤ 2 (색칠한 점)</div></div></div><p class="tip">등호가 있으면 ●, 없으면 ○</p>`}

function sys(){let a,b0,c,d,x0,y0;do{a=RZ(-4,4);b0=RZ(-4,4);c=RZ(-4,4);d=RZ(-4,4);x0=RZ(-5,5);y0=RZ(-5,5)}while(a*d-b0*c===0);return{a,b0,c,d,x0,y0,e:a*x0+b0*y0,f:c*x0+d*y0}}
const sysS=s=>`<div class="sys"><span>${poly([[s.a,'x'],[s.b0,'y']])} = ${N(s.e)}</span><span>${poly([[s.c,'x'],[s.d,'y']])} = ${N(s.f)}</span></div>`;

 {t:'평행과 일치',b:`<ul class="big"><li>기울기가 같고 ${Y}절편이 다르면 → <b>평행</b></li><li>기울기와 ${Y}절편이 모두 같으면 → <b>일치</b></li></ul>`},
 {t:'식 구하기',b:`<div class="ex steps">기울기 2, 점 (1, 5)를 지남<br>${Y} = 2${X} + ${B_}에 대입: 5 = 2 + ${B_} → ${B_} = 3<br>→ ${Y} = 2${X} + 3</div><div class="ex steps">두 점 (1, 2), (3, 6)을 지남<br>기울기 = ${fs3('6 − 2','3 − 1')} = 2 → ${Y} = 2${X} + ${B_}<br>(1, 2) 대입 → ${B_} = 0 → ${Y} = 2${X}</div>`}
],[
 ()=>{const a=RZ(-4,4),b0=RZ(-5,5);const q=a>0?(b0>0?3:1):(b0>0?2:0);const nm=['제1사분면','제2사분면','제3사분면','제4사분면'];return prob(`일차함수 ${Y} = ${lin(a,b0)}의 그래프가 <b>지나지 않는</b> 사분면은?`,mcFixed(nm,q),'기울기와 y절편의 부호로 그래프를 그려 보세요.',`기울기 ${a>0?'양수(오른쪽 위)':'음수(오른쪽 아래)'}, ${Y}절편 ${b0>0?'양수':'음수'} → <b>${nm[q]}</b>를 지나지 않아요.`,lineFig(a,b0))},
 ()=>{const a=RZ(-4,4),b0=RZ(-6,6);const ok=`${Y} = ${lin(a,b0)}`;return prob(`기울기가 ${N(a)}이고 ${Y}절편이 ${N(b0)}인 일차함수의 식은?`,mc(ok,[`${Y} = ${lin(b0||1,a)}`,`${Y} = ${lin(a,-b0)}`,`${Y} = ${lin(-a,b0)}`]),Y+' = (기울기)'+X+' + (y절편)',`<b>${ok}</b>`)},
 ()=>{const a=RZ(-4,4),p=RZ(-3,3),b0=RZ(-5,5);const q=a*p+b0;const ok=`${Y} = ${lin(a,b0)}`;return prob(`기울기가 ${N(a)}이고 점 (${N(p)}, ${N(q)})를 지나는 일차함수의 식은?`,mc(ok,[`${Y} = ${lin(a,q)}`,`${Y} = ${lin(a,b0+1)}`,`${Y} = ${lin(-a,q+a*p)}`]),Y+' = '+N(a)+X+' + b에 점을 대입해 b를 구해요.',`${N(q)} = ${N(a)} × ${P(p)} + ${B_} → ${B_} = ${N(b0)}<br>→ <b>${ok}</b>`)},
 ()=>{const a=RZ(-3,3),b0=RZ(-4,4);let x1=RZ(-3,3),x2;do{x2=RZ(-3,3)}while(x2===x1);const ok=`${Y} = ${lin(a,b0)}`;return prob(`두 점 (${N(x1)}, ${N(a*x1+b0)}), (${N(x2)}, ${N(a*x2+b0)})를 지나는 일차함수의 식은?`,mc(ok,[`${Y} = ${lin(-a,b0)}`,`${Y} = ${lin(a,-b0)}`,`${Y} = ${lin(a,b0+a)}`]),'먼저 기울기를 구하고, 한 점을 대입해요.',`기울기 = ${fs3(N(a*(x2-x1)),N(x2-x1))} = ${N(a)}<br>${Y}절편 ${N(b0)} → <b>${ok}</b>`)},
 ()=>{const a=RZ(-4,4),b0=RZ(-5,5);const ok=`${Y} = ${lin(a,b0+(b0>0?-3:3))}`;return prob(`일차함수 ${Y} = ${lin(a,b0)}의 그래프와 <b>평행한</b> 것은?`,mc(ok,[`${Y} = ${lin(-a,b0)}`,`${Y} = ${lin(a===1?2:1,b0)}`,`${Y} = ${lin(a,b0)}`]),'기울기가 같고 y절편이 다른 것을 찾아요.',`기울기 ${N(a)}로 같고 ${Y}절편이 다름 → <b>${ok}</b><br>(${Y} = ${lin(a,b0)}은(는) 같은 직선이라 평행이 아니라 일치예요.)`)},
 ()=>{let a,b0;do{a=RZ(-3,3);b0=RZ(-4,4)}while(Math.abs(a+b0)>5);const ok=`${Y} = ${lin(a,b0)}`;return prob('그래프가 다음과 같은 일차함수의 식은?',mc(ok,[`${Y} = ${lin(-a,b0)}`,`${Y} = ${lin(a,-b0)}`,`${Y} = ${lin(b0||2,a)}`]),'y절편과, x가 1 증가할 때 y가 얼마나 변하는지 읽어요.',`${Y}절편 ${N(b0)}, 점 (1, ${N(a+b0)})을 지남 → 기울기 ${N(a)}<br>→ <b>${ok}</b>`,lineFig(a,b0,[{x:0,y:b0,lab:''},{x:1,y:a+b0,lab:''}]))}
]);

T(16,4,'일차함수와 일차방정식',[
 {t:'일차방정식의 그래프',b:`<p>${A_}${X} + ${B_}${Y} + ${v('c')} = 0 (${B_} ≠ 0)을 ${Y}에 대해 풀면 일차함수가 돼요.</p><div class="ex">2${X} + ${Y} − 3 = 0 → ${Y} = −2${X} + 3<br>기울기 −2, ${Y}절편 3</div>`},
 {t:'축에 평행한 직선',b:`<ul class="big"><li>${X} = ${v('p')} → 점 (${v('p')}, 0)을 지나고 <b>${Y}축에 평행</b>한 직선</li><li>${Y} = ${v('q')} → 점 (0, ${v('q')})를 지나고 <b>${X}축에 평행</b>한 직선</li></ul>${coordPlane([],4,{lines:[[2,-4.5,2,4.5],[-4.5,-1,4.5,-1]]})}<div class="cap">${X} = 2 (세로선), ${Y} = −1 (가로선)</div>`}
],[
 ()=>{const b0=pick([1,2,-1,-2,3]);const a=RZ(-6,6),c=RZ(-6,6);const s=Q(-a,b0);return prob(`일차방정식 ${poly([[a,'x'],[b0,'y'],[c,'']])} = 0의 그래프의 기울기는?<div class="cap">분수는 3/2 처럼 입력</div>`,inp(s),Y+'에 대해 풀어요.',`${co(b0,'y')} = ${lin(-a,-c)} → ${Y} = ${fr(-a,b0)}${X} + … → 기울기 <b>${fr(s.n,s.d)}</b>`)},
 ()=>{const b0=pick([1,2,-1,-2,3]);const a=RZ(-6,6),c=RZ(-6,6);const s=Q(-c,b0);return prob(`일차방정식 ${poly([[a,'x'],[b0,'y'],[c,'']])} = 0의 그래프의 ${Y}절편은?<div class="cap">분수는 3/2 처럼 입력</div>`,inp(s),X+' = 0을 대입해요.',`${co(b0,'y')} ${c<0?'−':'+'} ${Math.abs(c)} = 0 → ${Y} = <b>${fr(s.n,s.d)}</b>`)},
 ()=>{const k=RZ(-5,5);const isX=Math.random()<.5;const ok=isX?`${Y}축에 평행한 직선`:`${X}축에 평행한 직선`;return prob(`방정식 ${isX?X:Y} = ${N(k)}의 그래프는?`,mc(ok,[isX?`${X}축에 평행한 직선`:`${Y}축에 평행한 직선`,'원점을 지나는 직선',`기울기가 ${N(k)}인 직선`]),isX?X+'가 항상 '+N(k)+'인 점들이에요.':Y+'가 항상 '+N(k)+'인 점들이에요.',`<b>${ok}</b>`,coordPlane([],5,{lines:[isX?[k,-5,k,5]:[-5,k,5,k]]}))},
 ()=>{const p=RZ(-4,4),q=RZ(-4,4);const isX=Math.random()<.5;const ok=isX?`${Y} = ${N(q)}`:`${X} = ${N(p)}`;return prob(`점 (${N(p)}, ${N(q)})를 지나고 <b>${isX?X+'축':Y+'축'}에 평행</b>한 직선의 방정식은?`,mc(ok,[isX?`${X} = ${N(p)}`:`${Y} = ${N(q)}`,isX?`${Y} = ${N(p)}`:`${X} = ${N(q)}`,`${Y} = ${co(Q(q,p).d===1&&p?q/p:1,'x')}`]),isX?X+'축에 평행 → '+Y+'좌표가 일정':Y+'축에 평행 → '+X+'좌표가 일정',`<b>${ok}</b>`)}
]);

T(17,4,'일차함수의 그래프와 연립일차방정식',[
 {t:'교점 = 연립방정식의 해',b:`<p>두 일차방정식의 그래프의 <b>교점의 좌표</b>가 연립방정식의 해예요.</p>${coordPlane([{x:1,y:2,lab:'(1, 2)'}],4,{lines:[[-0.5,-1,2,4],[-1,4,4,-1]]})}`},
 {t:'해가 없거나 무수히 많을 때',b:`<ul class="big"><li>두 그래프가 <b>평행</b> → 만나지 않음 → <mark>해가 없다</mark></li><li>두 그래프가 <b>일치</b> → <mark>해가 무수히 많다</mark></li></ul>`}
],[
 ()=>{const s=sys();const ok=`(${N(s.x0)}, ${N(s.y0)})`;return prob(`두 일차방정식의 그래프의 교점의 좌표는?${sysS(s)}`,mc(ok,[`(${N(s.y0)}, ${N(s.x0)})`,`(${N(-s.x0)}, ${N(s.y0)})`,`(${N(s.x0)}, ${N(-s.y0)})`,`(${N(s.x0+1)}, ${N(s.y0)})`]),'연립방정식을 풀면 교점이에요.',`해: ${X} = ${N(s.x0)}, ${Y} = ${N(s.y0)} → <b>${ok}</b>`)},
 ()=>{const a=R(1,3),b0=R(1,3),k=R(2,3),c=R(1,6);const e=pick([c*k+1,c*k+2,c*k-1]);return prob(`연립방정식 <div class="sys"><span>${poly([[a,'x'],[b0,'y']])} = ${c}</span><span>${a*k}${X} + ${A_}${Y} = ${e}</span></div>의 해가 <b>없을</b> 때, 상수 ${A_}의 값은?`,inp(b0*k),'두 직선이 평행하려면 계수의 비가 같아야 해요.',`첫 식 × ${k} → ${a*k}${X} + ${b0*k}${Y} = ${c*k}<br>${A_} = ${b0*k}이면 좌변은 같고 우변(${c*k} ≠ ${e})이 달라 평행 → <b>${b0*k}</b>`)},
 ()=>{const x0=RZ(-3,3),y0=RZ(-3,3);let a1,a2;do{a1=RZ(-2,2);a2=RZ(-2,2)}while(a1===a2);const b1=y0-a1*x0,b2=y0-a2*x0;if(Math.abs(b1)>4||Math.abs(b2)>4)return TOPICS[17].gens[2]();const ok=`${X} = ${N(x0)}, ${Y} = ${N(y0)}`;return prob(`그림은 두 일차함수의 그래프예요. 이 두 식으로 만든 연립방정식의 해는?`,mc(ok,[`${X} = ${N(y0)}, ${Y} = ${N(x0)}`,`${X} = ${N(x0+1)}, ${Y} = ${N(y0)}`,`${X} = ${N(-x0)}, ${Y} = ${N(-y0)}`,`${X} = 0, ${Y} = ${N(b1)}`]),'두 직선이 만나는 점을 읽어요.',`교점 (${N(x0)}, ${N(y0)}) → <b>${ok}</b>`,coordPlane([{x:x0,y:y0,lab:''}],5,{lines:[lineThruAB(a1,b1),lineThruAB(a2,b2)]}))},
 ()=>{const C=[['두 그래프가 평행할 때','해가 없다'],['두 그래프가 일치할 때','해가 무수히 많다'],['두 그래프가 한 점에서 만날 때','해가 하나뿐이다']];const c=pick(C);return prob(`연립방정식에서 <b>${c[0]}</b>, 해는?`,mc(c[1],C.filter(x=>x!==c).map(x=>x[1])),'교점의 개수 = 해의 개수',`${c[0]} → <b>${c[1]}</b>`)}
]);
function lineThruAB(a,b0){let x1=-5,x2=5;if(a){x1=Math.max(-5,Math.min((5-b0)/a,(-5-b0)/a));x2=Math.min(5,Math.max((5-b0)/a,(-5-b0)/a))}return[x1,a*x1+b0,x2,a*x2+b0]}

// ================= 중3 (중2 복습) PART 5~7 =================
function geo(Pt,segs,opt={}){let s='';const names=Object.keys(Pt);const cen=[0,0];const main=opt.main||names.slice(0,3);main.forEach(k=>{cen[0]+=Pt[k][0]/main.length;cen[1]+=Pt[k][1]/main.length});
 if(opt.circle)s+=`<circle cx="${opt.circle[0]}" cy="${opt.circle[1]}" r="${opt.circle[2]}" class="s thin dash" fill="none"/>`;
 for(const sg of segs){const [a,b2,cl]=Array.isArray(sg)?sg:[sg[0],sg[1],''];s+=ln(Pt[a][0],Pt[a][1],Pt[b2][0],Pt[b2][1],'s '+(cl||''))}
 if(opt.fill)s=pg(opt.fill.map(k=>Pt[k]),'s sec')+s;
 for(const k of names){if(opt.hide&&opt.hide.includes(k))continue;const p=Pt[k];let d=[p[0]-cen[0],p[1]-cen[1]];const L=Math.hypot(...d)||1;const off=opt.off&&opt.off[k]||[d[0]/L*16,d[1]/L*16];s+=dot(p[0],p[1],'d',2.5)+tx(p[0]+off[0],p[1]+off[1],k,'t b')}
 for(const sl of (opt.sides||[])){const a=Pt[sl[0][0]],b2=Pt[sl[0][1]];const m=[(a[0]+b2[0])/2,(a[1]+b2[1])/2];let d=[m[0]-cen[0],m[1]-cen[1]];const L=Math.hypot(...d)||1;s+=tx(m[0]+d[0]/L*(sl[2]||18),m[1]+d[1]/L*(sl[2]||18),sl[1],'t sm acc-t')}
 for(const t of (opt.texts||[]))s+=tx(t[0],t[1],t[2],'t sm b acc-t');
 return SV(opt.w||360,opt.h||240,s)}

const ISO={A:[180,30],B:[90,205],C:[270,205],D:[180,205]};

T(18,5,'이등변삼각형의 성질',[
 {t:'이등변삼각형',b:`<p>두 변의 길이가 같은 삼각형이에요.</p>${geo(ISO,['AB','AC','BC'],{hide:['D'],sides:[['AB','같다'],['AC','같다']]})}<ul class="big"><li><b>꼭지각</b>: 길이가 같은 두 변이 만드는 각 (∠A)</li><li><b>밑변</b>: 꼭지각의 대변 (BC)</li><li><b>밑각</b>: 밑변의 양 끝 각 (∠B, ∠C)</li></ul>`},
 {t:'성질 ①: 두 밑각의 크기는 같다',b:`<div class="ex">∠A = 40° → ∠B = ∠C = (180° − 40°) ÷ 2 = <b>70°</b></div><p class="tip">거꾸로, 두 내각의 크기가 같으면 이등변삼각형이에요.</p>`},
 {t:'성질 ②: 꼭지각의 이등분선',b:`${geo(ISO,['AB','AC','BC',['A','D','acc']],{})}<p>꼭지각의 이등분선은 <mark>밑변을 수직이등분</mark>해요.</p><div class="ex">BD = CD, &nbsp;∠ADB = 90°</div>`}
],[
 ()=>{const A=pick([20,30,40,50,60,70,80,90,100,110,120]);return prob(`AB = AC인 이등변삼각형 ABC에서 ∠A = ${A}°일 때, ∠B의 크기는?`,inp((180-A)/2,'°'),'두 밑각의 크기가 같아요.',`(180° − ${A}°) ÷ 2 = <b>${(180-A)/2}°</b>`,triFig((180-A)/2,(180-A)/2,{A:A+'°',B:v('x')}))},
 ()=>{const B=R(25,80);return prob(`AB = AC인 이등변삼각형 ABC에서 ∠B = ${B}°일 때, ∠A의 크기는?`,inp(180-2*B,'°'),'∠C = ∠B예요.',`∠C = ${B}°<br>∠A = 180° − ${B}° × 2 = <b>${180-2*B}°</b>`,triFig(B,B,{B:B+'°',A:v('x')}))},
 ()=>{const bc=R(3,12)*2;const ask=Math.random()<.5;return prob(ask?`AB = AC인 이등변삼각형 ABC에서 꼭지각 A의 이등분선이 BC와 만나는 점을 D라 해요. BC = ${bc} cm일 때, BD의 길이는?`:`AB = AC인 이등변삼각형 ABC에서 꼭지각 A의 이등분선이 BC와 만나는 점을 D라 할 때, ∠ADB의 크기는?`,inp(ask?bc/2:90,ask?'cm':'°'),'꼭지각의 이등분선은 밑변을 수직이등분해요.',ask?`BD = ${bc} ÷ 2 = <b>${bc/2} cm</b>`:`수직 → <b>90°</b>`,geo(ISO,['AB','AC','BC',['A','D','acc']]))},
 ()=>{const B=R(30,75);return prob(`AB = AC인 이등변삼각형 ABC에서 ∠B = ${B}°예요. 꼭짓점 C의 외각의 크기는?`,inp(180-B,'°'),'∠C = ∠B, 외각 = 180° − ∠C',`∠C = ${B}° → 외각 = 180° − ${B}° = <b>${180-B}°</b>`,triFig(B,B,{B:B+'°'},{ext:v('x')}))},
 ()=>{const B=R(30,70);return prob(`△ABC에서 ∠B = ∠C = ${B}°이고 AB = 7 cm일 때, AC의 길이는?`,inp(7,'cm'),'두 내각의 크기가 같으면 이등변삼각형이에요.',`∠B = ∠C → AB = AC = <b>7 cm</b>`)}
]);

T(19,5,'직각삼각형의 합동 조건',[
 {t:'RHA 합동',b:`<p>빗변(Hypotenuse)의 길이와 한 예각(Angle)의 크기가 각각 같은 두 직각삼각형은 합동이에요.</p>`},
 {t:'RHS 합동',b:`<p>빗변의 길이와 다른 한 변(Side)의 길이가 각각 같은 두 직각삼각형은 합동이에요.</p><p class="tip">R은 직각(Right angle)이에요. 빗변은 직각의 대변이에요.</p>`},
 {t:'각의 이등분선의 성질',b:`<p>각의 이등분선 위의 한 점에서 그 각의 두 변까지의 거리는 같아요. (RHA 합동)</p>`}
],[
 ()=>{const C=[['두 직각삼각형에서 빗변의 길이와 한 예각의 크기가 각각 같다.','RHA 합동'],['두 직각삼각형에서 빗변의 길이와 다른 한 변의 길이가 각각 같다.','RHS 합동']];const c=pick(C);return prob(`다음 조건일 때 두 직각삼각형은 어떤 합동일까요?<div class="qbox">${c[0]}</div>`,mc(c[1],['RHA 합동','RHS 합동','SSS 합동','ASA 합동'].filter(x=>x!==c[1])),'각(A)이면 RHA, 변(S)이면 RHS',`<b>${c[1]}</b>`)},
 ()=>prob('RHS 합동에서 H가 뜻하는 것은?',mc('빗변',['높이','한 예각','밑변']),'Hypotenuse',`H = Hypotenuse = <b>빗변</b>`),
 ()=>{const h=R(5,13),s=R(2,h-1);return prob(`∠C = ∠F = 90°인 두 직각삼각형 ABC, DEF에서 AB = DE = ${h} cm, BC = EF = ${s} cm예요. 두 삼각형은 어떤 합동일까요?`,mcFixed(['RHA 합동','RHS 합동','합동이 아니다'],1),'AB는 빗변이에요.',`빗변과 다른 한 변이 같음 → <b>RHS 합동</b>`)},
 ()=>{const d=R(2,9);return prob(`∠XOY의 이등분선 위의 점 P에서 두 변 OX, OY에 내린 수선의 발을 각각 A, B라 해요. PA = ${d} cm일 때 PB의 길이는?`,inp(d,'cm'),'각의 이등분선 위의 점에서 두 변까지의 거리는 같아요.',`PA = PB = <b>${d} cm</b> (RHA 합동)`)}
]);

T(20,5,'삼각형의 외심',[
 {t:'외심',b:`<p>삼각형의 <b>세 변의 수직이등분선</b>은 한 점(<b>외심 O</b>)에서 만나요.</p>${geo({...TRI,O:[180,150]},['AB','BC','CA',['O','A','dash'],['O','B','dash'],['O','C','dash']],{main:['A','B','C']})}<p>외심에서 세 꼭짓점까지의 거리는 같아요: <mark>OA = OB = OC</mark> (외접원의 반지름)</p>`},
 {t:'외심의 위치',b:`${tableHTML(['삼각형','외심의 위치'],[['예각삼각형','삼각형의 내부'],['직각삼각형','<b>빗변의 중점</b>'],['둔각삼각형','삼각형의 외부']])}<p class="tip">직각삼각형의 외접원 반지름 = 빗변 ÷ 2</p>`},
 {t:'외심과 각',b:`<div class="ex">∠OAB + ∠OBC + ∠OCA = 90°<br>∠BOC = 2∠A</div>`}
],[
 ()=>prob('삼각형의 외심은 무엇의 교점일까요?',mc('세 변의 수직이등분선',['세 내각의 이등분선','세 중선','세 꼭짓점에서 대변에 내린 수선']),'외심은 세 꼭짓점에서 같은 거리에 있는 점이에요.','외심 = <b>세 변의 수직이등분선</b>의 교점'),
 ()=>{const r=R(3,12);return prob(`점 O가 △ABC의 외심이고 OA = ${r} cm일 때, OC의 길이는?`,inp(r,'cm'),'외심에서 세 꼭짓점까지의 거리는 같아요.',`OA = OB = OC = <b>${r} cm</b>`)},
 ()=>{const c=R(3,12)*2;return prob(`∠C = 90°인 직각삼각형 ABC에서 빗변 AB의 길이가 ${c} cm일 때, 외접원의 반지름의 길이는?`,inp(c/2,'cm'),'직각삼각형의 외심은 빗변의 중점이에요.',`${c} ÷ 2 = <b>${c/2} cm</b>`)},
 ()=>{const a=R(10,40),b0=R(10,40);const x=90-a-b0;if(x<5)return TOPICS[20].gens[3]();return prob(`점 O가 △ABC의 외심이고 ∠OAB = ${a}°, ∠OBC = ${b0}°일 때, ∠OCA의 크기는?`,inp(x,'°'),'∠OAB + ∠OBC + ∠OCA = 90°',`90° − ${a}° − ${b0}° = <b>${x}°</b>`)},
 ()=>{const A=R(30,80);return prob(`점 O가 △ABC의 외심이고 ∠A = ${A}°일 때, ∠BOC의 크기는?`,inp(2*A,'°'),'∠BOC = 2∠A',`2 × ${A}° = <b>${2*A}°</b>`)}
]);

T(21,5,'삼각형의 내심',[
 {t:'내심',b:`<p>삼각형의 <b>세 내각의 이등분선</b>은 한 점(<b>내심 I</b>)에서 만나요.</p>${geo({...TRI,I:[180,145]},['AB','BC','CA',['I','A','dash'],['I','B','dash'],['I','C','dash']],{main:['A','B','C'],circle:[180,145,60]})}<p>내심에서 세 변까지의 거리는 같아요 (내접원의 반지름).</p>`},
 {t:'내심과 각',b:`<div class="ex">∠IAB + ∠IBC + ∠ICA = 90°<br>∠BIC = 90° + ${fs3(1,2)}∠A</div>`},
 {t:'넓이',b:`<div class="ex">내접원의 반지름 ${v('r')}, 세 변의 길이의 합(둘레)이 ${v('l')}이면<br>△ABC의 넓이 = ${fs3(1,2)} × ${v('r')} × ${v('l')}</div>`}
],[
 ()=>prob('삼각형의 내심은 무엇의 교점일까요?',mc('세 내각의 이등분선',['세 변의 수직이등분선','세 중선','세 꼭짓점에서 대변에 내린 수선']),'내심은 세 변에서 같은 거리에 있는 점이에요.','내심 = <b>세 내각의 이등분선</b>의 교점'),
 ()=>{const A=R(15,60)*2;return prob(`점 I가 △ABC의 내심이고 ∠A = ${A}°일 때, ∠BIC의 크기는?`,inp(90+A/2,'°'),'∠BIC = 90° + ½∠A',`90° + ${A}° ÷ 2 = <b>${90+A/2}°</b>`)},
 ()=>{const a=R(10,40),b0=R(10,40);const x=90-a-b0;if(x<5)return TOPICS[21].gens[2]();return prob(`점 I가 △ABC의 내심이고 ∠IAB = ${a}°, ∠IBC = ${b0}°일 때, ∠ICA의 크기는?`,inp(x,'°'),'∠IAB + ∠IBC + ∠ICA = 90°',`90° − ${a}° − ${b0}° = <b>${x}°</b>`)},
 ()=>{const r=R(1,5),l=R(6,20)*2;return prob(`△ABC의 내접원의 반지름이 ${r} cm이고 세 변의 길이의 합이 ${l} cm일 때, △ABC의 넓이는?`,inp(r*l/2,'cm²'),'넓이 = ½ × r × (둘레)',`${fs3(1,2)} × ${r} × ${l} = <b>${r*l/2} cm²</b>`)},
 ()=>{const d=R(2,8);return prob(`점 I가 △ABC의 내심이고, 점 I에서 변 AB까지의 거리가 ${d} cm일 때 점 I에서 변 BC까지의 거리는?`,inp(d,'cm'),'내심에서 세 변까지의 거리는 같아요.',`<b>${d} cm</b>`)}
]);

T(22,5,'평행사변형',[
 {t:'평행사변형',b:`<p>두 쌍의 대변이 각각 평행한 사각형이에요.</p>${geo(PARA,['AB','BC','CD','DA',['A','C','dash'],['B','D','dash']],{main:['A','B','C','D']})}`},
 {t:'평행사변형의 성질',b:`<ol class="big"><li>두 쌍의 대변의 길이가 각각 같다. (AB = DC, AD = BC)</li><li>두 쌍의 대각의 크기가 각각 같다. (∠A = ∠C, ∠B = ∠D)</li><li>두 대각선은 서로를 이등분한다. (OA = OC, OB = OD)</li></ol><p class="tip">이웃한 두 각의 합은 180°예요.</p>`},
 {t:'평행사변형이 되는 조건',b:`<ul class="big"><li>두 쌍의 대변이 각각 평행</li><li>두 쌍의 대변의 길이가 각각 같음</li><li>두 쌍의 대각의 크기가 각각 같음</li><li>두 대각선이 서로를 이등분</li><li>한 쌍의 대변이 평행하고 그 길이가 같음</li></ul>`}
],[
 ()=>{const A=R(50,130);const ask=Math.random()<.5;return prob(`평행사변형 ABCD에서 ∠A = ${A}°일 때, ∠${ask?'C':'B'}의 크기는?`,inp(ask?A:180-A,'°'),ask?'대각의 크기는 같아요.':'이웃한 두 각의 합은 180°',ask?`∠C = ∠A = <b>${A}°</b>`:`180° − ${A}° = <b>${180-A}°</b>`,geo(PARA,['AB','BC','CD','DA'],{main:['A','B','C','D'],hide:['O']}))},
 ()=>{const x=R(1,8),a=R(2,4),c=RZ(-3,5);const val=a*x+c;if(val<=0)return TOPICS[22].gens[1]();return prob(`평행사변형 ABCD에서 AD = (${lin(a,c)}) cm, BC = ${val} cm일 때, ${X}의 값은?`,inp(x),'대변의 길이는 같아요.',`${lin(a,c)} = ${val} → ${X} = <b>${x}</b>`,geo(PARA,['AB','BC','CD','DA'],{main:['A','B','C','D'],hide:['O']}))},
 ()=>{const ac=R(3,10)*2;return prob(`평행사변형 ABCD에서 두 대각선의 교점을 O라 할 때, AC = ${ac} cm이면 AO의 길이는?`,inp(ac/2,'cm'),'대각선은 서로를 이등분해요.',`${ac} ÷ 2 = <b>${ac/2} cm</b>`,geo(PARA,['AB','BC','CD','DA',['A','C','acc'],['B','D','dash']],{main:['A','B','C','D']}))},
 ()=>{const goods=['두 쌍의 대변의 길이가 각각 같다.','두 대각선이 서로를 이등분한다.','두 쌍의 대각의 크기가 각각 같다.','한 쌍의 대변이 평행하고 그 길이가 같다.'];const bads=['한 쌍의 대변만 평행하다.','두 대각선의 길이가 같다.','이웃한 두 변의 길이가 같다.','한 쌍의 대각의 크기만 같다.'];return prob('□ABCD가 평행사변형이 되는 조건은?',mc(pick(goods),shuf(bads).slice(0,3)),'평행사변형이 되는 5가지 조건을 떠올려요.','평행사변형이 되는 조건 5가지 중 하나예요. 한 쌍만 평행하면 사다리꼴일 수도 있어요.')}
]);

T(23,5,'여러 가지 사각형',[
 {t:'사각형 가족',b:`${tableHTML(['사각형','정의'],[['직사각형','네 내각의 크기가 모두 같은 사각형'],['마름모','네 변의 길이가 모두 같은 사각형'],['정사각형','네 변의 길이와 네 내각의 크기가 모두 같은 사각형'],['등변사다리꼴','밑변의 양 끝 각의 크기가 같은 사다리꼴']])}`},
 {t:'대각선의 성질',b:`${tableHTML(['사각형','대각선의 성질'],[['평행사변형','서로 이등분'],['직사각형','길이가 같고 서로 이등분'],['마름모','서로 수직이등분'],['정사각형','길이가 같고 서로 수직이등분'],['등변사다리꼴','길이가 같다']])}`},
 {t:'평행사변형이 다른 사각형이 되려면',b:`<ul class="big"><li>한 내각이 직각 또는 두 대각선의 길이가 같다 → <b>직사각형</b></li><li>이웃한 두 변의 길이가 같다 또는 두 대각선이 수직 → <b>마름모</b></li></ul>`}
],[
 ()=>{const C=[['네 내각의 크기가 모두 같은 사각형','직사각형'],['네 변의 길이가 모두 같은 사각형','마름모'],['두 대각선이 서로 수직이등분하는 사각형','마름모'],['두 대각선의 길이가 같고 서로 수직이등분하는 사각형','정사각형'],['밑변의 양 끝 각의 크기가 같은 사다리꼴','등변사다리꼴']];const c=pick(C);return prob(`다음 설명에 알맞은 사각형은?<div class="qbox">${c[0]}</div>`,mc(c[1],['직사각형','마름모','정사각형','등변사다리꼴','평행사변형'].filter(x=>x!==c[1])),'정의와 대각선의 성질을 떠올려요.',`<b>${c[1]}</b>`)},
 ()=>{const C=[['평행사변형 ABCD에서 ∠A = 90°이면','직사각형'],['평행사변형 ABCD에서 AB = BC이면','마름모'],['평행사변형 ABCD에서 두 대각선의 길이가 같으면','직사각형'],['평행사변형 ABCD에서 두 대각선이 서로 수직이면','마름모']];const c=pick(C);return prob(`${c[0]} □ABCD는 어떤 사각형일까요?`,mc(c[1],['직사각형','마름모','정사각형','사다리꼴'].filter(x=>x!==c[1])),'각에 대한 조건 → 직사각형, 변에 대한 조건 → 마름모',`<b>${c[1]}</b>`)},
 ()=>{const Tt=['정사각형은 직사각형이다.','정사각형은 마름모이다.','직사각형은 평행사변형이다.','마름모의 두 대각선은 서로 수직이다.'];const Ff=[['직사각형은 정사각형이다.','네 변의 길이가 같아야 정사각형이에요.'],['마름모의 두 대각선의 길이는 항상 같다.','같지 않을 수 있어요.'],['평행사변형은 직사각형이다.','네 각이 직각이어야 해요.'],['사다리꼴은 평행사변형이다.','사다리꼴은 한 쌍만 평행해요.']];const f=pick(Ff);return prob('다음 중 <b>옳지 않은</b> 것은?',mc(f[0],shuf(Tt).slice(0,3)),'포함 관계: 정사각형 ⊂ 직사각형, 마름모 ⊂ 평행사변형',`“${f[0]}” → ${f[1]}`)},
 ()=>{const d=R(3,12)*2;const ask=Math.random()<.5;return prob(ask?`직사각형 ABCD에서 대각선 AC의 길이가 ${d} cm일 때, BD의 길이는?`:`마름모 ABCD에서 두 대각선이 이루는 각의 크기는?`,inp(ask?d:90,ask?'cm':'°'),ask?'직사각형의 두 대각선은 길이가 같아요.':'마름모의 두 대각선은 서로 수직이에요.',ask?`BD = AC = <b>${d} cm</b>`:'<b>90°</b>')}
]);

T(24,6,'닮은 도형',[
 {t:'닮음',b:`<p>한 도형을 일정한 비율로 <b>확대하거나 축소</b>한 도형이 다른 도형과 합동일 때, 두 도형은 닮음이에요.</p><div class="ex big-ex">△ABC ∽ △DEF</div><p class="tip">합동(≡)처럼 대응하는 꼭짓점 순서대로 써요.</p>`},
 {t:'닮음의 성질',b:`<ul class="big"><li>대응변의 길이의 비는 일정해요. → <b>닮음비</b></li><li>대응각의 크기는 각각 같아요.</li></ul><div class="ex">AB = 4, DE = 6 → 닮음비 4 : 6 = <b>2 : 3</b></div>`},
 {t:'항상 닮은 도형',b:`<p>두 원, 두 정삼각형, 두 정사각형, 두 구, 변의 개수가 같은 두 정다각형은 <b>항상</b> 닮음이에요.</p>`}
],[
 ()=>{let a,c;do{a=R(2,9);c=R(2,9)}while(a===c);const k=R(1,3);const g=gcd(a,c);return prob(`△ABC ∽ △DEF이고 AB = ${a*k} cm, DE = ${c*k} cm일 때, △ABC와 △DEF의 닮음비는?`,mc(`${a/g} : ${c/g}`,[`${c/g} : ${a/g}`,`${a*k} : ${c}`,`1 : ${c*k}`]),'대응변의 길이의 비예요.',`${a*k} : ${c*k} = <b>${a/g} : ${c/g}</b>`)},
 ()=>{let a,c;do{a=R(1,5);c=R(1,5)}while(a===c);const t=R(1,4);return prob(`△ABC ∽ △DEF이고 닮음비가 ${a} : ${c}예요. BC = ${a*t} cm일 때 EF의 길이는?`,inp(c*t,'cm'),'BC : EF = '+a+' : '+c,`${a} : ${c} = ${a*t} : EF → EF = <b>${c*t} cm</b>`)},
 ()=>{const B=R(40,80);return prob(`△ABC ∽ △DEF이고 ∠B = ${B}°일 때, ∠E의 크기는?`,inp(B,'°'),'대응각의 크기는 같아요.',`∠E = ∠B = <b>${B}°</b>`)},
 ()=>{const ok=pick(['두 원','두 정삼각형','두 정사각형','두 구']);return prob('다음 중 <b>항상 닮은 도형</b>인 것은?',mc(ok,['두 직사각형','두 이등변삼각형','두 마름모','두 직각삼각형']),'모양이 하나로 정해지는 도형을 찾아요.',`<b>${ok}</b>는 크기만 다를 뿐 모양이 항상 같아요.`)},
 ()=>{const perm=pick(['DEF','EFD','FDE']);return prob(`△ABC ∽ △${perm}일 때, 변 AB의 대응변은?`,mc(perm[0]+perm[1],[perm[1]+perm[2],perm[2]+perm[0],'AC']),'꼭짓점을 쓴 순서대로 대응해요.',`A↔${perm[0]}, B↔${perm[1]} → <b>${perm[0]+perm[1]}</b>`)}
]);

T(25,6,'삼각형의 닮음 조건',[
 {t:'세 가지 닮음 조건',b:`${tableHTML(['조건','뜻'],[['<b>SSS</b> 닮음','세 쌍의 대응변의 길이의 비가 같다'],['<b>SAS</b> 닮음','두 쌍의 대응변의 길이의 비가 같고, 그 끼인각의 크기가 같다'],['<b>AA</b> 닮음','두 쌍의 대응각의 크기가 각각 같다']])}<p class="tip">AA 닮음이 가장 많이 쓰여요!</p>`},
 {t:'겹쳐진 삼각형',b:`${geo({A:[170,30],B:[50,210],C:[300,210],D:[98,138],E:[230,138]},['AB','BC','CA',['D','E','acc']],{main:['A','B','C']})}<p>∠A는 공통, ∠ADE = ∠ABC이면 △ADE ∽ △ABC (AA 닮음)</p>`}
],[
 ()=>{const k=R(2,3);const [a,b0,c]=pick([[2,3,4],[3,4,5],[4,5,6],[3,5,7],[2,4,5],[5,6,8]]);const C=[[`AB = ${a*k}, BC = ${b0*k}, CA = ${c*k}<br>DE = ${a}, EF = ${b0}, FD = ${c}`,'SSS 닮음'],[`AB = ${a*k}, BC = ${b0*k}, ∠B = 50°<br>DE = ${a}, EF = ${b0}, ∠E = 50°`,'SAS 닮음'],[`∠A = 60°, ∠B = 70°<br>∠D = 60°, ∠E = 70°`,'AA 닮음']];const c0=pick(C);return prob(`△ABC와 △DEF가 다음과 같을 때, 닮음 조건은?<div class="qbox">${c0[0]}</div>`,mcFixed(['SSS 닮음','SAS 닮음','AA 닮음'],['SSS 닮음','SAS 닮음','AA 닮음'].indexOf(c0[1])),'변의 비인지, 각인지 확인해요.',`<b>${c0[1]}</b>`)},
 ()=>{const ad=R(2,6),k=R(2,3),de=R(2,7);const ab=ad*k,bc=de*k;return prob(`△ABC에서 변 AB, AC 위의 점 D, E에 대하여 ∠ADE = ∠ABC예요. AD = ${ad} cm, AB = ${ab} cm, DE = ${de} cm일 때, BC의 길이는?`,inp(bc,'cm'),'△ADE ∽ △ABC (AA 닮음), 닮음비 AD : AB',`닮음비 ${ad} : ${ab} = 1 : ${k}<br>BC = ${de} × ${k} = <b>${bc} cm</b>`,geo({A:[170,30],B:[50,210],C:[300,210],D:[50+120*(1-1/k),210-180*(1-1/k)],E:[300-130*(1-1/k),210-180*(1-1/k)]},['AB','BC','CA',['D','E','acc']],{main:['A','B','C']}))},
 ()=>prob('두 삼각형에서 두 쌍의 대응각의 크기가 각각 같을 때의 닮음 조건은?',mc('AA 닮음',['SSS 닮음','SAS 닮음','RHA 닮음']),'A는 각(Angle)이에요.','<b>AA 닮음</b>')
]);

T(26,6,'평행선과 선분의 길이의 비',[
 {t:'삼각형에서 평행선',b:`${geo({A:[170,30],B:[50,210],C:[300,210],D:[98,138],E:[230,138]},['AB','BC','CA',['D','E','acc']],{main:['A','B','C']})}<p>DE // BC이면</p><div class="ex">AD : AB = AE : AC = DE : BC<br>AD : DB = AE : EC</div>`},
 {t:'삼각형의 중점연결정리',b:`<p>두 변의 중점 M, N을 이은 선분은 나머지 한 변과 <b>평행</b>하고, 길이는 그 변의 <mark>${fs3(1,2)}</mark>이에요.</p><div class="ex">BC = 10 cm → MN = <b>5 cm</b></div>`},
 {t:'평행선 사이의 선분',b:`<p>세 평행선 ${v('l')}, ${v('m')}, ${v('n')}이 두 직선과 만날 때 <b>${A_} : ${B_} = ${v('c')} : ${v('d')}</b></p>`}
],[
 ()=>{const a=R(1,6),b0=R(1,6),k=R(1,3);const c=a*k;return prob(`△ABC에서 DE // BC이고 AD = ${a} cm, DB = ${b0} cm, AE = ${c} cm일 때, EC의 길이는?`,inp(b0*k,'cm'),'AD : DB = AE : EC',`${a} : ${b0} = ${c} : EC → EC = <b>${b0*k} cm</b>`,geo({A:[170,30],B:[50,210],C:[300,210],D:[170-120*a/(a+b0),30+180*a/(a+b0)],E:[170+130*a/(a+b0),30+180*a/(a+b0)]},['AB','BC','CA',['D','E','acc']],{main:['A','B','C'],sides:[['AD',a],['DB',b0],['AE',c]]}))},
 ()=>{const ad=R(1,4),db=R(1,4);const k=R(1,3);const bc=(ad+db)*k;return prob(`△ABC에서 DE // BC이고 AD = ${ad} cm, DB = ${db} cm, BC = ${bc} cm일 때, DE의 길이는?`,inp(ad*k,'cm'),'AD : AB = DE : BC (AB = AD + DB)',`${ad} : ${ad+db} = DE : ${bc} → DE = <b>${ad*k} cm</b>`)},
 ()=>{const bc=R(2,12)*2;const ask=Math.random()<.5;return ask?prob(`△ABC에서 두 변 AB, AC의 중점을 각각 M, N이라 해요. BC = ${bc} cm일 때, MN의 길이는?`,inp(bc/2,'cm'),'중점연결정리: MN = ½BC',`${bc} ÷ 2 = <b>${bc/2} cm</b>`):prob(`△ABC에서 두 변 AB, AC의 중점을 각각 M, N이라 해요. MN = ${bc/2} cm일 때, BC의 길이는?`,inp(bc,'cm'),'MN = ½BC',`${bc/2} × 2 = <b>${bc} cm</b>`)},
 ()=>{const a=R(2,6),b0=R(2,6),k=R(1,3);return prob(`세 직선 ${v('l')} // ${v('m')} // ${v('n')}이 두 직선과 만나서 생긴 선분의 길이가 각각 ${a}, ${b0}와 ${a*k}, ${X}일 때, ${X}의 값은?`,inp(b0*k),`${a} : ${b0} = ${a*k} : ${X}`,`${a}${X} = ${b0} × ${a*k} → ${X} = <b>${b0*k}</b>`,parFig3(a,b0,a*k))}
]);
function parFig3(a,b0,c){let s='';[40,110,200].forEach((y,i)=>{s+=ln(20,y,340,y);s+=tx(350,y,[v('l'),v('m'),v('n')][i],'t')});s+=ln(80,20,120,220)+ln(200,20,300,220);s+=tx(78,75,a,'t sm acc-t')+tx(90,155,b0,'t sm acc-t')+tx(240,75,c,'t sm acc-t')+tx(275,155,v('x'),'t sm acc-t');return SV(370,230,s)}

T(27,6,'삼각형의 무게중심',[
 {t:'중선과 무게중심',b:`<p><b>중선</b>: 꼭짓점과 대변의 중점을 이은 선분<br>세 중선은 한 점(<b>무게중심 G</b>)에서 만나요.</p>${geo({...TRI,D:[180,205],G:[180,147]},['AB','BC','CA',['A','D','acc']],{main:['A','B','C']})}`},
 {t:'2 : 1로 나눠요',b:`<div class="ex big-ex">AG : GD = 2 : 1</div><div class="ex">AD = 9 cm → AG = 6 cm, GD = 3 cm</div>`},
 {t:'넓이',b:`<p>세 중선은 삼각형의 넓이를 <b>6등분</b>해요.</p><div class="ex">△GAB = △GBC = △GCA = ${fs3(1,3)}△ABC</div>`}
],[
 ()=>{const k=R(1,8);return prob(`점 G가 △ABC의 무게중심이고 중선 AD의 길이가 ${3*k} cm일 때, AG의 길이는?`,inp(2*k,'cm'),'AG : GD = 2 : 1',`${3*k} × ${fs3(2,3)} = <b>${2*k} cm</b>`,geo({...TRI,D:[180,205],G:[180,147]},['AB','BC','CA',['A','D','acc']],{main:['A','B','C']}))},
 ()=>{const g=R(1,8);return prob(`점 G가 △ABC의 무게중심이고 GD = ${g} cm일 때, AG의 길이는? (D는 BC의 중점)`,inp(2*g,'cm'),'AG = 2 × GD',`2 × ${g} = <b>${2*g} cm</b>`)},
 ()=>{const S=R(2,12)*6;const ask=Math.random()<.5;return prob(`점 G가 넓이 ${S} cm²인 △ABC의 무게중심일 때, ${ask?'△GAB':'△GBD (D는 BC의 중점)'}의 넓이는?`,inp(ask?S/3:S/6,'cm²'),ask?'△GAB = ⅓△ABC':'세 중선이 넓이를 6등분해요.',`${S} ÷ ${ask?3:6} = <b>${ask?S/3:S/6} cm²</b>`)},
 ()=>prob('삼각형의 무게중심은 무엇의 교점일까요?',mc('세 중선',['세 내각의 이등분선','세 변의 수직이등분선','세 높이']),'중선 = 꼭짓점과 대변의 중점을 이은 선분','무게중심 = <b>세 중선</b>의 교점')
]);

const TRIPLES=[[3,4,5],[5,12,13],[8,15,17],[6,8,10],[7,24,25],[9,12,15]];
function rtFig(a,b0,c,hide){const P_={C:[60,200],B:[300,200],A:[60,60]};return geo(P_,['AB','BC','CA'],{main:['A','B','C'],sides:[['CB',hide==='a'?v('x'):a],['CA',hide==='b'?v('x'):b0],['AB',hide==='c'?v('x'):c]],texts:[]})}
T(28,6,'피타고라스 정리',[
 {t:'피타고라스 정리',b:`<p>직각삼각형에서 직각을 낀 두 변의 길이를 ${A_}, ${B_}, 빗변의 길이를 ${v('c')}라 하면</p><div class="ex big-ex">${A_}<sup>2</sup> + ${B_}<sup>2</sup> = ${v('c')}<sup>2</sup></div>${rtFig('a','b','c')}`},
 {t:'예제',b:`<div class="ex">직각을 낀 두 변이 3, 4 → 3<sup>2</sup> + 4<sup>2</sup> = 25 = 5<sup>2</sup> → 빗변 <b>5</b><br>빗변 13, 한 변 5 → 13<sup>2</sup> − 5<sup>2</sup> = 144 = 12<sup>2</sup> → <b>12</b></div><p class="tip">자주 나오는 수: (3, 4, 5), (5, 12, 13), (6, 8, 10), (8, 15, 17)</p>`},
 {t:'직각삼각형 판별',b:`<p>세 변의 길이가 ${A_}, ${B_}, ${v('c')}(가장 긴 변)일 때 ${A_}<sup>2</sup> + ${B_}<sup>2</sup> = ${v('c')}<sup>2</sup>이면 직각삼각형이에요.</p>`}
],[
 ()=>{const t=pick(TRIPLES);const k=pick([1,1,2]);const [a,b0,c]=t.map(x=>x*k);return prob('그림의 직각삼각형에서 빗변의 길이 '+X+'는?',inp(c,'cm'),'a² + b² = c²',`${a}<sup>2</sup> + ${b0}<sup>2</sup> = ${a*a+b0*b0} = ${c}<sup>2</sup> → <b>${c} cm</b>`,rtFig(a+' cm',b0+' cm','','c'))},
 ()=>{const t=pick(TRIPLES);const [a,b0,c]=t;return prob('그림의 직각삼각형에서 '+X+'의 값은?',inp(a),'c² − b² = a²',`${c}<sup>2</sup> − ${b0}<sup>2</sup> = ${c*c-b0*b0} = ${a}<sup>2</sup> → <b>${a}</b>`,rtFig('',b0,c,'a'))},
 ()=>{const t=pick(TRIPLES);const ok=t.join(', ');const bad=[[t[0],t[1],t[2]+1],[t[0]+1,t[1],t[2]],[2,3,4],[4,5,6]].map(x=>x.join(', '));return prob('세 변의 길이가 다음과 같은 삼각형 중 <b>직각삼각형</b>인 것은?',mc(ok,bad),'가장 긴 변의 제곱 = 나머지 두 변의 제곱의 합?',`${t[0]}<sup>2</sup> + ${t[1]}<sup>2</sup> = ${t[0]**2+t[1]**2} = ${t[2]}<sup>2</sup> ✔ → <b>${ok}</b>`)},
 ()=>{const p=R(2,20),q=R(2,20);return prob(`직각삼각형의 직각을 낀 두 변 위에 그린 정사각형의 넓이가 각각 ${p} cm², ${q} cm²일 때, 빗변 위에 그린 정사각형의 넓이는?`,inp(p+q,'cm²'),'a² + b² = c² 이므로 넓이를 더해요.',`${p} + ${q} = <b>${p+q} cm²</b>`)},
 ()=>{const t=pick(TRIPLES.filter(x=>x[0]<=9));return prob(`가로 ${t[1]} cm, 세로 ${t[0]} cm인 직사각형의 대각선의 길이는?`,inp(t[2],'cm'),'대각선은 직각삼각형의 빗변이에요.',`√(${t[1]}<sup>2</sup> + ${t[0]}<sup>2</sup>) → ${t[0]**2+t[1]**2} = ${t[2]}<sup>2</sup> → <b>${t[2]} cm</b>`)}
]);

// ---------- PART 7 ----------
const fact=n=>n<=1?1:n*fact(n-1);
T(29,7,'경우의 수',[
 {t:'사건과 경우의 수',b:`<p><b>사건</b>: 실험이나 관찰의 결과<br><b>경우의 수</b>: 사건이 일어나는 가짓수</p><div class="ex">주사위 1개를 던질 때 짝수의 눈이 나오는 경우: 2, 4, 6 → <b>3가지</b></div>`},
 {t:'합의 법칙과 곱의 법칙',b:`<ul class="big"><li><b>또는</b> (동시에 일어나지 않음) → <mark>더하기</mark><br>버스 3가지 또는 지하철 2가지 → 3 + 2 = 5</li><li><b>동시에(그리고)</b> → <mark>곱하기</mark><br>티셔츠 3벌과 바지 2벌을 짝지어 입기 → 3 × 2 = 6</li></ul>`},
 {t:'자주 나오는 경우의 수',b:`${tableHTML(['상황','경우의 수'],[['동전 n개 던지기','2 × 2 × … = 2<sup>n</sup>'],['주사위 2개 던지기','6 × 6 = 36'],['n명을 한 줄로 세우기','n × (n−1) × … × 1'],['n명 중 회장, 부회장 뽑기','n × (n−1)'],['n명 중 대표 2명 뽑기','n × (n−1) ÷ 2']])}`}
],[
 ()=>{const C=[['짝수',[2,4,6]],['홀수',[1,3,5]],['3의 배수',[3,6]],['소수',[2,3,5]],['4 이상',[4,5,6]],['6의 약수',[1,2,3,6]]];const c=pick(C);return prob(`주사위 한 개를 던질 때, <b>${c[0]}</b>의 눈이 나오는 경우의 수는?`,inp(c[1].length,'가지'),'1부터 6까지 하나씩 확인해요.',`${c[1].join(', ')} → <b>${c[1].length}가지</b>`)},
 ()=>{const s=R(2,12);const pr=[];for(let a=1;a<=6;a++)for(let b0=1;b0<=6;b0++)if(a+b0===s)pr.push(`(${a}, ${b0})`);return prob(`서로 다른 두 주사위를 동시에 던질 때, 나온 눈의 수의 합이 ${s}인 경우의 수는?`,inp(pr.length,'가지'),'(첫 번째, 두 번째) 순서쌍으로 세어요.',`${pr.join(', ')} → <b>${pr.length}가지</b>`)},
 ()=>{const a=R(2,6),b0=R(2,6);const t=Math.random()<.5;return t?prob(`티셔츠 ${a}벌과 바지 ${b0}벌 중에서 티셔츠와 바지를 하나씩 골라 입는 경우의 수는?`,inp(a*b0,'가지'),'동시에 → 곱의 법칙',`${a} × ${b0} = <b>${a*b0}가지</b>`):prob(`도서관에 가는 버스 노선이 ${a}가지, 지하철 노선이 ${b0}가지 있어요. 버스 또는 지하철로 가는 경우의 수는?`,inp(a+b0,'가지'),'또는 → 합의 법칙',`${a} + ${b0} = <b>${a+b0}가지</b>`)},
 ()=>{const n=R(3,6);const t=R(0,2);if(t===0)return prob(`${n}명을 한 줄로 세우는 경우의 수는?`,inp(fact(n),'가지'),`${n} × ${n-1} × … × 1`,`${Array.from({length:n},(_,i)=>n-i).join(' × ')} = <b>${fact(n)}가지</b>`);if(t===1)return prob(`${n}명 중에서 회장 1명, 부회장 1명을 뽑는 경우의 수는?`,inp(n*(n-1),'가지'),'순서가 있어요: n × (n−1)',`${n} × ${n-1} = <b>${n*(n-1)}가지</b>`);return prob(`${n}명 중에서 대표 2명을 뽑는 경우의 수는?`,inp(n*(n-1)/2,'가지'),'순서가 없어요: n × (n−1) ÷ 2',`${n} × ${n-1} ÷ 2 = <b>${n*(n-1)/2}가지</b>`)},
 ()=>{const n=R(1,4);return prob(`동전 ${n}개를 동시에 던질 때 일어나는 모든 경우의 수는?`,inp(2**n,'가지'),'동전 하나마다 앞, 뒤 2가지',`${Array(n).fill(2).join(' × ')} = <b>${2**n}가지</b>`)},
 ()=>{const n=R(3,6);return prob(`1부터 ${n}까지의 숫자가 적힌 카드 ${n}장 중 2장을 뽑아 만들 수 있는 두 자리 자연수의 개수는?`,inp(n*(n-1),'개'),'십의 자리 '+n+'가지, 일의 자리 '+(n-1)+'가지',`${n} × ${n-1} = <b>${n*(n-1)}개</b>`)}
]);

T(30,7,'확률',[
 {t:'확률',b:`<div class="ex big-ex">(확률) = ${fs3('(사건이 일어나는 경우의 수)','(모든 경우의 수)')}</div><div class="ex">주사위에서 짝수가 나올 확률 = ${fs3(3,6)} = ${fr(1,2)}</div>`},
 {t:'확률의 성질',b:`<ul class="big"><li>0 ≤ (확률) ≤ 1</li><li>반드시 일어나는 사건 → <b>1</b></li><li>절대 일어나지 않는 사건 → <b>0</b></li><li>(어떤 사건이 일어나지 않을 확률) = 1 − (일어날 확률)</li></ul>`},
 {t:'확률의 계산',b:`<ul class="big"><li>A <b>또는</b> B (동시에 안 일어남) → 확률을 <b>더해요</b></li><li>A <b>그리고</b> B (서로 영향 없음) → 확률을 <b>곱해요</b></li></ul><div class="ex">동전은 앞면, 주사위는 짝수 → ${fr(1,2)} × ${fr(1,2)} = ${fr(1,4)}</div>`}
],[
 ()=>{const r=R(1,7),b0=R(1,7);const ask=Math.random()<.5;return prob(`주머니에 빨간 공 ${r}개, 파란 공 ${b0}개가 들어 있어요. 공 한 개를 꺼낼 때 <b>${ask?'빨간':'파란'} 공</b>이 나올 확률은?<div class="cap">분수로 입력 (예: 3/5)</div>`,inp(Q(ask?r:b0,r+b0)),'(해당 공의 수) ÷ (전체 공의 수)',`${fs3(ask?r:b0,r+b0)}${gcd(ask?r:b0,r+b0)>1?' = '+fr(ask?r:b0,r+b0):''} → <b>${fr(ask?r:b0,r+b0)}</b>`)},
 ()=>{const C=[['짝수',3],['3의 배수',2],['5 이상',2],['소수',3],['6의 약수',4],['7 이상',0],['6 이하',6]];const c=pick(C);return prob(`주사위 한 개를 던질 때, ${c[0]}의 눈이 나올 확률은?<div class="cap">분수 또는 정수로 입력</div>`,inp(Q(c[1],6)),'경우의 수 ÷ 6',`${fs3(c[1],6)} = <b>${fr(c[1],6)}</b>`)},

 else fb(`<div class="fb no"><div class="fb-h">정답은 <span class="ansv">${ansText(p)}</span></div>${S.mode==='speed'?'':`<div class="fb-ex open"><b>풀이</b><div>${p.ex}</div></div><div class="cap">오답노트에 저장했어요. 다시 풀어서 맞히면 졸업!</div>`}${nextBtn}</div>`);

function end(){
 clearInterval(TIMER);const r={mode:S.mode,score:S.score,total:S.total,xp:S.xp,maxCombo:S.maxCombo,wrongN:S.wrongN,grad:S.grad,tid:S.tid,pid:S.pid,stars:0,newBest:false,win:false,opt:S.opt};

 case 'mix':start('mix');break;
 case 'boss':start('boss',{pid:+el.dataset.p});break;
 case 'review':{const ids=el.dataset.ids.split(',');const notes=ids.map(id=>D.wrong.find(w=>w.id===id)).filter(Boolean);if(notes.length)start('review',{notes});break}
 case 'notes':go('notes',{tid:tid||0});break;
 case 'nfilter':go('notes',{part:+el.dataset.p});break;
 case 'records':go('records');break;
 case 'sound':D.sound=!D.sound;save();render();if(D.sound)sfx('ok');break;
 case 'pick':submit(+el.dataset.i);break;
 case 'submit':submit(document.getElementById('ans').value);break;
 case 'key':{const i=document.getElementById('ans');if(!i||i.disabled)break;const k=el.dataset.k;if(k==='back')i.value=i.value.slice(0,-1);else if(k==='-'){i.value=i.value.startsWith('-')?i.value.slice(1):'-'+i.value}else i.value+=k;if(!matchMedia('(pointer:coarse)').matches)i.focus();break}
 case 'hint':{const hb=document.getElementById('hintbox');if(hb){hb.hidden=false;el.remove()}break}
 case 'next':next();break;
 case 'quit':if(!quitArm){quitArm=true;el.textContent='정말 그만둘까요? 한 번 더 누르면 종료';el.classList.add('arm');setTimeout(()=>{quitArm=false;const q=document.getElementById('quitbtn');if(q){q.textContent='✕ 그만하기';q.classList.remove('arm')}},3000)}else{quitArm=false;clearInterval(TIMER);const back=S&&S.tid?{tid:S.tid}:null;S=null;back?go('topic',{tid:back.tid,tab:'quiz'}):go('home')}break;
 case 'ndel':{const id=el.dataset.id;if(delArm!==id){delArm=id;el.textContent='정말 지울까요?';el.classList.add('arm');setTimeout(()=>{if(delArm===id)delArm=null},3000)}else{D.wrong=D.wrong.filter(w=>w.id!==id);delArm=null;save();render()}break}
 case 'rename':{const v=document.getElementById('nm').value.trim();if(v){D.name=v;save();toast('이름을 바꿨어요');render()}break}
 case 'setname':{const v=(document.getElementById('nmfirst').value||'').trim()||'수학 탐험가';D.name=v;save();document.getElementById('namebox')?.remove();render();break}
 case 'reset':if(!resetArm){resetArm=true;el.textContent='정말 모든 기록을 지울까요? 한 번 더 누르세요';setTimeout(()=>{resetArm=false},4000)}else{resetArm=false;const snd=D.sound;D=clone(DEF);D.sound=snd;save();go('home')}break;
 }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nmfirst')document.querySelector('[data-act="setname"]')?.click();if(view==='run'&&S&&!S.answered&&cur().type==='choice'&&/^[1-5]$/.test(e.key)){const k=+e.key-1;if(k<cur().choices.length){const bt=document.querySelector(`.ch[data-i="${k}"]`);if(bt&&!bt.disabled)submit(k)}}});
render();

</script>

</body></html>
