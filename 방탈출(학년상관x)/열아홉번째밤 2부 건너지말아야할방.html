<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>열아홉 번째 밤 2부 — 건너지 말아야 할 방</title>
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--ink:#07080b;--ink2:#101218;--panel:#15181f;--panel2:#1d212a;--line:#343a46;--text:#e9e6df;--muted:#9a978e;--accent:#d9b25c;--accent2:#f0d590;
  --red:#d9485a;--green:#5fbf8a;--font:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","맑은 고딕","Noto Sans KR",system-ui,sans-serif;}
html,body{margin:0;height:100%;background:var(--ink);color:var(--text);font-family:var(--font);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
button{font-family:inherit;cursor:pointer}
#game{position:fixed;inset:0}
#game canvas{display:block}
#hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 10px;z-index:20;background:linear-gradient(#000c,#0000);pointer-events:none}
#hud>*{pointer-events:auto}
#hud .zone{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1;letter-spacing:.02em}
#hud .zone small{display:block;font-weight:500;font-size:11px;color:var(--muted)}
.fear{display:flex;gap:3px;align-items:center;background:#0009;border:1px solid var(--line);border-radius:20px;padding:4px 9px}
.fear b{font-size:11px;color:var(--muted);margin-right:3px;font-weight:600}
.fear i{width:9px;height:12px;display:block;background:#2a2e38;clip-path:polygon(50% 100%,0 35%,15% 5%,50% 22%,85% 5%,100% 35%);transition:.3s}
.fear i.on{background:var(--red);filter:drop-shadow(0 0 4px var(--red))}
.fear.beat{animation:beat .5s}
@keyframes beat{30%{transform:scale(1.18)}}
.timer{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);background:#0009;border:1px solid var(--line);border-radius:20px;padding:4px 9px}
.hbtn{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;font-weight:700;white-space:nowrap}
.hbtn:hover{border-color:var(--accent)}
@media (max-width:560px){#hud{gap:5px;padding:6px}.timer{display:none}.hbtn{padding:6px 7px;font-size:12px}.fear b{display:none}#hud .zone{font-size:13px}}
#prompt{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:15;background:#000c;border:1px solid var(--accent);color:var(--accent2);padding:7px 14px;border-radius:12px;font-size:14px;font-weight:700;display:none;max-width:92vw;text-align:center;pointer-events:none}
#toasts{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(94vw,540px)}
.toast{background:#0d0f14f2;border:1px solid var(--line);border-left:4px solid #8a8f9c;padding:9px 14px;border-radius:10px;font-size:14px;box-shadow:0 6px 20px #000a;animation:tin .25s ease-out;line-height:1.5;width:100%}
.toast.bad{border-left-color:var(--red)}.toast.good{border-left-color:var(--green)}.toast.gold{border-left-color:var(--accent)}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#flash{position:fixed;inset:0;z-index:50;pointer-events:none;background:radial-gradient(transparent 35%,#5a0010cc);opacity:0;transition:opacity .6s}
#flash.on{opacity:1;transition:none}
#black{position:fixed;inset:0;z-index:55;background:#000;opacity:0;pointer-events:none;transition:opacity 1.2s;display:flex;align-items:center;justify-content:center;font-size:20px;color:#bbb;text-align:center;line-height:1.8;padding:20px}
#black.on{opacity:1;pointer-events:auto}
body.shake #game{animation:shk .35s}
@keyframes shk{20%{transform:translate(-8px,4px)}40%{transform:translate(7px,-5px)}60%{transform:translate(-5px,-3px)}80%{transform:translate(4px,3px)}}
.mwrap{position:fixed;inset:0;z-index:40;background:#000c;display:flex;align-items:center;justify-content:center;padding:12px}
.modal{background:linear-gradient(170deg,#1a1d24,#0e1015);border:1px solid var(--line);border-radius:14px;width:min(600px,100%);max-height:calc(100% - 10px);overflow:auto;padding:18px 18px 16px;box-shadow:0 20px 60px #000;position:relative;touch-action:pan-y}
.modal.wide{width:min(820px,100%)}
.modal h2{margin:0 34px 10px 0;font-size:19px;color:var(--accent2)}
.modal p{line-height:1.65;margin:6px 0}
.modal .muted{color:var(--muted);font-size:13px}
.mclose{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:18px;line-height:1}
.btn{background:var(--accent);color:#1b1400;border:0;border-radius:10px;padding:10px 16px;font-size:15px;font-weight:800}
.btn:hover{filter:brightness(1.1)}.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.menu-list button{text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:12px;padding:12px 14px;font-size:15px;font-weight:700}
.menu-list button:hover{border-color:var(--accent)}
.menu-list button small{display:block;font-weight:500;color:var(--muted);font-size:12px;margin-top:2px}
.paper{background:#ece4d0;color:#2b261c;border-radius:6px;padding:18px 20px;font-family:"Nanum Myeongjo","Batang",serif;line-height:1.9;font-size:15.5px;box-shadow:inset 0 0 40px #b8a98455, 0 6px 18px #0008;white-space:pre-line}
.paper.child{font-family:"Nanum Pen Script","Comic Sans MS",cursive;font-size:20px;line-height:1.6;background:#f6f1e3}
.paper .stamp{display:inline-block;border:3px solid #b3262f;color:#b3262f;font-weight:900;padding:2px 10px;transform:rotate(-8deg);font-family:var(--font);font-size:18px;margin-top:6px}
/* title */
#title{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;background:#000}
#title canvas{position:absolute;inset:0;width:100%;height:100%}
#title .tbox{position:relative;max-width:640px;width:100%;background:#000a;border:1px solid #2a2e38;border-radius:18px;padding:24px 22px;backdrop-filter:blur(2px)}
#title .ep{color:var(--accent);font-weight:800;letter-spacing:.2em;font-size:13px}
#title h1{margin:6px 0 4px;font-size:clamp(28px,6.4vw,44px);line-height:1.15;letter-spacing:.04em;text-shadow:0 0 18px #000}
#title .sub{color:var(--muted);margin-bottom:14px}
#title .story{line-height:1.75;font-size:15px;background:#ffffff07;border-left:3px solid var(--accent);padding:10px 14px;border-radius:8px}
#title .ctrl{font-size:13px;color:var(--muted);margin-top:12px;line-height:1.7}
#title kbd,.modal kbd{background:#252a34;border:1px solid #444b5a;border-bottom-width:2px;border-radius:5px;padding:0 5px;font-family:inherit;font-size:12px;color:#fff}
#title .row{margin-top:16px}
.warn{margin-top:10px;font-size:12.5px;color:#e8b4b4;border:1px dashed #6a3a3a;padding:6px 10px;border-radius:8px}
/* inventory */
#inv{position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:22;display:flex;gap:6px;padding:6px;background:#000b;border:1px solid var(--line);border-radius:14px;max-width:calc(100vw - 20px);overflow-x:auto}
#inv:empty{display:none}
.slot{width:64px;height:64px;border-radius:10px;background:#1a1e26;border:1px solid #333a48;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;color:var(--muted);position:relative;flex:none;padding:2px}
.slot canvas{width:40px;height:40px}
.slot.sel{border-color:var(--accent);box-shadow:0 0 0 2px #d9b25c66;background:#2a2618}
.slot .n{position:absolute;right:4px;top:3px;font-size:11px;font-weight:800;color:var(--accent2)}
@media (max-width:560px){.slot{width:54px;height:54px}.slot canvas{width:32px;height:32px}}
/* hints */
.hint-task{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.hint-task .ht{font-weight:800}
.hint-step{margin-top:6px;padding:8px 10px;border-radius:8px;background:#0b0d12;font-size:14px;line-height:1.55}
.hint-step.ans{border:1px solid var(--accent);color:var(--accent2)}
/* keypad / dials */
.kp-display{font-size:28px;letter-spacing:.3em;text-align:center;background:#050608;border:1px solid var(--line);border-radius:10px;padding:10px;min-height:56px;font-variant-numeric:tabular-nums;color:#ffb46a;font-family:ui-monospace,Consolas,monospace}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;max-width:300px;margin-left:auto;margin-right:auto}
.kp button{background:#232833;border:1px solid #3c4352;border-bottom-width:3px;color:#fff;border-radius:10px;padding:12px 0;font-size:20px;font-weight:800}
.kp button.fn{background:#33262a;font-size:14px}.kp button.ok{background:var(--accent);color:#1b1400;border-color:#a8822c}
.dials{display:flex;gap:10px;justify-content:center;margin:12px 0;flex-wrap:wrap}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{width:56px;height:30px;border-radius:8px;background:#232833;border:1px solid #3c4352;color:#fff;font-size:15px}
.dial .v{width:56px;height:60px;border-radius:10px;background:linear-gradient(#3a3226,#1c1812);border:2px solid #7a6a4a;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#f0d590;font-family:ui-monospace,Consolas,monospace}
.dial .sym{width:56px;height:46px;display:flex;align-items:center;justify-content:center}
/* touch */
#touch{position:fixed;left:0;right:0;bottom:84px;z-index:25;display:none;justify-content:space-between;align-items:flex-end;padding:10px;pointer-events:none}
body.touch #touch{display:flex}
#touch .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;pointer-events:auto}
#touch .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:60vw;pointer-events:auto}
#touch button{background:#ffffff14;border:1px solid #ffffff33;color:#fff;border-radius:14px;font-weight:800;font-size:14px;min-width:52px;min-height:52px;padding:4px 8px}
#touch button.on{background:#d9b25c55}
#touch .pad .e{visibility:hidden}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stats div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font-size:22px;color:var(--accent2)}
.stats span{font-size:12px;color:var(--muted)}
body:has(.mwrap) #toasts{bottom:auto;top:10px}

</style></head>
<body><div id="game"></div>
<script>/* 해바라기 시리즈 공통 엔진 — 공포 게이지 · 소리 · 가방 · 힌트 · 저장 */
(function(){
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const h=(tag,attrs={},html='')=>{const e=document.createElement(tag);for(const k in attrs){if(k==='on')for(const ev in attrs.on)e.addEventListener(ev,attrs.on[ev]);else e.setAttribute(k,attrs[k]);}if(html)e.innerHTML=html;return e;};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const fmt=t=>{t=Math.floor(t);const m=Math.floor(t/60),s=t%60;return (m<10?'0':'')+m+':'+(s<10?'0':'')+s;};
const TAU=Math.PI*2;

/* ================= SOUND (WebAudio 합성) ================= */
const Snd={ctx:null,master:null,muted:false,amb:null,noiseBuf:null,vol:0.8};
try{Snd.muted=localStorage.getItem('hb_mute')==='1';}catch(e){}
Snd.init=function(){
  if(Snd.ctx)return;try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;Snd.ctx=new AC();}catch(e){return;}
  const c=Snd.ctx;Snd.master=c.createGain();Snd.master.gain.value=Snd.muted?0:Snd.vol;
  const comp=c.createDynamicsCompressor();Snd.master.connect(comp);comp.connect(c.destination);
  const len=c.sampleRate*2;const b=c.createBuffer(1,len,c.sampleRate);const d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;Snd.noiseBuf=b;
  // 잔향
  const ir=c.createBuffer(2,c.sampleRate*2.2,c.sampleRate);for(let ch=0;ch<2;ch++){const x=ir.getChannelData(ch);for(let i=0;i<x.length;i++)x[i]=(Math.random()*2-1)*Math.pow(1-i/x.length,2.6);}
  Snd.verb=c.createConvolver();Snd.verb.buffer=ir;const vg=c.createGain();vg.gain.value=0.35;Snd.verb.connect(vg);vg.connect(Snd.master);
};
Snd.setMute=function(m){Snd.muted=m;try{localStorage.setItem('hb_mute',m?'1':'0');}catch(e){}if(Snd.master)Snd.master.gain.setTargetAtTime(m?0:Snd.vol,Snd.ctx.currentTime,0.05);};
function out(wet=0.3){const c=Snd.ctx;const g=c.createGain();g.connect(Snd.master);if(wet>0){const s=c.createGain();s.gain.value=wet;g.connect(s);s.connect(Snd.verb);}return g;}
function env(g,t,a,peak,d,sus=0){g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(0.0002,peak),t+a);g.gain.exponentialRampToValueAtTime(Math.max(0.0001,sus||0.0001),t+a+d);}
function noise(t,dur,filt,freq,q,peak,a=0.005,wet=0.3,f2){const c=Snd.ctx;const s=c.createBufferSource();s.buffer=Snd.noiseBuf;s.loop=true;const f=c.createBiquadFilter();f.type=filt;f.frequency.setValueAtTime(freq,t);if(f2)f.frequency.exponentialRampToValueAtTime(f2,t+dur);f.Q.value=q||1;const g=c.createGain();env(g,t,a,peak,dur);s.connect(f);f.connect(g);g.connect(out(wet));s.start(t,Math.random());s.stop(t+a+dur+0.05);return g;}
function tone(t,type,f0,f1,dur,peak,a=0.005,wet=0.3){const c=Snd.ctx;const o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);const g=c.createGain();env(g,t,a,peak,dur);o.connect(g);g.connect(out(wet));o.start(t);o.stop(t+a+dur+0.05);return o;}
const NOTE=n=>440*Math.pow(2,(n-69)/12);
Snd.play=function(name,opt={}){
  if(!Snd.ctx||Snd.muted)return;const c=Snd.ctx;if(c.state==='suspended')c.resume();const t=c.currentTime+0.01;
  switch(name){
    case 'thud':tone(t,'sine',90,38,0.5,0.9,0.003,0.25);noise(t,0.18,'lowpass',400,1,0.5);break;
    case 'slam':tone(t,'sine',70,30,0.9,1.0,0.002,0.6);noise(t,0.35,'lowpass',900,0.7,0.8,0.002,0.6);noise(t+0.02,0.25,'bandpass',2200,2,0.15);break;
    case 'crash':noise(t,0.7,'bandpass',2600,1.2,0.6,0.002,0.5);[523,817,1290,1740].forEach((f,i)=>tone(t,'triangle',f,f*0.98,1.1+i*0.2,0.18,0.002,0.5));tone(t,'sine',110,50,0.3,0.6);break;
    case 'clang':[310,620,955,1380].forEach((f,i)=>tone(t+i*0.005,'triangle',f,f*0.99,1.4,0.16,0.002,0.6));break;
    case 'crow':for(let k=0;k<3;k++){const tt=t+k*0.34;const o=tone(tt,'sawtooth',720,430,0.22,0.22,0.01,0.45);noise(tt,0.2,'bandpass',1500,4,0.12,0.01,0.45);}break;
    case 'flap':for(let k=0;k<14;k++)noise(t+k*0.06,0.05,'bandpass',600+Math.random()*500,1,0.35,0.004,0.2);break;
    case 'creak':{const o=c.createOscillator();o.type='sawtooth';o.frequency.setValueAtTime(70,t);o.frequency.linearRampToValueAtTime(110,t+0.5);o.frequency.linearRampToValueAtTime(85,t+1.1);
      const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=900;f.Q.value=6;const am=c.createOscillator();am.frequency.value=28;const ag=c.createGain();ag.gain.value=0.5;am.connect(ag);
      const g=c.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.35,t+0.08);g.gain.linearRampToValueAtTime(0.25,t+0.9);g.gain.linearRampToValueAtTime(0.0001,t+1.2);ag.connect(g.gain);
      o.connect(f);f.connect(g);g.connect(out(0.5));o.start(t);am.start(t);o.stop(t+1.25);am.stop(t+1.25);}break;
    case 'ring':for(let k=0;k<2;k++){const tt=t+k*1.4;[440,480].forEach(fr=>{const o=c.createOscillator();o.frequency.value=fr;const g=c.createGain();g.gain.setValueAtTime(0,tt);
      for(let i=0;i<20;i++){g.gain.setValueAtTime(i%2?0:0.09,tt+i*0.05);}g.gain.setValueAtTime(0,tt+1.0);o.connect(g);g.connect(out(0.2));o.start(tt);o.stop(tt+1.05);});}break;
    case 'static':noise(t,1.6,'highpass',1800,0.7,0.25,0.02,0.1);for(let k=0;k<12;k++)noise(t+Math.random()*1.5,0.03,'bandpass',3000,1,0.4,0.001,0);break;
    case 'heart':[0,0.22].forEach((d,i)=>{tone(t+d,'sine',58,40,0.22,i?0.6:0.85,0.004,0.05);});break;
    case 'splash':noise(t,0.6,'lowpass',3000,0.8,0.55,0.003,0.4,300);noise(t+0.05,0.3,'bandpass',1200,2,0.2);break;
    case 'owl':[0,0.45,0.75].forEach((d,i)=>{const tt=t+d;tone(tt,'sine',i===0?370:340,i===0?360:320,0.32,0.22,0.05,0.6);});break;
    case 'step':noise(t,0.12,'lowpass',500,1,0.35,0.003,0.3);tone(t,'sine',80,50,0.1,0.25);break;
    case 'drip':tone(t,'sine',1400,620,0.12,0.18,0.002,0.7);break;
    case 'pop':noise(t,0.05,'highpass',2000,1,0.7,0.001,0.4);tone(t,'sine',1800,300,0.08,0.3);break;
    case 'whoosh':noise(t,0.6,'bandpass',300,1.5,0.35,0.15,0.3,2400);break;
    case 'branch':noise(t,0.08,'bandpass',2500,3,0.6,0.001,0.3);noise(t+0.05,0.4,'lowpass',1400,1,0.4,0.01,0.4);tone(t+0.35,'sine',100,45,0.35,0.5);break;
    case 'key':[2600,3400,4100].forEach((f,i)=>tone(t+i*0.04,'triangle',f,f,0.25,0.08,0.001,0.3));break;
    case 'unlock':noise(t,0.05,'bandpass',2500,3,0.5,0.001,0.2);noise(t+0.12,0.08,'bandpass',1800,3,0.6,0.001,0.2);tone(t+0.12,'triangle',900,700,0.1,0.15);break;
    case 'chain':for(let k=0;k<7;k++)tone(t+k*0.05+Math.random()*0.03,'triangle',1800+Math.random()*1500,1600,0.12,0.08,0.001,0.3);break;
    case 'steam':noise(t,1.5,'highpass',2500,0.5,0.5,0.02,0.3);break;
    case 'ball':for(let k=0;k<6;k++){const tt=t+k*0.38*(1-k*0.09);tone(tt,'sine',160,90,0.12,0.5*(1-k*0.13),0.002,0.5);}break;
    case 'whisperwind':noise(t,2.5,'bandpass',700,6,0.12,0.8,0.6,1100);break;
    case 'bell':[880,1320,1760].forEach(f=>tone(t,'sine',f,f,1.6,0.12,0.003,0.6));break;
    case 'ok':tone(t,'sine',NOTE(72),0,0.25,0.12,0.004,0.4);tone(t+0.12,'sine',NOTE(79),0,0.45,0.12,0.004,0.4);break;
    case 'musicbox':{const mel=opt.notes||[76,74,72,74,76,76,76,74,74,74,76,79,79];const sp=opt.speed||0.42;
      mel.forEach((n,i)=>{const tt=t+i*sp;tone(tt,'sine',NOTE(n),0,1.4,0.16,0.002,0.7);tone(tt,'sine',NOTE(n)*2.01,0,0.5,0.04,0.002,0.7);});}break;
    case 'bulb':tone(t,'sine',60,60,0.4,0.15,0.01,0);noise(t,0.15,'highpass',4000,1,0.3,0.001,0.3);break;
  }
};
Snd.ambient=function(kind){
  if(!Snd.ctx)return;const c=Snd.ctx;
  if(Snd.amb){const o=Snd.amb;o.g.gain.setTargetAtTime(0.0001,c.currentTime,0.6);setTimeout(()=>{o.nodes.forEach(n=>{try{n.stop();}catch(e){}});clearInterval(o.iv);},2500);Snd.amb=null;}
  if(!kind)return;
  const g=c.createGain();g.gain.value=0.0001;g.gain.setTargetAtTime(1,c.currentTime,1.2);g.connect(Snd.master);const nodes=[];let iv=null;
  const nsrc=(filt,f,q,vol)=>{const s=c.createBufferSource();s.buffer=Snd.noiseBuf;s.loop=true;const fl=c.createBiquadFilter();fl.type=filt;fl.frequency.value=f;fl.Q.value=q;const gg=c.createGain();gg.gain.value=vol;s.connect(fl);fl.connect(gg);gg.connect(g);s.start();nodes.push(s);return {s,fl,gg};};
  if(kind==='rain'){nsrc('lowpass',1800,0.4,0.16);nsrc('highpass',5000,0.5,0.04);iv=setInterval(()=>{if(!Snd.muted&&Math.random()<0.5)Snd.play('drip');},900);}
  if(kind==='forest'){const w=nsrc('bandpass',400,0.6,0.12);const lfo=c.createOscillator();lfo.frequency.value=0.08;const lg=c.createGain();lg.gain.value=220;lfo.connect(lg);lg.connect(w.fl.frequency);lfo.start();nodes.push(lfo);
    iv=setInterval(()=>{if(Snd.muted)return;const t=c.currentTime;if(Math.random()<0.35){for(let k=0;k<3;k++)tone(t+k*0.09,'sine',4200,4200,0.05,0.025,0.003,0.2);} if(Math.random()<0.05)Snd.play('owl');},1400);}
  if(kind==='hospital'){const o=c.createOscillator();o.type='sine';o.frequency.value=48;const og=c.createGain();og.gain.value=0.07;o.connect(og);og.connect(g);o.start();nodes.push(o);
    const o2=c.createOscillator();o2.type='sine';o2.frequency.value=48.7;const og2=c.createGain();og2.gain.value=0.05;o2.connect(og2);og2.connect(g);o2.start();nodes.push(o2);
    nsrc('lowpass',300,0.5,0.06);iv=setInterval(()=>{if(!Snd.muted&&Math.random()<0.25)Snd.play('drip');},2300);}
  if(kind==='warm'){[60,64,67,72].forEach((n,i)=>{const o=c.createOscillator();o.type='sine';o.frequency.value=NOTE(n);const og=c.createGain();og.gain.value=0.025;o.connect(og);og.connect(g);o.start();nodes.push(o);});}
  Snd.amb={g,nodes,iv,kind};
};

/* ================= CORE ================= */
const Core={keys:{},S:null,cfg:null,modals:[],paused:true,sel:null,Snd};
window.Core=Core;window.Snd=Snd;
function fresh(){return {v:3,started:false,zone:0,flags:{},items:[],fear:0,mistakes:0,hints:0,hintSeen:{},elapsed:0,won:false,seed:Math.floor(Math.random()*1e9)};}
Core.save=function(){try{localStorage.setItem(Core.cfg.id,JSON.stringify(Core.S));}catch(e){}};
Core.load=function(){try{const r=localStorage.getItem(Core.cfg.id);if(!r)return null;const s=JSON.parse(r);return s&&s.v===3?s:null;}catch(e){return null;}};
Core.wipe=function(){try{localStorage.removeItem(Core.cfg.id);}catch(e){}};
Core.rand=function(n,salt=0){let x=(Core.S.seed+salt*7919)>>>0;x^=x<<13;x>>>=0;x^=x>>17;x^=x<<5;x>>>=0;return x%n;};

function build(){
  document.body.insertAdjacentHTML('beforeend',`
  <div id="hud"><div class="zone" id="zoneName">-</div>
    <div class="fear" id="fear" title="심장 박동: 다섯 칸이 차면 겁에 질려 뒤로 물러난다"><b>두근</b><i></i><i></i><i></i><i></i><i></i></div>
    <div class="timer" id="timer">00:00</div>
    <button class="hbtn" id="bHint">💡 힌트</button><button class="hbtn" id="bMenu">⚙</button></div>
  <div id="prompt"></div><div id="toasts"></div><div id="flash"></div><div id="black"></div><div id="inv"></div>
  <div id="touch"><div class="pad" id="tpad"></div><div class="acts" id="tacts"></div></div>`);
  $('#bHint').onclick=()=>Core.hintBox();$('#bMenu').onclick=()=>Core.settings();
  if(matchMedia('(pointer:coarse)').matches)document.body.classList.add('touch');
}
const GAMEKEYS=new Set(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','KeyW','KeyA','KeyS','KeyD','KeyE','KeyF','KeyR','KeyV','KeyM','KeyL','ShiftLeft']);
addEventListener('keydown',e=>{
  if(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))return;
  if(e.code==='Escape'){if(Core.modals.length)Core.closeModal();else if(Core.sel){Core.select(null);}return;}
  if(Core.modals.length){const m=Core.modals[Core.modals.length-1];if(m.onKey&&m.onKey(e))e.preventDefault();return;}
  if(GAMEKEYS.has(e.code))e.preventDefault();
  if(!Core.keys[e.code]){Core.keys[e.code]=true;if(Core.cfg&&Core.cfg.onKey&&!Core.paused)Core.cfg.onKey(e.code);}
});
addEventListener('keyup',e=>{Core.keys[e.code]=false;});
addEventListener('blur',()=>{Core.keys={};});
Core.press=function(code){if(Core.modals.length||Core.paused)return;Core.cfg.onKey&&Core.cfg.onKey(code);};
function buildTouch(){
  const pad=$('#tpad'),acts=$('#tacts');pad.innerHTML='';acts.innerHTML='';const cfg=Core.cfg.touch;if(!cfg){$('#touch').style.display='none';return;}
  (cfg.pad||[]).flat().forEach(k=>{const b=h('button',{},k?(cfg.labels&&cfg.labels[k]||k):'');if(!k)b.className='e';else hold(b,k);pad.appendChild(b);});
  (cfg.buttons||[]).forEach(bd=>{const b=h('button',{},bd.label);if(bd.hold)hold(b,bd.key);else b.addEventListener('pointerdown',e=>{e.preventDefault();Core.press(bd.key);});acts.appendChild(b);});
}
function hold(b,k){const on=e=>{e.preventDefault();Core.keys[k]=true;b.classList.add('on');};const off=()=>{Core.keys[k]=false;b.classList.remove('on');};
  b.addEventListener('pointerdown',on);b.addEventListener('pointerup',off);b.addEventListener('pointerleave',off);b.addEventListener('pointercancel',off);}

Core.hud=function(){const S=Core.S,c=Core.cfg;const z=c.zones[S.zone]||{name:''};{const hb=document.getElementById('bHint');if(hb&&S)hb.innerHTML=`💡 힌트 <span style="color:${Core.hintsLeft()?'var(--accent2)':'var(--red)'}">${Core.hintsLeft()}</span>`;}
  $('#zoneName').innerHTML=esc(z.name)+'<small>'+esc(c.short)+'</small>';
  document.querySelectorAll('#fear i').forEach((e,i)=>e.classList.toggle('on',i<S.fear));Core.drawInv();};
Core.prompt=function(t){const p=$('#prompt');if(!t){p.style.display='none';return;}p.innerHTML=t;p.style.display='block';};
Core.toast=function(msg,type='',ms=3400){const t=h('div',{class:'toast '+type},msg);$('#toasts').appendChild(t);while($('#toasts').children.length>3)$('#toasts').firstChild.remove();
  setTimeout(()=>{t.style.transition='opacity .4s';t.style.opacity=0;setTimeout(()=>t.remove(),400);},ms);};

/* modal */
Core.modal=function(html,opt={}){const w=h('div',{class:'mwrap'});const m=h('div',{class:'modal '+(opt.cls||'')});m.innerHTML=html;
  if(opt.close!==false){const x=h('button',{class:'mclose','aria-label':'닫기'},'×');x.onclick=()=>Core.closeModal();m.appendChild(x);}
  w.appendChild(m);document.body.appendChild(w);const rec={w,m,onClose:opt.onClose,onKey:opt.onKey};Core.modals.push(rec);
  if(opt.close!==false)w.addEventListener('pointerdown',e=>{if(e.target===w)Core.closeModal();});Core.keys={};Core.prompt('');return m;};
Core.closeModal=function(){const r=Core.modals.pop();if(!r)return;r.w.remove();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();if(r.onClose)r.onClose();Core.hud();};
Core.closeAll=function(){while(Core.modals.length)Core.closeModal();};
Core.isModal=()=>Core.modals.length>0;
Core.menu=function(title,desc,options){const m=Core.modal(`<h2>${esc(title)}</h2>${desc?`<p class="muted">${desc}</p>`:''}<div class="menu-list"></div>`);const L=m.querySelector('.menu-list');
  options.filter(Boolean).forEach(o=>{const b=h('button',{},esc(o.label)+(o.sub?`<small>${esc(o.sub)}</small>`:''));b.onclick=()=>{Core.closeModal();o.fn&&o.fn();};L.appendChild(b);});return m;};
Core.say=function(title,html,after,btn='확인'){const m=Core.modal(`<h2>${esc(title)}</h2><div>${html}</div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn">${btn}</button></div>`,{onClose:after,cls:'wide'});m.querySelector('.btn').onclick=()=>Core.closeModal();return m;};
Core.keypad=function(o){const lay=o.layout||['1','2','3','4','5','6','7','8','9','←','0','OK'];
  const m=Core.modal(`<h2>${esc(o.title)}</h2>${o.desc?`<p class="muted">${o.desc}</p>`:''}<div class="kp-display"></div><div class="kp"></div>`,{onKey:e=>{const k=e.key.toUpperCase();if(e.key==='Enter')press('OK');else if(e.key==='Backspace')press('←');else if(lay.includes(k))press(k);return true;}});
  let v='';const d=m.querySelector('.kp-display');const kp=m.querySelector('.kp');const draw=()=>{d.textContent=v||'·'.repeat(o.maxLen||4);};
  function press(k){Snd.play('pop');if(k==='←')v=v.slice(0,-1);else if(k==='OK'){if(!v)return;if(o.onSubmit(v))Core.closeModal();else{v='';d.style.color='#ff5468';setTimeout(()=>d.style.color='',500);}}else if(v.length<(o.maxLen||4))v+=k;draw();}
  lay.forEach(k=>{const b=h('button',{class:k==='OK'?'ok':(k==='←'?'fn':'')},k);b.onclick=()=>press(k);kp.appendChild(b);});draw();return m;};
/* dials: o.dials=[{sym:html, values:[...], v:index}] */
Core.dials=function(o){const st=o.dials.map(d=>d.start||0);
  const m=Core.modal(`<h2>${esc(o.title)}</h2>${o.desc?`<p class="muted">${o.desc}</p>`:''}<div class="dials"></div><div class="row" style="justify-content:flex-end"><button class="btn" id="dOk">${o.ok||'당겨 보기'}</button></div>`);
  const box=m.querySelector('.dials');
  const draw=()=>{box.innerHTML='';o.dials.forEach((d,i)=>{const el=h('div',{class:'dial'});const up=h('button',{},'▲'),dn=h('button',{},'▼');
    up.onclick=()=>{st[i]=(st[i]+1)%d.values.length;Snd.play('pop');draw();};dn.onclick=()=>{st[i]=(st[i]+d.values.length-1)%d.values.length;Snd.play('pop');draw();};
    el.appendChild(up);el.appendChild(h('div',{class:'v'},esc(d.values[st[i]])));el.appendChild(dn);if(d.sym)el.appendChild(h('div',{class:'sym'},d.sym));box.appendChild(el);});};
  draw();m.querySelector('#dOk').onclick=()=>{const vals=st.map((x,i)=>o.dials[i].values[x]);if(o.onSubmit(vals,st))Core.closeModal();};return m;};

/* fear / scare */
Core.flash=function(){const f=$('#flash');f.classList.add('on');setTimeout(()=>f.classList.remove('on'),60);};
Core.shake=function(){document.body.classList.remove('shake');void document.body.offsetWidth;document.body.classList.add('shake');setTimeout(()=>document.body.classList.remove('shake'),400);};
Core.scare=function(o={}){if(o.sound)Snd.play(o.sound);if(o.shake!==false)Core.shake();if(o.flash)Core.flash();if(o.text)Core.toast(o.text,o.type||'',o.ms||3600);if(o.fear)Core.mistake(null,true);};
Core.mistake=function(msg,quiet){const S=Core.S;S.fear++;S.mistakes++;Snd.play('heart');const fe=$('#fear');fe.classList.remove('beat');void fe.offsetWidth;fe.classList.add('beat');if(!quiet)Core.flash();
  if(S.fear>=5){S.fear=0;Core.toast((msg?msg+'<br>':'')+'💓 <b>심장이 터질 것 같다!</b> 숨을 고르려고 왔던 길로 뒷걸음질 쳤다. (주운 물건은 그대로)','bad',5000);Core.cfg.onPanic&&Core.cfg.onPanic();}
  else if(msg)Core.toast(msg+` <span style="color:#f08a98">(두근 ${S.fear}/5)</span>`,'bad');
  Core.hud();Core.save();};
Core.calm=function(){if(Core.S.fear>0){Core.S.fear--;Core.hud();}};
Core.blackout=function(html,ms,mid,after){const b=$('#black');b.innerHTML=html||'';b.classList.add('on');Core.paused=true;
  setTimeout(()=>{mid&&mid();setTimeout(()=>{b.classList.remove('on');Core.paused=false;setTimeout(()=>{b.innerHTML='';after&&after();},1200);},300);},ms||2500);};

/* inventory */
Core.items=()=>Core.S.items;
Core.has=id=>Core.S.items.some(i=>i.id===id);
Core.count=id=>{const it=Core.S.items.find(i=>i.id===id);return it?(it.n||1):0;};
Core.addItem=function(id,n=1,quiet){const it=Core.S.items.find(i=>i.id===id);const def=Core.cfg.items[id];
  if(it){if(def&&def.stack)it.n=(it.n||1)+n;else return;}else Core.S.items.push(def&&def.stack?{id,n}:{id});
  if(!quiet){Core.toast(`🎒 <b>${esc(def?def.name:id)}</b>${def&&def.stack&&n>1?' ×'+n:''} 을(를) 챙겼다.`,'gold');Snd.play('key');}Core.save();Core.drawInv();};
Core.removeItem=function(id,n=1){const i=Core.S.items.findIndex(x=>x.id===id);if(i<0)return;const it=Core.S.items[i];if(it.n&&it.n>n)it.n-=n;else{Core.S.items.splice(i,1);if(Core.sel===id)Core.sel=null;}Core.save();Core.drawInv();};
Core.select=function(id){Core.sel=Core.sel===id?null:id;Core.drawInv();if(Core.sel){const d=Core.cfg.items[Core.sel];Core.toast(`손에 든 것: <b>${esc(d.name)}</b> — 쓸 곳을 눌러 보자.${d.view?' (한 번 더 누르면 살펴보기)':''}`,'',2200);}};
Core.drawInv=function(){const box=$('#inv');if(!box||!Core.S)return;box.innerHTML='';
  Core.S.items.forEach(it=>{const d=Core.cfg.items[it.id];if(!d)return;const s=h('button',{class:'slot'+(Core.sel===it.id?' sel':''),title:d.name});const cv=document.createElement('canvas');cv.width=80;cv.height=80;
    try{d.icon&&d.icon(cv.getContext('2d'),80);}catch(e){}s.appendChild(cv);s.appendChild(h('span',{},esc(d.short||d.name)));if(d.stack)s.appendChild(h('span',{class:'n'},'×'+(it.n||1)));
    s.onclick=()=>{if(Core.isModal()||Core.paused)return;if(Core.sel===it.id&&d.view){d.view();return;}if(d.view&&!d.usable){d.view();return;}Core.select(it.id);};box.appendChild(s);});};
Core.useSel=function(){const s=Core.sel;return s;};

/* hints */
Core.hintList=function(){let L=(Core.cfg.hints(Core.S)||[]).filter(Boolean);if(!L.length)L=[{key:'fb'+Core.S.zone,title:'지금 할 일',steps:['주변을 꼼꼼히 살펴보자. 아직 눌러 보지 않은 곳이 있을지도 모른다.','가방의 물건을 골라 쓸 수 있는 곳을 눌러 보자.']}];return L;};
Core.hintBudget=()=>Core.cfg.hintBudget||6;
Core.hintsLeft=()=>Math.max(0,Core.hintBudget()-(Core.S.hints||0));
Core.hintBox=function(){if(!Core.S.started||Core.paused&&!Core.isModal())return;const S=Core.S;const L=Core.hintList();
  const m=Core.modal(`<h2>💡 힌트</h2><p class="muted">이 게임에서 쓸 수 있는 힌트는 모두 <b>${Core.hintBudget()}개</b>. 힌트는 방향만 알려 줄 뿐, 답을 알려 주지는 않는다. 아껴 쓰자.</p><div class="hcount" style="font-weight:800;margin:6px 0 2px"></div><div class="hl"></div>`);const box=m.querySelector('.hl'),cnt=m.querySelector('.hcount');let armed=null;
  const draw=()=>{const left=Core.hintsLeft();cnt.innerHTML=`남은 힌트 <span style="color:${left?'var(--accent2)':'var(--red)'}">${'●'.repeat(left)}${'○'.repeat(Core.hintBudget()-left)}</span> ${left}/${Core.hintBudget()}`;
    box.innerHTML='';L.forEach(t=>{const n=S.hintSeen[t.key]||0;const d=h('div',{class:'hint-task'},`<div class="ht">${esc(t.title)}</div>`);
    for(let i=0;i<Math.min(n,t.steps.length);i++)d.appendChild(h('div',{class:'hint-step'},`<b>힌트 ${i+1}</b> · `+t.steps[i]));
    if(n<t.steps.length){if(!left){d.appendChild(h('div',{class:'muted',style:'margin-top:8px;font-size:13px'},'힌트를 모두 써 버렸다. 이제는 스스로 풀어야 한다.'));}
      else{const ok=armed===t.key;const b=h('button',{class:'btn small '+(ok?'':'ghost'),style:'margin-top:8px'},ok?`정말 쓸까? (남은 힌트 ${left} → ${left-1})`:`힌트 ${n+1} 열기`);
        b.onclick=()=>{if(armed!==t.key){armed=t.key;draw();return;}armed=null;S.hintSeen[t.key]=n+1;S.hints=(S.hints||0)+1;Core.save();Core.hud();draw();};d.appendChild(b);}}
    else d.appendChild(h('div',{class:'muted',style:'margin-top:6px;font-size:12.5px'},'이 과제의 힌트는 여기까지다.'));
    box.appendChild(d);});};draw();};

Core.settings=function(){const extra=Core.cfg.settingsExtra?Core.cfg.settingsExtra():[];
  Core.menu('설정',`조작: ${Core.cfg.controls}`,[...extra,{label:Snd.muted?'🔇 소리 켜기':'🔊 소리 끄기',fn:()=>{Snd.init();Snd.setMute(!Snd.muted);}},{label:'게임 계속하기'},
    {label:'조작법 다시 보기',fn:()=>Core.say('조작법',Core.cfg.controlsHtml)},
    {label:'처음부터 다시 시작',sub:'저장된 진행이 지워집니다',fn:()=>Core.menu('정말 처음부터?','주운 물건과 진행이 모두 지워집니다.',[{label:'네, 처음부터',fn:()=>{Core.wipe();location.reload();}},{label:'아니요'}])}]);};

Core.win=function(html){const S=Core.S;if(S.won)return;S.won=true;Core.save();Core.paused=true;Core.closeAll();
  const m=Core.modal(`${html}<div class="stats"><div><b>${fmt(S.elapsed)}</b><span>걸린 시간</span></div><div><b>${S.mistakes}</b><span>놀란 횟수</span></div><div><b>${S.hints}</b><span>힌트 사용</span></div></div>
   <div class="row" style="justify-content:flex-end"><button class="btn ghost" id="wAgain">처음부터 다시</button></div>`,{close:false,cls:'wide'});m.querySelector('#wAgain').onclick=()=>{Core.wipe();location.reload();};};

Core.init=function(cfg){
  Core.cfg=cfg;build();buildTouch();const saved=Core.load();Core.S=fresh();
  const t=h('div',{id:'title'});const tc=document.createElement('canvas');t.appendChild(tc);
  t.insertAdjacentHTML('beforeend',`<div class="tbox"><div class="ep">${esc(cfg.ep)}</div><h1>${esc(cfg.title)}</h1><div class="sub">${esc(cfg.subtitle)}</div>
    <div class="story">${cfg.story}</div><div class="ctrl">${cfg.controlsHtml}</div>
    <div class="warn">${cfg.warn||'🔊 갑자기 큰 소리가 나는 장면이 있어요. 이어폰 소리를 너무 크게 하지 마세요. 귀신은 나오지 않아요.'}</div>
    <div class="row">${saved&&saved.started&&!saved.won?'<button class="btn" id="tCont">이어서 하기</button><button class="btn ghost" id="tNew">처음부터</button>':'<button class="btn" id="tNew">시작하기</button>'}
    <button class="btn ghost" id="tSnd">${Snd.muted?'🔇 소리 꺼짐':'🔊 소리 켜짐'}</button></div></div>`);
  document.body.appendChild(t);
  $('#tSnd',t).onclick=()=>{Snd.init();Snd.setMute(!Snd.muted);$('#tSnd',t).textContent=Snd.muted?'🔇 소리 꺼짐':'🔊 소리 켜짐';};
  let tt=0;const tg=tc.getContext('2d');const titleLoop=()=>{if(!t.isConnected)return;const W=tc.width=innerWidth,H=tc.height=innerHeight;tt+=1/60;cfg.titleDraw&&cfg.titleDraw(tg,W,H,tt);requestAnimationFrame(titleLoop);};titleLoop();
  const start=s=>{Snd.init();if(Snd.ctx&&Snd.ctx.state==='suspended')Snd.ctx.resume();t.remove();Core.S=s;Core.paused=false;const isNew=!s.started;s.started=true;cfg.onStart&&cfg.onStart(isNew);Core.hud();Core.save();};
  const bc=$('#tCont',t);if(bc)bc.onclick=()=>start(saved);$('#tNew',t).onclick=()=>{Core.wipe();start(fresh());};
  cfg.onReady&&cfg.onReady();
  let last=performance.now(),acc=0;
  function loop(now){let dt=(now-last)/1000;last=now;if(dt>0.1)dt=0.1;
    if(!Core.paused&&Core.S.started&&!Core.S.won){Core.S.elapsed+=dt;acc+=dt;if(acc>2){acc=0;Core.save();}const tm=$('#timer');if(tm)tm.textContent=fmt(Core.S.elapsed);}
    cfg.frame&&cfg.frame(dt,now);requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  addEventListener('beforeunload',()=>{if(Core.S.started)Core.save();});
  window.__G={get S(){return Core.S;},Core,hints:()=>Core.hintList()};
};
Core.fmt=fmt;Core.esc=esc;Core.h=h;Core.TAU=TAU;
})();
</script>
<script>/* 열아홉 번째 밤 2부 — 건너지 말아야 할 방 (2D 장면 클릭형) */
(function(){
'use strict';
const C=Core;

   에피소드 쪽에서 S_ (장면), NAVNAMES, LIGHTR 를 정의해 사용한다. */
const TAU=Math.PI*2,F=()=>C.S.flags;
const LW=1600,LH=900;
const cv=document.createElement('canvas');document.getElementById('game').appendChild(cv);const ctx=cv.getContext('2d');
let W=0,H=0,DPR=1,SC=1,OX=0,OY=0,PANX=null,PORT=false;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cv.style.width=W+'px';cv.style.height=H+'px';
  const top=48,bot=82;const avail=H-top-bot;PORT=W/avail<1.25;
  if(PORT){SC=Math.min(avail*0.7/LH,W*1.9/LW);const sw=LW*SC;if(PANX===null)PANX=(W-sw)/2;PANX=Math.max(Math.min(PANX,0),W-sw);OX=sw<=W?(W-sw)/2:PANX;OY=top+(avail-LH*SC)/2;}
  else{SC=Math.min(W/LW,avail/LH);if(SC<=0)SC=Math.min(W/LW,H/LH);OX=(W-LW*SC)/2;OY=top+Math.max(0,(avail-LH*SC)/2);}}
addEventListener('resize',resize);resize();
const now=()=>performance.now()/1000;
function R(seed){let s=seed>>>0||1;return ()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
/* 그리기 도구 */
function lg(g,x0,y0,x1,y1,st){const gr=g.createLinearGradient(x0,y0,x1,y1);st.forEach(([o,c])=>gr.addColorStop(o,c));return gr;}
function rg(g,x,y,r,st,r0=0){const gr=g.createRadialGradient(x,y,r0,x,y,r);st.forEach(([o,c])=>gr.addColorStop(o,c));return gr;}
function poly(g,pts,fill,stroke,lw){g.beginPath();pts.forEach(([a,b],i)=>i?g.lineTo(a,b):g.moveTo(a,b));g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}}
function rrect(g,x,y,w,h,r,fill,stroke,lw){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.lineWidth=lw||2;g.stroke();}}
function ell(g,x,y,rx,ry,fill,rot=0){g.beginPath();g.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),rot,0,TAU);g.fillStyle=fill;g.fill();}
function line(g,x0,y0,x1,y1,col,w=2){g.strokeStyle=col;g.lineWidth=w;g.beginPath();g.moveTo(x0,y0);g.lineTo(x1,y1);g.stroke();}
function speck(g,x,y,w,h,n,col,a,seed){const r=R(seed);g.fillStyle=col;for(let i=0;i<n;i++){g.globalAlpha=a*r();g.fillRect(x+r()*w,y+r()*h,1+r()*2.5,1+r()*2);}g.globalAlpha=1;}
function text(g,t,x,y,size,col,weight=800,font,align='center',rot=0){g.save();g.translate(x,y);g.rotate(rot);g.fillStyle=col;g.font=`${weight} ${size}px ${font||getComputedStyle(document.body).fontFamily}`;g.textAlign=align;g.textBaseline='middle';g.fillText(t,0,0);g.restore();}
function glowAt(g,x,y,r,col,a){g.globalCompositeOperation='lighter';g.fillStyle=rg(g,x,y,r,[[0,col.replace('A',a)],[1,col.replace('A',0)]]);g.fillRect(x-r,y-r,r*2,r*2);g.globalCompositeOperation='source-over';}
function wallpaper(g,x,y,w,h,base,pat,seed){g.fillStyle=base;g.fillRect(x,y,w,h);const r=R(seed);g.fillStyle=pat;for(let yy=y+20;yy<y+h;yy+=60)for(let xx=x+(yy/60%2)*30;xx<x+w;xx+=60){g.globalAlpha=0.5;g.beginPath();g.arc(xx,yy,4,0,TAU);g.fill();g.globalAlpha=0.25;for(let k=0;k<4;k++){const a=k/4*TAU+0.4;g.beginPath();g.ellipse(xx+Math.cos(a)*10,yy+Math.sin(a)*10,6,3,a,0,TAU);g.fill();}}g.globalAlpha=1;speck(g,x,y,w,h,w*h/400,'#000',0.15,seed);}
function floorWood(g,x,y,w,h,c1,c2,seed){const r=R(seed);for(let yy=y;yy<y+h;yy+=26){g.fillStyle=(yy/26)%2?c1:c2;g.fillRect(x,yy,w,26);g.fillStyle='#00000040';g.fillRect(x,yy+25,w,1);for(let xx=x+r()*200;xx<x+w;xx+=180+r()*160){g.fillRect(xx,yy,1.5,26);}}speck(g,x,y,w,h,w*h/300,'#000',0.18,seed+1);}
const RAIN=[...Array(260)].map((_,i)=>[(i*97.31)%1,(i*0.6180339)%1,0.6+((i*13)%7)/10]);
function rain(g,t,alpha=0.35,ang=0.12,x0=0,y0=0,w=LW,h=LH){g.save();g.beginPath();g.rect(x0,y0,w,h);g.clip();g.strokeStyle=`rgba(190,205,230,${alpha})`;g.lineWidth=1.2;g.beginPath();RAIN.forEach(([a,b,s])=>{const y=y0+((b+t*1.7*s)%1)*h,x=x0+(a*w+(y-y0)*ang)%w;g.moveTo(x,y);g.lineTo(x+ang*30,y+30*s);});g.stroke();g.restore();}
function label(g,t,x,y){g.font=`700 22px ${getComputedStyle(document.body).fontFamily}`;const w=g.measureText(t).width+22;const hh=34;let lx=Math.min(LW-w-6,Math.max(6,x-w/2)),ly=Math.max(6,y-hh-14);
  rrect(g,lx,ly,w,hh,17,'#000000d0','#d9b25c88',1.5);g.fillStyle='#f3ead6';g.textAlign='center';g.textBaseline='middle';g.fillText(t,lx+w/2,ly+hh/2+1);}
function navArrow(g,x,y,dir,t){const p=0.6+0.4*Math.sin(t*3);g.save();g.translate(x,y);g.rotate({left:Math.PI,right:0,up:-Math.PI/2,down:Math.PI/2}[dir]);g.globalAlpha=0.55+p*0.3;
  g.fillStyle='#00000088';g.beginPath();g.arc(0,0,30,0,TAU);g.fill();g.strokeStyle='#f0d590';g.lineWidth=4;g.beginPath();g.moveTo(-8,-12);g.lineTo(8,0);g.lineTo(-8,12);g.stroke();g.restore();}

let scene=null,hot=null,ptr={x:LW/2,y:LH*0.55},cache={},fadeT=0,fadeMid=null;
function hs(o){return o;}
function inHs(o,x,y){if(o.circle){const [cx,cy,r]=o.circle;return Math.hypot(x-cx,y-cy)<r;}if(o.poly){let c=false;const p=o.poly;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!==(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c;}return c;}const [a,b,w,h]=o.rect;return x>=a&&x<=a+w&&y>=b&&y<=b+h;}
function hsCenterIn(o){if(o.circle)return [o.circle[0],o.circle[1]];if(o.rect)return [o.rect[0]+o.rect[2]/2,o.rect[1]+o.rect[3]/2];let x=0,y=0;o.poly.forEach(p=>{x+=p[0];y+=p[1];});return [x/o.poly.length,y/o.poly.length];}
function go(id,how){const sc=S_[id];if(!sc)return;const doIt=()=>{PANX=null;resize();scene=id;F().scene=id;C.S.zone=sc.zone;cache={};C.hud();C.save();Snd.ambient(sc.amb||'rain');sc.enter&&sc.enter();};
  if(how==='cut')doIt();else{fadeT=0.0001;fadeMid=doIt;}}
function redraw(){cache={};}
function hotspots(){const sc=S_[scene];if(!sc)return [];const L=(sc.hs?sc.hs():[]).filter(o=>o&&(!o.vis||o.vis()));
  (sc.nav?sc.nav():[]).forEach(([x,y,dir,to,nm])=>L.push({id:'nav_'+to,name:nm||NAVNAMES[to]||'이동',circle:[x,y,46],act:()=>{const g=sc.leave&&sc.leave(to);if(g===false)return;Snd.play('step');go(to);}}));return L;}
function pick(x,y){const L=hotspots();for(let i=L.length-1;i>=0;i--)if(inHs(L[i],x,y))return L[i];return null;}
function useOn(itemId,fn,fail){return ()=>{const s=C.sel;if(s===itemId){C.select(null);fn();return;}if(s){C.select(null);C.toast((ITEMS[s].name)+'은(는) 여기에 쓸 수 없을 것 같다.');return;}fail&&fail();};}
function getCache(sc){if(cache.c&&cache.id===scene)return cache.c;const c=document.createElement('canvas');c.width=LW;c.height=LH;sc.bg(c.getContext('2d'));cache={c,id:scene};return c;}
let darkC=null;
function render(){const t=now();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);const sc=S_[scene];if(!sc)return;
  ctx.save();ctx.translate(OX,OY);ctx.scale(SC,SC);ctx.beginPath();ctx.rect(0,0,LW,LH);ctx.clip();
  ctx.drawImage(getCache(sc),0,0);sc.fg&&sc.fg(ctx,t);
  const dk=typeof sc.dark==='function'?sc.dark():(sc.dark||0);
  if(dk>0){if(!darkC){darkC=document.createElement('canvas');darkC.width=LW/2;darkC.height=LH/2;}
    const d=darkC.getContext('2d');d.setTransform(0.5,0,0,0.5,0,0);d.globalCompositeOperation='source-over';d.clearRect(0,0,LW,LH);d.fillStyle=`rgba(0,0,0,${dk})`;d.fillRect(0,0,LW,LH);
    d.globalCompositeOperation='destination-out';const holes=(sc.lights?sc.lights():[]).slice();holes.push([ptr.x,ptr.y,LIGHTR,0.75]);
    holes.forEach(([x,y,r,a])=>{d.fillStyle=rg(d,x,y,r,[[0,`rgba(0,0,0,${a})`],[0.6,`rgba(0,0,0,${a*0.6})`],[1,'rgba(0,0,0,0)']]);d.fillRect(x-r,y-r,r*2,r*2);});
    ctx.drawImage(darkC,0,0,LW,LH);}
  sc.over&&sc.over(ctx,t);
  ctx.fillStyle=rg(ctx,LW/2,LH/2,LW*0.75,[[0.55,'rgba(0,0,0,0)'],[1,'rgba(0,0,0,0.65)']]);ctx.fillRect(0,0,LW,LH);
  (sc.nav?sc.nav():[]).forEach(([x,y,dir])=>navArrow(ctx,x,y,dir,t));
  if(PORT&&LW*SC>W+4){ctx.globalAlpha=0.5+0.3*Math.sin(t*2);text(ctx,'◀  끌어서 둘러보기  ▶',(W/2-OX)/SC,LH-24,26,'#f0d590',700);ctx.globalAlpha=1;}
  if(hot&&hot.name)label(ctx,(C.sel?'🎒 ':'')+hot.name,ptr.x,ptr.y-20);
  if(fadeT>0){fadeT+=1/40;const a=fadeT<0.5?fadeT*2:Math.max(0,2-fadeT*2);if(fadeT>=0.5&&fadeMid){fadeMid();fadeMid=null;}ctx.fillStyle=`rgba(0,0,0,${Math.min(1,a)})`;ctx.fillRect(0,0,LW,LH);if(fadeT>=1)fadeT=0;}
  ctx.restore();}
function toLogical(e){return {x:(e.clientX-OX)/SC,y:(e.clientY-OY)/SC};}
let pd=null;
cv.addEventListener('pointerdown',e=>{if(C.paused||C.isModal()||fadeT>0)return;pd={x:e.clientX,y:e.clientY,moved:0,px:PANX};const p=toLogical(e);ptr.x=p.x;ptr.y=p.y;hot=pick(p.x,p.y);try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',e=>{if(C.paused)return;if(pd){const dx=e.clientX-pd.x,dy=e.clientY-pd.y;pd.moved=Math.max(pd.moved,Math.hypot(dx,dy));if(PORT&&pd.moved>10){PANX=pd.px+dx;resize();return;}}
  const p=toLogical(e);ptr.x=p.x;ptr.y=p.y;hot=pick(p.x,p.y);cv.style.cursor=hot?'pointer':'default';});
cv.addEventListener('pointerup',e=>{const d=pd;pd=null;if(!d||C.paused||C.isModal()||fadeT>0)return;if(d.moved>10)return;const p=toLogical(e);if(p.x<0||p.y<0||p.x>LW||p.y>LH){if(C.sel)C.select(null);return;}
  const o=pick(p.x,p.y);hot=o;if(o){o.act();}else if(C.sel){C.select(null);}});

 {k:'q3',need:()=>F().roof&&F().cardSeen&&(F().ph_wed||F().pcSeen)&&F().insurSeen,missing:F=>F.roof&&!F.insurSeen?'白衣가 왜 그랬는지 알려 줄 것이 그 서재 어딘가에 있었다. 기억 속 서재를 더 뒤져 보자.':'그날 밤의 기억을 끝까지 되짚어야 한다.'}];
function viewNote(){const sol=F().sol||(F().sol={});
  const m=C.modal(`<h2>📓 의심 노트 (2부)</h2><p class="muted">결론을 틀리면 머리가 지끈거린다(두근 +1).</p><div id="nq"></div>`,{cls:'wide'});const box=m.querySelector('#nq');
  const sel=(id,opts)=>`<select id="${id}" style="font-size:15px;padding:4px 6px;border-radius:6px;background:#22252c;color:#fff;border:1px solid #555"><option value="">— 고르기 —</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
  const draw=()=>{box.innerHTML='';
    const card=(k,title,body,check,after)=>{const q=NQ.find(x=>x.k===k);const d=document.createElement('div');d.className='hint-task';d.innerHTML=`<div class="ht">${sol[k]?'✅ ':''}${title}</div>`;
      if(sol[k])d.innerHTML+=`<div class="hint-step">${sol[k]}</div>`;else if(!q.need())d.innerHTML+=`<div class="hint-step muted">${typeof q.missing==='function'?q.missing(F()):q.missing}</div>`;
      else{d.innerHTML+=`<div class="hint-step" style="line-height:2.2">${body}</div>`;const b=document.createElement('button');b.className='btn small';b.style.marginTop='8px';b.textContent='결론 내리기';
        b.onclick=()=>{const r=check();if(r){sol[k]=r;Snd.play('ok');C.save();draw();after&&setTimeout(after,500);}else{C.closeModal();setTimeout(()=>C.mistake('…아니다. 앞뒤가 맞지 않는다. 머리가 지끈거린다.'),120);}};d.appendChild(b);}
      box.appendChild(d);};
    card('q1','① 지금은 언제, 나는 누구',`지금은 ${sel('a1',['1997','2007','2017','2027'])}년이고, 나는 만 ${sel('a2',['21','31','41','51'])}살이다.`,()=>box.querySelector('#a1').value==='2017'&&box.querySelector('#a2').value==='41'?'지금은 <b>2017년</b>. 나는 <b>만 41살</b>이다. 1997년에 멈춰 있던 건 나뿐이었다.':null);
    card('q2','② 형의 정체',`형(도현)을 연기한 사람의 이름은 ${sel('a3n',['강도현','최은서','최한결','오한결'])} 이고,<br>그는 ${sel('a3',['진짜 우리 형','강력계 형사','돈을 받은 배우','1997년 다솜동 사건 피해자의 아들'])} 이다.<br>그가 옷장 틈으로 본 그날 밤의 시각은 ${sel('a3t',['22:30','22:41','22:50','01:10'])} 이다.`,()=>box.querySelector('#a3n').value==='최한결'&&box.querySelector('#a3').value==='1997년 다솜동 사건 피해자의 아들'&&box.querySelector('#a3t').value==='22:50'?'형은 <b>최한결</b>. 다솜동 사건 피해자의 막내아들, 밤 <b>10시 50분</b> 옷장 틈으로 거울 속 시계를 보던 여섯 살 아이다.':null);
    card('q3','③ 白衣의 정체',`그날 밤 나에게 일을 맡긴 "白衣"는 ${sel('a4',['병원 원무과 직원','현장 지휘 반장','은서와 한결의 아빠','형을 수술한 의사'])} 였다.<br>그가 나를 자기 집에 보낸 진짜 이유는 ${sel('a5',['금고 속 돈을 혼자 챙기려고','아내가 "강도 사건"으로 죽기를 바라서','나에게 형 병원비를 갚게 하려고','하이텔에 남은 글을 없애려고'])} 이다.`,()=>box.querySelector('#a4').value==='은서와 한결의 아빠'&&box.querySelector('#a5').value==='아내가 "강도 사건"으로 죽기를 바라서'?'白衣는 <b>은서와 한결의 아빠, 최정훈</b>. 한 달 반 전 아내 앞으로 <b>강도·상해 특약</b>이 붙은 보험을 들고, "빈집"이라며 나를 자기 집에 보냈다. 그날 밤 그는 빗소리 나는 공중전화로 딸에게 "병원이야"라고 말했다.':null,()=>{C.closeAll();finalChoice();});};draw();}

/* ====================== 결말 ====================== */
function finalChoice(){Snd.ambient('hospital');C.blackout('<div>…눈을 뜨자, 다시 2017년의 끝방이었다.</div>',2200,()=>{go('forbid','cut');},()=>{
  const m=C.modal(`<h2>마지막 선택</h2><p>한결이 내 앞에 앉아 있다. 20년 동안 기다린 대답을 기다리며.</p><p>"말해 줘요. 그날 밤, 무슨 일이 있었는지."</p><p class="muted">나는 모든 것을 기억해 냈다. 白衣가 누구였는지까지.</p><div class="menu-list"><button id="fA">모든 것을 말한다 — 白衣가 그의 아버지였고, 왜 그랬는지까지<small>진실 전부를 건넨다</small></button><button id="fB">내가 한 일만 말한다 — 白衣의 정체는 묻어 둔다<small>아이에게 남은 마지막 아버지를 지킨다</small></button></div>`,{close:false});
  m.querySelector('#fA').onclick=()=>{C.closeModal();ending(true);};m.querySelector('#fB').onclick=()=>{C.closeModal();ending(false);};});}
function ending(all){F().ending=all?'A':'B';C.save();
  const body=all?`<p>나는 모든 것을 말했다. 형의 수술비, 白衣의 쪽지, 비어 있던 금고, 서랍 속 보험 증권, 계단, 옷장의 두 눈. 그리고 옥상 물탱크 뒤에서 본 얼굴까지.</p><p>한결은 오래도록 아무 말도 하지 않았다. 창밖이 희게 밝아 올 무렵, 그가 겨우 입을 열었다. <i>"…고마워요. 이제야 그날 밤이 끝났네요."</i></p>`
    :`<p>나는 내가 한 일만 말했다. 白衣가 누구였는지는 끝내 말하지 않았다.</p><p>한결이 창밖을 보며 말했다. <i>"그날 밤… 아버지는 왜 집에 없었을까요. 그게 20년 동안 제일 궁금했어요."</i> 나는 대답하지 못했다. 그는 이미 알고 있는 것 같았다.</p>`;
  C.win(`<h2>열아홉 번째 밤 — 끝</h2>${body}<p>아침, 나는 경찰서로 걸어 들어갔다. 이번엔 길 건너 작은 파출소가 아니라, 내 이름과 내 나이를 가지고.</p>
   <div class="paper" style="font-size:14.5px">1997년 봄, 벚꽃이 흩날리는 공원.<br>다리 다친 형을 부축하며 웃던 스물한 살의 나와, 흰 가운의 아빠 손을 잡고 지나가던 여섯 살 꼬마가 스쳐 지나갔다.<br>서로를 모르는 채, 서로에게 웃어 주며.</div>
   <p class="muted">「열아홉 번째 밤」 2부작 완결 · ${all?'결말 A — 건넨 진실':'결말 B — 묻어 둔 진실'}</p>`);}

/* ====================== 힌트 ====================== */
function hints(S){const f=S.flags,L=[];const T=(key,title,...steps)=>L.push({key,title,steps});const sol=f.sol||{};
  if(S.zone===0){
    if(!f.gotBelong)T('a0','파출소','순경이 맡아 둔 내 물건이 있다.');
    else if(!f.phoneOK)T('a1','매끈한 기계','유리판에 남은 기름 자국이 어떤 모양을 그리고 있다. 그 선을 따라 그리면 된다.','선은 양쪽 끝 중 한쪽에서 시작했다. 손가락을 처음 댈 때 더 오래, 더 세게 누르게 된다.');
    if(!sol.q1){if(!f.mirrorSeen)T('a2','거울','파출소 안에 얼굴을 비춰 볼 곳이 있다. 너무 뿌옇다면 닦을 것이 근처에 있다.');T('a3','나는 누구','지금이 몇 년인지는 여러 곳에 적혀 있다. 지갑 속 생일과 비교해 나이를 계산해 보자. 생일이 이미 지났는지도 따져 보자.');}
    else if(!f.outPolice)T('a4','파출소 탈출','순경이 유리 너머에서 서성인다. 그가 어디를 보고 있는지 잘 지켜보자.');}
  else if(S.zone===1){
    if(!f.padOpen)T('b1','끝방 자물쇠','자물쇠 옆 글씨와, 받은 메시지 속 낱말이 같다. 그 낱말이 가리키는 날짜는?','괘종시계가 친 것을 기억하는가? 날짜는 이미 넘어갔다.');
    else if(!f.hroomOpen){if(!C.has('hkey'))T('b2','형 방 여분 열쇠','끝방의 진행 일지에 여분 열쇠 이야기가 있다. 그 열쇠가 숨겨진 곳의 조건을 끝방에서 모두 모으자. 조건은 세 군데에 흩어져 있다.','① 자석이 붙는 재질 ② CH6 배치도의 노란 범위 밖 ③ 대본 속 "형"이 집 안에서 절대 하지 않는 동작. 복도 물건을 하나씩 눌러 재질과 높이를 확인하자.');else T('b2k','형의 방','손에 든 여분 열쇠를 써 볼 문이 있다.');}
    else if(!f.trunkOpen)T('b3','트렁크','스케치북 그림과 서류철 속 진술 조서를 함께 보자. 아이는 시계를 직접 보지 않았다.','거울에 비친 시계는 좌우가 뒤집혀 보인다. 바늘을 좌우로 뒤집어 읽고, 신고 접수 시각과 앞뒤가 맞는지 확인하자. 답은 24시 표기.');
    else if(!sol.q2)T('b4','형의 정체','대본의 배역표에서 형만 이름 대신 초성이다. 트렁크 속 물건들이 그 초성의 주인을 알려 준다.','시각은 트렁크 자물쇠를 연 숫자다.');
    else if(!f.boxOpen||C.has('memories'))T('b5','기억 상자','상자 속 사진들의 순서를 맞추자. 사진 속 날짜와 시각을 확대해서 읽어 보자.','날짜가 없는 사진은 앞뒤 사진과 이어지는 단서(장소·날씨·메시지 내용)로 자리를 정하자.');}
  else{
    if(f.safeOpen&&!f.roof){if(!f.vmHeard)T('c2','삐삐 음성사서함','가방의 삐삐를 눌러 뒷면까지 살펴보자. 공중전화는 카드를 먼저 넣어야 걸린다.','비밀번호는 내 생일 월·일 네 자리. 2017년의 내가 가진 물건 중에 생일이 적힌 것이 있다.');
      else T('c3','약속 장소','음성 메시지에는 건물의 조건이 세 가지 있다. 둘만 맞는 건물이 여럿이다.','초록 십자는 무엇의 간판일까? 간판에서 켜진 글자 수를 세고, 옥상 위의 실루엣도 확인하자.');}
    else if(!f.safeOpen)T('c1','금고','삐삐 메시지가 알려 준 것은 "딸 생일". 서재에서 그 집의 딸이 누구인지, 언제 태어났는지 알려 주는 것을 찾자.','첫돌은 태어난 지 1년 되는 날이다. 연도는 금고 번호와 상관없다.');
    else T('c4','白衣','白衣라는 아이디는 서재 어딘가에도 적혀 있다. 그리고 옥상의 얼굴은 서재 사진 속에서 본 얼굴이다.','왜 그랬는지는 서재 책상 서랍의 서류와, 한결의 트렁크 속 누나의 편지를 함께 떠올려 보자. 서류의 날짜와 특약이 중요하다.');}
  return L;}

/* ====================== 시작 ====================== */
function titleDraw(g,w,h,t){const s=Math.max(w/LW,h/LH);g.save();g.translate((w-LW*s)/2,(h-LH*s)/2);g.scale(s,s);
  if(!titleDraw.c){const c=document.createElement('canvas');c.width=LW;c.height=LH;const q=c.getContext('2d');q.fillStyle=lg(q,0,0,0,LH,[[0,'#05070c'],[1,'#10141c']]);q.fillRect(0,0,LW,LH);
    for(let i=0;i<6;i++){const x=420+(i%3)*260,y=200+Math.floor(i/3)*220;rrect(q,x,y,240,190,6,'#111','#333',4);q.fillStyle='#16243a';q.fillRect(x+10,y+10,220,170);}titleDraw.c=c;}
  g.drawImage(titleDraw.c,0,0);for(let i=0;i<6;i++){const x=430+(i%3)*260,y=210+Math.floor(i/3)*220;g.fillStyle=`rgba(110,150,230,${0.1+0.08*Math.sin(t*3+i)})`;g.fillRect(x,y,220,170);}rain(g,t,0.2,0.1);g.fillStyle='rgba(0,0,0,0.35)';g.fillRect(0,0,LW,LH);g.restore();}
C.init({
  id:'yeolahop_ep2_v2',ep:'열아홉 번째 밤 · 2부',title:'건너지 말아야 할 방',short:'2부 건너지 말아야 할 방',subtitle:'장면을 살펴보는 2D 추리 방탈출 · 도전 난이도 (완결편)',
  story:`비를 맞으며 뛰어든 파출소. 벽에 걸린 달력은 <b>2017년 12월</b>을 가리키고 있었다.<br>
  순경은 나를 "아저씨"라고 불렀다. 1997년의 스물한 살 재수생, 그게 나일 텐데.<br>
  그 집의 <b>2층 끝방</b>. 절대 들어가지 말라던 그 방에, 모든 답이 있다.`,
  controls:'장면 클릭: 조사 · 화살표: 이동 · 가방: 물건 고르기 → 쓸 곳 클릭',
  controlsHtml:'화면을 <b>클릭</b>(터치)해 조사한다 · <b>둥근 화살표</b>로 이동한다<br>아래 <b>가방</b>에서 물건을 고른 뒤 쓸 곳을 누르면 쓴다 · 기계와 종이는 가방에서 눌러 살펴본다<br><b>수첩(의심 노트)</b>에 결론을 정리해야 이야기가 나아간다<br><b>💡 힌트는 모두 8번</b>뿐이고, 답이 아니라 방향만 알려 준다',
  zones:ZONES,items:ITEMS,hints,titleDraw,hintBudget:8,warn:'🔊 갑자기 큰 소리가 나는 장면이 있어요. (영화 「기억의 밤」에서 영감을 받은 창작 이야기이며, 인물·사건은 각색되었습니다.)',
  onStart:(isNew)=>{const s=F().scene||'police';scene=s;C.S.zone=S_[s].zone;Snd.ambient(S_[s].amb||'rain');
    if(isNew){C.addItem('note',1,true);setTimeout(()=>C.say('2017년 12월 10일, 새벽 0시 20분',`<p>순경이 졸린 눈으로 나를 훑어본다. "아저씨, 일단 여기 앉아 계세요. 확인 좀 하고 올게요."</p><p>그가 안쪽 사무실로 들어가며 바구니 하나를 데스크에 내려놓았다. "들어오시면서 떨어뜨린 거예요."</p><p>아저씨. 그 말이 귓가에서 떠나지 않는다.</p><p class="muted">1부를 하지 않았다면: 도윤은 1997년이라 믿던 집에서 가족이 연극을 한다는 증거를 찾아 뛰쳐나왔다.</p>`),300);}},
  onPanic:()=>{const z=C.S.zone;go(z===0?'police':z===1?(F().padOpen?'forbid':'hall2b'):(F().safeOpen?'booth':'memory'));},
  frame:()=>render(),
});
testHooks({PATTERN,TL_ANS,CARDS,BLD,HALLOBJ});
})();
</script>
</body></html>
